  <script>
  /* ================================================================== */
  /*  历法基础数据                                                       */
  /* ================================================================== */

  /* 农历信息压缩表（1900-2100，每年一个十六进制值：
     高 4 位闰月月份，0x10000 位表示闰月大小，低 12 位为 12 个月的大小） */
  const LUNAR_INFO = [
    0x04bd8,0x04ae0,0x0a570,0x054d5,0x0d260,0x0d950,0x16554,0x056a0,0x09ad0,0x055d2,//1900-1909
    0x04ae0,0x0a5b6,0x0a4d0,0x0d250,0x1d255,0x0b540,0x0d6a0,0x0ada2,0x095b0,0x14977,//1910-1919
    0x04970,0x0a4b0,0x0b4b5,0x06a50,0x06d40,0x1ab54,0x02b60,0x09570,0x052f2,0x04970,//1920-1929
    0x06566,0x0d4a0,0x0ea50,0x06e95,0x05ad0,0x02b60,0x186e3,0x092e0,0x1c8d7,0x0c950,//1930-1939
    0x0d4a0,0x1d8a6,0x0b550,0x056a0,0x1a5b4,0x025d0,0x092d0,0x0d2b2,0x0a950,0x0b557,//1940-1949
    0x06ca0,0x0b550,0x15355,0x04da0,0x0a5b0,0x14573,0x052b0,0x0a9a8,0x0e950,0x06aa0,//1950-1959
    0x0aea6,0x0ab50,0x04b60,0x0aae4,0x0a570,0x05260,0x0f263,0x0d950,0x05b57,0x056a0,//1960-1969
    0x096d0,0x04dd5,0x04ad0,0x0a4d0,0x0d4d4,0x0d250,0x0d558,0x0b540,0x0b6a0,0x195a6,//1970-1979
    0x095b0,0x049b0,0x0a974,0x0a4b0,0x0b27a,0x06a50,0x06d40,0x0af46,0x0ab60,0x09570,//1980-1989
    0x04af5,0x04970,0x064b0,0x074a3,0x0ea50,0x06b58,0x055c0,0x0ab60,0x096d5,0x092e0,//1990-1999
    0x0c960,0x0d954,0x0d4a0,0x0da50,0x07552,0x056a0,0x0abb7,0x025d0,0x092d0,0x0cab5,//2000-2009
    0x0a950,0x0b4a0,0x0baa4,0x0ad50,0x055d9,0x04ba0,0x0a5b0,0x15176,0x052b0,0x0a930,//2010-2019
    0x07954,0x06aa0,0x0ad50,0x05b52,0x04b60,0x0a6e6,0x0a4e0,0x0d260,0x0ea65,0x0d530,//2020-2029
    0x05aa0,0x076a3,0x096d0,0x04afb,0x04ad0,0x0a4d0,0x1d0b6,0x0d250,0x0d520,0x0dd45,//2030-2039
    0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0,//2040-2049
    0x14b63,0x09370,0x049f8,0x04970,0x064b0,0x168a6,0x0ea50,0x06b20,0x1a6c4,0x0aae0,//2050-2059
    0x0a2e0,0x0d2e3,0x0c960,0x0d557,0x0d4a0,0x0da50,0x05d55,0x056a0,0x0a6d0,0x055d4,//2060-2069
    0x052d0,0x0a9b8,0x0a950,0x0b4a0,0x0b6a6,0x0ad50,0x055a0,0x0aba4,0x0a5b0,0x052b0,//2070-2079
    0x0b273,0x06930,0x07337,0x06aa0,0x0ad50,0x14b55,0x04b60,0x0a570,0x054e4,0x0d160,//2080-2089
    0x0e968,0x0d520,0x0daa0,0x16aa6,0x056d0,0x04ae0,0x0a9d4,0x0a2d0,0x0d150,0x0f252,//2090-2099
    0x0d520 // 2100
  ];

  const STEMS    = '甲乙丙丁戊己庚辛壬癸';                                   // 天干
  const BRANCHES = '子丑寅卯辰巳午未申酉戌亥';                               // 地支
  const ANIMALS  = ['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪']; // 生肖
  const CN_MONTH = ['正','二','三','四','五','六','七','八','九','十','冬','腊']; // 农历月份
  const WEEK_MAP = ['日', '一', '二', '三', '四', '五', '六'];
  const STEM_WUXING = ['木','木','火','火','土','土','金','金','水','水'];   // 日干五行

  /* ==================== 农历核心计算 ==================== */

  /** 农历年 y 的总天数 */
  function lunarYearDays(y) {
    let sum = 348;
    for (let i = 0x8000; i > 0x8; i >>= 1) sum += (LUNAR_INFO[y - 1900] & i) ? 1 : 0;
    return sum + leapDays(y);
  }
  /** 农历年 y 的闰月月份（0 表示无闰月） */
  function leapMonth(y) { return LUNAR_INFO[y - 1900] & 0xf; }
  /** 农历年 y 闰月的天数 */
  function leapDays(y) { return leapMonth(y) ? ((LUNAR_INFO[y - 1900] & 0x10000) ? 30 : 29) : 0; }
  /** 农历年 y 的 m 月天数（m 为 1-12 的正常月份序号） */
  function monthDays(y, m) { return (LUNAR_INFO[y - 1900] & (0x10000 >> m)) ? 30 : 29; }

  /**
   * 公历转农历
   * @returns {{year, month, isLeap, day}} 农历年 / 月 / 是否闰月 / 日
   */
  function solarToLunar(y, m, d) {
    let offset = Math.floor((Date.UTC(y, m - 1, d) - Date.UTC(1900, 0, 31)) / 86400000);
    let i, temp = 0;
    for (i = 1900; i < 2101 && offset > 0; i++) { temp = lunarYearDays(i); offset -= temp; }
    if (offset < 0) { offset += temp; i--; }
    const year = i;

    const leap = leapMonth(year);
    let isLeap = false;
    for (i = 1; i < 13 && offset > 0; i++) {
      if (leap > 0 && i === leap + 1 && !isLeap) { --i; isLeap = true; temp = leapDays(year); }
      else { temp = monthDays(year, i); }
      if (isLeap && i === leap + 1) isLeap = false;
      offset -= temp;
    }
    if (offset === 0 && leap > 0 && i === leap + 1) {
      if (isLeap) { isLeap = false; } else { isLeap = true; --i; }
    }
    if (offset < 0) { offset += temp; --i; }
    return { year, month: i, isLeap, day: offset + 1 };
  }

  /** 农历日的中文名（初一～三十） */
  function lunarDayStr(d) {
    if (d === 10) return '初十';
    if (d === 20) return '二十';
    if (d === 30) return '三十';
    const nums = ['一','二','三','四','五','六','七','八','九','十'];
    return ['初','十','廿','三'][Math.floor(d / 10)] + nums[(d % 10) - 1];
  }

  /** 干支甲子表（0 = 甲子） */
  const GZ60 = Array.from({ length: 60 }, (_, i) => STEMS[i % 10] + BRANCHES[i % 12]);

  /**
   * 干支纪日：1900-01-31 为甲辰日（甲子序 40），
   * 以当日距基准日的天数推算六十甲子序号
   */
  function dayGZIndex(y, m, d) {
    const offset = Math.floor((Date.UTC(y, m - 1, d) - Date.UTC(1900, 0, 31)) / 86400000);
    return (offset + 40) % 60;
  }

  /**
   * 月支（节气月）近似：按每月「节」的大致入节日划分
   * 寅月≈2/4 起、卯月≈3/6 起 … 丑月≈1/6 起（误差 ±1 天，足以用于推算值神）
   */
  const TERM_DAYS = [4, 6, 5, 6, 6, 7, 8, 8, 8, 7, 7, 6]; // 2月～次年1月
  function solarMonthBranchIndex(y, m, d) {
    let mi = (m - 2 + 12) % 12;          // 0 = 立春所在的寅月
    if (d < TERM_DAYS[mi]) mi = (mi + 11) % 12; // 未到节，属上一节月
    return mi;                            // 0=寅 1=卯 … 11=丑
  }

  /* ================================================================== */
  /*  黄历内容数据                                                       */
  /* ================================================================== */

  /* 建除十二神（按月支起建顺数）+ 传统宜忌 */
  const TWELVE_GODS = ['建','除','满','平','定','执','破','危','成','收','开','闭'];
  const GOD_YIJI = {
    '建': { yi: ['出行', '上任', '会友', '见工', '上书'],        ji: ['动土', '开仓', '嫁娶', '词讼'] },
    '除': { yi: ['祭祀', '沐浴', '清洁', '除旧布新', '求医'],    ji: ['嫁娶', '远行', '签约'] },
    '满': { yi: ['祈福', '祭祀', '结亲', '开市', '纳财'],        ji: ['服药', '栽种', '动土'] },
    '平': { yi: ['修整', '粉饰', '平整道路', '计划'],            ji: ['开市', '嫁娶', '登高'] },
    '定': { yi: ['立券', '交易', '嫁娶', '定基', '纳采'],        ji: ['诉讼', '出行', '搬迁'] },
    '执': { yi: ['捕捉', '祈福', '祭祀', '立约'],                ji: ['搬家', '开业', '远行'] },
    '破': { yi: ['拆卸', '破屋', '求医治病'],                    ji: ['诸事不宜'] },
    '危': { yi: ['安床', '祭祀', '收债'],                        ji: ['登高', '行船', '冒险'] },
    '成': { yi: ['开业', '嫁娶', '入学', '签约', '动土'],        ji: ['诉讼', '争执'] },
    '收': { yi: ['收获', '纳财', '置业', '收账'],                ji: ['葬礼', '远行', '开市'] },
    '开': { yi: ['开业', '开工', '求医', '见贵'],                ji: ['安葬', '探病'] },
    '闭': { yi: ['安葬', '修坟', '补垣', '塞穴'],                ji: ['开市', '出行', '搬迁'] }
  };

  /* 冲煞方位：申子辰日煞南，寅午戌日煞北，巳酉丑日煞东，亥卯未日煞西 */
  function shaDirection(dayBranchIdx) {
    const group = dayBranchIdx % 4; // 0=申子辰 1=巳酉丑(丑巳酉同组) 2=寅午戌 3=亥卯未
    return ['南', '东', '北', '西'][group];
  }

  /* 黄道黑道十二神（时辰）：黄道 = 青龙/明堂/金匮/天德/玉堂/司命 */
  const HOUR_GODS = ['青龙', '明堂', '天刑', '朱雀', '金匮', '天德', '白虎', '玉堂', '天牢', '玄武', '司命', '勾陈'];
  const LUCKY_GODS = new Set(['青龙', '明堂', '金匮', '天德', '玉堂', '司命']);
  /** 日上起时：青龙起时支 = (日支 * 2 + 8) % 12（口诀：寅申须加子，卯酉却居寅…） */
  function qinglongStart(dayBranchIdx) { return (dayBranchIdx * 2 + 8) % 12; }

  /* ================================================================== */
  /*  页面渲染                                                           */
  /* ================================================================== */
  let toastTimer = null;
  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
  }

  /** 渲染宜 / 忌 chips */
  function chipHTML(arr, color) {
    return arr.map(t =>
      `<span class="text-xs px-2.5 py-1 rounded-full border ${color}">${t}</span>`
    ).join('');
  }

  /** 渲染全部黄历内容 */
  function renderHuangli() {
    const now = new Date();
    const y = now.getFullYear(), m = now.getMonth() + 1, d = now.getDate();

    /* ---- 公历与星期 ---- */
    document.getElementById('solar-year-month').textContent = `${y} 年 ${String(m).padStart(2, '0')} 月`;
    document.getElementById('solar-day').textContent = d;
    document.getElementById('solar-week').textContent = `星期${WEEK_MAP[now.getDay()]}`;

    /* ---- 农历 ---- */
    const lunar = solarToLunar(y, m, d);
    const lunarText =
      (lunar.isLeap ? '闰' : '') + CN_MONTH[lunar.month - 1] + '月' + lunarDayStr(lunar.day);
    document.getElementById('lunar-text').textContent = lunarText;

    /* ---- 年干支与生肖（按农历年） ---- */
    const yGz = GZ60[(lunar.year - 4) % 60];
    const zodiac = ANIMALS[(lunar.year - 4) % 12];
    document.getElementById('gz-year').textContent = yGz;
    document.getElementById('zodiac-year').textContent = zodiac;

    /* ---- 日干支 / 五行 / 冲煞 ---- */
    const dGzIdx = dayGZIndex(y, m, d);
    const dGz = GZ60[dGzIdx];
    const dayBranchIdx = dGzIdx % 12;
    document.getElementById('gz-day').textContent = dGz + '日';

    const stemIdx = dGzIdx % 10;
    document.getElementById('day-wuxing').textContent = STEM_WUXING[stemIdx];

    const chongAnimal = ANIMALS[(dayBranchIdx + 6) % 12];
    document.getElementById('chong-sha').textContent = `冲${chongAnimal} · 煞${shaDirection(dayBranchIdx)}`;

    /* ---- 值日生肖（当日地支对应的生肖） ---- */
    document.getElementById('day-animal').textContent = ANIMALS[dayBranchIdx];

    /* ---- 值神（建除十二神）与宜忌 ---- */
    const monthBranchIdx = solarMonthBranchIndex(y, m, d) + 2; // 0=寅 → 地支序 2
    const god = TWELVE_GODS[(dayBranchIdx - monthBranchIdx + 12) % 12];
    const info = GOD_YIJI[god];
    document.getElementById('value-god').textContent = `${god}日`;
    document.getElementById('yi-list').innerHTML =
      chipHTML(info.yi, 'border-emerald-400/30 bg-emerald-400/10 text-emerald-200');
    document.getElementById('ji-list').innerHTML =
      chipHTML(info.ji, 'border-rose-400/30 bg-rose-400/10 text-rose-200');

    /* ---- 时辰黄历（黄道黑道） ---- */
    const start = qinglongStart(dayBranchIdx);
    const curBranch = Math.floor(((now.getHours() + 1) % 24) / 2); // 当前时辰地支序
    document.getElementById('hour-grid').innerHTML = Array.from({ length: 12 }, (_, i) => {
      const god12 = HOUR_GODS[(i - start + 12) % 12];
      const lucky = LUCKY_GODS.has(god12);
      const h1 = (i * 2 + 23) % 24, h2 = (i * 2 + 25) % 24;
      const isNow = i === curBranch;
      return `
        <div class="hour-cell rounded-xl border px-2.5 py-2.5 text-center ${isNow ? 'ring-2 ring-cyan-300/60' : ''}"
             style="animation-delay:${i * 0.03}s;
                    border-color: ${lucky ? 'rgba(52,211,153,.35)' : 'rgba(148,197,255,.14)'};
                    background: ${lucky ? 'rgba(16,185,129,.08)' : 'rgba(255,255,255,.03)'};">
          <p class="text-sm font-semibold ${isNow ? 'text-cyan-300' : 'text-slate-200'}">${BRANCHES[i]}时
             ${isNow ? '<span class="text-[10px] text-cyan-400 ml-0.5">当前</span>' : ''}</p>
          <p class="text-[11px] text-slate-400 font-mono mt-0.5">${String(h1).padStart(2,'0')}-${String(h2).padStart(2,'0')}</p>
          <p class="text-xs mt-1 ${lucky ? 'text-emerald-300' : 'text-slate-500'}">${god12} · ${lucky ? '吉' : '黑'}</p>
        </div>`;
    }).join('');
  }

  /* ================================================================== */
  /*  壁纸加载（与主页相同的异步生成图轮询逻辑）                          */
  /* ================================================================== */
  const BG_URL = 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=' +
      encodeURIComponent('动漫风格风景壁纸，璀璨星空下的平静湖面，远山与极光，唯美治愈，深蓝青色调，高清4K') +
      '&image_size=landscape_16_9';

  const PLACEHOLDER_SIZE = 1832, IMG_MAX_RETRY = 8, IMG_RETRY_GAP = 6000;

  function loadBackground() {
    let tries = 0;
    const img = document.getElementById('bg-img');
    function attempt() {
      const probe = new Image();
      probe.src = BG_URL + '&_t=' + Date.now();
      probe.onload = () => {
        const isPlaceholder = probe.naturalWidth === PLACEHOLDER_SIZE
                           && probe.naturalHeight === PLACEHOLDER_SIZE;
        if (isPlaceholder && tries < IMG_MAX_RETRY) { tries++; setTimeout(attempt, IMG_RETRY_GAP); }
        else {
          img.src = probe.src; img.style.display = '';
          document.getElementById('bg-overlay').classList.remove('loading');
        }
      };
      probe.onerror = () => { if (tries < IMG_MAX_RETRY) { tries++; setTimeout(attempt, IMG_RETRY_GAP); } };
    }
    attempt();
  }

  /* ================================================================== */
  /*  初始化：加载即渲染当日黄历；跨天 / 手动刷新自动更新                 */
  /* ================================================================== */
  let renderDateKey = '';

  function refresh(showTip) {
    renderHuangli();
    const key = new Date().toDateString();
    if (showTip && key !== renderDateKey) showToast('黄历已更新至今日');
    renderDateKey = key;
  }

  function init() {
    loadBackground();
    renderDateKey = new Date().toDateString();
    refresh(false);

    // 手动刷新
    document.getElementById('btn-refresh').addEventListener('click', () => {
      const icon = document.getElementById('refresh-icon');
      icon.classList.add('fa-spin');
      setTimeout(() => icon.classList.remove('fa-spin'), 600);
      refresh(true);
    });

    // 页面跨零点打开时，每分钟自动检测日期变化并更新
    setInterval(() => {
      if (new Date().toDateString() !== renderDateKey) refresh(true);
    }, 60000);

    document.getElementById('footer-year').textContent = new Date().getFullYear();
  }

  init();
  </script>
</body>
</html>
