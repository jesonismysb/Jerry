  <style>
    /* ==================== 全局基础样式 ==================== */
    html, body { height: 100%; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, -apple-system, sans-serif;
      background-color: #0b1220; /* 壁纸加载前的深色兜底 */
      -webkit-tap-highlight-color: transparent;
    }

    /* ==================== 毛玻璃卡片 ==================== */
    .glass-card {
      background: rgba(15, 23, 42, 0.42);
      backdrop-filter: blur(16px) saturate(150%);
      -webkit-backdrop-filter: blur(16px) saturate(150%);
      border: 1px solid rgba(148, 197, 255, 0.14);
      border-radius: 1.25rem;
      box-shadow: 0 8px 32px rgba(2, 8, 23, 0.35);
      transition: transform .3s ease, box-shadow .3s ease, border-color .3s ease;
    }
    /* hover：卡片上浮 + 青蓝色描边光晕 */
    .glass-card:hover {
      transform: translateY(-4px);
      border-color: rgba(103, 232, 249, 0.35);
      box-shadow: 0 14px 40px rgba(8, 145, 178, 0.22);
    }

    /* ==================== 入场动画（依次淡入上浮） ==================== */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    main > * { animation: fadeUp .7s ease both; }
    main > *:nth-child(1) { animation-delay: .05s; }
    main > *:nth-child(2) { animation-delay: .12s; }
    main > *:nth-child(3) { animation-delay: .19s; }
    main > *:nth-child(4) { animation-delay: .26s; }
    main > *:nth-child(5) { animation-delay: .33s; }
    main > *:nth-child(6) { animation-delay: .40s; }
    main > *:nth-child(7) { animation-delay: .47s; }

    /* ==================== 诗词切换淡入 ==================== */
    @keyframes poemFade {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .poem-fade { animation: poemFade .5s ease both; }

    /* ==================== Toast 提示 ==================== */
    #toast {
      position: fixed; left: 50%; bottom: 32px;
      transform: translateX(-50%) translateY(20px);
      opacity: 0; pointer-events: none;
      background: rgba(8, 145, 178, 0.92);
      color: #ecfeff; font-size: 14px;
      padding: 10px 20px; border-radius: 999px;
      box-shadow: 0 8px 24px rgba(8,145,178,.35);
      transition: opacity .3s ease, transform .3s ease;
      z-index: 99; white-space: nowrap;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* 定位文字呼吸效果 */
    .pulse-dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: #67e8f9; margin-right: 6px;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:.4;} 50%{opacity:1;} }

    /* ==================== IP 获取中的柔和呼吸动画 ==================== */
    .ip-loading { animation: ipPulse 1.6s ease-in-out infinite; }
    @keyframes ipPulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }

    /* 壁纸尚未生成完成（占位图）时加深遮罩，避免占位文字透出影响观感 */
    #bg-overlay { transition: opacity .8s ease; }
    #bg-overlay.loading {
      background: linear-gradient(180deg, rgba(2,6,23,.97) 0%, rgba(2,6,23,.92) 50%, rgba(2,6,23,.98) 100%) !important;
    }
  </style>
</head>

  /* ==================================================================
   *  IP 属地接口列表（按精度优先级顺序轮询，任一成功取出真实出口 IP）
   *  均为免费、支持 HTTPS 与跨域(CORS: Access-Control-Allow-Origin)的公开接口
   *  ①② 国内库对中国地级市精度更高；③④⑤ 全球库；⑥ ipify 纯 IP 最终兜底
   * ================================================================== */
  const IP_APIS = [
    { // ① 百度千帆：国内 IP 库，省/市精度高
      url: 'https://qifu-api.baidubce.com/ip/local/geo/v1/district',
      parse: (d) => d && d.data ? { prov: d.data.prov, city: d.data.city, ip: d.data.ip } : null
    },
    { // ② vore：聚合国内数据源，含真实出口 IP 与省市
      url: 'https://api.vore.top/api/IPdata',
      parse: (d) => d && d.ipinfo ? { prov: d.ipinfo.prov, city: d.ipinfo.city, ip: d.ipinfo.cip } : null
    },
    { // ③ ipwho.is：全球库，免 Key、CORS 开放，城市级
      url: 'https://ipwho.is/',
      parse: (d) => d && d.success !== false ? { prov: d.region, city: d.city, ip: d.ip } : null
    },
    { // ④ GeoJS：CORS/HTTPS 开放，全球库，限流宽松
      url: 'https://get.geojs.io/v1/ip/geo.json',
      parse: (d) => d && d.ip ? { prov: d.region, city: d.city, ip: d.ip } : null
    },
    { // ⑤ UserAgentInfo：全球库补充
      url: 'https://ip.useragentinfo.com/json',
      parse: (d) => d ? { prov: d.province, city: d.city, ip: d.ip } : null
    },
    { // ⑥ ipify：CORS 开放、仅返回 {ip}，纯 IP 最终兜底
      url: 'https://api.ipify.org?format=json',
      parse: (d) => d && d.ip ? { ip: d.ip } : null
    }
  ];

  /* ================================================================== */

  /** Toast 轻提示 */
  let toastTimer = null;
  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
  }

  /** 带超时的 fetch JSON 请求（默认 8 秒超时，避免卡住页面） */
  async function fetchJSON(url, timeout = 8000) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeout);
    try {
      const res = await fetch(url, { signal: ctrl.signal });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    } finally {
      clearTimeout(timer);
    }
  }

  /** 数字滚动动画 */
  function countUp(el, target, duration = 700) {
    const start = performance.now();
    function tick(now) {
      const p = Math.min((now - start) / duration, 1);
      el.textContent = Math.floor(target * (1 - Math.pow(1 - p, 3))); // easeOutCubic
      if (p < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  /* ================================================================== */
  /*  图片接口为“异步生成”模式：新提示词首次请求返回固定占位图               */
  /*  （1832×1832 浅灰图），正式图生成好后再请求才返回。                   */
  /*  此加载器自动轮询：识别到占位图就等待后重新请求，访客无需手动刷新。     */
  /* ================================================================== */
  const PLACEHOLDER_SIZE = 1832;           // 占位图固定宽高
  const IMG_MAX_RETRY    = 8;              // 最多重试次数
  const IMG_RETRY_GAP    = 6000;           // 每次重试间隔(ms)

  /**
   * 加载“异步生成”的图片
   * @param {HTMLImageElement} imgEl  目标 <img> 元素
   * @param {string} url              图片接口地址
   * @param {function} onReady        正式图加载完成回调
   */
  function loadGeneratedImage(imgEl, url, onReady) {
    let tries = 0;

    function applyReady() {
      imgEl.src = probe.src;          // 走浏览器缓存，瞬间显示，不重复耗流量
      imgEl.classList.remove('opacity-0');
      onReady && onReady();
    }

    function attempt() {
      const probe = new Image();
      // 加时间戳绕过中间缓存，确保拿到接口最新结果
      probe.src = url + (url.includes('?') ? '&' : '?') + '_t=' + Date.now();

      probe.onload = () => {
        const isPlaceholder = probe.naturalWidth === PLACEHOLDER_SIZE
                           && probe.naturalHeight === PLACEHOLDER_SIZE;
        if (isPlaceholder && tries < IMG_MAX_RETRY) {
          tries++;
          setTimeout(attempt, IMG_RETRY_GAP); // 图片仍在生成，稍后重试
        } else {
          applyReady();               // 正式图就绪；超过重试上限也先展示当前结果
        }
      };
      probe.onerror = () => {
        if (tries < IMG_MAX_RETRY) {
          tries++;
          setTimeout(attempt, IMG_RETRY_GAP); // 网络抖动，稍后重试
        }
        // 彻底失败则保持兜底样式（深色背景 / “知”字头像），不打扰访客
      };
    }

    attempt();
  }

  /* ==================================================================
   *  模块一：访客 IP 属地
   *  英文/拼音地名 → 中文映射表（省、直辖市、主要城市）
   *  key 一律小写、忽略空格；不在表内的地名保持原样显示
   * ================================================================== */
  const CITY_CN_MAP = {
    // 直辖市 / 特别行政区
    beijing: '北京', shanghai: '上海', tianjin: '天津', chongqing: '重庆',
    'hong kong': '香港', macau: '澳门', hongkong: '香港',
    // 省 / 自治区
    guangdong: '广东', zhejiang: '浙江', jiangsu: '江苏', shandong: '山东',
    henan: '河南', sichuan: '四川', hubei: '湖北', hunan: '湖南',
    hebei: '河北', fujian: '福建', anhui: '安徽', jiangxi: '江西',
    liaoning: '辽宁', shaanxi: '陕西', guangxi: '广西', yunnan: '云南',
    shanxi: '山西', guizhou: '贵州', heilongjiang: '黑龙江', jilin: '吉林',
    gansu: '甘肃', hainan: '海南', ningxia: '宁夏', qinghai: '青海',
    'inner mongolia': '内蒙古', 'nei mongol': '内蒙古',
    xinjiang: '新疆', tibet: '西藏', xizang: '西藏', taiwan: '台湾',
    // 主要城市（省会及计划单列市/重点地级市）
    guangzhou: '广州', shenzhen: '深圳', hangzhou: '杭州', nanjing: '南京',
    chengdu: '成都', wuhan: '武汉', 'xi’an': '西安', "xi'an": '西安', xian: '西安',
    suzhou: '苏州', zhengzhou: '郑州', changsha: '长沙', shenyang: '沈阳',
    qingdao: '青岛', dalian: '大连', xiamen: '厦门', ningbo: '宁波',
    fuzhou: '福州', hefei: '合肥', kunming: '昆明', harbin: '哈尔滨',
    jinan: '济南', taiyuan: '太原', nanchang: '南昌', nanning: '南宁',
    guiyang: '贵阳', lanzhou: '兰州', wuxi: '无锡', changzhou: '常州',
    foshan: '佛山', dongguan: '东莞', zhuhai: '珠海', zhongshan: '中山',
    wenzhou: '温州', sanya: '三亚', haikou: '海口', shijiazhuang: '石家庄',
    changchun: '长春', urumqi: '乌鲁木齐', hohhot: '呼和浩特', lhasa: '拉萨',
    xining: '西宁', yinchuan: '银川', quanzhou: '泉州', nantong: '南通',
    xuzhou: '徐州', tangshan: '唐山', luoyang: '洛阳', shaoxing: '绍兴',
    jiaxing: '嘉兴', yantai: '烟台', weifang: '潍坊'
  };

  /** 地名转中文：已是中文或不在映射表内时，返回原始名称 */
  function toChineseRegion(name) {
    const s = String(name == null ? '' : name).trim();
    if (!s) return '';
    if (/[\u4e00-\u9fa5]/.test(s)) return s;            // 已含中文，直接使用
    return CITY_CN_MAP[s.toLowerCase()] || s;
  }

  let visitorLocation = { prov: '', city: '', text: '未知地区' };

  /**
   * IP 脱敏：只保留前两段，其余用 x 代替
   *   IPv4: 120.230.45.67  → 120.230.x.x
   *   IPv6: 240e:0310:abcd::1 → 240e:0310:x:x:x:x:x:x
   */
  function maskIP(ip) {
    const s = String(ip).trim();
    if (/^\d{1,3}(\.\d{1,3}){3}$/.test(s)) {
      const p = s.split('.');
      return p[0] + '.' + p[1] + '.x.x';
    }
    if (s.includes(':')) {
      const p = s.split(':');
      return (p[0] || '0') + ':' + (p[1] || '0') + ':x:x:x:x:x:x';
    }
    return s;   // 非标准格式原样返回，不做猜测
  }

  /** 回填访客公网 IP（脱敏展示）；ip 为空时展示友好失败文案 */
  function setVisitorIP(ip) {
    const el = document.getElementById('visitor-ip');
    el.classList.remove('ip-loading');
    if (ip) {
      el.textContent = maskIP(ip);
    } else {
      el.textContent = 'IP获取失败';
      el.classList.add('text-slate-500');
    }
  }

  async function initVisitorLocation() {
    const welcomeEl = document.getElementById('welcome-region');
    const cityEl = document.getElementById('clock-city');

    // 属地与 IP 独立处理：首个成功的属地立即渲染；
    // 若该接口未返回 IP，则继续尝试后续接口，尽量拿到公网 IP
    let regionReady = false;

    for (const api of IP_APIS) {
      try {
        const data = await fetchJSON(api.url);
        const loc = api.parse(data);
        if (loc) {
          // 统一在数据出口把英文/拼音地名转中文；已是中文或无映射则保持原值
          if (loc.prov) loc.prov = toChineseRegion(loc.prov);
          if (loc.city) loc.city = toChineseRegion(loc.city);
        }
        if (loc && (loc.prov || loc.city || loc.ip)) {
          if (!regionReady && (loc.prov || loc.city)) {
            // 直辖市等情况省市同名时只显示一次
            let text = [loc.prov, loc.city].filter(Boolean).join(' ');
            if (loc.prov && loc.city && (loc.prov.includes(loc.city) || loc.city.includes(loc.prov))) {
              text = loc.prov;
            }
            visitorLocation = { prov: loc.prov || '', city: loc.city || '', text };

            welcomeEl.innerHTML = '<i class="fa-solid fa-location-dot text-cyan-400 mr-1"></i>' + text;
            cityEl.textContent = loc.city || loc.prov || '未知';
            regionReady = true;
          }
          if (loc.ip) {
            setVisitorIP(loc.ip);   // 拿到公网 IP，异步二次回填
            if (!regionReady) {
              // 仅拿到 IP、未拿到属地：属地给明确兜底，不停留在“定位中”
              welcomeEl.innerHTML = '<i class="fa-solid fa-circle-question text-slate-400 mr-1"></i>未知地区';
              cityEl.textContent = '未知';
            }
            return;
          }
        }
      } catch (err) {
        // 当前接口失败，自动尝试下一个
        console.warn('[IP定位] 接口失败：', api.url, err.message || err);
      }
    }
    // 全部接口超时/失败时的兜底展示
    if (!regionReady) {
      welcomeEl.innerHTML = '<i class="fa-solid fa-circle-question text-slate-400 mr-1"></i>未知地区';
      // 城市与 IP 合并为一行友好提示：当前所在城市：未知 · IP：获取失败
      document.getElementById('city-row').innerHTML =
        '<i class="fa-solid fa-location-dot text-slate-500 mr-1"></i>' +
        '当前所在城市：未知 <span class="text-slate-600 mx-1">·</span>IP：获取失败';
      // 隐藏独立的 IP 模块（含分隔线），避免重复
      document.getElementById('ip-box').classList.add('hidden');
    } else {
      // 已拿到城市但 IP 全部失败：城市正常显示，IP 行单独提示
      setVisitorIP(null);
    }
  }

  /* ================================================================== */
  /*  模块二：实时时钟                                                    */
  /* ================================================================== */
  const WEEK_MAP = ['日', '一', '二', '三', '四', '五', '六'];

  function pad(n) { return String(n).padStart(2, '0'); }

  function updateClock() {
    const now = new Date();
    const dateText = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 星期${WEEK_MAP[now.getDay()]}`;
    const timeText = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    document.getElementById('clock-date').textContent = dateText;
    document.getElementById('clock-time').textContent = timeText;
  }

  function initClock() {
    updateClock();
    setInterval(updateClock, 1000); // 每秒刷新
  }

  /* ================================================================== */
  /*  模块三：随机诗词                                                    */
  /* ================================================================== */
  let currentPoemIndex = -1;

  function renderRandomPoem() {
    let idx;
    // 尽量避免连续抽到同一句
    do {
      idx = Math.floor(Math.random() * POETRY_DB.length);
    } while (POETRY_DB.length > 1 && idx === currentPoemIndex);
    currentPoemIndex = idx;

    const poem = POETRY_DB[idx];
    const contentEl = document.getElementById('poem-content');
    const authorEl = document.getElementById('poem-author');

    // 重置动画实现淡入效果
    contentEl.classList.remove('poem-fade');
    authorEl.classList.remove('poem-fade');
    void contentEl.offsetWidth; // 触发重排以重启动画
    contentEl.classList.add('poem-fade');
    authorEl.classList.add('poem-fade');

    contentEl.textContent = poem.content;
    authorEl.textContent = `—— ${poem.dynasty}·${poem.author} ${poem.source}`;
  }

  /* ================================================================== */
  /*  模块四：导航按钮网格渲染                                            */
  /* ================================================================== */
  function renderNavGrid() {
    const grid = document.getElementById('nav-grid');
    grid.innerHTML = SITE_CONFIG.links.map((item) => {
      const colorClass = COLOR_MAP[item.color] || COLOR_MAP.cyan;
      const href = item.url && item.url !== '#' ? item.url : '#';
      // 本站子页面（.html）在当前标签页打开，便于返回；外部链接新开标签页
      const target = href !== '#' && href.endsWith('.html') ? '_self' : '_blank';
      return `
        <a href="${href}"
           data-name="${item.name}"
           data-configured="${item.url && item.url !== '#' ? '1' : '0'}"
           target="${target}" rel="noopener noreferrer"
           class="glass-card p-4 flex flex-col items-center justify-center gap-2.5 group cursor-pointer">
          <span class="w-11 h-11 rounded-xl flex items-center justify-center text-lg ${colorClass}
                       transition-transform duration-300 group-hover:scale-110">
            <i class="${item.icon}"></i>
          </span>
          <span class="text-sm text-slate-200 group-hover:text-cyan-200 transition-colors">${item.name}</span>
        </a>`;
    }).join('');

    // 未配置链接的按钮：阻止跳转并提示
    grid.querySelectorAll('a[data-configured="0"]').forEach((a) => {
      a.addEventListener('click', (e) => {
        e.preventDefault();
        showToast(`「${a.dataset.name}」链接暂未配置，请在代码 SITE_CONFIG.links 中修改`);
      });
    });
  }

  /* ================================================================== */
  /*  模块五：访问统计（localStorage 本地计数）                            */
  /*  PV：每次打开页面 +1；UV：同一浏览器首次访问 +1                      */
  /*  ⚠ 纯前端本地计数仅作演示，不同设备/浏览器不互通；如需全局限量可接后端   */
  /* ================================================================== */
  const LS_PV  = 'zhishihunzi_stat_pv';
  const LS_UV  = 'zhishihunzi_stat_uv';
  const LS_MARK = 'zhishihunzi_visitor_mark';

  function initStats() {
    // 总访问量 PV
    let pv = parseInt(localStorage.getItem(LS_PV) || '0', 10) + 1;
    localStorage.setItem(LS_PV, String(pv));

    // 访客人数 UV（首次访问的浏览器打标记）
    let uv = parseInt(localStorage.getItem(LS_UV) || '0', 10);
    if (!localStorage.getItem(LS_MARK)) {
      uv += 1;
      localStorage.setItem(LS_UV, String(uv));
      localStorage.setItem(LS_MARK, new Date().toISOString());
    }

    countUp(document.getElementById('stat-pv'), pv);
    countUp(document.getElementById('stat-uv'), uv);
  }

  /* ================================================================== */
  /*  模块六：分享 & 邮箱                                                 */
  /* ================================================================== */
  function bindActions() {
    // 分享：优先调用系统分享（手机），不支持则复制链接到剪贴板
    document.getElementById('btn-share').addEventListener('click', async () => {
      const shareData = { title: SITE_CONFIG.name, text: SITE_CONFIG.slogan, url: location.href };
      if (navigator.share) {
        try { await navigator.share(shareData); } catch (e) { /* 用户取消，不处理 */ }
        return;
      }
      try {
        await navigator.clipboard.writeText(location.href);
        showToast('本站链接已复制，快分享给好友吧～');
      } catch (e) {
        // 剪贴板权限被拒时的降级方案
        const input = document.createElement('textarea');
        input.value = location.href;
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        input.remove();
        showToast('本站链接已复制，快分享给好友吧～');
      }
    });

    // 换一句诗词
    document.getElementById('btn-poem').addEventListener('click', renderRandomPoem);

    // 邮箱按钮
    const emailBtn = document.getElementById('btn-email');
    emailBtn.setAttribute('href', 'mailto:' + SITE_CONFIG.email);
  }

  /* ================================================================== */
  /*  初始化入口                                                          */
  /* ================================================================== */
  function init() {
    // 应用配置：壁纸、头像、站名、年份
    document.getElementById('bg-img').src = SITE_CONFIG.background;
    document.getElementById('avatar-img').src = SITE_CONFIG.avatar;
    document.title = `${SITE_CONFIG.name} · 个人导航`;
    document.getElementById('site-slogan').textContent = SITE_CONFIG.slogan;
    document.getElementById('footer-year').textContent = new Date().getFullYear();

    renderNavGrid();      // 导航按钮
    initClock();          // 实时时钟
    renderRandomPoem();   // 随机诗词
    initStats();          // 访问统计
    bindActions();        // 按钮事件
    initVisitorLocation(); // IP 属地（异步，不阻塞页面渲染）
  }

  init();
  </script>
