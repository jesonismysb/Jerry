<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- 移动端自适应视口 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="中职对口升学教材专栏 - 生理学基础、解剖学基础、英语、语文教材章节目录、背诵要点与刷题" />
  <meta name="theme-color" content="#0b1220" />
  <title>中职对口升学教材 · 奈良</title>

  <!-- 网页小图标（与主页一致的内联 SVG） -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%230e7490'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='%23a5f3fc' font-family='sans-serif'%3E%E7%9F%A5%3C/text%3E%3C/svg%3E" />

  <!-- Tailwind CSS（CDN 方式，无需构建） -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome 图标库 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <script>
    /* Tailwind 自定义配置（与主页一致） */
    tailwind.config = {
      theme: {
        extend: {
          colors: { accent: '#67e8f9' }
        }
      }
    };
  </script>

  <style>
    /* ==================== 主题变量：暗色（默认）/ 浅色（与博客同一套） ==================== */
    :root {
      --c-main: #e2e8f0;
      --c-sub: #94a3b8;
      --c-card: rgba(15, 23, 42, 0.42);
      --c-border: rgba(148, 197, 255, 0.14);
      --c-input: rgba(255, 255, 255, 0.05);
      --c-soft: rgba(255, 255, 255, 0.03);
      --c-rail: rgba(2, 6, 23, 0.35);
    }
    body.light {
      --c-main: #1e293b;
      --c-sub: #5b6b7f;
      --c-card: rgba(255, 255, 255, 0.72);
      --c-border: rgba(15, 23, 42, 0.10);
      --c-input: rgba(255, 255, 255, 0.62);
      --c-soft: rgba(15, 23, 42, 0.03);
      --c-rail: rgba(255, 255, 255, 0.5);
    }

    /* ==================== 全局基础样式 ==================== */
    html, body { height: 100%; }
    html, body { overflow-x: hidden; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, -apple-system, sans-serif;
      background-color: #0b1220;
      -webkit-tap-highlight-color: transparent;
      -webkit-overflow-scrolling: touch;
    }
    body.light { background-color: #d8e9f2; }
    .t-main { color: var(--c-main); }
    .t-sub  { color: var(--c-sub); }

    /* ==================== 毛玻璃卡片（与博客同一套参数） ==================== */
    .glass-card {
      background: var(--c-card);
      backdrop-filter: blur(16px) saturate(150%);
      -webkit-backdrop-filter: blur(16px) saturate(150%);
      border: 1px solid var(--c-border);
      border-radius: 1.25rem;
      box-shadow: 0 8px 32px rgba(2, 8, 23, 0.35);
      transition: border-color .3s ease, background .4s ease, box-shadow .3s ease;
    }
    .glass-card:hover {
      border-color: rgba(103, 232, 249, 0.35);
      box-shadow: 0 14px 40px rgba(8, 145, 178, 0.22);
    }

    /* ==================== 书本封面（纯 CSS，深浅色自适应） ==================== */
    .book-cover {
      position: relative;
      aspect-ratio: 3 / 4;
      border-radius: .55rem;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(2, 8, 23, .45), inset 2px 0 0 rgba(255,255,255,.18);
      display: flex; flex-direction: column;
      justify-content: space-between;
      padding: .6rem .55rem;
      color: #fff;
    }
    .book-cover::before {            /* 书脊高光 */
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px;
      background: linear-gradient(90deg, rgba(255,255,255,.35), rgba(255,255,255,0));
    }
    .book-cover .bc-deco {
      position: absolute; right: -14px; bottom: -14px;
      font-size: 58px; opacity: .16;
    }
    .book-cover .bc-title {
      font-size: 12.5px; font-weight: 700; line-height: 1.45;
      text-shadow: 0 1px 4px rgba(0,0,0,.3);
    }
    .book-cover .bc-pub { font-size: 8.5px; opacity: .85; letter-spacing: .5px; }

    /* 封面主题配色（完整类名供 Tailwind CDN 识别） */
    .cv-physiology { background: linear-gradient(150deg,#0e7490 0%,#155e75 55%,#164e63 100%); }
    .cv-anatomy    { background: linear-gradient(150deg,#9d174d 0%,#831843 55%,#500724 100%); }
    .cv-english    { background: linear-gradient(150deg,#1d4ed8 0%,#1e40af 55%,#172554 100%); }
    .cv-chinese    { background: linear-gradient(150deg,#b45309 0%,#92400e 55%,#451a03 100%); }
    .cv-math       { background: linear-gradient(150deg,#047857 0%,#065f46 55%,#022c22 100%); }

    /* 左侧书本导航项 */
    .book-nav-item {
      display: flex; align-items: center; gap: .75rem;
      width: 100%; text-align: left;
      padding: .6rem; border-radius: .9rem;
      border: 1px solid transparent;
      background: transparent;
      cursor: pointer; transition: all .25s ease;
    }
    .book-nav-item:hover { background: var(--c-input); }
    .book-nav-item .book-cover { width: 42px; flex-shrink: 0; }
    .book-nav-item .bn-name { font-size: 13px; font-weight: 600; color: var(--c-main); line-height: 1.5; }
    .book-nav-item .bn-meta { font-size: 11px; color: var(--c-sub); margin-top: 2px; line-height: 1.5; }
    .book-nav-item.active {
      background: var(--c-input);
      border-color: rgba(103, 232, 249, 0.35);
      box-shadow: 0 4px 16px rgba(8, 145, 178, .15);
    }
    .book-nav-item.active .bn-name { color: #67e8f9; }

    /* ==================== 搜索框 / 结果 ==================== */
    .search-input {
      background: var(--c-input);
      border: 1px solid var(--c-border);
      color: var(--c-main);
      transition: border-color .3s ease, box-shadow .3s ease;
    }
    .search-input::placeholder { color: var(--c-sub); }
    .search-input:focus {
      outline: none;
      border-color: rgba(103, 232, 249, 0.45);
      box-shadow: 0 0 0 3px rgba(103, 232, 249, 0.12);
    }
    #search-results {
      position: absolute; left: 0; right: 0; top: calc(100% + 8px); z-index: 45;
      max-height: 340px; overflow-y: auto;
      background: rgba(11, 18, 32, .97);
      border: 1px solid rgba(148, 197, 255, .2);
      border-radius: 1rem;
      box-shadow: 0 16px 44px rgba(2, 8, 23, .55);
      padding: .4rem; display: none;
    }
    body.light #search-results { background: rgba(255,255,255,.98); }
    #search-results a {
      display: block; padding: .55rem .7rem; border-radius: .6rem;
      font-size: 12.5px; color: #c2cfdf; line-height: 1.6;
    }
    body.light #search-results a { color: #334155; }
    #search-results a:hover, #search-results a:active { background: rgba(103,232,249,.08); color: #67e8f9; }
    #search-results .sr-type {
      display: inline-block; font-size: 10.5px; margin-right: .4rem;
      padding: .05rem .45rem; border-radius: 999px;
      background: rgba(103,232,249,.12); color: #67e8f9;
    }
    #search-results .sr-where { color: #7d8fa6; font-size: 11px; display: block; margin-top: 2px; }
    #search-results .sr-empty { padding: .9rem; text-align: center; color: #7d8fa6; font-size: 12.5px; }

    /* ==================== 章节手风琴 ==================== */
    .chapter-item {
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: .95rem;
      background: var(--c-soft);
      margin-bottom: .7rem;
      overflow: hidden;
    }
    body.light .chapter-item { border-color: rgba(15,23,42,.1); }
    .chapter-head {
      width: 100%; display: flex; align-items: center; gap: .7rem;
      padding: .8rem .95rem; cursor: pointer; text-align: left;
      font-size: 14px; color: var(--c-main); font-weight: 600;
      background: transparent; border: none;
    }
    .chapter-head .ch-no {
      width: 26px; height: 26px; border-radius: 8px; flex-shrink: 0;
      background: rgba(103, 232, 249, .1); color: #67e8f9;
      font-size: 11.5px; display: flex; align-items: center; justify-content: center;
    }
    .chapter-head .ch-caret {
      margin-left: auto; color: #67e8f9; font-size: 11px;
      transition: transform .25s ease;
    }
    .chapter-item.open .ch-caret { transform: rotate(180deg); }
    .chapter-item.open { border-color: rgba(103, 232, 249, .3); }
    .chapter-item.flash {
      border-color: rgba(94, 234, 212, .9);
      box-shadow: 0 0 0 3px rgba(94, 234, 212, .22);
    }

    .chapter-body { display: none; padding: 0 .95rem .95rem; }
    .chapter-item.open .chapter-body { display: block; }

    /* 小节 chips */
    .sec-chip {
      display: inline-block; font-size: 11.5px; line-height: 1.5;
      padding: .25rem .65rem; margin: 0 .4rem .4rem 0; border-radius: 999px;
      background: var(--c-input); color: var(--c-sub);
      border: 1px solid var(--c-border);
    }

    /* 板块小标题 */
    .blk-title {
      display: flex; align-items: center; gap: .45rem;
      font-size: 12.5px; font-weight: 600; color: var(--c-main);
      margin: .85rem 0 .5rem;
    }
    .blk-title i { font-size: 12px; }
    .i-know { color: #38bdf8; }
    .i-exam { color: #fbbf24; }
    .i-memo { color: #fb7185; }

    /* 条目列表 */
    .note-list { list-style: none; padding: 0; margin: 0; }
    .note-list li {
      position: relative; padding-left: 1.1rem;
      margin-bottom: .4rem; font-size: 13px; line-height: 1.8;
      color: var(--c-sub);
    }
    .note-list li::before {
      content: ''; position: absolute; left: 0; top: .7em;
      width: 5px; height: 5px; border-radius: 50%;
    }
    .note-list.know li::before { background: #38bdf8; }
    .note-list.exam li::before { background: #fbbf24; }

    /* 背诵要点卡 */
    .memo-card {
      border-radius: .85rem;
      border: 1px solid rgba(251, 113, 133, .35);
      background: rgba(251, 113, 133, .07);
      padding: .75rem .9rem;
    }
    .memo-card .note-list li::before { background: #fb7185; }
    .memo-card .note-list li { color: var(--c-main); }

    /* 内容待补充空状态 */
    .todo-box {
      border: 1px dashed rgba(148, 163, 184, .35);
      border-radius: .75rem;
      padding: .7rem .9rem;
      font-size: 12px; color: var(--c-sub); line-height: 1.7;
    }

    /* 章节内按钮 */
    .btn-quiz {
      display: inline-flex; align-items: center; gap: .4rem;
      font-size: 12.5px; color: #ecfeff;
      padding: .45rem 1rem; border-radius: 999px;
      background: linear-gradient(to right, rgba(8,145,178,.9), rgba(14,165,233,.9));
      border: 1px solid rgba(103, 232, 249, .4);
      box-shadow: 0 5px 16px rgba(8, 145, 178, .25);
      cursor: pointer; transition: all .25s ease;
    }
    .btn-quiz:hover { filter: brightness(1.1); }
    .btn-quiz:active { transform: scale(.97); }
    .btn-soft {
      display: inline-flex; align-items: center; gap: .4rem;
      font-size: 12.5px; color: var(--c-sub);
      padding: .45rem 1rem; border-radius: 999px;
      background: var(--c-input); border: 1px solid var(--c-border);
      cursor: pointer; transition: all .25s ease;
    }
    .btn-soft:hover { color: #67e8f9; border-color: rgba(103,232,249,.4); }

    /* ==================== 移动端抽屉 ==================== */
    #drawer-mask {
      position: fixed; inset: 0; z-index: 60;
      background: rgba(2, 6, 23, .6); backdrop-filter: blur(2px);
      opacity: 0; pointer-events: none; transition: opacity .3s ease;
    }
    #drawer-mask.show { opacity: 1; pointer-events: auto; }
    #book-drawer {
      position: fixed; top: 0; bottom: 0; left: 0; z-index: 61;
      width: min(82vw, 310px);
      background: rgba(11, 18, 32, .97);
      border-right: 1px solid rgba(148, 197, 255, .18);
      transform: translateX(-100%); transition: transform .32s ease;
      display: flex; flex-direction: column;
    }
    #book-drawer.show { transform: translateX(0); }
    #drawer-head {
      padding: 1rem 1.1rem; border-bottom: 1px solid rgba(255,255,255,.08);
      display: flex; align-items: center; justify-content: space-between;
    }
    #drawer-list { flex: 1; overflow-y: auto; padding: .8rem; }

    /* 移动端目录 FAB（左下角，避开右侧数学 FAB 区域） */
    #drawer-fab {
      position: fixed; left: 16px;
      bottom: calc(20px + env(safe-area-inset-bottom));
      z-index: 55; width: 46px; height: 46px; border-radius: 50%;
      background: linear-gradient(135deg, rgba(8,145,178,.95), rgba(14,165,233,.95));
      border: 1px solid rgba(103, 232, 249, 0.5);
      color: #ecfeff; font-size: 17px;
      box-shadow: 0 8px 24px rgba(8, 145, 178, .45);
      display: flex; align-items: center; justify-content: center;
    }
    #drawer-fab:active { transform: scale(.94); }

    /* ==================== 刷题视图 ==================== */
    .quiz-bar {
      height: 6px; border-radius: 999px;
      background: var(--c-input); overflow: hidden;
    }
    #quiz-bar-fill {
      height: 100%; width: 0; border-radius: 999px;
      background: linear-gradient(90deg, #06b6d4, #67e8f9);
      transition: width .3s ease;
    }
    .type-badge {
      display: inline-block; font-size: 11px; line-height: 1.6;
      padding: .1rem .55rem; border-radius: 999px; margin-right: .4rem;
      background: rgba(103, 232, 249, .12); color: #67e8f9;
      vertical-align: 2px;
    }
    .type-badge.judge { background: rgba(251, 191, 36, .14); color: #fbbf24; }
    .diff-badge {
      display: inline-block; font-size: 11px; line-height: 1.6;
      padding: .1rem .55rem; border-radius: 999px; margin-right: .4rem;
      vertical-align: 2px;
    }
    .diff-base { background: rgba(74, 222, 128, .14); color: #4ade80; }
    .diff-mid  { background: rgba(251, 191, 36, .14); color: #fbbf24; }
    .diff-high { background: rgba(251, 113, 133, .16); color: #fb7185; }
    .quiz-opt {
      display: flex; align-items: center; gap: .6rem;
      width: 100%; text-align: left;
      padding: .6rem .85rem; margin-bottom: .55rem;
      border-radius: .8rem; font-size: 13.5px; line-height: 1.6;
      border: 1px solid var(--c-border);
      background: var(--c-input); color: var(--c-main);
      cursor: pointer; transition: all .2s ease;
    }
    .quiz-opt:hover { border-color: rgba(103, 232, 249, .45); }
    .quiz-opt .opt-key {
      width: 24px; height: 24px; border-radius: 7px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(103, 232, 249, .12); color: #67e8f9; font-size: 12px;
    }
    .quiz-opt.correct { border-color: rgba(74, 222, 128, .7); background: rgba(74, 222, 128, .12); }
    .quiz-opt.correct .opt-key { background: rgba(74, 222, 128, .2); color: #4ade80; }
    .quiz-opt.wrong { border-color: rgba(248, 113, 113, .7); background: rgba(248, 113, 113, .12); }
    .quiz-opt.wrong .opt-key { background: rgba(248, 113, 113, .2); color: #f87171; }
    .quiz-opt.disabled { pointer-events: none; }
    .quiz-explain {
      border-left: 3px solid rgba(103, 232, 249, .5);
      background: var(--c-soft); border-radius: .6rem;
      padding: .65rem .85rem; font-size: 12.5px; line-height: 1.8;
      color: var(--c-sub); margin-top: .8rem;
    }

    /* ==================== 错题本 ==================== */
    .wrong-item {
      border: 1px solid rgba(248, 113, 113, .28);
      background: var(--c-soft);
      border-radius: .95rem; padding: .85rem .95rem; margin-bottom: .7rem;
    }

    /* ==================== Toast ==================== */
    #toast {
      position: fixed; left: 50%;
      bottom: calc(28px + env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(20px);
      opacity: 0; pointer-events: none;
      background: rgba(8, 145, 178, 0.94); color: #ecfeff; font-size: 13.5px;
      padding: 10px 20px; border-radius: 999px;
      box-shadow: 0 8px 24px rgba(8, 145, 178, .4);
      transition: opacity .3s ease, transform .3s ease;
      z-index: 80; max-width: 86vw; white-space: nowrap;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-item { animation: fadeUp .7s ease both; }

    /* 浅色模式下青色强调字加深，保证白底可读 */
    body.light .text-cyan-200,
    body.light .text-cyan-300 { color: #0e7490 !important; }

    /* 顶栏亮色覆盖（与博客一致） */
    body.light .topbar { background: rgba(240, 249, 255, 0.65); border-color: rgba(15, 23, 42, 0.08); }
    body.light .topbar .bar-text { color: #1e293b; }
    body.light #bg-overlay {
      background: linear-gradient(180deg, rgba(235,246,252,.86) 0%, rgba(235,246,252,.7) 45%, rgba(235,246,252,.9) 100%) !important;
    }
    #bg-overlay { transition: opacity .8s ease; }
    #bg-overlay.loading {
      background: linear-gradient(180deg, rgba(2,6,23,.97) 0%, rgba(2,6,23,.92) 50%, rgba(2,6,23,.98) 100%) !important;
    }
    #page-footer { padding-bottom: calc(1.5rem + env(safe-area-inset-bottom)); }
  </style>
</head>

<body class="min-h-screen">

  <!-- 背景层：壁纸 + 遮罩（与博客同一张壁纸） -->
  <div class="fixed inset-0 -z-10 overflow-hidden bg-slate-950">
    <img id="bg-img" src="" alt="" class="w-full h-full object-cover opacity-80"
         onerror="this.style.display='none'" />
    <div id="bg-overlay" class="absolute inset-0 loading"
         style="background: linear-gradient(180deg, rgba(2,6,23,.72) 0%, rgba(2,6,23,.52) 45%, rgba(2,6,23,.85) 100%);"></div>
  </div>

  <!-- 顶部导航栏 -->
  <header class="topbar sticky top-0 z-40 backdrop-blur-md bg-slate-950/55 border-b border-white/10">
    <div class="max-w-6xl mx-auto px-4 h-14 flex items-center gap-3">
      <a href="./index.html"
         class="inline-flex items-center gap-2 text-sm text-slate-300 hover:text-cyan-300
                px-3 py-1.5 rounded-full border border-white/10 bg-white/5
                hover:bg-cyan-400/20 hover:border-cyan-300/40 transition-all min-w-[86px]">
        <i class="fa-solid fa-arrow-left"></i>
        <span class="hidden sm:inline">返回首页</span><span class="sm:hidden">首页</span>
      </a>
      <div class="flex-1 flex items-center justify-center gap-2 min-w-0">
        <i class="fa-solid fa-book-medical text-cyan-300/90"></i>
        <h1 class="text-sm sm:text-base font-semibold truncate bar-text" style="color:var(--c-main)">中职对口升学教材</h1>
      </div>
      <div class="flex items-center gap-2">
        <button id="btn-wrong" title="错题本"
                class="w-9 h-9 rounded-full border border-white/10 bg-white/5 flex items-center justify-center
                       hover:bg-cyan-400/20 text-slate-300 transition-all relative">
          <i class="fa-solid fa-book-bookmark"></i>
          <span id="wrong-badge" class="hidden absolute -top-1 -right-1 bg-rose-500 text-white text-[9px] font-bold px-1 rounded-full leading-none h-4 flex items-center justify-center">0</span>
        </button>
        <a href="./blog.html" title="返回博客"
           class="w-9 h-9 rounded-full border border-white/10 bg-white/5 flex items-center justify-center
                  hover:bg-cyan-400/20 hover:text-cyan-300 text-slate-300 transition-all">
          <i class="fa-solid fa-feather"></i>
        </a>
        <button id="btn-theme" title="切换深浅色"
                class="w-9 h-9 rounded-full border border-white/10 bg-white/5 flex items-center justify-center
                       hover:bg-cyan-400/20 text-slate-300 transition-all">
          <i id="icon-theme" class="fa-solid fa-sun"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6 sm:py-8 space-y-5">

    <!-- ==================== 视图：教材书架（默认） ==================== -->
    <div id="view-main" class="space-y-5">
    <!-- 专栏简介 -->
    <section class="glass-card p-5 sm:p-7 fade-item">
      <h2 class="text-lg sm:text-xl font-bold t-main leading-snug">
        【中职对口升学教材】<span class="text-cyan-300">章节目录 · 背诵要点 · 配套刷题</span>
      </h2>
      <p class="text-[13px] t-sub mt-2.5 leading-relaxed">
        收录护理/助产专业医学基础课与文化课统编教材。点击左侧教材切换，展开章节查看
        <span class="text-cyan-200">小节、核心知识点、重点考点、背诵要点</span>，
        并可跳转刷题。详细笔记持续补充中，欢迎常回来看看 ✍️
      </p>
    </section>

    <!-- 站内搜索 -->

          { type:'judge',  difficulty:'base', q:'细胞膜的液态镶嵌模型认为，膜以液态的脂质双分子层为基架，其中镶嵌着具有不同功能的蛋白质。', answer:true, explain:'脂质分子和膜蛋白的运动使膜具有流动性；膜蛋白承担受体、载体和酶等功能。' },
          { type:'choice', difficulty:'base', q:'细胞内合成蛋白质的场所是', options:['线粒体','中心体','核糖体','溶酶体'], answer:2, explain:'核糖体由大小亚基组成，是把氨基酸装配成肽链的机器；中心体与细胞分裂有关，不合成蛋白质。' },

          { type:'judge',  difficulty:'base', q:'染色质主要由DNA和蛋白质组成，DNA是储存和复制遗传信息的物质基础。', answer:true, explain:'分裂期染色质螺旋浓缩成染色体；核内遗传信息经DNA复制传递给子细胞。' },

          { type:'choice', difficulty:'base', q:'胃、肠黏膜表面的上皮是', options:['单层柱状上皮','复层扁平上皮','假复层纤毛柱状上皮','变移上皮'], answer:0, explain:'胃肠腔面为单层柱状上皮，利于吸收和分泌；耐摩擦的复层扁平上皮位于表皮和口腔、食管。' },

          { type:'choice', difficulty:'base', q:'气管、支气管等呼吸道腔面的上皮主要是', options:['单层立方上皮','复层扁平上皮','假复层纤毛柱状上皮','单层扁平上皮'], answer:2, explain:'假复层纤毛柱状上皮的纤毛定向摆动，可把黏液和尘粒推向咽部排出；它并非真正的多层上皮。' },

          { type:'judge',  difficulty:'base', q:'中心体与细胞分裂时纺锤体的形成及染色体移动有关。', answer:true, explain:'中心体含两个互相垂直的中心粒，分裂时移向细胞两极并形成纺锤体；不分裂时不明显。' },
          { type:'choice', difficulty:'high', q:'下列被覆上皮与其主要分布部位对应正确的是', options:['内皮——心和血管腔面；变移上皮——膀胱；假复层纤毛柱状上皮——呼吸道','间皮——肾小管；单层立方上皮——胸腹膜','复层扁平上皮——胃和肠黏膜','单层柱状上皮——皮肤表皮'], answer:0, explain:'三项对应均正确：内皮在心血管腔面，变移上皮在膀胱，纤毛柱状上皮在呼吸道；其余选项把部位整体错位，属张冠李戴。' },
          { type:'choice', difficulty:'base', q:'能合成、分泌抗体，参与体液免疫的细胞是', options:['成纤维细胞','肥大细胞','巨噬细胞','浆细胞'], answer:3, explain:'浆细胞由B淋巴细胞分化而来，能产生免疫球蛋白即抗体；肥大细胞含组胺和肝素，不产生抗体。' },
          { type:'judge',  difficulty:'mid', q:'平滑肌纤维有横纹，受意识支配，属于随意肌。', answer:false, explain:'平滑肌呈梭形、无横纹，为不随意肌；有横纹、受意识支配的是骨骼肌。' },
          { type:'choice', difficulty:'base', q:'肥大细胞的颗粒中含有', options:['抗体和水解酶','胶原蛋白和弹性蛋白','组胺、白三烯和肝素','DNA和RNA'], answer:2, explain:'组胺、白三烯可使血管扩张、通透性增加，肝素能抗凝血，故肥大细胞与过敏反应有关；抗体由浆细胞产生。' },
          { type:'choice', difficulty:'base', q:'疏松结缔组织中能合成纤维和基质的细胞是', options:['巨噬细胞','成纤维细胞','浆细胞','肥大细胞'], answer:1, explain:'成纤维细胞合成胶原蛋白、弹性蛋白和基质，损伤修复时尤为活跃；巨噬细胞主司吞噬。' },
          { type:'choice', difficulty:'base', q:'疏松结缔组织中具有强大吞噬能力，能吞噬异物和衰老细胞的是', options:['巨噬细胞','成纤维细胞','脂肪细胞','浆细胞'], answer:0, explain:'巨噬细胞由血液中的单核细胞穿出血管后分化而成，并能处理和呈递抗原；成纤维细胞不具吞噬功能。' },
          { type:'choice', difficulty:'mid', q:'下列符合骨骼肌纤维特点的是', options:['梭形、无横纹','有分支、连接处为闰盘','不随意、无横纹','长圆柱状、有明显横纹、多核、为随意肌'], answer:3, explain:'骨骼肌随意、有横纹、多核；有闰盘和分支的是心肌，梭形无横纹的是平滑肌。' },
          { type:'judge',  difficulty:'base', q:'人体的四种基本组织是上皮组织、结缔组织、肌组织和神经组织。', answer:true, explain:'四种基本组织由细胞和细胞间质按不同比例构成；血液、骨和软骨在分类上都属于结缔组织。' },
          { type:'choice', difficulty:'high', q:'下列关于细胞结构与基本组织的叙述，正确的是', options:['核糖体为细胞供能，心肌属于随意肌','肥大细胞产生抗体，膀胱腔面为复层扁平上皮','线粒体供能，浆细胞产生抗体，心肌纤维有闰盘，轴突将冲动传出胞体','溶酶体合成蛋白质，平滑肌有横纹'], answer:2, explain:'该项把功能与结构全部正确配对；供能的是线粒体而非核糖体，抗体由浆细胞而非肥大细胞产生，此类混搭是综合题常见陷阱。' },
          { type:'choice', difficulty:'base', q:'神经元上接受刺激、并将神经冲动传向胞体的突起是', options:['树突','轴突','髓鞘','神经膜'], answer:0, explain:'树突短而分支多，把冲动传向胞体；轴突长而分支少，将冲动由胞体传出，二者方向相反。' },
          { type:'judge',  difficulty:'mid', q:'神经胶质细胞与神经元一样，都能感受刺激并传导神经冲动。', answer:false, explain:'神经胶质细胞对神经元起支持、营养、保护和绝缘作用，不能传导冲动；能传导冲动的只有神经元。' },
          { type:'choice', difficulty:'base', q:'将神经冲动由胞体传向末梢的突起是', options:['树突','轴突','核仁','尼氏体'], answer:1, explain:'每个神经元通常只有一条轴突，末端分支与其他细胞构成突触；树突的传导方向恰好相反。' },
          { type:'choice', difficulty:'mid', q:'关于化学性突触结构的叙述，正确的是', options:['突触前膜与突触后膜直接融合','突触就是相邻细胞间的桥粒','突触只存在于神经元之间','由突触前膜、突触间隙和突触后膜三部分构成，靠神经递质传递'], answer:3, explain:'突触前膜释放递质进入突触间隙，递质与突触后膜受体结合，故冲动只能单向传递；突触也可位于神经元与肌细胞、腺细胞之间。' },
          { type:'choice', difficulty:'base', q:'衬在胸膜、腹膜和心包膜表面的单层扁平上皮称为', options:['内皮','表皮','间皮','真皮'], answer:2, explain:'胸膜、腹膜和心包膜表面的单层扁平上皮特称间皮，表面光滑、利于脏器活动；心、血管腔面的才称内皮。' },
          { type:'choice', difficulty:'base', q:'粗面内质网表面附着的颗粒是', options:['核糖体','线粒体','溶酶体','分泌颗粒'], answer:0, explain:'粗面内质网因表面附着核糖体而得名，主要合成分泌蛋白；无颗粒者为滑面内质网，参与脂质合成。' },
          { type:'judge',  difficulty:'high', q:'核糖体是为细胞供能的细胞器；心肌纤维有闰盘；膀胱腔面衬有变移上皮。', answer:false, explain:'后两句正确，但为细胞供能的是线粒体，核糖体负责合成蛋白质；只要有一句错误，整题即判错。' },
          { type:'choice', difficulty:'base', q:'高尔基复合体的主要功能是', options:['合成ATP','合成DNA','对来自内质网的蛋白质进行加工、浓缩、分选和包装','消化衰老的细胞器'], answer:2, explain:'高尔基复合体是细胞内的「加工包装车间」，还参与溶酶体的形成；执行消化的是溶酶体。' },
          { type:'choice', difficulty:'base', q:'含有多种水解酶、执行细胞内消化功能的细胞器是', options:['中心体','溶酶体','核糖体','滑面内质网'], answer:1, explain:'溶酶体能分解吞噬的异物和衰老细胞器，膜破裂后可致细胞自溶；中心体参与分裂，不具消化作用。' },

      {
        title: '第3章　运动系统',
        sections: [
          '第一节　骨学',
          '第二节　骨连结',
          '第三节　肌学'
        ],
        knowledge: [
          '运动系统由骨、骨连结和骨骼肌三部分组成，约占成人体重的60%；骨借骨连结构成骨骼，成为人体的支架。在神经支配下，骨在运动中起杠杆作用，关节是运动的枢纽，骨骼肌收缩是运动的动力；此外运动系统还具有支持身体、保护颅腔、胸腔和盆腔内重要器官的作用，骨也是钙、磷的储存库。',
          '正常成人有骨206块，按所在部位分为中轴骨和附肢骨：中轴骨包括颅骨29块（脑颅骨8块、面颅骨15块、听小骨6块）和躯干骨51块（椎骨26块、胸骨1块、肋24块即12对），附肢骨即四肢骨126块（上肢骨64块、下肢骨62块）。按形态骨可分为长骨、短骨、扁骨和不规则骨四类：长骨呈长管状、分一体两端，多见于四肢，如肱骨、股骨；短骨近似立方形，如腕骨、跗骨；扁骨呈板状，如颅盖骨、胸骨和肋；不规则骨形状不规则，如椎骨、髋骨，其中具有含气空腔的又称含气骨，如上颌骨。在肌腱内发生的小骨称籽骨，髌骨是人体最大的籽骨。',
          '骨由骨质、骨膜和骨髓构成，并含有丰富的血管和神经。骨质分为骨密质和骨松质：骨密质致密坚硬、耐压性强，配布在骨的外层和长骨骨干；骨松质由骨小梁交织成海绵状，配布在长骨两端以及短骨、扁骨内部。骨膜是覆盖在除关节面以外骨表面的结缔组织膜，内含血管、神经和成骨细胞、破骨细胞，对骨的营养、感觉、生长增粗和骨折后的修复愈合有重要作用，故骨折手术应尽量保留骨膜。',
          '骨髓充填于长骨骨髓腔及骨松质网眼内，分为红骨髓和黄骨髓：红骨髓内含不同发育阶段的红细胞和部分白细胞，有造血功能；胎儿和幼儿全部骨髓都是红骨髓，约5岁起长骨骨髓腔内的红骨髓逐渐被脂肪组织代替而成黄骨髓，正常情况下无造血功能，但在大量失血等情况下可重新转化为红骨髓。成人红骨髓保留在椎骨、髂骨、肋骨、胸骨、肩胛骨及肱骨、股骨两端等的骨松质内，临床骨髓穿刺常选髂嵴、髂结节等处。骨的化学成分随年龄变化：有机质以骨胶原纤维为主，使骨具有韧性和弹性；无机质以钙盐（羟基磷灰石结晶）为主，使骨坚硬挺实；小儿骨有机质比例较大，易变形而不易完全折断（青枝状骨折），老年人骨无机质比例较大、有机质减少，骨质疏松、脆性增加，轻微外伤即可骨折。',
          '椎骨在幼儿期为32或33块，成人5块骶椎融合为1块骶骨、尾椎融合为1块尾骨，故成人椎骨共26块，即颈椎7块、胸椎12块、腰椎5块、骶骨1块、尾骨1块。典型椎骨由前方的椎体和后方的椎弓组成：椎体呈短圆柱状，是承重的主要部分；椎弓与椎体围成椎孔，各椎骨的椎孔连通成椎管，容纳脊髓。椎弓分椎弓根和椎弓板，根的上、下缘有椎上切迹和椎下切迹，相邻椎骨的切迹围成椎间孔，有脊神经和血管通过。由椎弓发出7个突起：向后方的1个棘突，向两侧的1对横突，向上、向下各1对上关节突和下关节突。',
          '颈椎共7块，椎体较小，椎孔相对较大；其主要特征是横突上有横突孔，孔内有椎动、静脉通过（第7颈椎横突孔较小，只有椎静脉通过）。第1颈椎称寰椎，无椎体、棘突和关节突，呈环形，由前弓、后弓和两个侧块构成，上接枕骨髁。第2颈椎称枢椎，椎体向上伸出一指状突起称齿突，与寰椎构成环枢关节，使头部旋转。第7颈椎称隆椎，棘突特别长、末端不分叉，在颈后正中线上容易摸到，低头时尤为明显，是计数椎骨序数和针灸取穴的重要标志。',
          '胸椎共12块，椎体从上向下逐渐增大，椎体两侧面后份上、下缘有半圆形的上肋凹和下肋凹，与肋头相关节；横突末端前面有横突肋凹与肋结节相关节；棘突较长，斜向后下方，呈叠瓦状排列，这些都与胸廓的构成相适应。腰椎共5块，椎体粗大、呈肾形，棘突宽短呈板状、水平伸向后方，相邻棘突之间间隙较宽，临床腰椎穿刺常选第3~4或第4~5腰椎棘突间隙进行。骶骨由5块骶椎融合而成，呈倒置三角形，底向上，底前缘中份向前突出称骶岬；前面（盆面）光滑凹陷，有4对骶前孔，后面粗糙隆凸有4对骶后孔，均与骶管相通。骶骨中央有纵贯全长的骶管，上通椎管，下端裂开称骶管裂孔，裂孔两侧向下的突起称骶角，是临床骶管麻醉（骶管裂孔穿刺）的重要体表标志。尾骨由3~4块退化的尾椎融合而成，上接骶骨，下端游离为尾骨尖。',
          '胸骨位于胸前壁正中，是扁骨，自上而下分为胸骨柄、胸骨体和剑突三部分：柄上缘中份为颈静脉切迹，两侧为锁切迹与锁骨相连；柄与体连接处微向前凸称胸骨角，可在体表扪及，其两侧平对第2肋软骨（即平第2肋），向后平对第4胸椎体下缘，是计数肋和肋间隙序数的重要标志。剑突扁而薄，末端游离。肋共12对，由肋骨和肋软骨构成：第1~7对肋的前端直接与胸骨相连，称真肋；第8~10对肋软骨不直接连胸骨，而依次连于上位肋软骨形成肋弓，称假肋；第11、12对肋前端游离于腹壁肌层中，称浮肋。肋弓是触摸肝、脾和胆囊底的重要标志。',
          '颅骨共23块（未计3对听小骨），彼此借骨连结连成颅，分脑颅和面颅两部分。脑颅骨共8块，围成颅腔、容纳保护脑，包括前方的额骨1块、后方的枕骨1块、两顶骨之间下方的蝶骨1块、两眶之间的筛骨1块，以及顶骨和颞骨各2块；可记为「额枕蝶筛各一块，顶骨颞骨各成双」。面颅骨共15块，构成面部支架和眶、鼻腔、口腔的骨性基础，其中成对的有上颌骨、颧骨、鼻骨、泪骨、腭骨和下鼻甲各2块（共12块），不成对的有下颌骨、犁骨和舌骨各1块；下颌骨是颅骨中唯一能活动的骨（听小骨除外），分一体两支，有下颌角、下颌头和牙槽弓等结构。',
          '颞窝内侧壁上，额、顶、颞、蝶四骨汇合处构成H形的骨缝称翼点（位于太阳穴深面），该处骨质最薄，其内面有脑膜中动脉前支紧贴通过；颞部外伤骨折时易撕裂该动脉，引起硬膜外血肿，典型表现为伤后短暂昏迷、中间清醒后再次昏迷，临床十分重要。鼻旁窦是上颌骨、额骨、蝶骨和筛骨内的含气空腔，位于鼻腔周围并开口于鼻腔，对发音起共鸣作用，共4对，即上颌窦、额窦、筛窦和蝶窦；上颌窦最大，因其开口位于窦内侧壁上部、窦底低于窦口，直立或坐位时引流不畅，故慢性炎症发病率最高，牙根感染也易波及上颌窦。',
          '上肢骨共64块，两侧对称。上肢带骨包括锁骨和肩胛骨：锁骨呈横置的S形，内侧2/3凸向前、外侧1/3凸向后，支撑肩胛骨使上肢离开胸壁，骨折多见于中、外1/3交界处；肩胛骨为三角形扁骨，贴于胸廓后外侧，介于第2~7肋之间，背面有肩胛冈，冈的外侧端扁平突起为肩峰，前面凹陷为肩胛下窝，外侧角有梨形关节盂，上角平第2肋、下角平第7肋（计数肋的标志）。自由上肢骨中肱骨是上臂的长骨：上端有半球形肱骨头，头周围的浅沟为解剖颈，上端与体交界处较细称外科颈，是骨折易发部位；体后面有自内上斜向外下的桡神经沟，肱骨中段骨折易损伤桡神经；下端前后扁，有内上髁、外上髁和与尺骨相关节的肱骨滑车。前臂外侧为桡骨（有桡骨头、桡骨茎突），内侧为尺骨（上端粗大，有滑车切迹及其前下方的冠突、后上方粗大的鹰嘴，屈肘时肘后最突出的骨性标志即为尺骨鹰嘴；下端为尺骨头）。腕骨8块排成两列，可记为「舟、月、三角、豆，大、小、头状、钩」；另有掌骨5块、指骨14块（拇指2节，其余各3节）。',
          '下肢骨共62块。下肢带骨即髋骨，为不规则扁骨，幼年时由上方的髂骨、前下方的耻骨和后下方的坐骨三骨借软骨连接，约16岁前后在髋臼处融合为一块；三骨融合处外侧有深窝称髋臼，与股骨头相关节，髋骨前下份有闭孔。髂骨上缘肥厚呈弓形称髂嵴，前端为髂前上棘，髂嵴前、中1/3交界处向外突出为髂结节，均为重要体表标志和骨髓穿刺、肌注定位标志；坐骨最低处粗糙为坐骨结节，耻骨两支交汇处内侧有耻骨联合面。自由下肢骨中股骨是人体最长、最结实的长骨，长度约为身高的1/4：上端有股骨头、股骨颈，颈与体之间形成颈干角，老年人骨质疏松，股骨颈骨折十分常见；颈根部外上方的大转子可在体表摸到，是测量下肢长度的标志。髌骨位于股四头肌腱内，是最大的籽骨。胫骨位于小腿内侧、较粗壮，承重为主要功能，上端有内侧髁、外侧髁，上端前面的粗糙隆起称胫骨粗隆，下端向内下突起为内踝；腓骨细长位于小腿后外侧，上端为腓骨头，下端膨大为外踝。足骨包括跗骨7块（距骨、跟骨、足舟骨、骰骨和3块楔骨，其中跟骨最大）、跖骨5块和趾骨14块。',
          '骨与骨之间的连结装置称骨连结，按连结方式分直接连结和间接连结。直接连结之间无腔隙，活动度小或不能活动，包括缝、韧带等纤维连结，椎间盘、耻骨联合等软骨连结以及骶椎间的骨性结合。间接连结又称关节（滑膜关节），特点是骨与骨之间有腔隙，活动度大，其基本构造包括关节面、关节囊和关节腔：关节面是相关节骨的对应面，表面覆有关节软骨，光滑而有弹性，可减少摩擦、缓冲震荡；关节囊为结缔组织囊，分内、外两层，外层为纤维层、厚而坚韧，内层为滑膜层、薄而柔软，能分泌滑液润滑关节；关节腔是关节囊滑膜层与关节软骨围成的密闭腔隙，内含少量滑液，腔内呈负压，对维持关节稳固有一定作用。关节的辅助结构有韧带、关节盘（如膝关节半月板）、关节唇（如肩关节盂唇）和滑膜襞等。关节的运动形式有屈和伸、内收和外展、旋内和旋外以及环转。',
          '椎体之间借椎间盘、前纵韧带和后纵韧带相连。椎间盘是连于相邻两个椎体之间的纤维软骨盘，成人共23块，盘的中央部分为柔软而富有弹性的胶状物质称髓核，是胚胎时期脊索的残留；周围部分为多层同心圆排列的纤维软骨构成的纤维环，坚韧而有弹性，牢固连接椎体并限制髓核向周围膨出。椎间盘既坚韧又富弹性，可缓冲震荡、允许脊柱各方向适度运动；纤维环前宽后窄，前纵韧带强韧、后纵韧带较窄，故后外侧部最为薄弱，当弯腰负重、剧烈扭转或突然劳损时，髓核易向后外侧突出，突入椎管或椎间孔压迫脊神经根和脊髓，引起腰腿痛甚至下肢感觉、运动障碍，即临床常见的椎间盘突出症，好发于活动度和负重较大的第4~5腰椎和第5腰椎与骶骨之间。椎弓间还有黄韧带（连于相邻椎弓板之间，由弹性纤维构成）、棘间韧带和棘上韧带（颈部扩展为项韧带）等。',
          '脊柱由24块椎骨、1块骶骨和1块尾骨借椎间盘、韧带和关节紧密连结而成，构成躯干的中轴，上承颅骨、下连髋骨，中附肋骨并参与胸廓、腹后壁和骨盆的构成。从前面观，椎体自第2颈椎到第2骶椎逐渐增宽（因承重渐增），自骶骨耳状面以下又迅速缩小。从侧面观，脊柱有4个生理性弯曲：颈曲和腰曲凸向前方，胸曲和骶曲凸向后方；胸曲、骶曲在胚胎时已形成（先天弯曲），颈曲在婴儿抬头、坐起时出现，腰曲在婴儿站立、行走后形成（后天弯曲）。这些弯曲使脊柱更具弹性，可缓冲行走、跳跃时对脑和内脏器官的震荡，并维持身体重心平衡。脊柱具有支持体重、保护脊髓和脊神经根、保护胸腹腔脏器以及做前屈、后伸、侧屈、旋转和环转运动的功能。',
          '胸廓由12块胸椎、12对肋、1块胸骨和它们之间的骨连结共同围成，肋的后端借肋头关节、肋横突关节与胸椎相连，前端借肋软骨连于胸骨或上位肋软骨。胸廓有上、下两口和前、后、外侧壁：胸廓上口较小，由第1胸椎、第1对肋和胸骨柄上缘围成，是胸腔与颈部的通道；胸廓下口宽而不整，由第12胸椎、第11和12对肋、肋弓及剑突围成，两侧肋弓在中线构成向下开放的胸骨下角，相邻肋骨之间的间隙称肋间隙。胸廓形态与年龄、性别、体型和健康状况有关，儿童胸廓近似桶状，成年人前后径较左右径短、近似圆锥形，佝偻病儿童可形成鸡胸。胸廓除支持和保护心、肺、大血管及肝等器官外，主要参与呼吸运动：吸气时肋上提、肋体外翻，胸廓前后径和左右径增大，配合膈下降扩大胸腔；呼气时恢复原位。',
          '肩关节由肱骨头与肩胛骨的关节盂构成，是典型的球窝关节。其结构特点是：肱骨头大、关节盂浅而小，盂周缘虽有纤维软骨形成的关节唇加深，但仅能容纳肱骨头的1/4~1/3；关节囊薄而松弛，其上方、前方和后方有韧带及肩袖肌（冈上肌、冈下肌、肩胛下肌和小圆肌）的腱加强，囊内有肱二头肌长头腱沿结节间沟穿过，而关节囊的前下方缺少韧带和肌腱加强，最为薄弱。因此肩关节是全身运动范围最大、最灵活的关节，可作屈、伸、内收、外展、旋内、旋外和环转运动，但稳固性较差；当跌倒时上肢处于外展、外旋位撑地，或突然遭受外力，肱骨头易从前下部脱出，形成肩关节前脱位（临床最常见的关节脱位），出现方肩畸形，患侧手掌不能同时搭到健侧肩部。',
          '肘关节是复合关节，由肱骨下端与尺、桡骨上端构成，包在一个共同的关节囊内，包括三个关节：肱骨滑车与尺骨滑车切迹构成的肱尺关节（为主要部分，只作屈伸）、肱骨小头与桡骨头关节凹构成的肱桡关节，以及桡骨头与尺骨桡切迹构成的桡尺近侧关节。关节囊前、后壁薄而松弛，两侧壁厚并有韧带加强：外侧有桡侧副韧带，内侧有尺侧副韧带，还有环绕桡骨头的桡骨环状韧带，防止桡骨头脱出。在肘后区，肱骨内上髁、外上髁和尺骨鹰嘴三点在伸肘时位于同一直线上，屈肘90度时三点构成等腰三角形（肘后三角）；肘关节后脱位时三点关系破坏，而肱骨髁上骨折时关系不变，可借以鉴别。5岁以下小儿桡骨头尚未发育完全、环状韧带松弛，当手臂在旋前位被突然用力提拉时，桡骨头可被环状韧带卡住，称桡骨头半脱位（牵拉肘）。',
          '骨盆由左右髋骨、骶骨和尾骨借骶髂关节、耻骨联合以及韧带连结而成，是连接躯干与下肢的盆状骨架。骨盆以界线分为上方的大骨盆和下方的小骨盆：界线是由骶岬、弓状线、耻骨梳、耻骨结节和耻骨联合上缘连成的环形线；小骨盆有上、下两口，上口即界线所围的入口，下口由尾骨、骶结节韧带、坐骨结节、坐骨支、耻骨下支和耻骨联合下缘围成，两口之间为骨盆腔，容纳直肠、膀胱和生殖器官。从青春期开始骨盆出现明显性别差异，女性骨盆适应妊娠和分娩功能：外形宽而短，骨盆上口近似圆形或横椭圆形，下口较宽大，骨盆腔短而宽呈圆桶状，骶骨宽短、弯曲度小，耻骨下角（两侧耻骨下支、坐骨支相连形成的角）较大，约90~100度；男性骨盆窄而长，上口近似心形，下口狭小，盆腔呈漏斗状，耻骨下角约70~75度。',
          '膝关节由股骨内、外侧髁，胫骨内、外侧髁和髌骨共同构成，是人体最大、结构最复杂的关节。关节囊宽阔而松弛，周围及囊内外有众多结构加强：前方有股四头肌腱延续的髌韧带（位于髌骨下缘与胫骨粗隆之间），内侧有胫侧副韧带、外侧有腓侧副韧带，囊的后壁亦有韧带。关节囊内有膝交叉韧带和半月板：前交叉韧带起自胫骨髁间前窝，向上后外止于股骨外侧髁内面，伸膝时最紧张，可防止胫骨向前移位；后交叉韧带可防止胫骨向后移位。半月板是垫在股骨与胫骨关节面之间的两块纤维软骨板，内侧半月板较大呈C形、外缘与胫侧副韧带紧密相连故较易损伤，外侧半月板较小近似O形；半月板使关节面更为贴合，增强稳固性并缓冲震荡。膝关节主要作屈、伸运动，半屈位时小腿还可作轻度旋内和旋外。踝关节（距小腿关节）由胫、腓骨下端和距骨构成，能背屈（伸）和跖屈（屈），跖屈时关节松动、足易内翻而损伤外侧韧带，是临床最常见的扭伤；跗骨和跖骨借韧带、肌腱牵拉形成凸向上的足弓，富有弹性，可缓冲震荡并保护足底血管神经。',
          '运动系统所讲的肌均为骨骼肌，全身骨骼肌约600多块，约占体重的40%。按外形肌可分为长肌（多见于四肢，收缩时产生大幅度运动）、短肌（多位于躯干深部）、扁肌（扁阔，多分布于胸腹壁，除运动外还构成体壁、保护内脏）和轮匝肌（位于孔裂周围，如眼轮匝肌、口轮匝肌，收缩时关闭孔裂）。每块肌由肌腹和肌腱两部分构成：肌腹主要由骨骼肌纤维组成，色红柔软、有收缩能力；肌腱由致密结缔组织构成，色白强韧、无收缩能力，附着于骨。肌的附着点分起点和止点：通常把接近身体正中面或四肢近侧、较固定的附着点称起点（定点），另一端活动度较大称止点（动点）。肌周围的辅助结构包括筋膜（浅筋膜即皮下脂肪组织，深筋膜包绕肌群并形成肌间隔）、滑膜囊（减少肌腱与骨面摩擦的密闭结缔组织囊）和腱鞘（包绕长肌腱的鞘管，存在于腕、踝和指趾等处，由纤维层和滑膜层组成，可固定肌腱并减少摩擦）。',
          '头肌分为面肌和咀嚼肌。面肌为扁薄的皮肌，位置表浅，多起自颅骨或筋膜、止于面部皮肤，收缩时改变面部皮肤和五官外形、产生各种表情，故又称表情肌，主要有枕额肌（提眉、形成额纹）、眼轮匝肌（闭合眼裂）、口轮匝肌（闭口）和颊肌等。咀嚼肌包括咬肌、颞肌、翼内肌和翼外肌，配布于颞下颌关节周围，参与咀嚼运动，咬肌收缩时在下颌角外上方可摸到明显隆起。颈肌分浅、深群：浅层最重要的是胸锁乳突肌，斜列于颈部两侧，是颈部重要体表标志；起自胸骨柄和锁骨的胸骨端，两头会合后斜向后上止于颞骨乳突。一侧胸锁乳突肌收缩，使头向同侧倾斜、面部转向对侧；两侧同时收缩，使头后仰；分娩损伤致一侧胸锁乳突肌痉挛可引起先天性斜颈。颈深层还有舌骨上、下肌群和斜角肌等。',
          '躯干肌包括背肌、胸肌、膈、腹肌和会阴肌。背肌浅层主要有斜方肌和背阔肌：斜方肌位于项部和背上部，为三角形扁肌，两侧合成斜方形，可上提、下降和内拉肩胛骨，瘫痪时产生塌肩；背阔肌位于背下部和胸侧部，是全身最大的扁肌，可使肩关节内收、旋内和后伸（如背手姿势），上肢上举固定时可引体向上。竖脊肌（骶棘肌）纵列于棘突两侧，是背肌中最长、最大者，对伸脊柱、仰头和维持直立姿势有重要作用。胸肌中胸大肌位于胸前壁浅层，可使肱骨内收和旋内，上肢固定时可引体向上并提肋助深吸气；肋间外肌提肋助吸气，肋间内肌降肋助呼气。膈是分隔胸腔和腹腔、向上膨隆的穹隆形扁肌，为主要呼吸肌，周围为肌性部，中央为腱膜称中心腱；膈上有三个裂孔：在第12胸椎前方、左右膈脚与脊柱之间为主动脉裂孔，有主动脉和胸导管通过；约平第10胸椎水平为食管裂孔，有食管和迷走神经通过；约平第8胸椎水平、位于中心腱内为腔静脉孔，有下腔静脉通过。膈收缩时膈穹下降、胸腔容积扩大而吸气，松弛时膈穹上升而助呼气；膈与腹肌同时收缩可增加腹压，协助排便、分娩、呕吐和咳嗽。腹肌前外侧群包括位于腹前壁正中线两侧的腹直肌，以及腹外斜肌、腹内斜肌和腹横肌三层阔肌；腹外斜肌腱膜下缘卷曲增厚形成腹股沟韧带，张于髂前上棘与耻骨结节之间。在腹股沟韧带内侧半上方，腹前壁下部有一由肌和腱膜围成的斜行裂隙称腹股沟管，长约4~5cm，男性有精索、女性有子宫圆韧带通过，为腹壁薄弱区，是腹股沟疝的好发部位。腹肌有保护腹腔脏器、增加腹压和使脊柱前屈、侧屈及旋转的作用。',
          '上肢肌中三角肌位于肩部，从前、外、后三面包裹肱骨上端，肌腹肥厚、外形圆隆，主要作用是使肩关节外展（前部肌束可屈和旋内，后部肌束可伸和旋外），因其肌腹厚、深部无大血管神经，中部是肌内注射的常用部位，但注射点不可偏前或偏下，以免伤及神经。上臂前群的肱二头肌有长、短两头，止于桡骨粗隆，主要作用是屈肘关节并使前臂旋后（屈肘时臂前部隆起的肌腹即是）；上臂后群的肱三头肌有长头、外侧头和内侧头，止于尺骨鹰嘴，主要作用是伸肘关节。下肢肌中臀大肌位于臀部皮下，大而肥厚，形成臀部膨隆，可使髋关节伸和旋外，对维持直立姿势十分重要；其外上象限血管神经少、距坐骨神经主干较远，是肌内注射最常选的部位（用十字法或连线法定位），以防损伤坐骨神经。大腿前群的股四头肌是全身体积最大的肌，有股直肌、股内侧肌、股外侧肌和股中间肌四个头，向下包绕髌骨延续为髌韧带，止于胫骨粗隆，主要作用是伸膝关节，股直肌还可屈髋关节，是维持直立、行走和上下楼的关键肌。小腿后群的小腿三头肌位置最浅，由浅层的腓肠肌（内、外侧两头）和其深面的比目鱼肌合成，三个头会合下移行为粗大坚韧的跟腱，止于跟骨结节；可上提足跟、使足跖屈，并在站立时固定膝、踝关节、防止身体前倾，对行走、跑跳和维持直立起重要作用，跟腱断裂时不能提踵。'

          { type:'choice', difficulty:'base', q:'临床计数椎骨序数时作为重要标志的是', options:['第1颈椎的前结节','第2颈椎的齿突','第7颈椎的棘突','第1胸椎的棘突'], answer:2, explain:'第7颈椎称隆椎，棘突特别长，在颈后正中易于扪及；齿突位置深在，不能作为体表计数标志。' },
          { type:'choice', difficulty:'mid', q:'肩关节运动灵活但稳固性较差，与其灵活性直接相关的结构特点是', options:['肱骨头大而关节盂浅小，关节囊薄而松弛','关节窝深、关节囊厚而紧张','关节囊周围韧带强厚、完全没有薄弱区','肱骨头与关节窝面积等大、嵌合紧密'], answer:0, explain:'关节盂仅能容纳肱骨头的一小部分，加上关节囊薄而松弛，既决定了灵活性，也使其容易脱位。' },

          { type:'judge',  difficulty:'base', q:'臀大肌外上象限深部无重要神经血管主干，临床常选该部位做肌内注射，以避免损伤坐骨神经。', answer:true, explain:'臀大肌肌注用十字法或连线法选外上象限；若偏内下方进针，可能伤及坐骨神经。' },
          { type:'choice', difficulty:'base', q:'脑颅骨的数目是', options:['8块','10块','15块','23块'], answer:0, explain:'脑颅8块、面颅15块，共23块（不含听小骨）；15块是面颅骨数目，属易错干扰项。' },
          { type:'choice', difficulty:'base', q:'容积最大、直立位引流不畅、最易发生慢性炎症的鼻旁窦是', options:['额窦','筛窦','蝶窦','上颌窦'], answer:3, explain:'上颌窦最大，窦口位置高于窦底，直立或坐位时分泌物不易引流，故上颌窦炎发病率最高。' },
          { type:'judge',  difficulty:'mid', q:'椎间盘中央为坚韧的纤维环，周围是柔软的髓核；髓核多向前方突出压迫脊神经。', answer:false, explain:'结构恰好相反：中央是髓核、周围是纤维环；且纤维环后外侧薄弱，髓核多向后外侧突出，而非前方。' },
          { type:'choice', difficulty:'base', q:'肱骨上端与肱骨体交界处较细、易发生骨折的部位是', options:['肱骨头','外科颈','解剖颈','鹰嘴'], answer:1, explain:'外科颈是松质骨与密质骨的移行处，为骨折好发部位；解剖颈为肱骨头周围的浅沟，骨折少见。' },
          { type:'choice', difficulty:'mid', q:'下列关于女性骨盆的叙述，正确的是', options:['外形窄而长，适应承重','骨盆上口近似心形','耻骨下角约70~75度','宽而短，上口近圆形，盆腔呈圆桶状，耻骨下角约90~100度'], answer:3, explain:'女性骨盆为适应分娩而宽短、下口宽大、耻骨下角大；窄长、心形上口和70~75度均为男性骨盆特征。' },
          { type:'choice', difficulty:'base', q:'构成髋骨的三块骨是', options:['髂骨、骶骨、耻骨','坐骨、骶骨、髂骨','髂骨、坐骨、耻骨','耻骨、尾骨、坐骨'], answer:2, explain:'幼年髋骨由髂骨、坐骨、耻骨三骨组成，约16岁在髋臼处融合为一块；骶骨和尾骨不属于髋骨。' },
          { type:'judge',  difficulty:'base', q:'肱二头肌的主要作用是伸肘关节，肱三头肌的主要作用是屈肘关节。', answer:false, explain:'二者作用恰好相反：肱二头肌屈肘并使前臂旋后，肱三头肌伸肘；止点分别为桡骨粗隆和尺骨鹰嘴。' },
          { type:'choice', difficulty:'base', q:'老年人骨质疏松时最易发生骨折的股骨部位是', options:['股骨颈','股骨头中央','大转子尖','股骨体中段'], answer:0, explain:'股骨颈较细且为偏心承重部位，老年人骨质疏松后轻微扭转即可骨折；股骨干骨密质厚，相对不易骨折。' },
          { type:'choice', difficulty:'high', q:'下列关于运动系统结构的综合叙述，正确的是', options:['内侧半月板呈O形，外侧半月板呈C形；腔静脉孔平第12胸椎','前交叉韧带防止胫骨后移；膈收缩时膈穹上升助呼气','膈的腔静脉孔平第8胸椎、有下腔静脉通过；内侧半月板呈C形，前交叉韧带可防止胫骨向前移位','半月板和交叉韧带都位于关节囊之外'], answer:2, explain:'该项三处对应全部正确：腔静脉孔最高平胸8，内侧半月板大呈C形，前交叉韧带防止胫骨前移；其余选项把数字或功能整体错位。' },
          { type:'choice', difficulty:'base', q:'关节的基本构造是', options:['关节面、关节盘、关节唇','韧带、关节盘、关节腔','关节囊、韧带、关节盘','关节面、关节囊、关节腔'], answer:3, explain:'关节面、关节囊、关节腔为关节三要素；韧带、关节盘和关节唇属于辅助结构，并非每个关节都有。' },
          { type:'judge',  difficulty:'mid', q:'膈收缩时膈穹隆上升、胸腔容积缩小，因而引起呼气。', answer:false, explain:'膈是主要的吸气肌，收缩时膈穹下降、胸腔上下径增大而吸气；松弛时穹隆上升才助呼气。' },
          { type:'choice', difficulty:'base', q:'椎间盘的中央部分是', options:['纤维环','软骨板','髓核','黄韧带'], answer:2, explain:'中央为胶状的髓核，周围为纤维软骨构成的纤维环；黄韧带连于相邻椎弓板之间，不属于椎间盘。' },
          { type:'choice', difficulty:'mid', q:'一侧胸锁乳突肌收缩时，可使', options:['头向前屈','头偏向同侧、面部转向对侧','头偏向对侧、面部转向同侧','头直接后仰'], answer:1, explain:'一侧收缩使头向同侧屈、面向对侧旋转；只有两侧同时收缩才使头后仰，这是高频易错点。' },
          { type:'choice', difficulty:'base', q:'髓核最容易从椎间盘的哪个方向突出', options:['前方','后外侧','正后方','前外侧'], answer:1, explain:'后纵韧带较窄、纤维环后外侧薄弱，故髓核多向后外侧突出，压迫经椎间孔走出的脊神经根。' },
          { type:'judge',  difficulty:'high', q:'股四头肌是全身最大的肌，经髌韧带止于胫骨粗隆、伸膝关节；膝关节前交叉韧带可防止胫骨向后移位。', answer:false, explain:'前两句正确，但前交叉韧带防止的是胫骨向前移位，防止胫骨后移的是后交叉韧带；综合题中有一处错误即判错。' },
          { type:'choice', difficulty:'base', q:'膈的主动脉裂孔约平对', options:['第8胸椎','第9胸椎','第10胸椎','第12胸椎'], answer:3, explain:'三个裂孔自上而下为腔静脉孔平胸8、食管裂孔平胸10、主动脉裂孔平胸12，数字须一一牢记。' },
          { type:'choice', difficulty:'base', q:'全身体积最大的肌是', options:['臀大肌','股四头肌','背阔肌','小腿三头肌'], answer:1, explain:'股四头肌有四个头，是全身最大的肌，主伸膝关节；背阔肌是全身最大的扁肌，两种提法不同。' }
        ]

      {
        title: '第4章　消化系统',
        sections: [
          '第一节　概述',
          '第二节　口腔',
          '第三节　咽',
          '第四节　食管',
          '第五节　胃',
          '第六节　小肠',
          '第七节　大肠',
          '第八节　消化腺'
        ],
        knowledge: [
          '消化系统由消化管和消化腺两部分组成。消化管是从口腔到肛门的粗细不等的管道，包括口腔、咽、食管、胃、小肠（十二指肠、空肠、回肠）和大肠（盲肠、阑尾、结肠、直肠、肛管）。临床上常把口腔到十二指肠的一段称上消化道，空肠以下的部分称下消化道。消化腺分大消化腺（大唾液腺、肝、胰）和小消化腺（唇腺、颊腺、胃腺、肠腺等）。',
          '口腔是消化管的起始部，前壁为唇、侧壁为颊、上壁为腭、下壁为口腔底，向前经口裂通外界，向后借咽峡与咽相通。腭的前2/3为硬腭，后1/3为软腭；软腭后缘中央向下的突起称腭垂，腭垂、两侧腭舌弓和舌根共同围成咽峡，是口腔与咽的分界。',
          '牙是人体最坚硬的器官，嵌于上、下颌骨的牙槽内，分牙冠、牙颈、牙根三部分；牙由牙质、釉质、牙骨质和牙髓构成，牙内部的牙腔容纳牙髓，牙髓内含神经、血管和结缔组织。人的一生有乳牙和恒牙两套牙：乳牙共20个，生后约6个月开始萌出、3岁左右出齐；恒牙共32个，6岁左右开始萌出并替换乳牙。临床用牙式记录牙位，以「┼」划分上下颌和左右侧，恒牙用阿拉伯数字、乳牙用罗马数字表示。',
          '舌位于口腔底，由骨骼肌外覆黏膜构成，分舌尖、舌体和舌根三部分。舌背黏膜有许多舌乳头，其中菌状乳头和轮廓乳头等处含味蕾，能感受酸、甜、苦、咸等味觉；丝状乳头数量最多，只司一般感觉。舌肌为骨骼肌，舌可搅拌食物、协助吞咽和发音。',
          '唾液腺分大、小两类，小唾液腺如唇腺、颊腺位于口腔黏膜内；大唾液腺有3对：腮腺最大，位于耳郭前下方，导管开口于平对上颌第2磨牙的颊黏膜处；下颌下腺位于下颌骨体内面，导管开口于舌下阜；舌下腺最小，位于舌下襞深面，导管开口于舌下阜和舌下襞。唾液可湿润口腔、清洁口腔、形成食团并初步分解淀粉。',
          '咽是前后略扁的漏斗形肌性管道，位于颈椎前方，上起颅底、下至第6颈椎体下缘续于食管，全长约12cm，是消化和呼吸的共同通道。咽自上而下分鼻咽、口咽和喉咽三部：鼻咽侧壁有咽鼓管咽口，咽腔经此口借咽鼓管通中耳鼓室，咽口后上方的咽隐窝是鼻咽癌好发部位；口咽侧壁腭舌弓与腭咽弓之间的窝内容纳腭扁桃体。',
          '食管是前后扁窄的肌性管道，上端在第6颈椎体下缘接咽，下端约平第11胸椎体左侧连贲门，全长约25cm，分颈、胸、腹三部。食管全长有3处生理性狭窄：第一处在食管起始处，距中切牙约15cm；第二处在与左主支气管交叉处，距中切牙约25cm；第三处在穿膈的食管裂孔处，距中切牙约40cm。三个狭窄是异物滞留和食管癌的好发部位，食管插管时应注意顺利通过。',
          '胃是消化管最膨大的部分，上接食管、下续十二指肠，可容纳食物、分泌胃液并初步消化食物。胃的入口称贲门，出口称幽门；胃分贲门部、胃底、胃体和幽门部（临床常称胃窦）四部分。胃在中等充盈时大部分位于左季肋区，小部分位于腹上区。',
          '小肠上起幽门、下接盲肠，成人全长约5~7m，是食物消化和吸收的主要部位，分十二指肠、空肠和回肠。十二指肠长约25cm，呈C形包绕胰头，分上部、降部、水平部和升部；上部起始处壁薄、黏膜光滑无环形皱襞，称十二指肠球，是十二指肠溃疡好发部位；降部后内侧壁有十二指肠大乳头，是胆总管和胰管的共同开口处，距中切牙约75cm。',
          '空肠和回肠借肠系膜连于腹后壁，二者无明显界限。空肠占近侧2/5，多位于腹腔左上部，管径较大、管壁较厚、血管丰富、颜色较红，黏膜环形皱襞密而高，有孤立淋巴滤泡；回肠占远侧3/5，多位于腹腔右下部，管径较小、管壁较薄、颜色较淡，皱襞疏而低，除孤立淋巴滤泡外还有集合淋巴滤泡。',
          '大肠长约1.5m，围绕在空、回肠周围，分盲肠、阑尾、结肠、直肠和肛管五部分。除直肠、肛管和阑尾外，大肠有结肠带、结肠袋和肠脂垂三个特征性结构；结肠带由肠壁纵行肌增厚形成，三条结肠带均汇集于阑尾根部，手术中可沿结肠带寻找阑尾。',
          '盲肠是大肠的起始部，位于右髂窝，下端为盲端、上续升结肠。回肠末端开口于盲肠，开口处的两片唇样皱襞称回盲瓣，既可控制回肠内容物进入盲肠的速度，又可防止盲肠内容物反流入回肠。阑尾根部连于盲肠后内壁，其体表投影通常在脐与右髂前上棘连线的中、外1/3交点处，称麦氏点，急性阑尾炎时该处有明显压痛。',
          '结肠分升结肠、横结肠、降结肠和乙状结肠四部：升结肠上行至肝下方形成结肠右曲，横结肠左行至脾下方形成结肠左曲，乙状结肠呈S形弯曲，至第3骶椎平面续直肠。直肠长约10~14cm，位于骶骨前方，矢状面上有凸向后的骶曲和凸向前的会阴曲，直肠镜检查时应注意顺应弯曲进镜。',
          '肛管长约3~4cm，上接直肠、下端终于肛门。肛管内面有6~10条纵行的肛柱，相邻肛柱下端之间有半月形肛瓣；各肛柱下端与肛瓣基部连成锯齿状环形线称齿状线，是黏膜与皮肤的分界线，也是内痔与外痔的分界标志（线上为内痔、线下为外痔）。肛门内括约肌为平滑肌、不受意识支配，肛门外括约肌为骨骼肌，可随意控制排便。',
          '肝是人体最大的消化腺，成人肝重约1500g，质软而脆，受暴力打击易破裂。肝大部分位于右季肋区和腹上区，小部分位于左季肋区。膈面以镰状韧带分右叶和左叶；脏面有呈H形的沟，其中横沟称肝门，是肝左管、肝右管、肝固有动脉、肝门静脉及神经、淋巴管进出的部位。肝有分泌胆汁、参与代谢、储存糖原、解毒和吞噬防御等功能，胚胎时期还有造血功能。',
          '肝外胆道包括肝左管、肝右管、肝总管、胆囊和胆总管。胆囊位于肝下面的胆囊窝内，呈梨形，分底、体、颈、管四部分，有储存和浓缩胆汁的作用；胆囊底的体表投影在右锁骨中线与右肋弓相交处，胆囊炎时该处压痛。胆囊管与肝总管汇合成胆总管，胆总管长约4~8cm，末端与胰管汇合成肝胰壶腹，开口于十二指肠降部的十二指肠大乳头。',
          '胆汁由肝细胞分泌。平时肝胰壶腹括约肌收缩，胆汁经肝左管、肝右管、肝总管和胆囊管进入胆囊储存、浓缩；进食后（尤其高脂肪食物后）胆囊收缩、肝胰壶腹括约肌舒张，胆汁经胆囊管、胆总管排入十二指肠，参与脂肪的消化和吸收。',
          '胰是人体第二大消化腺，位于胃后方，横卧于第1、2腰椎体前方，色灰红、质柔软，分头、体、尾三部分，胰头被十二指肠包绕，胰尾伸向脾门。胰分外分泌部和内分泌部：外分泌部分泌含多种消化酶的胰液，经胰管排入十二指肠，分解糖类、脂肪和蛋白质；内分泌部即散在的胰岛，分泌胰岛素和胰高血糖素，调节血糖，胰岛素分泌不足可引起糖尿病。'
        ],
        examPoints: [
          '消化系统组成及上消化道范围（口腔至十二指肠），属直考识记，常以选择、填空出现。',
          '乳牙20个、恒牙32个及牙的构造（牙冠、牙颈、牙根，牙腔内有牙髓）；舌乳头中味蕾司味觉。',
          '三对大唾液腺名称及导管开口，尤其是腮腺导管开口于平对上颌第2磨牙的颊黏膜，几乎每年必考。',
          '咽分鼻咽、口咽、喉咽三部；咽鼓管咽口通中耳鼓室，咽隐窝为鼻咽癌好发部位。',
          '食管全长约25cm及三个狭窄距中切牙的距离（15、25、40cm），数字配对为高频考点，常结合插胃管、食管异物情境考查。',

          '十二指肠大乳头是胆总管和胰管共同开口处；十二指肠球为溃疡好发部位；空肠与回肠的位置、结构对比。',
          '大肠三特征（结肠带、结肠袋、肠脂垂）；齿状线为黏膜与皮肤、内痔与外痔的分界；直肠两个弯曲。',
          '肝的位置（大部分在右季肋区和腹上区）、肝门进出结构及肝的功能；胆囊底投影（右锁骨中线与右肋弓交点）。',
          '胆汁由肝细胞分泌及进食前后的排出路径；胰的外分泌部（胰液）与内分泌部（胰岛分泌胰岛素）。'

        memorize: [

          '牙：乳牙二十、恒牙三十二；分冠、颈、根，牙腔含牙髓。',

          '咽分鼻咽、口咽、喉咽，咽鼓管咽口通中耳。',

          '肝为最大消化腺约一千五百克，肝门有肝管、动脉、门静脉；胆囊储胆汁，底投影右锁骨中线交右肋弓。',

        practiceUrl: '',
        questions: [
          { type:'choice', difficulty:'base', q:'临床上所称的上消化道是指', options:['从口腔到胃的一段','从口腔到空肠的一段','从咽到十二指肠的一段','从口腔到十二指肠的一段'], answer:3, explain:'临床以十二指肠为界，口腔到十二指肠称上消化道，空肠及以下称下消化道。' },
          { type:'judge',  difficulty:'base', q:'消化系统由消化管和消化腺两部分组成，大唾液腺、肝和胰均属于大消化腺。', answer:true, explain:'消化管是口腔至肛门的管道；大消化腺包括大唾液腺、肝和胰，小消化腺位于消化管壁内。' },
          { type:'choice', difficulty:'mid', q:'关于空肠和回肠区别的叙述，正确的是', options:['空肠位于腹腔右下部，管壁较薄','回肠位于腹腔左上部，血管丰富颜色较红','空肠占近侧2/5，管径大、管壁厚、黏膜皱襞密而高','集合淋巴滤泡只见于空肠黏膜内'], answer:2, explain:'空肠位于左上腹、壁厚色红、占近侧2/5；集合淋巴滤泡见于回肠，其余选项均把空、回肠特点记反。' },
          { type:'choice', difficulty:'base', q:'人体最大的消化腺是', options:['腮腺','胰','下颌下腺','肝'], answer:3, explain:'肝是人体最大的消化腺，成人约1500g；胰是第二大消化腺，腮腺是最大的唾液腺。' },
          { type:'judge',  difficulty:'base', q:'乳牙共32个，恒牙共20个，6岁左右乳牙逐渐被恒牙替换。', answer:false, explain:'数字恰好颠倒，乳牙20个、恒牙32个；乳牙生后约6个月开始萌出，3岁左右出齐。' },
          { type:'choice', difficulty:'base', q:'食管第二处狭窄距中切牙约', options:['25cm','15cm','40cm','75cm'], answer:0, explain:'三处狭窄距中切牙依次约15、25、40cm；75cm是十二指肠大乳头距中切牙的距离。' },
          { type:'choice', difficulty:'high', q:'某人进食油腻食物后出现右上腹阵发性绞痛，疼痛向右肩背部放射。结合解剖知识分析，正确的是', options:['病变在胆囊，胆囊底投影于右锁骨中线与右肋弓交点处；进食油腻后胆囊收缩，胆汁经胆囊管、胆总管排入十二指肠','病变在阑尾，压痛点在脐与右髂前上棘连线中外1/3交点','胆汁由胆囊分泌，经胰管直接排入胃','胆汁由肝分泌后直接储存在胆总管内，不经过胆囊'], answer:0, explain:'高脂饮食诱发右上腹痛为胆绞痛；胆囊储存浓缩胆汁，进食后胆汁经胆囊管、胆总管入十二指肠，麦氏点在右下腹。' },
          { type:'choice', difficulty:'base', q:'咽鼓管咽口', options:['位于喉咽前壁、喉口两侧','位于口咽侧壁的腭扁桃体窝内','位于咽隐窝内，是鼻咽癌的好发部位','位于鼻咽侧壁，咽腔经咽鼓管通中耳鼓室'], answer:3, explain:'咽鼓管咽口在鼻咽侧壁；咽隐窝在咽口后上方，二者位置不要混淆。' },
          { type:'judge',  difficulty:'mid', q:'十二指肠大乳头位于十二指肠水平部，是肝总管和胰管的共同开口。', answer:false, explain:'大乳头位于十二指肠降部后内侧壁；与之共同开口的是胆总管（肝总管与胆囊管汇合后）和胰管，并非肝总管。' },
          { type:'choice', difficulty:'base', q:'胃的出口是', options:['贲门','幽门','胃底','角切迹'], answer:1, explain:'入口贲门接食管，出口幽门续十二指肠；角切迹是胃小弯下缘的转折处。' },
          { type:'choice', difficulty:'mid', q:'关于肝的位置和形态的叙述，正确的是', options:['肝大部分位于左季肋区和腹上区','肝是人体第二大消化腺，重约500g','肝大部分位于右季肋区和腹上区，小部分在左季肋区，脏面横沟称肝门','肝门只有神经和淋巴管通过，没有血管和肝管'], answer:2, explain:'肝是最大消化腺，肝门有肝左管、肝右管、肝固有动脉、肝门静脉及神经淋巴管进出，其余选项位置或结构错误。' },
          { type:'choice', difficulty:'base', q:'阑尾根部的体表投影（麦氏点）在', options:['两侧髂前上棘连线的中点','脐与右髂前上棘连线的中、外1/3交点','脐与左髂前上棘连线的中、内1/3交点','右锁骨中线与右肋弓的交点'], answer:1, explain:'麦氏点在脐与右髂前上棘连线中外1/3交点；右锁骨中线与右肋弓交点是胆囊底投影。' },
          { type:'judge',  difficulty:'base', q:'三条结肠带均汇集于阑尾根部，剖腹手术时可沿结肠带寻找阑尾。', answer:true, explain:'结肠带由大肠纵行肌增厚形成，三条带集中于阑尾根部，是术中定位阑尾的可靠标志。' },
          { type:'choice', difficulty:'base', q:'胆总管和胰管共同开口于', options:['胃的幽门窦','十二指肠上部的十二指肠球','十二指肠升部','十二指肠降部的十二指肠大乳头'], answer:3, explain:'二者汇合成肝胰壶腹，开口于降部的大乳头；十二指肠球是溃疡好发处，而非胆汁开口处。' },
          { type:'choice', difficulty:'high', q:'患者误吞异物后行食管镜检查，镜身自中切牙进入。下列叙述正确的是', options:['食管全长约25cm，三处狭窄距中切牙依次约15、25、40cm；胃大部分位于左季肋区、小部分位于腹上区，入口为贲门','食管长约40cm，三处狭窄距中切牙分别为10、20、30cm，胃入口为幽门','胃大部分位于右季肋区，出口称贲门，与食管相连','食管只有一处狭窄，位于与左主支气管交叉处，胃没有出入口之分'], answer:0, explain:'三狭窄依次为起始处、跨左主支气管处、穿膈处，距中切牙15、25、40cm；胃入口贲门、大部在左季肋区，其余选项数字或方位均错。' },
          { type:'choice', difficulty:'base', q:'腮腺导管开口于', options:['舌下阜','舌下襞','平对上颌第2磨牙的颊黏膜处','腭垂根部'], answer:2, explain:'腮腺导管开口于平对上颌第2磨牙相对的颊黏膜；下颌下腺和舌下腺导管开口于舌下阜。' },
          { type:'judge',  difficulty:'base', q:'回盲瓣既可控制回肠内容物进入盲肠的速度，又能防止盲肠内容物反流入回肠。', answer:true, explain:'回盲瓣是回肠末端突入盲肠形成的唇样皱襞，起单向阀门作用。' },
          { type:'choice', difficulty:'mid', q:'关于齿状线的叙述，正确的是', options:['位于直肠与乙状结肠交界处，由肛柱上端连成','由肛柱下端和肛瓣基部连成，是黏膜与皮肤、内痔与外痔的分界线','齿状线以上发生的痔称外痔','是肛门内括约肌与外括约肌的分界线'], answer:1, explain:'齿状线以上为黏膜和内痔，以下为皮肤和外痔；它不是括约肌的分界线。' },
          { type:'choice', difficulty:'base', q:'胆汁由下列哪种细胞分泌', options:['胆囊黏膜上皮细胞','胰岛细胞','胰腺腺泡细胞','肝细胞'], answer:3, explain:'胆汁由肝细胞分泌，胆囊只储存和浓缩胆汁；胰岛分泌胰岛素，腺泡细胞分泌胰液。' },
          { type:'judge',  difficulty:'base', q:'胰的外分泌部是胰岛、分泌胰岛素，内分泌部分泌胰液并经胰管排入十二指肠。', answer:false, explain:'内、外分泌恰好颠倒：外分泌部分泌胰液助消化，内分泌部胰岛分泌胰岛素等调节血糖。' },
          { type:'choice', difficulty:'base', q:'咽自上而下依次分为', options:['口咽、鼻咽、喉咽','喉咽、口咽、鼻咽','鼻咽、口咽、喉咽','鼻咽、喉咽、口咽'], answer:2, explain:'咽以软腭后缘、会厌上缘为界，自上而下为鼻咽、口咽、喉咽，顺序不能颠倒。' },
          { type:'choice', difficulty:'base', q:'结肠带、结肠袋和肠脂垂是', options:['除直肠、肛管和阑尾外大肠的特征性结构','十二指肠和空肠的特征','胃和食管的特征','全部消化管共有的结构'], answer:0, explain:'三者为大肠的特征，手术中借此辨认大肠；直肠、肛管和阑尾不具备这三个结构。' },
          { type:'choice', difficulty:'mid', q:'进食后胆汁排入十二指肠的正确路径是', options:['胆汁由肝细胞直接经胆总管入十二指肠，不经过胆囊','胆囊收缩，胆汁经胆囊管、胆总管、肝胰壶腹、十二指肠大乳头入十二指肠','胆汁经胆囊管、肝总管、胰管排入胃','胆汁由胆囊分泌，经肝总管排入空肠'], answer:1, explain:'进食后胆囊收缩、肝胰壶腹括约肌舒张，胆汁沿胆囊管、胆总管、大乳头入十二指肠；胆汁由肝而非胆囊分泌。' },
          { type:'judge',  difficulty:'base', q:'十二指肠上部起始处壁薄、黏膜光滑无环形皱襞，称十二指肠球，是十二指肠溃疡的好发部位。', answer:true, explain:'十二指肠球位于上部；胆总管和胰管共同开口的大乳头位于降部，两处位置须分清。' },
          { type:'choice', difficulty:'base', q:'食管第三处狭窄位于', options:['食管与左主支气管交叉处','食管穿膈的食管裂孔处','食管起始处','贲门处'], answer:1, explain:'第三狭窄为穿膈处，距中切牙约40cm；与左主支气管交叉处是第二狭窄，距中切牙约25cm。' },
          { type:'choice', difficulty:'base', q:'舌黏膜上感受味觉的结构是', options:['舌系带','丝状乳头','味蕾','舌下阜'], answer:2, explain:'味蕾分布于菌状乳头、轮廓乳头等处司味觉；丝状乳头数量最多，但只司一般感觉。' },
          { type:'choice', difficulty:'high', q:'下列关于消化系统的综合叙述，正确的是', options:['肝是人体最大的消化腺，胆总管与胰管共同开口于十二指肠大乳头，胰岛分泌胰岛素','腮腺导管开口于舌下阜，麦氏点位于脐与左髂前上棘连线的交点','食管三处狭窄距中切牙约25、35、50cm，胃的入口称幽门','胆汁由胆囊分泌，小肠是消化和吸收的唯一场所'], answer:0, explain:'第一项三处表述全部正确；腮腺导管开口于颊黏膜、麦氏点在右下腹、狭窄距离为15、25、40cm、胆汁由肝细胞分泌，其余选项均含错误。' },
          { type:'judge',  difficulty:'base', q:'空肠和回肠各占空、回肠全长的一半，二者之间有明显的分界标志。', answer:false, explain:'空肠占近侧2/5、回肠占远侧3/5，二者之间并无明显界限，为相互移行。' },
          { type:'choice', difficulty:'mid', q:'关于胃的位置和分部的叙述，正确的是', options:['入口称幽门、出口称贲门，大部分位于右季肋区','分胃底、胃体、幽门部三部，全部位于脐区','贲门部又称胃窦，是胃溃疡唯一的好发部位','分贲门部、胃底、胃体、幽门部四部，入口贲门、出口幽门，大部分位于左季肋区、小部分位于腹上区'], answer:3, explain:'胃分四部，大部分在左季肋区、小部分在腹上区；幽门部临床称胃窦，其余选项名称或方位有误。' },
          { type:'choice', difficulty:'base', q:'胆囊的主要功能是', options:['分泌胆汁','分泌胰岛素','储存和浓缩胆汁','分泌胰液'], answer:2, explain:'胆囊只储存和浓缩胆汁，胆汁由肝细胞分泌；胰岛素由胰岛分泌，胰液由胰腺腺泡分泌。' }
        ]
      },
      {
        title: '第5章　呼吸系统',
        sections: [
          '第一节　鼻',
          '第二节　咽',
          '第三节　喉',
          '第四节　气管与主支气管',
          '第五节　肺',
          '第六节　胸膜与纵隔'
        ],
        knowledge: [
          '呼吸系统由呼吸道和肺两大部分组成，主要功能是从外界吸入氧气并排出体内代谢产生的二氧化碳，即完成机体与外界之间的气体交换；此外，鼻还有嗅觉功能，喉还具有发音功能。呼吸道包括鼻、咽、喉、气管和各级支气管，临床上把鼻、咽、喉称上呼吸道，把气管和各级支气管称下呼吸道，通常所说的上呼吸道感染即指鼻、咽、喉的感染。',
          '鼻是呼吸道的起始部，又是嗅觉器官，分外鼻、鼻腔和鼻旁窦三部分。鼻腔以骨和软骨为基础，内面衬以黏膜或皮肤，被鼻中隔分为左、右两腔；每侧鼻腔以鼻阈为界分为前部的鼻前庭和后部的固有鼻腔，鼻前庭内衬皮肤、生有鼻毛，可滤过和净化吸入的空气。',
          '鼻中隔由筛骨垂直板、犁骨和鼻中隔软骨等覆以黏膜构成，常偏向一侧。鼻中隔前下份的黏膜较薄，内有丰富而位置表浅的血管吻合丛，易受干燥、外伤等刺激而破裂出血，称为易出血区（Little区），临床上约90%的鼻出血发生于此。',
          '固有鼻腔的黏膜依结构和功能分为两区：上鼻甲内侧面及与其相对的鼻中隔上部黏膜内含嗅细胞，呈苍白或淡黄色，称嗅区，司嗅觉；其余大部分黏膜血管丰富，活体呈红色，称呼吸区，可温暖、湿润吸入的空气并黏附尘埃。',
          '鼻旁窦又称副鼻窦，是位于鼻腔周围颅骨内、与鼻腔相通的含气空腔，共4对，即上颌窦、额窦、筛窦和蝶窦。各窦均衬有黏膜，且经窦口与鼻腔黏膜相延续，鼻腔炎症可蔓延引起鼻旁窦炎；鼻旁窦对喉发出的声音有共鸣作用，并可温湿空气、减轻颅骨重量。',
          '鼻旁窦的开口部位各有不同：上颌窦、额窦和前组、中组筛窦开口于中鼻道，后组筛窦开口于上鼻道，蝶窦开口于蝶筛隐窝。上颌窦是4对鼻旁窦中最大的一对，因窦口高于窦底，直立或坐位时分泌物引流不畅、易潴留，故慢性上颌窦炎在临床上最为常见。',
          '咽是前后略扁的漏斗状肌性管道，为消化和呼吸的共同通道，自上而下分鼻咽、口咽和喉咽三部。鼻咽侧壁有咽鼓管咽口，咽腔经咽鼓管通中耳鼓室；喉咽位于喉的后方，向前借喉口通喉腔、向下在第6颈椎体下缘续于食管。吞咽时喉上提、会厌封闭喉口，使食物经喉咽进入食管。',
          '喉位于颈前部正中、舌骨下方，上通喉咽、下接气管，成人约平第4~6颈椎体高度，可随吞咽和发音上下移动。喉既是气体进出的通道，又是发音器官，由数块喉软骨借关节、韧带和肌肉连接、内衬黏膜构成。',
          '喉软骨主要有4种：甲状软骨最大，由左、右两块方形软骨板在前正中线融合而成，融合处上部向前突出称喉结，成年男性明显；环状软骨前部窄、后部宽，形似戒指，是喉软骨中唯一完整的软骨环，对保持呼吸道通畅十分重要，损伤后易引起喉狭窄；会厌软骨形似树叶，吞咽时封闭喉口，防止食物和液体误入喉腔；杓状软骨成对，位于环状软骨后部上缘，声襞附于其声带突，与声门的开大和缩小有关。',
          '喉腔是由喉软骨、韧带、纤维膜和喉黏膜围成的管腔，上通喉咽、下接气管。喉腔以前庭襞和声襞分为三部分：前庭襞平面以上为喉前庭；前庭襞与声襞之间为喉中间腔，其向两侧突出的梭形隐窝称喉室；声襞平面以下为声门下腔，该处黏膜下组织疏松，炎症时易发生喉水肿，婴幼儿喉腔狭小，水肿时更易引起呼吸困难。两侧声襞及杓状软骨基底部之间的裂隙称声门裂，是喉腔最狭窄的部位，呼出气流振动声襞而产生声音。',
          '气管上端平第6颈椎体下缘与喉相连，向下至胸骨角平面（约平第4胸椎体下缘）分为左、右主支气管，分叉处称气管杈，气管杈内面有一向上凸的半月形纵嵴称气管隆嵴，常略偏左侧，是支气管镜检查时定位的重要标志。气管由14~17个呈C形的气管软骨环以及连接各环的平滑肌和结缔组织构成，软骨的缺口朝向后壁，由平滑肌和结缔组织构成的膜壁封闭，紧贴食管，有利于食管内食团通过。',
          '主支气管左、右各一，自气管杈发出后外行入肺门。左主支气管细而长，平均长约4~5cm，与气管中线延长线之间的夹角较大，走行较水平；右主支气管粗而短，平均长约2~3cm，夹角较小，走行较垂直，近似气管的直接延续。因此，坠入气管的异物多进入右主支气管，临床气管异物和吸入性病变也以右侧多见。',
          '肺位于胸腔内，左、右各一，分居纵隔两侧，表面被覆脏胸膜。肺质软而轻，呈海绵状，富有弹性，内含空气时入水不下沉；婴幼儿肺呈淡红色，随年龄增长因吸入的尘埃不断沉积，颜色逐渐变为暗红乃至深灰色。肺大致呈半圆锥形，有一尖、一底、两面和三缘：上端为肺尖，下面为肺底（膈面），外侧面为肋面，内侧面为纵隔面；右肺因膈下邻肝而较宽短，左肺因心偏左而较狭长。',
          '肺的内侧面（纵隔面）中部偏后有一长椭圆形凹陷，称肺门，是主支气管，肺动脉，肺静脉，支气管动、静脉，以及神经和淋巴管进出肺的部位。这些出入肺门的结构被结缔组织包绕、外面覆以胸膜，总称为肺根；两肺根主要结构的排列有一定规律，肺根将肺连于纵隔。',
          '左肺有一条自后上斜向前下的斜裂，将左肺分为上叶和下叶两叶；左肺前缘下部因心压迫形成心切迹，心切迹下方的舌状突起称左肺小舌。右肺除斜裂外，还有一条沿第4肋水平走行的水平裂，两裂将右肺分为上叶、中叶和下叶三叶。临床上大叶性肺炎即以肺叶作为病变范围单位。',
          '肺尖钝圆，经胸廓上口向上突入颈根部，高出锁骨内侧1/3段上方2~3cm。在锁骨上大窝处进行针刺、臂丛阻滞麻醉或锁骨下静脉穿刺时，进针不可过深，以免刺破肺尖和胸膜顶而引起气胸。',
          '胸膜是覆盖在肺表面、胸壁内面、膈上面和纵隔两侧的一层薄而光滑的浆膜，分脏胸膜和壁胸膜两部分：紧贴肺表面并深入叶间裂内的称脏胸膜；衬贴于胸壁内面、膈上面和纵隔侧面的称壁胸膜。脏、壁两层胸膜在肺根处相互移行，共同围成一个完全封闭的潜在性腔隙，称胸膜腔。胸膜腔左、右各一，互不相通，正常为负压，腔内仅有少量浆液，可润滑胸膜表面、减少呼吸运动时两层胸膜之间的摩擦。',
          '壁胸膜依其衬覆部位分为肋胸膜、膈胸膜、纵隔胸膜和胸膜顶四部分，其中胸膜顶包被肺尖，亦高出锁骨内侧1/3段上方2~3cm。在肋胸膜与膈胸膜转折处形成一个半环形的深间隙，称肋膈隐窝（肋膈窦），它是胸膜腔位置最低、容量最大的部位，深呼吸时肺下缘也不能充满此窝。当胸膜腔有积液时，液体因重力作用首先积聚于肋膈隐窝，故临床上常在此处（多取肩胛线或腋后线第7~8肋间）进行胸膜腔穿刺抽液。',
          '肺和胸膜下界的体表投影可用三条标志线表示：平静呼吸时，肺下缘在锁骨中线与第6肋相交，在腋中线与第8肋相交，在肩胛线与第10肋相交；胸膜下界约比肺下界低2个肋，即在上述三线分别与第8、第10、第11肋相交。由于肺下缘与胸膜下界之间存在一定距离，在肺下界以下、胸膜下界以上进针，可抽出肋膈隐窝内积液而不损伤肺。',
          '纵隔是两侧纵隔胸膜之间全部器官、结构和结缔组织的总称，其前界为胸骨，后界为脊柱胸段，两侧为纵隔胸膜，上达胸廓上口，下至膈。通常以胸骨角与第4胸椎体下缘的平面为界，将纵隔分为上纵隔和下纵隔；下纵隔再以心包为界，分为胸骨与心包之间的前纵隔、心和心包所在的中纵隔，以及心包与脊柱胸段之间的后纵隔。'
        ],
        examPoints: [
          '上呼吸道的范围：鼻、咽、喉称上呼吸道，气管及各级支气管称下呼吸道，常以选择或判断题直考。',
          '鼻中隔前下份为易出血区（Little区），黏膜血管丰富而表浅，约90%的鼻出血发生于此。',

          '肺尖与胸膜顶均高出锁骨内侧1/3段上方2~3cm，颈根部进针过深可刺破之而引起气胸。',
          '胸膜腔密闭、负压、左右互不相通；肋膈隐窝为胸膜腔最低处，积液先积聚，常于肩胛线或腋后线第7~8肋间穿刺抽液；肺下界在锁骨中线、腋中线、肩胛线分别平第6、8、10肋，胸膜下界各低约2肋。'

        practiceUrl: '',
        questions: [
          { type:'choice', difficulty:'base', q:'临床上所称的上呼吸道是指', options:['鼻、咽、喉','气管和支气管','鼻和口腔','喉和气管'], answer:0, explain:'鼻、咽、喉合称上呼吸道，气管及各级支气管称下呼吸道；口腔属消化管，不属于呼吸道。' },
          { type:'judge',  difficulty:'base', q:'临床上把鼻、咽、喉合称为上呼吸道，气管和各级支气管称下呼吸道。', answer:true, explain:'这是呼吸道的常用分部，上呼吸道感染即指鼻、咽、喉的感染。' },
          { type:'choice', difficulty:'base', q:'鼻出血最易发生的部位（易出血区）位于', options:['鼻腔顶部黏膜','下鼻甲前端','鼻前庭皮肤','鼻中隔前下份黏膜'], answer:3, explain:'鼻中隔前下份血管表浅、吻合丰富，称易出血区（Little区）；其余部位血供相对深在，不是最常见出血处。' },
          { type:'choice', difficulty:'mid', q:'关于鼻旁窦开口部位的叙述，正确的是', options:['上颌窦开口于上鼻道','蝶窦开口于中鼻道','上颌窦、额窦开口于中鼻道，后组筛窦开口于上鼻道','各鼻旁窦均开口于下鼻道'], answer:2, explain:'上颌窦、额窦及前组中组筛窦开口于中鼻道，后组筛窦开口于上鼻道，蝶窦开口于蝶筛隐窝；其余选项位置均错。' },
          { type:'judge',  difficulty:'base', q:'上颌窦开口低于窦底，直立时引流通畅，故很少发生炎症。', answer:false, explain:'上颌窦开口位于窦腔内侧壁上部、开口高于窦底，直立位引流不畅，分泌物易潴留，所以最易发生慢性炎症。' },
          { type:'choice', difficulty:'base', q:'喉软骨中唯一呈完整环形、对保持呼吸道通畅有重要意义的是', options:['环状软骨','甲状软骨','会厌软骨','杓状软骨'], answer:0, explain:'环状软骨形似戒指，是唯一完整的软骨环；甲状软骨最大但不成环，损伤环状软骨易致喉狭窄。' },
          { type:'choice', difficulty:'base', q:'吞咽时可封闭喉口、防止食物误入喉腔的软骨是', options:['甲状软骨','环状软骨','杓状软骨','会厌软骨'], answer:3, explain:'会厌软骨形似树叶，吞咽时喉上提、会厌后倒盖住喉口；其余软骨不参与封闭喉口。' },
          { type:'choice', difficulty:'mid', q:'下列关于喉软骨的叙述，正确的是', options:['甲状软骨最小且无喉结','环状软骨是唯一完整软骨环，杓状软骨成对','会厌软骨成对、专司发音','杓状软骨是最大的喉软骨'], answer:1, explain:'四项中只有环状软骨完整成环、杓状软骨成对全部正确；甲状软骨最大有喉结，会厌软骨单一且司吞咽封闭。' },
          { type:'judge',  difficulty:'base', q:'声门裂是喉腔中最狭窄的部位。', answer:true, explain:'两侧声襞及杓状软骨基底部之间的裂隙称声门裂，为喉腔最狭窄处；注意与其他部位狭窄相区别。' },
          { type:'choice', difficulty:'base', q:'喉腔最狭窄的部位是', options:['喉前庭','喉室','前庭裂','声门裂'], answer:3, explain:'声门裂是喉腔最狭窄处；喉室是喉中间腔向两侧的隐窝，前庭裂比声门裂宽。' },
          { type:'choice', difficulty:'base', q:'气管异物多易坠入右主支气管，其形态学原因是右主支气管', options:['细而长、走行水平','粗而短、走行较垂直','软骨呈完整环形','管壁有丰富腺体'], answer:1, explain:'右主支气管粗短、走行垂直，近似气管的直接延续；细而长者为左主支气管，故异物多见于右侧。' },
          { type:'judge',  difficulty:'base', q:'左主支气管细而长、走行较水平，右主支气管粗而短、走行较垂直。', answer:true, explain:'左右主支气管的形态对比是解释异物多坠入右侧的依据，长短、粗细、方位三组对比不可记反。' },
          { type:'choice', difficulty:'base', q:'气管软骨的形态特点是', options:['完整的环形软骨','C形软骨环、缺口朝后','C形软骨环、缺口朝前','片状软骨'], answer:1, explain:'气管由14~17个C形软骨环构成，缺口朝后、由平滑肌膜壁封闭，紧贴食管；完整环是环状软骨的特点。' },
          { type:'choice', difficulty:'mid', q:'关于气管的叙述，正确的是', options:['上端平第4颈椎','软骨缺口朝前','下端平第10胸椎','由14~17个C形软骨环构成，至胸骨角平面分为左、右主支气管'], answer:3, explain:'气管上端平第6颈椎、下端在胸骨角平面（约第4胸椎）分杈，软骨缺口朝后；其余选项位置或方位有误。' },
          { type:'choice', difficulty:'base', q:'肺门位于肺的', options:['肋面','前缘','内侧面（纵隔面）中部','膈面中央'], answer:2, explain:'肺门是内侧面（纵隔面）中部的凹陷，为主支气管、血管、神经和淋巴管进出之处；膈面贴膈、肋面贴胸壁。' },
          { type:'choice', difficulty:'base', q:'左肺借斜裂分为', options:['上叶和下叶两叶','上、中、下三叶','上叶和中叶两叶','三叶'], answer:0, explain:'左肺只有斜裂，分上、下两叶；有水平裂、分三叶的是右肺。' },
          { type:'choice', difficulty:'mid', q:'关于左、右肺形态区别的叙述，正确的是', options:['左肺宽短、右肺狭长','左肺分三叶、右肺分两叶','左肺狭长、前缘有心切迹，分上下两叶；右肺宽短，分上中下三叶','两肺均有水平裂'], answer:2, explain:'心偏左使左肺狭长并留有心切迹，仅分两叶；右肺因膈下有肝而宽短，有斜裂和水平裂、分三叶。' },
          { type:'judge',  difficulty:'base', q:'左肺除有斜裂外还有水平裂，故左肺分为上、中、下三叶。', answer:false, explain:'有斜裂和水平裂、分三叶的是右肺；左肺只有斜裂，分上、下两叶，前缘有心切迹。' },
          { type:'choice', difficulty:'base', q:'关于肺尖位置的叙述，正确的是', options:['高出锁骨外侧1/3上方2~3cm','高出锁骨内侧1/3上方2~3cm','平锁骨水平','高出锁骨中点上方约5cm'], answer:1, explain:'肺尖突入颈根部，高出锁骨内侧1/3段上方2~3cm；锁骨上方针刺过深可伤肺尖引起气胸。' },
          { type:'choice', difficulty:'base', q:'胸膜腔有积液时，液体首先积聚的部位是', options:['肋膈隐窝','胸膜顶','纵隔','肺门处'], answer:0, explain:'肋膈隐窝是胸膜腔位置最低、容量最大的隐窝，积液先积聚于此；胸膜顶反而是最高点。' },
          { type:'judge',  difficulty:'base', q:'胸膜腔是脏胸膜与壁胸膜围成的密闭潜在腔隙，左右各一、互不相通，正常呈负压。', answer:true, explain:'胸膜腔密闭、负压、含少量浆液是肺随胸廓扩张的关键，左右互不相通，故一侧气胸不直接累及对侧。' },
          { type:'choice', difficulty:'mid', q:'关于胸膜和胸膜腔的叙述，正确的是', options:['壁胸膜紧贴肺表面','胸膜腔左右相通、内为正压','壁胸膜只覆盖膈肌','脏胸膜紧贴肺表面，胸膜腔为密闭、负压的潜在腔隙'], answer:3, explain:'紧贴肺表面的是脏胸膜，胸膜腔密闭、左右不通、为负压；衬于胸壁内面、膈上面等处的才是壁胸膜。' },
          { type:'choice', difficulty:'base', q:'脏胸膜与壁胸膜相互移行的部位是', options:['肺尖处','肺根处','肋膈隐窝','胸骨后方'], answer:1, explain:'两层胸膜在肺根处相互移行，从而围成密闭的胸膜腔；肋膈隐窝只是壁胸膜的转折处。' },
          { type:'choice', difficulty:'high', q:'患者在锁骨上方行颈部穿刺后突感胸痛、呼吸困难，胸片示右侧气胸，最可能损伤的结构是', options:['肺尖和胸膜顶','右主支气管','肋膈隐窝','心包'], answer:0, explain:'肺尖和胸膜顶高出锁骨内侧1/3上方2~3cm，颈根部进针过深可刺破之而致气胸；其余结构位置均低于锁骨。' },
          { type:'judge',  difficulty:'mid', q:'平静呼吸时，肺下界在锁骨中线与第8肋相交。', answer:false, explain:'肺下界在锁骨中线平第6肋、腋中线第8肋、肩胛线第10肋；第8肋是腋中线的位置，不要把两条线的数字记混。' },

          { type:'judge',  difficulty:'base', q:'腰椎穿刺常选第3至第4或第4至第5腰椎棘突之间进针，可进入蛛网膜下隙而不易损伤脊髓。', answer:true, explain:'因此处已平脊髓下端以下，椎管内只有漂浮在脑脊液中的马尾，针可推开神经根而较少损伤。' },
          { type:'choice', difficulty:'base', q:'心血管运动中枢和呼吸中枢等基本生命中枢主要位于', options:['延髓','小脑','端脑','背侧丘脑'], answer:0, explain:'延髓受压或损伤可迅速导致呼吸、心跳停止，故称生命中枢；小脑和端脑无此基本调节中枢。' },
          { type:'choice', difficulty:'base', q:'躯体运动中枢位于', options:['中央后回','颞横回','枕叶距状沟两侧','中央前回'], answer:3, explain:'中央前回及旁中央小叶前部管理全身随意运动，身体各部在此呈倒置的投影，代表区大小与运动精细程度有关。' },
          { type:'judge',  difficulty:'base', q:'视觉中枢位于颞横回，听觉中枢位于枕叶。', answer:false, explain:'视觉中枢在枕叶距状沟两侧，听觉中枢在颞叶的颞横回，题中两中枢位置完全颠倒。' },
          { type:'choice', difficulty:'mid', q:'桡神经损伤后出现的典型体征是', options:['爪形手','垂腕征','猿手','方肩'], answer:1, explain:'桡神经支配前臂伸肌，损伤后腕和指不能背伸、抬前臂时手下垂，称垂腕征；爪形手见于尺神经损伤。' },
          { type:'choice', difficulty:'base', q:'管理头面部一般感觉并支配咀嚼肌运动的脑神经是', options:['面神经','迷走神经','三叉神经','舌下神经'], answer:2, explain:'三叉神经分眼、上颌、下颌三支，下颌神经含运动纤维支配咀嚼肌；面肌由面神经支配，注意区分。' },
          { type:'judge',  difficulty:'high', q:'交感神经兴奋时心率减慢、支气管平滑肌收缩、消化液分泌增多。', answer:false, explain:'上述均为副交感神经兴奋的表现；交感神经在应急时使心率加快、支气管扩张、消化活动减弱。' },
          { type:'choice', difficulty:'base', q:'腓总神经损伤后主要表现为', options:['足不能背屈，出现足下垂和跨阈步态','爪形手','垂腕征','钩状足'], answer:0, explain:'腓总神经绕腓骨颈处表浅易伤，支配小腿前群和外侧群肌，损伤后足下垂内翻；钩状足是胫神经损伤的表现。' },
          { type:'choice', difficulty:'base', q:'迷走神经的主要功能是', options:['支配咀嚼肌运动','支配面部表情肌','管理视觉和听觉','支配颈、胸、腹部大部分脏器的副交感活动'], answer:3, explain:'迷走神经是行程最长、分布最广的脑神经，管理心跳、支气管和消化管等；咀嚼肌归三叉神经、面肌归面神经。' },
          { type:'judge',  difficulty:'base', q:'小脑的主要功能是维持身体平衡、调节肌张力和协调随意运动。', answer:true, explain:'小脑损伤可出现站立不稳、肌张力异常和动作不协调，如指鼻不准、醉酒样步态。' },
          { type:'choice', difficulty:'mid', q:'脑脊液最终经何结构渗入硬脑膜窦回流', options:['脉络丛','室间孔','蛛网膜粒','中脑水管'], answer:2, explain:'蛛网膜绒毛突入上矢状窦形成蛛网膜粒，脑脊液经其单向渗入静脉血；其余结构都在脑室系统内部。' },
          { type:'choice', difficulty:'base', q:'尺神经损伤后手部出现的畸形是', options:['桡神经损伤的垂腕','爪形手','正中神经损伤的猿手','方肩'], answer:1, explain:'尺神经支配大部分手肌，损伤后环指、小指不能屈伸收展，掌骨间沟凹陷呈爪形手。' },
          { type:'choice', difficulty:'mid', q:'关于交感神经与副交感神经的叙述，正确的是', options:['交感神经在应急状态下兴奋，使心跳加快、支气管扩张','副交感神经使心跳加快','两者对所有器官作用完全相同','交感神经主要促进消化和储存能量'], answer:0, explain:'交感神经动员机体应对紧急情况，副交感神经则重在休整、消化和积蓄能量，同一器官上二者作用往往相反。' },
          { type:'choice', difficulty:'base', q:'中脑、脑桥和延髓合称为', options:['小脑','端脑','间脑','脑干'], answer:3, explain:'脑干自上而下由中脑、脑桥、延髓组成，上接间脑、下续脊髓，背面与小脑相连。' },
          { type:'choice', difficulty:'high', q:'腰椎穿刺针由棘突间进入蛛网膜下隙，依次穿过的结构及深感觉传导束的叙述，正确的是', options:['穿刺经硬膜外隙后直接进入脊髓','薄束传导痛觉和温度觉','穿刺依次穿过棘上和棘间韧带、黄韧带、硬脊膜、蛛网膜进入蛛网膜下隙，薄束和楔束传导本体觉与精细触觉','皮质脊髓束负责传导感觉'], answer:2, explain:'黄韧带是进入硬膜外隙的标志，再穿硬脊膜和蛛网膜方达含脑脊液的蛛网膜下隙；痛温觉由脊髓丘脑束传导。' },
          { type:'judge',  difficulty:'base', q:'脊髓白质主要由神经元胞体构成，灰质主要由有髓神经纤维构成。', answer:false, explain:'灰质是胞体集中处、位于脊髓内部，白质是有髓纤维集中处、位于周围，题中组成正好颠倒。' },
          { type:'choice', difficulty:'base', q:'支配面部表情肌运动的脑神经是', options:['三叉神经','面神经','舌咽神经','副神经'], answer:1, explain:'面神经损伤后患侧额纹消失、闭眼不全、口角歪向健侧；三叉神经只管面部感觉和咀嚼运动。' },
          { type:'choice', difficulty:'mid', q:'大脑动脉环的组成及意义是', options:['由前交通动脉、两侧大脑前动脉、颈内动脉、后交通动脉和大脑后动脉吻合而成，对脑供血起代偿作用','位于脊髓下端周围','血管间没有吻合、无代偿意义','仅由两侧椎动脉单独构成'], answer:0, explain:'此环使颈内动脉与椎基底动脉系相互交通，环上某支缓慢狭窄时可经环内重新分配血流。' },
          { type:'choice', difficulty:'base', q:'全身最粗大的神经坐骨神经发自', options:['颈丛','臂丛','腰丛','骶丛'], answer:3, explain:'坐骨神经由骶丛发出，经梨状肌下孔出盆腔至臀大肌深面下行，分支支配大腿后群及小腿和足。' },
          { type:'choice', difficulty:'base', q:'膈神经发自', options:['臂丛','腰丛','颈丛','骶丛'], answer:2, explain:'膈神经是颈丛最重要的分支，运动纤维支配膈肌，损伤后同侧膈肌麻痹可致呼吸困难。' },
          { type:'choice', difficulty:'base', q:'脊髓内传导痛觉和温度觉的纤维束是', options:['薄束','脊髓丘脑束','皮质脊髓束','楔束'], answer:1, explain:'脊髓丘脑束在白质前外侧索上行，传导对侧半身痛温觉和粗触觉；薄束、楔束传导本体觉和精细触觉。' },
          { type:'judge',  difficulty:'mid', q:'正中神经损伤后拇指不能对掌，大鱼际萎缩，手掌平坦呈猿手。', answer:true, explain:'正中神经支配大鱼际和前臂前群大部分肌，猿手是其典型体征；爪形手、垂腕分别见于尺神经和桡神经损伤。' },
          { type:'choice', difficulty:'base', q:'第四脑室位于', options:['延髓和脑桥与小脑之间','两侧大脑半球之间','脊髓中央管下端','背侧丘脑内部'], answer:0, explain:'第四脑室底为脑桥和延髓背面、顶朝小脑，经正中孔和两个外侧孔与蛛网膜下隙相通。' }
        ]

          { type:'choice', difficulty:'high', q:'一患儿身材明显矮小伴智力低下，另一成人怕冷、水肿、反应迟钝，二者分别是胎儿或婴儿期和成年期哪种激素不足所致', options:['生长激素','甲状腺激素','胰岛素','糖皮质激素'], answer:1, explain:'甲状腺激素既促生长又促脑发育，胎儿或婴儿期不足患呆小症且智力低下；生长激素不足的侏儒症智力正常，这是核心鉴别点。' },

          { type:'choice', difficulty:'base', q:'肾上腺髓质分泌的激素是', options:['糖皮质激素','盐皮质激素','性激素','肾上腺素和去甲肾上腺素'], answer:3, explain:'髓质嗜铬细胞分泌儿茶酚胺类激素；盐皮质激素、糖皮质激素和性激素均由外周的肾上腺皮质分泌。' },
          { type:'judge',  difficulty:'base', q:'胰岛素由胰岛A细胞分泌，其作用是升高血糖。', answer:false, explain:'胰岛素由胰岛B细胞分泌，是体内唯一降低血糖的激素；A细胞分泌的胰高血糖素才使血糖升高。' },

          { type:'choice', difficulty:'base', q:'It was ________ cold that we decided to stay at home all day.', options:['very','so','such','too'], answer:1, explain:'so...that... 表示「如此……以至于……」，so 后接形容词 cold。such 后要接名词短语，very、too 不能与 that 构成该句型。' },
          { type:'judge',  difficulty:'base', q:'判断句子语法是否正确：The delicious cakes were ate up by the children in five minutes.', answer:false, explain:'被动语态由 be 加过去分词构成，eat 的过去分词是 eaten，应改为 were eaten up。ate 是过去式，不能用在被动结构中。' },
          { type:'choice', difficulty:'base', q:'The shop ________ sells fresh bread is just around the corner.', options:['who','where','what','which'], answer:3, explain:'先行词 shop 指物，关系词在从句中作主语，用 which 或 that。who 指人，where 要求从句成分完整，what 不能引导定语从句。' },
          { type:'choice', difficulty:'base', q:'餐厅服务员问 May I take your order now?，你还没决定好点什么，可以回答', options:['Yes, please','No, you cannot','Just a moment, please','You are welcome'], answer:2, explain:'请对方稍等一会儿用 Just a moment, please.。Yes, please. 表示马上点餐，No, you cannot 语气生硬无礼，You are welcome 用于应答感谢。' },
          { type:'choice', difficulty:'mid', q:'Never ________ until tomorrow what you can do today.', options:['put on','put up','put off','put down'], answer:2, explain:'谚语「今日事今日毕」意为不要把今天能做的事推迟到明天，put off 表示推迟。put on 是穿上，put up 是张贴，put down 是放下。' },
          { type:'judge',  difficulty:'base', q:'判断句子语法是否正确：The dishes should be washed clean before they are put away.', answer:true, explain:'含情态动词的被动语态结构为「情态动词加 be 加过去分词」，should be washed 完全正确；时间状语从句中 are put away 也是正确的一般现在时被动。' },
          { type:'choice', difficulty:'mid', q:'All the food must ________ before the guests arrive.', options:['finish','be finished','finished','is finished'], answer:1, explain:'食物是「完成」的承受者，情态动词后的被动形式为 must be done，故选 be finished。finish、finished 是主动或非谓语形式，must 后也不能接 is finished。' },
          { type:'choice', difficulty:'base', q:'Do you know the boy ________ father is a famous cook in this restaurant?', options:['who','that','whose','which'], answer:2, explain:'空格后有名词 father，关系词在从句中作定语表示「男孩的父亲」，要用 whose。who、that 在从句中作主语或宾语，which 用来指物。' },
          { type:'judge',  difficulty:'base', q:'在餐桌上招待客人时，说 Help yourself to some fish. 意思是「请随便吃点鱼」。', answer:true, explain:'Help yourself/yourselves to... 是招待用语，表示「请随便吃或用……」，其后接食物名称，题中中文释义准确。' },
          { type:'choice', difficulty:'mid', q:'The restaurant is almost empty at lunchtime. The food there ________ be very good.', options:['must','may','cannot','should'], answer:2, explain:'午饭时间餐厅几乎没人，据此作有把握的否定推测要用 cannot be（不可能好）。must be 表肯定推测，may be 把握很小，均与依据矛盾。' },
          { type:'choice', difficulty:'high', q:'The outdoor sale will be put off ________ it rains tomorrow, ________ we must wait for the notice.', options:['if；so','although；but','because；so','if；but'], answer:0, explain:'第一空引导条件用 if，条件句用一般现在时表将来；第二空表示结果用 so。although 与 but、because 与 so 都不能在同一句中连用。' },
          { type:'choice', difficulty:'base', q:'My grandma is ________ my little sister while Mum goes shopping.', options:['looking for','looking after','looking up','looking forward to'], answer:1, explain:'奶奶在妈妈购物时照看妹妹，look after 意为照顾、照看。look for 是寻找，look up 是查阅，look forward to 是盼望，均不合语境。' },
          { type:'judge',  difficulty:'mid', q:'判断句子语法是否正确：The snack bar where we often have noodles opens at six every morning.', answer:true, explain:'先行词 bar 表示地点，从句 we often have noodles 主谓宾完整，用关系副词 where 正确；主句谓语 opens 与单数主语一致，整句无误。' },
          { type:'choice', difficulty:'base', q:'在商店里想问这件外套的价格，你应该说', options:['How many is it?','How money is it?','What does it cost of?','How much is it?'], answer:3, explain:'询问价格的固定表达是 How much is it?。how many 后要接可数名词复数，英语中没有 how money 的说法，cost 作动词也不与 of 搭配。' },
          { type:'choice', difficulty:'base', q:'The new supermarket ________ in our town last year.', options:['built','was built','is built','builds'], answer:1, explain:'超市是「建造」的承受者，last year 提示一般过去时，故用 was built。built 是主动形式或缺少 be，is built 时态不对。' },
          { type:'judge',  difficulty:'base', q:'判断句子语法是否正确：Although the shop is small, but it sells fresh and cheap fruit.', answer:false, explain:'although 与 but 不能在同一句中连用，二者只能保留一个，可改为 Although the shop is small, it sells... 或 The shop is small, but it sells...。' },
          { type:'choice', difficulty:'high', q:'The old man to ________ I spoke at the service counter is the manager of the mall.', options:['who','whose','which','whom'], answer:3, explain:'关系代词紧跟在介词 to 之后且指人，只能用宾格 whom。who 不能直接放在介词后，whose 表示所属，which 用来指物。' },
          { type:'choice', difficulty:'base', q:'The shop ________ closed today, but I am not quite sure.', options:['must be','cannot be','will be','may be'], answer:3, explain:'后半句「我不太确定」说明把握不大，用 may be（可能）。must be 表很有把握，cannot be 表不可能，均与 not sure 矛盾。' },
          { type:'choice', difficulty:'base', q:'Ladies and gentlemen, the plane is going to ________. Please fasten your seat belt.', options:['take off','take up','take out','take away'], answer:0, explain:'飞机即将起飞并要求系好安全带，take off 表示起飞。take up 是开始从事或占据，take out 是取出，take away 是带走。' },
          { type:'judge',  difficulty:'base', q:'判断对话是否恰当：—— Would you like something to drink? —— Yes, I would like a cup of tea, please.', answer:true, explain:'Would you like something to drink? 是礼貌询问对方想喝点什么，回答 I would like a cup of tea, please. 礼貌且切题，对话恰当。' },
          { type:'choice', difficulty:'base', q:'________ the restaurant was far from our hotel, we still walked there.', options:['Because','If','When','Although'], answer:3, explain:'饭店离宾馆远，我们仍然走着去，前后是让步关系，用 Although（虽然）。because 表原因，if 表条件，when 表时间，逻辑都不通。' },
          { type:'choice', difficulty:'high', q:'The children were made ________ up the kitchen after the cooking class.', options:['clean','to clean','cleaning','cleaned'], answer:1, explain:'make sb do sth 变为被动后为 be made to do sth，必须还原不定式符号 to，故选 to clean。这是被动语态与使役动词的综合考点。' },
          { type:'judge',  difficulty:'base', q:'判断句子语法是否正确：I am looking forward to hear from you very soon.', answer:false, explain:'look forward to 中的 to 是介词，后面要接名词或动名词，应改为 hearing from you。hear 是动词原形，不能直接放在这里。' },
          { type:'choice', difficulty:'mid', q:'吃完饭准备离开餐厅，你想结账，可以对服务员说', options:['Give me the money','Could I have the bill, please?','I will not pay here','Wait a long time'], answer:1, explain:'礼貌地要求结账用 Could I have the bill, please? 或 May I pay?。其余选项要么意思错误，要么语气粗鲁，都不符合服务交际。' }
        ]

  /* ==================================================================
   *  通用工具
   * ================================================================== */
  let toastTimer = null;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
  }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  /* ==================================================================
   *  壁纸（与博客同一套轮询逻辑）
   * ================================================================== */
  const BG_URL = 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=' +
      encodeURIComponent('动漫风格图书馆书房壁纸，阳光洒在堆叠的书本上，安静治愈，深蓝青色调，高清4K') +
      '&image_size=landscape_16_9';
  const PLACEHOLDER_SIZE = 1832;
  function loadBackground() {
    let tries = 0;
    const img = document.getElementById('bg-img');
    function attempt() {
      const p = new Image();
      p.src = BG_URL + '&_t=' + Date.now();
      p.onload = () => {
        if (p.naturalWidth === PLACEHOLDER_SIZE && tries < 8) { tries++; setTimeout(attempt, 6000); }
        else { img.src = p.src; img.style.display = ''; document.getElementById('bg-overlay').classList.remove('loading'); }
      };
      p.onerror = () => { if (tries < 8) { tries++; setTimeout(attempt, 6000); } };
    }
    attempt();
  }

  /* ==================================================================
   *  深浅色切换（与博客共用同一 localStorage key）
   * ================================================================== */
  const LS_THEME = 'zhishihunzi_blog_theme';
  function applyTheme(light) {
    document.body.classList.toggle('light', light);
    document.getElementById('icon-theme').className = light ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
  }
  function initTheme() {
    applyTheme(localStorage.getItem(LS_THEME) === 'light');
    document.getElementById('btn-theme').addEventListener('click', () => {
      const light = !document.body.classList.contains('light');
      applyTheme(light);
      localStorage.setItem(LS_THEME, light ? 'light' : 'dark');
    });
  }

        <i class="bc-deco ${book.deco}"></i>
        <p class="bc-pub">${esc(book.publisher)}</p>

  }

    document.getElementById('drawer-list').innerHTML = BOOKS.map(navItemHTML).join('');

    document.querySelectorAll('.book-nav-item').forEach(btn => {
      btn.addEventListener('click', () => {
        selectBook(btn.dataset.book);
        closeDrawer();
      });
    });
  }

  function selectBook(bookId) {
    currentBookId = bookId;
    renderBookNav();
    renderBookContent();
  }

  /* ==================================================================
   *  右侧教材内容：大封面 + 章节手风琴
   * ================================================================== */
  function listBlock(type, arr, icon) {
    if (!arr || !arr.length) {
      return `<div class="todo-box"><i class="fa-solid fa-pen-ruler mr-1.5 opacity-70"></i>本部分笔记整理中，位置已预留，后续直接补充即可。</div>`;
    }
    return `
      <ul class="note-list ${type}">
        ${arr.map(x => `<li>${esc(x)}</li>`).join('')}

                ${ch.questions && ch.questions.length

    // 章节展开/收起（手风琴：可同时展开多个）
