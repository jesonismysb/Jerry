          { type:'judge', difficulty:'base', q:'缩宫素对子宫体作用强，对子宫颈作用弱。', answer:true, explain:'缩宫素作用具有选择性，对子宫体平滑肌兴奋作用强，对子宫颈平滑肌兴奋作用弱，此特点使其适合用于催产和引产。' },
          { type:'choice', difficulty:'base', q:'缩宫素大剂量可引起子宫', options:['节律性收缩','强直性收缩，用于产后止血','舒张松弛','无变化'], answer:1, explain:'缩宫素大剂量使子宫产生强直性收缩，压迫子宫肌层血管而止血，故用于产后止血；小剂量则引起节律性收缩用于催产引产。' },
          { type:'choice', difficulty:'mid', q:'关于缩宫素与麦角新碱的比较，正确的是', options:['两者均可用于催产引产','两者对宫体和宫颈均无选择性','缩宫素作用强而持久，麦角新碱作用弱而短','缩宫素对宫体作用强、宫颈作用弱，麦角新碱无选择性'], answer:3, explain:'缩宫素对宫体作用强、对宫颈作用弱，适于催产引产；麦角新碱对宫体和宫颈无选择性，易致胎儿窒息和子宫破裂，不宜用于催产引产。' },
          { type:'choice', difficulty:'base', q:'麦角新碱主要用于', options:['产后止血和子宫复旧','催产和引产','防治早产','妊娠高血压'], answer:0, explain:'麦角新碱兴奋子宫作用强而持久，对宫体和宫颈无选择性，主要用于产后止血和促进子宫复旧；不宜用于催产引产。' },
          { type:'judge', difficulty:'base', q:'麦角新碱可用于催产和引产。', answer:false, explain:'麦角新碱对宫体和宫颈无选择性，易引起强直性收缩，导致胎儿窒息和子宫破裂，故禁用于催产和引产，仅用于产后止血。' },
          { type:'choice', difficulty:'base', q:'前列腺素类用于催产引产和流产的药物是', options:['缩宫素和麦角新碱','PGE2和PGF2α','沙丁胺醇和利托君','硫酸镁和维生素K'], answer:1, explain:'前列腺素类如地诺前列酮（PGE2）和卡前列素（PGF2α）可兴奋子宫平滑肌，临床用于催产、引产和人工流产；缩宫素和麦角新碱不属于前列腺素类。' },
          { type:'choice', difficulty:'high', q:'某产妇，足月妊娠，宫缩乏力需催产，宜首选', options:['大剂量缩宫素肌注','麦角新碱静脉注射','小剂量缩宫素静脉滴注','硫酸镁静脉滴注'], answer:2, explain:'催产应首选小剂量缩宫素静脉滴注，可产生节律性收缩且便于随时调整剂量；大剂量缩宫素和麦角新碱均可致强直性收缩，禁用于催产；硫酸镁为子宫舒张药。' },
          { type:'judge', difficulty:'base', q:'沙丁胺醇属于子宫舒张药，可用于防治早产。', answer:true, explain:'沙丁胺醇为β2受体激动药，可激动子宫平滑肌β2受体而使子宫舒张，降低子宫收缩力，临床用于防治早产。' },
          { type:'choice', difficulty:'base', q:'缩宫素的不良反应不包括', options:['胎心率异常','支气管哮喘','子宫破裂','水中毒'], answer:1, explain:'缩宫素过量可致胎心率异常、子宫强直性收缩甚至子宫破裂；缩宫素还具有抗利尿作用，大量应用可致水中毒；支气管哮喘不是其典型不良反应。' },
          { type:'choice', difficulty:'base', q:'缩宫素禁用于', options:['产后出血','子宫复旧不良','剖宫产术后止血','胎位不正'], answer:3, explain:'缩宫素禁用于胎位不正、头盆不称、前置胎盘、剖宫产史、多胎妊娠等；产后出血和子宫复旧不良为其适应证。' },
          { type:'judge', difficulty:'mid', q:'硫酸镁仅用于抑制子宫收缩防治早产，无其他用途。', answer:false, explain:'硫酸镁除抑制子宫平滑肌用于防治早产外，还可用于妊娠高血压综合征及子痫的预防和治疗，具有中枢抑制和降压作用。' },
          { type:'choice', difficulty:'high', q:'某孕妇，28周，出现先兆早产，宜选用的药物是', options:['缩宫素','麦角新碱','利托君','氨甲苯酸'], answer:2, explain:'先兆早产应选用子宫舒张药抑制宫缩，利托君为β2受体激动药，可舒张子宫平滑肌、延缓分娩；缩宫素和麦角新碱为子宫收缩药，会加重早产风险。' },
          { type:'choice', difficulty:'base', q:'产后出血宜首选', options:['肝素','缩宫素或麦角新碱','华法林','硫酸镁'], answer:1, explain:'产后出血需加强子宫收缩以压迫止血，缩宫素和麦角新碱均为子宫收缩药，可首选；肝素和华法林为抗凝药，硫酸镁为子宫舒张药，均不宜用于产后出血。' },
          { type:'judge', difficulty:'base', q:'前置胎盘者可用缩宫素进行催产和引产。', answer:false, explain:'前置胎盘为缩宫素催产引产的绝对禁忌证，因子宫收缩可导致胎盘剥离面大出血，危及母儿安全。' },
          { type:'choice', difficulty:'base', q:'利托君用于防治早产的机制是', options:['兴奋子宫平滑肌','抑制前列腺素合成','拮抗缩宫素受体','激动子宫β2受体，舒张子宫平滑肌'], answer:3, explain:'利托君为β2受体激动药，可激动子宫平滑肌β2受体而使子宫舒张，降低子宫收缩力和频率，从而防治早产。' },
          { type:'judge', difficulty:'base', q:'麦角新碱对子宫体和子宫颈的作用无选择性。', answer:true, explain:'麦角新碱对子宫体和子宫颈平滑肌均有强大兴奋作用，无选择性，易致宫颈紧闭和胎儿窒息，故不宜用于催产和引产。' },
          { type:'choice', difficulty:'mid', q:'缩宫素与麦角新碱用于产后止血的主要区别是', options:['缩宫素作用强而持久','两者均对宫颈无作用','麦角新碱作用强而持久，对宫颈也有收缩作用','缩宫素仅口服有效'], answer:2, explain:'麦角新碱兴奋子宫作用强而持久，对宫体和宫颈均有收缩作用，产后止血和复旧效果好；缩宫素作用相对较弱且持续时间短，对宫颈作用弱。' },
          { type:'choice', difficulty:'base', q:'属于子宫舒张药的是', options:['缩宫素','麦角新碱','沙丁胺醇','卡前列素'], answer:2, explain:'沙丁胺醇为β2受体激动药，可使子宫平滑肌舒张，属于子宫舒张药；缩宫素、麦角新碱和卡前列素（PGF2α）均为子宫收缩药。' },
          { type:'judge', difficulty:'base', q:'头盆不称者禁用缩宫素催产和引产。', answer:true, explain:'头盆不称时胎儿下降受阻，若使用缩宫素加强宫缩，可致子宫破裂，故为缩宫素催产引产的绝对禁忌证。' },
          { type:'choice', difficulty:'high', q:'某孕妇，妊娠34周，诊断为妊娠高血压综合征伴宫缩过强，宜选用的药物是', options:['缩宫素','麦角新碱','维生素K','硫酸镁'], answer:3, explain:'该患者既有妊娠高血压综合征又有宫缩过强，硫酸镁既可抑制子宫平滑肌舒张子宫防治早产，又可用于妊娠高血压综合征子痫的预防和治疗，一举两得。' },
          { type:'choice', difficulty:'base', q:'PGF2α（卡前列素）的临床用途是', options:['防治早产','催产引产和流产','产后止血首选','妊娠高血压'], answer:1, explain:'PGF2α为前列腺素类子宫收缩药，可兴奋子宫平滑肌，临床用于催产、引产和人工流产；防治早产用子宫舒张药，产后止血首选缩宫素或麦角新碱。' },
          { type:'judge', difficulty:'mid', q:'前列腺素类药物仅用于人工流产，不能用于催产和引产。', answer:false, explain:'前列腺素类如PGE2和PGF2α既可用于催产和引产，也可用于人工流产，临床用途较广，并非仅用于流产。' },
          { type:'choice', difficulty:'mid', q:'缩宫素用于催产引产时，正确的给药方法是', options:['大剂量肌内注射','一次性静脉推注','小剂量静脉滴注，并根据宫缩调整滴速','口服给药'], answer:2, explain:'缩宫素催产引产须小剂量静脉滴注，并根据子宫收缩情况随时调整滴速，以防子宫强直性收缩；大剂量肌注或静推易致子宫破裂，口服易被胰蛋白酶破坏失效。' },
          { type:'choice', difficulty:'mid', q:'缩宫素用于催产和引产时，必须严格掌握', options:['饮食禁忌','适应证和禁忌证','药物相互作用','过敏反应'], answer:1, explain:'缩宫素催产引产直接关系母儿安全，必须严格掌握适应证和禁忌证，用药过程中须专人监护胎心、宫缩及产程进展。' },
          { type:'choice', difficulty:'base', q:'关于硫酸镁的作用，错误的是', options:['口服用于保胎','抑制子宫平滑肌收缩','用于妊娠高血压综合征子痫','静脉给药用于防治早产'], answer:0, explain:'硫酸镁口服难吸收，仅起导泻和利胆作用，无保胎效果；其抑制子宫平滑肌和抗子痫作用需通过静脉或肌内给药实现。' },
          { type:'choice', difficulty:'base', q:'缩宫素的作用机制是', options:['抑制前列腺素合成','阻断β2受体','拮抗钙离子','直接兴奋子宫平滑肌'], answer:3, explain:'缩宫素可直接兴奋子宫平滑肌，增强其收缩力和频率；其作用强度受子宫生理状态和雌激素水平影响，与前列腺素、β受体和钙离子无关。' },
          { type:'choice', difficulty:'base', q:'麦角新碱兴奋子宫作用的特点是', options:['弱而短暂','强而持久','仅对宫颈有效','仅对宫体有效'], answer:1, explain:'麦角新碱兴奋子宫平滑肌作用强而持久，对宫体和宫颈均有强大收缩作用，此特点使其适用于产后止血和子宫复旧，但不宜用于催产引产。' },
          { type:'choice', difficulty:'base', q:'子宫收缩药不包括', options:['硫酸镁','缩宫素','麦角新碱','卡前列素'], answer:0, explain:'硫酸镁可抑制子宫平滑肌收缩，属于子宫舒张药；缩宫素、麦角新碱和卡前列素（PGF2α）均属于子宫收缩药。' },
          { type:'choice', difficulty:'base', q:'缩宫素禁用于下列哪种情况', options:['产后子宫收缩乏力','多胎妊娠','引产','产后出血'], answer:1, explain:'多胎妊娠为缩宫素催产引产的禁忌证，因子宫过度膨胀，使用缩宫素易致子宫破裂；产后子宫收缩乏力、引产（适应证内）和产后出血均为其适应证。' }
        ]

        questions: [
          { type:'choice', difficulty:'base', q:'糖皮质激素的药理作用不包括', options:['抗炎作用','抗免疫作用','抗毒素作用','抗菌作用'], answer:3, explain:'糖皮质激素具有抗炎、抗免疫、抗毒素、抗休克及刺激骨髓造血作用，但无抗菌作用，用于严重感染时须合用足量有效抗菌药。' },
          { type:'judge', difficulty:'base', q:'糖皮质激素用于严重感染时必须合用足量有效的抗菌药。', answer:true, explain:'糖皮质激素无抗菌作用且可抑制机体免疫，单用易致感染扩散，故用于严重感染时必须合用足量有效的抗菌药。' },
          { type:'choice', difficulty:'base', q:'胰岛素最常见且最严重的不良反应是', options:['低血糖反应','过敏反应','注射部位脂肪萎缩','胰岛素抵抗'], answer:0, explain:'低血糖为胰岛素最常见最严重的不良反应，表现为饥饿感、出汗、心悸甚至昏迷，须立即口服糖水或静脉注射葡萄糖解救。' },
          { type:'choice', difficulty:'mid', q:'糖皮质激素隔日疗法的主要优点是', options:['减少用药总量','增强抗炎疗效','减少给药次数','减轻对肾上腺皮质的抑制'], answer:3, explain:'隔日疗法将两日总量于隔日清晨一次顿服，符合糖皮质激素分泌的昼夜节律，可减轻对肾上腺皮质的抑制，防止肾上腺皮质功能减退。' },
          { type:'judge', difficulty:'base', q:'硫脲类抗甲状腺药起效迅速，用药后立即控制甲亢症状。', answer:false, explain:'硫脲类通过抑制甲状腺激素合成起效，对已合成并储存的甲状腺激素无效，须待储存激素耗竭后才显效，故起效慢。' },
          { type:'choice', difficulty:'base', q:'婴幼儿缺乏甲状腺激素可致', options:['呆小病','黏液性水肿','侏儒症','单纯性甲状腺肿'], answer:0, explain:'甲状腺激素可促进生长发育，婴幼儿缺乏致呆小病（克汀病），成人缺乏致黏液性水肿；侏儒症与生长激素缺乏有关。' },
          { type:'choice', difficulty:'mid', q:'大剂量碘用于甲亢术前准备的机制是', options:['抑制甲状腺激素合成','破坏甲状腺组织','抑制甲状腺激素释放','促进甲状腺激素代谢'], answer:2, explain:'大剂量碘可抑制甲状腺激素的释放，使甲状腺缩小变硬、血流减少，利于手术；抑制甲状腺激素合成是硫脲类的作用机制。' },
          { type:'judge', difficulty:'base', q:'双胍类口服降糖药二甲双胍适用于2型糖尿病肥胖者。', answer:true, explain:'二甲双胍可促进组织对葡萄糖的利用、抑制糖原异生，不刺激胰岛素分泌、不增加体重，故最适用于2型糖尿病肥胖者。' },
          { type:'choice', difficulty:'base', q:'糖皮质激素用于严重感染时必须', options:['加大剂量单独使用','合用足量有效的抗菌药','与小剂量碘剂合用','配合血液透析'], answer:1, explain:'糖皮质激素无抗菌作用且可抑制免疫，用于严重感染时必须合用足量有效的抗菌药，以防感染扩散。' },
          { type:'choice', difficulty:'high', q:'患者，女，28岁，Graves病拟行甲状腺次全切除术，术前使甲状腺缩小变硬宜选用', options:['大剂量碘剂','小剂量碘剂','甲状腺激素','二甲双胍'], answer:0, explain:'甲亢术前用大剂量碘剂可抑制甲状腺激素释放，使腺体缩小变硬、血流减少，利于手术；一般先用硫脲类控制症状，术前再加用大剂量碘剂。' },
          { type:'judge', difficulty:'mid', q:'胰岛素既可注射给药，也可口服给药。', answer:false, explain:'胰岛素为蛋白质类激素，口服易被胃肠道消化酶破坏而失效，故必须注射给药，不能口服。' },
          { type:'choice', difficulty:'base', q:'小剂量碘可用于预防', options:['甲状腺危象','甲状腺功能亢进','单纯性甲状腺肿','呆小病'], answer:2, explain:'小剂量碘是合成甲状腺激素的原料，可预防单纯性（地方性）甲状腺肿；大剂量碘则用于甲亢术前准备和甲状腺危象。' },
          { type:'choice', difficulty:'base', q:'磺酰脲类口服降血糖药的作用机制是', options:['刺激胰岛β细胞分泌胰岛素','延缓肠道碳水化合物吸收','抑制甲状腺激素释放','激动α受体'], answer:0, explain:'磺酰脲类（格列本脲、格列齐特）通过刺激胰岛β细胞分泌胰岛素而降低血糖，适用于胰岛功能尚存的2型糖尿病非肥胖者。' },
          { type:'judge', difficulty:'base', q:'避孕药仅通过抑制排卵发挥避孕作用。', answer:false, explain:'避孕药除抑制排卵外，还可改变宫颈黏液性状使精子不易穿透，并改变子宫内膜环境不利于孕卵着床，多环节发挥避孕作用。' },
          { type:'choice', difficulty:'base', q:'属于磺酰脲类口服降血糖药的是', options:['二甲双胍','阿卡波糖','胰岛素','格列本脲'], answer:3, explain:'格列本脲、格列齐特为磺酰脲类口服降糖药；二甲双胍为双胍类，阿卡波糖为α-葡萄糖苷酶抑制剂，胰岛素须注射给药。' },
          { type:'choice', difficulty:'base', q:'糖皮质激素长期大量应用可致', options:['甲状腺功能亢进','骨质疏松和肌肉萎缩','呆小病','单纯性甲状腺肿'], answer:1, explain:'长期大量应用糖皮质激素可促进蛋白质分解、抑制成骨细胞活性，导致骨质疏松、肌肉萎缩和儿童生长发育迟缓。' },
          { type:'choice', difficulty:'mid', q:'患者长期应用大剂量糖皮质激素，出现向心性肥胖、满月脸、水牛背等，属于', options:['甲状腺功能亢进综合征','医源性肾上腺皮质功能不全','类肾上腺皮质功能亢进综合征','甲状腺危象'], answer:2, explain:'长期大量应用糖皮质激素所致向心性肥胖、满月脸、水牛背、多毛、痤疮、高血压、高血糖、低血钾等，称为类肾上腺皮质功能亢进综合征。' },
          { type:'choice', difficulty:'base', q:'α-葡萄糖苷酶抑制剂阿卡波糖的主要作用是', options:['刺激胰岛β细胞分泌胰岛素','促进组织对葡萄糖的利用','延缓碳水化合物的吸收','抑制甲状腺激素合成'], answer:2, explain:'阿卡波糖通过抑制小肠黏膜α-葡萄糖苷酶，延缓碳水化合物分解为葡萄糖并延缓其吸收，主要降低餐后血糖。' },
          { type:'judge', difficulty:'base', q:'隔日疗法是将两日总量于隔日清晨一次顿服。', answer:true, explain:'隔日疗法符合糖皮质激素分泌的昼夜节律，将两日总量于隔日清晨一次顿服，可减轻对肾上腺皮质的反馈抑制。' },
          { type:'choice', difficulty:'base', q:'雌激素可用于', options:['卵巢功能不全和更年期综合征','先兆流产和习惯性流产','2型糖尿病肥胖者','甲亢术前准备'], answer:0, explain:'雌激素用于卵巢功能不全、更年期综合征、功能性子宫出血、晚期乳腺癌和前列腺癌；孕激素用于先兆流产和习惯性流产。' },
          { type:'choice', difficulty:'mid', q:'使用胰岛素过程中出现低血糖反应，应首选的处理措施是', options:['立即给予糖皮质激素','立即口服糖水或静脉注射葡萄糖','立即给予大剂量碘剂','立即停药观察'], answer:1, explain:'胰岛素所致低血糖最常见最严重，表现为饥饿感、出汗、心悸甚至昏迷，须立即口服糖水或进食，严重者静脉注射葡萄糖。' },
          { type:'judge', difficulty:'mid', q:'碘和碘化物大小剂量作用相同，均可用于甲亢术前准备。', answer:false, explain:'碘和碘化物剂量不同作用不同：小剂量为合成甲状腺激素的原料，用于预防单纯性甲状腺肿；大剂量抑制甲状腺激素释放，才用于甲亢术前准备和甲状腺危象。' },
          { type:'choice', difficulty:'base', q:'口服降血糖药中，双胍类二甲双胍的主要不良反应是', options:['低血糖反应','乳酸血症','粒细胞减少','胃肠道反应和便秘'], answer:1, explain:'二甲双胍可促进组织对葡萄糖的利用、抑制糖原异生，主要不良反应为乳酸血症，需警惕；低血糖反应多见于磺酰脲类。' },
          { type:'choice', difficulty:'base', q:'孕激素可用于', options:['晚期乳腺癌','先兆流产和习惯性流产','呆小病','单纯性甲状腺肿'], answer:1, explain:'孕激素临床用于先兆流产、习惯性流产、功能性子宫出血、痛经和子宫内膜异位症；晚期乳腺癌用雌激素或雄激素，呆小病和单纯性甲状腺肿用甲状腺激素。' },
          { type:'judge', difficulty:'base', q:'糖皮质激素突然停药可引起医源性肾上腺皮质功能不全。', answer:true, explain:'长期应用糖皮质激素可通过负反馈抑制垂体-肾上腺轴，突然停药可使肾上腺皮质分泌不足，出现医源性肾上腺皮质功能不全。' },
          { type:'choice', difficulty:'high', q:'患者，男，55岁，肥胖，诊断为2型糖尿病，首选的口服降血糖药是', options:['格列本脲','二甲双胍','阿卡波糖','甲巯咪唑'], answer:1, explain:'二甲双胍不刺激胰岛素分泌、不增加体重，且可促进组织对葡萄糖的利用，为2型糖尿病肥胖者的首选口服降糖药；格列本脲适用于非肥胖者，甲巯咪唑为抗甲状腺药。' },
          { type:'choice', difficulty:'base', q:'糖皮质激素大剂量突击疗法适用于', options:['严重感染和休克','结缔组织病','腺垂体功能减退','肾病综合征'], answer:0, explain:'大剂量突击疗法用于严重感染和休克等危重病症，一般剂量长期疗法用于结缔组织病和肾病综合征，小剂量替代疗法用于腺垂体功能减退。' },
          { type:'choice', difficulty:'high', q:'关于硫脲类抗甲状腺药的叙述，错误的是', options:['通过抑制甲状腺激素合成起效','起效慢，对已合成的甲状腺激素无效','可单独用于甲状腺危象的紧急处理','粒细胞减少为其最严重的不良反应'], answer:2, explain:'硫脲类通过抑制甲状腺激素合成起效慢，对已合成的激素无效，故不能单独用于需迅速控制症状的甲状腺危象；甲状腺危象应首选大剂量碘剂等快速起效药物。' },
          { type:'choice', difficulty:'base', q:'甲状腺激素的临床用途不包括', options:['呆小病','黏液性水肿','单纯性甲状腺肿','甲状腺功能亢进'], answer:3, explain:'甲状腺激素用于呆小病、黏液性水肿和单纯性甲状腺肿的替代或补充治疗；甲状腺功能亢进应使用抗甲状腺药如硫脲类或碘化物，禁用甲状腺激素。' },
          { type:'choice', difficulty:'base', q:'胰岛素对糖代谢的作用是', options:['促进糖原分解和糖原异生','促进葡萄糖利用并抑制糖原分解和糖原异生','抑制葡萄糖利用','促进甲状腺激素合成'], answer:1, explain:'胰岛素可促进组织对葡萄糖的摄取和利用，加速糖原合成，同时抑制糖原分解和糖原异生，从而降低血糖水平。' }
        ]
      },
      { title: '第12章　抗微生物药',
        sections: [
          '概述：抗菌谱、抗菌活性、化疗指数、抗菌后效应、耐药性等基本概念。',
          'β-内酰胺类抗生素：青霉素G及半合成青霉素，头孢菌素类一至四代的特点。',
          '大环内酯类：红霉素的抗菌作用、临床应用及不良反应。',
          '氨基糖苷类：链霉素、庆大霉素、阿米卡星的抗菌特点及耳毒性、肾毒性。',
          '四环素类与氯霉素：广谱抗菌作用及二重感染、影响骨牙生长、骨髓抑制等不良反应。',
          '人工合成抗菌药：喹诺酮类、磺胺类、甲氧苄啶及硝基呋喃类。',
          '抗结核病药及抗真菌药、抗病毒药：一线抗结核药、用药原则及常用药物常识。'
        ],
        knowledge: [
          '抗菌谱指抗菌药物的抗菌范围，分窄谱与广谱；抑菌药仅能抑制细菌生长繁殖，杀菌药能杀灭细菌。',
          '化疗指数＝LD50/ED50，是评价化疗药物安全性的指标，化疗指数越大表示药物越安全。',
          '抗菌活性常用最低抑菌浓度（MIC）和最低杀菌浓度（MBC）表示；抗菌后效应指撤药后细菌生长仍受持续抑制的现象。',
          '耐药性（抗药性）指细菌与药物反复接触后对药物的敏感性降低甚至消失。',
          '青霉素G为窄谱杀菌药，对革兰阳性球菌、革兰阳性杆菌、革兰阴性球菌及螺旋体高度敏感。',
          '青霉素G用于敏感菌所致肺炎、脑膜炎、心内膜炎、白喉、破伤风、炭疽、气性坏疽、梅毒及钩端螺旋体病等感染。',
          '青霉素G毒性低，最常见的不良反应是过敏反应，表现为药疹、接触性皮炎、血清病样反应，严重者发生过敏性休克；防治措施为用药前皮试、备好肾上腺素及抢救设备、药液现用现配；大剂量可致青霉素脑病。',
          '半合成青霉素：耐酸青霉素（青霉素V）可口服；耐酶青霉素（苯唑西林、氯唑西林）用于耐药金葡菌感染；广谱青霉素（氨苄西林、阿莫西林）对革兰阳性和阴性菌均有效，耐酸可口服但不耐酶。',
          '头孢菌素类分四代：第一代（头孢氨苄、头孢唑啉）对革兰阳性菌作用强、对阴性菌弱，对β-内酰胺酶不稳定，肾毒性较大。',
          '第二代头孢（头孢呋辛）对革兰阳性菌与阴性菌作用较均衡，对酶较稳定，肾毒性较小；第三代（头孢噻肟、头孢曲松）对革兰阴性菌作用强、对阳性菌弱，对酶高度稳定，基本无肾毒性；第四代（头孢吡肟）广谱高效。',
          '头孢菌素类的不良反应有过敏反应（与青霉素有交叉过敏）、肾毒性、胃肠道反应及二重感染。',
          '红霉素属大环内酯类窄谱抗生素，以革兰阳性菌为主；用于青霉素过敏者的替代用药、军团菌病、白喉带菌者及支原体肺炎；不良反应有胃肠道反应、肝毒性和血栓性静脉炎。',
          '氨基糖苷类（链霉素、庆大霉素、阿米卡星）对需氧革兰阴性杆菌作用强，对结核杆菌亦有效；不良反应为耳毒性（前庭和耳蜗神经损害）、肾毒性、神经肌肉阻滞及过敏反应；链霉素过敏性休克发生率仅次于青霉素，可用葡萄糖酸钙解救；同类药物合用毒性相加，不宜合用。',
          '四环素类（四环素、土霉素、多西环素）为广谱抗生素，对革兰阳性菌、阴性菌、立克次体、支原体、衣原体及螺旋体均有效；不良反应有二重感染、影响骨骼和牙齿生长（8岁以下儿童、孕妇及乳母禁用）、胃肠道反应和肝损害。',
          '氯霉素为广谱抗生素，可致骨髓抑制（严重者再生障碍性贫血）和灰婴综合征等严重不良反应，临床已少用。',
          '喹诺酮类（诺氟沙星、环丙沙星）抗菌谱广、口服吸收好，用于泌尿生殖道、肠道及呼吸道感染；可致软骨损伤，18岁以下禁用。',
          '磺胺类：磺胺嘧啶易透过血脑屏障，用于流行性脑脊髓膜炎；磺胺甲噁唑与甲氧苄啶组成复方新诺明；不良反应有结晶尿（需加服碳酸氢钠碱化尿液并多饮水）、过敏反应及骨髓抑制；甲氧苄啶为磺胺增效剂；呋喃妥因用于泌尿道感染。',
          '一线抗结核病药有异烟肼（各型结核首选，不良反应为周围神经炎和肝毒性）、利福平（广谱，肝毒性，可致体液呈橘红色）、乙胺丁醇（可致视神经炎）、链霉素和吡嗪酰胺；抗结核用药原则为早期、联合、适量、规律、全程。',
          '常用抗真菌药有制霉菌素、两性霉素B、酮康唑、氟康唑；常用抗病毒药有阿昔洛韦、利巴韦林、奥司他韦。'
        ],
        examPoints: [
          '青霉素G为窄谱杀菌药，其抗菌谱特点及在敏感菌所致感染中的临床应用。',

        practiceUrl: '',
        questions: [
          { type:'choice', difficulty:'base', q:'评价化疗药物安全性的指标是', options:['抗菌谱','化疗指数','最低抑菌浓度','抗菌后效应'], answer:1, explain:'化疗指数即LD50/ED50，其值越大表示药物安全性越高；抗菌谱反映抗菌范围，最低抑菌浓度反映抗菌活性强弱。' },
          { type:'judge', difficulty:'base', q:'青霉素G为广谱抗生素，对各类细菌均有强大杀灭作用。', answer:false, explain:'青霉素G属窄谱杀菌药，仅对革兰阳性球菌、革兰阳性杆菌、革兰阴性球菌及螺旋体高度敏感，对革兰阴性杆菌作用差。' },
          { type:'choice', difficulty:'base', q:'青霉素G最常见的不良反应是', options:['肾毒性','耳毒性','过敏反应','二重感染'], answer:2, explain:'过敏反应为青霉素G最常见的不良反应，轻者出现药疹、血清病样反应，重者可发生过敏性休克，故用药前必须皮试并备好肾上腺素。' },
          { type:'choice', difficulty:'mid', q:'患者对青霉素过敏，现诊断为军团菌病，宜选用的药物是', options:['头孢氨苄','红霉素','庆大霉素','磺胺嘧啶'], answer:1, explain:'红霉素对军团菌病、支原体肺炎疗效确切，且可作为青霉素过敏者的替代用药；头孢氨苄与青霉素有交叉过敏，不宜使用。' },
          { type:'judge', difficulty:'base', q:'8岁以下儿童、孕妇及哺乳期妇女禁用四环素类药物。', answer:true, explain:'四环素类可与钙结合沉积于骨骼和牙齿，影响骨牙生长并致牙齿黄染，故8岁以下儿童、孕妇及乳母禁用。' },
          { type:'choice', difficulty:'base', q:'抢救青霉素过敏性休克的首选药物是', options:['肾上腺素','去甲肾上腺素','葡萄糖酸钙','异丙肾上腺素'], answer:0, explain:'青霉素过敏性休克首选肾上腺素皮下或肌内注射抢救；葡萄糖酸钙用于链霉素过敏性休克的解救，注意区分。' },
          { type:'choice', difficulty:'base', q:'防治磺胺类药物引起结晶尿的措施是', options:['同服碳酸氢钠并多饮水','同服维生素C','与碳酸钙同服','临睡前一次服用'], answer:0, explain:'磺胺类及其代谢物在酸性尿中易析出结晶损伤肾脏，同服碳酸氢钠碱化尿液并多饮水可增加其溶解度，防止结晶尿。' },
          { type:'judge', difficulty:'mid', q:'氨基糖苷类抗生素之间合用可使毒性相加，故不宜合用。', answer:true, explain:'氨基糖苷类均有耳毒性、肾毒性和神经肌肉阻滞作用，同类合用毒性相加，可加重对听神经和肾脏的损害，故不宜合用。' },
          { type:'choice', difficulty:'base', q:'喹诺酮类药物禁用于18岁以下人群的原因是', options:['可致再生障碍性贫血','可损伤软骨，影响骨骼发育','可致严重耳毒性','可致灰婴综合征'], answer:1, explain:'喹诺酮类可损伤软骨、影响骨骼发育，故18岁以下禁用；再生障碍性贫血见于氯霉素，耳毒性见于氨基糖苷类，灰婴综合征见于氯霉素。' },
          { type:'choice', difficulty:'high', q:'患者，女，26岁，妊娠3个月，患急性支气管炎需用抗菌药，下列药物中应禁用的是', options:['青霉素G','头孢唑啉','红霉素','环丙沙星'], answer:3, explain:'环丙沙星属喹诺酮类，可损伤软骨，孕妇及18岁以下人群禁用；青霉素、头孢菌素和红霉素在妊娠期相对安全。' },
          { type:'choice', difficulty:'base', q:'治疗耐药金黄色葡萄球菌感染宜选用', options:['青霉素G','氨苄西林','青霉素V','苯唑西林'], answer:3, explain:'苯唑西林属耐酶青霉素，可对抗金葡菌产生的β-内酰胺酶，用于耐药金葡菌感染；青霉素G和氨苄西林不耐酶，青霉素V仅耐酸。' },
          { type:'judge', difficulty:'base', q:'异烟肼为各型结核病的首选药。', answer:true, explain:'异烟肼抗结核杆菌作用强、毒性低，易透过血脑屏障并渗入细胞内，为各型结核病首选药；不良反应有周围神经炎和肝毒性。' },
          { type:'choice', difficulty:'base', q:'关于第三代头孢菌素的特点，正确的是', options:['对革兰阳性菌作用最强','肾毒性最大','对β-内酰胺酶不稳定','对革兰阴性菌作用强且基本无肾毒性'], answer:3, explain:'第三代头孢（如头孢噻肟、头孢曲松）对革兰阴性菌作用强、对β-内酰胺酶高度稳定、基本无肾毒性；对革兰阳性菌的作用不如第一代强。' },
          { type:'choice', difficulty:'mid', q:'关于氨基糖苷类抗生素的使用，错误的是', options:['用药期间应注意监测听力和肾功能','链霉素过敏性休克可用葡萄糖酸钙解救','本类药物之间可以合用以增强疗效','对需氧革兰阴性杆菌作用强'], answer:2, explain:'氨基糖苷类同类合用会使耳毒性、肾毒性等毒性相加，故不宜合用；链霉素过敏性休克发生率仅次于青霉素，可用葡萄糖酸钙解救。' },
          { type:'judge', difficulty:'base', q:'氯霉素最严重的不良反应是过敏反应。', answer:false, explain:'氯霉素最严重的不良反应是抑制骨髓造血功能，可致再生障碍性贫血，新生儿尚可致灰婴综合征，故临床已少用。' },
          { type:'choice', difficulty:'base', q:'防治流行性脑脊髓膜炎宜首选的磺胺药是', options:['磺胺甲噁唑','磺胺嘧啶','甲氧苄啶','呋喃妥因'], answer:1, explain:'磺胺嘧啶血浆蛋白结合率低，易透过血脑屏障，脑脊液中浓度高，为防治流脑的首选药；呋喃妥因用于泌尿道感染。' },
          { type:'choice', difficulty:'mid', q:'头孢菌素类由第一代至第四代的变化规律是', options:['抗革兰阳性菌作用逐代增强','肾毒性逐代增大','抗革兰阴性菌作用逐代增强而肾毒性逐代减小','对β-内酰胺酶的稳定性逐代降低'], answer:2, explain:'头孢一至四代的总体规律为：抗革兰阳性菌作用逐代减弱、抗革兰阴性菌作用逐代增强、对β-内酰胺酶稳定性逐代提高、肾毒性逐代减小。' },
          { type:'choice', difficulty:'base', q:'下列属于广谱抗生素的是', options:['青霉素G','红霉素','苯唑西林','四环素类'], answer:3, explain:'四环素类为广谱抗生素，对革兰阳性菌、革兰阴性菌、立克次体、支原体、衣原体及螺旋体均有效；青霉素G和红霉素均为窄谱。' },
          { type:'judge', difficulty:'base', q:'链霉素所致过敏性休克可用葡萄糖酸钙解救。', answer:true, explain:'链霉素过敏性休克发生率仅次于青霉素，抢救时除用肾上腺素外，静脉注射葡萄糖酸钙可拮抗其毒性。' },
          { type:'choice', difficulty:'base', q:'红霉素的临床应用不包括', options:['青霉素过敏者的替代用药','军团菌病','支原体肺炎','铜绿假单胞菌感染'], answer:3, explain:'红霉素为窄谱抗生素，以革兰阳性菌为主，用于青霉素过敏者替代、军团菌病、白喉带菌者及支原体肺炎；对铜绿假单胞菌无效。' },
          { type:'choice', difficulty:'high', q:'患者长期应用广谱抗生素后出现口腔白色念珠菌感染（鹅口疮），此现象属于', options:['毒性反应','二重感染','过敏反应','特异质反应'], answer:1, explain:'长期应用广谱抗生素使敏感菌受抑制、不敏感菌（真菌或耐药菌）大量繁殖而引起的感染称二重感染，鹅口疮即为常见的真菌性二重感染。' },
          { type:'choice', difficulty:'base', q:'氨基糖苷类抗生素共同的不良反应是', options:['耳毒性、肾毒性和神经肌肉阻滞','骨髓抑制和灰婴综合征','软骨损伤和光敏反应','二重感染和影响骨牙生长'], answer:0, explain:'氨基糖苷类共同的不良反应为耳毒性、肾毒性、神经肌肉阻滞及过敏反应；骨髓抑制见于氯霉素，软骨损伤见于喹诺酮类，影响骨牙生长见于四环素类。' },
          { type:'judge', difficulty:'mid', q:'结核病患者症状消失后即可自行停药，不必继续用药。', answer:false, explain:'结核病治疗须遵循早期、联合、适量、规律、全程的原则，症状消失即自行停药易致复发和产生耐药性，必须完成全程治疗。' },
          { type:'choice', difficulty:'base', q:'异烟肼长期大剂量应用最易引起的不良反应是', options:['周围神经炎','视神经炎','耳毒性','过敏性休克'], answer:0, explain:'异烟肼长期大剂量应用可致周围神经炎，与维生素B6缺乏有关，可加服维生素B6防治；视神经炎为乙胺丁醇的主要不良反应。' },
          { type:'choice', difficulty:'mid', q:'关于氨苄西林、阿莫西林的叙述，正确的是', options:['耐酸可口服，但不耐酶','耐酶，可用于耐药金葡菌感染','仅对革兰阳性菌有效','不可口服，只能注射给药'], answer:0, explain:'氨苄西林、阿莫西林为广谱青霉素，对革兰阳性和阴性菌均有效，耐酸可口服但不耐酶，故对产酶的耐药金葡菌感染无效。' },
          { type:'choice', difficulty:'base', q:'服用利福平期间患者的尿液、汗液可呈', options:['深绿色','蓝黑色','橘红色','乳白色'], answer:2, explain:'利福平及其代谢产物可使尿液、汗液、泪液等体液呈橘红色，属正常现象，停药后可消失；其主要不良反应为肝毒性。' },
          { type:'choice', difficulty:'base', q:'乙胺丁醇的主要不良反应是', options:['周围神经炎','视神经炎','肝毒性','耳毒性'], answer:1, explain:'乙胺丁醇可致视神经炎，表现为视力下降、视野缩小和红绿色盲，用药期间应定期检查视力和视野。' },
          { type:'judge', difficulty:'high', q:'使用青霉素前，只要患者自述无药物过敏史，即可免做皮试直接给药。', answer:false, explain:'无论有无过敏史，使用青霉素前均须做皮肤过敏试验，且药液应现用现配、备好肾上腺素及抢救设备，以防发生过敏性休克。' },
          { type:'choice', difficulty:'base', q:'甲氧苄啶与磺胺甲噁唑合用组成复方新诺明的原因是', options:['甲氧苄啶可增强磺胺药的抗菌作用','甲氧苄啶可减轻结晶尿','甲氧苄啶可防止过敏反应','甲氧苄啶可促进磺胺药吸收'], answer:0, explain:'甲氧苄啶抑制二氢叶酸还原酶，与抑制二氢叶酸合成酶的磺胺药合用可双重阻断细菌叶酸代谢，使抗菌作用增强，故称磺胺增效剂。' },
          { type:'choice', difficulty:'base', q:'呋喃妥因的临床用途是', options:['流行性脑脊髓膜炎','泌尿道感染','肺结核','真菌感染'], answer:1, explain:'呋喃妥因属硝基呋喃类，口服后尿中药物浓度高，主要用于敏感菌所致的泌尿道感染，不用于全身性严重感染。' }
        ]

      { title: '第13章　抗寄生虫药',
        sections: [
          '抗疟药：氯喹、奎宁控制症状；伯氨喹控制复发和传播；乙胺嘧啶用于病因性预防。',
          '抗阿米巴病药：甲硝唑对肠内、肠外阿米巴病均有效，为首选药；依米丁毒性大。',
          '抗滴虫病药：甲硝唑口服为首选，乙酰胂胺局部外用。',
          '抗肠蠕虫药：阿苯达唑、甲苯达唑广谱驱虫；吡喹酮、氯硝柳胺驱绦虫。',
          '抗血吸虫药：吡喹酮为广谱抗吸虫和驱绦虫药，是治疗血吸虫病的首选药。'
        ],
        knowledge: [
          '抗疟药按作用环节分为三类：控制症状药（氯喹、奎宁）、控制复发和传播药（伯氨喹）、病因性预防药（乙胺嘧啶）。',
          '氯喹能杀灭红细胞内期疟原虫，迅速控制疟疾症状，为控制症状的首选药；对肠外阿米巴病（如阿米巴肝脓肿）也有效。',
          '奎宁抗疟作用与氯喹相似但较弱，主要用于耐氯喹的恶性疟；不良反应有金鸡纳反应（耳鸣、头痛、恶心、视力减退）和黑尿热。',
          '伯氨喹能杀灭红细胞外期疟原虫和配子体，用于根治间日疟和控制疟疾传播；葡萄糖-6-磷酸脱氢酶缺乏者用后可致急性溶血性贫血和高铁血红蛋白血症。',
          '乙胺嘧啶能杀灭红细胞外期疟原虫，为病因性预防的首选药；通过抑制二氢叶酸还原酶发挥作用，长期大量应用可致巨幼红细胞性贫血，可用甲酰四氢叶酸钙解救。',
          '甲硝唑对肠内、肠外阿米巴病均有效，为治疗阿米巴痢疾和阿米巴肝脓肿的首选药；对阴道滴虫病、贾第鞭毛虫病及厌氧菌感染也有良好疗效。',
          '甲硝唑用药期间及停药后一周内忌酒，否则可发生双硫仑样反应（面部潮红、头痛、恶心、呕吐、血压下降）；常见不良反应还有胃肠反应、口中金属味、尿色深红。',
          '依米丁仅用于急性阿米巴痢疾，毒性大，可致心肌损害，现已少用。',
          '抗滴虫病药以甲硝唑口服为首选，夫妇应同时治疗；乙酰胂胺可局部外用治疗阴道滴虫病。',
          '阿苯达唑为广谱驱虫药，对蛔虫、蛲虫、钩虫、鞭虫均有良好驱虫效果，还可用于囊虫病；不良反应轻。',

          '根据肿瘤细胞增殖周期，抗恶性肿瘤药分为细胞周期非特异性药物和细胞周期特异性药物两大类。',

          '细胞周期特异性药物仅对增殖周期某一期有作用：抗代谢药（如甲氨蝶呤、氟尿嘧啶、巯嘌呤）主要作用于S期；长春碱类主要作用于M期。',

          '氟尿嘧啶为抗代谢药，主要用于消化道癌（食管癌、胃癌、结肠癌等）和乳腺癌；不良反应有骨髓抑制和胃肠道反应。',
          '巯嘌呤为抗代谢药，主要用于急性白血病，对儿童急性淋巴细胞白血病疗效较好；主要不良反应为骨髓抑制。',
          '长春新碱为抗肿瘤植物药，主要用于急性白血病和恶性淋巴瘤；突出不良反应为神经毒性，表现为指趾麻木、肌无力等周围神经炎症状，骨髓抑制较轻。',

  /* ==================================================================
   *  通用工具
   * ================================================================== */
  let toastTimer = null;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
  }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  /* ==================================================================
   *  壁纸（与博客同一套轮询逻辑）
   * ================================================================== */
  const BG_URL = 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=' +
      encodeURIComponent('动漫风格图书馆书房壁纸，阳光洒在堆叠的书本上，安静治愈，深蓝青色调，高清4K') +
      '&image_size=landscape_16_9';
  const PLACEHOLDER_SIZE = 1832;
  function loadBackground() {
    let tries = 0;
    const img = document.getElementById('bg-img');
    function attempt() {
      const p = new Image();
      p.src = BG_URL + '&_t=' + Date.now();
      p.onload = () => {
        if (p.naturalWidth === PLACEHOLDER_SIZE && tries < 8) { tries++; setTimeout(attempt, 6000); }
        else { img.src = p.src; img.style.display = ''; document.getElementById('bg-overlay').classList.remove('loading'); }
      };
      p.onerror = () => { if (tries < 8) { tries++; setTimeout(attempt, 6000); } };
    }
    attempt();
  }

  /* ==================================================================
   *  深浅色切换（与博客共用同一 localStorage key）
   * ================================================================== */
  const LS_THEME = 'zhishihunzi_blog_theme';
  function applyTheme(light) {
    document.body.classList.toggle('light', light);
    document.getElementById('icon-theme').className = light ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
  }
  function initTheme() {
    applyTheme(localStorage.getItem(LS_THEME) === 'light');
    document.getElementById('btn-theme').addEventListener('click', () => {
      const light = !document.body.classList.contains('light');
      applyTheme(light);
      localStorage.setItem(LS_THEME, light ? 'light' : 'dark');
    });
  }

  /* ==================================================================
   *  封面 HTML（导航缩略图与大封面共用）
   * ================================================================== */
  function coverHTML(book) {
    return `
      <div class="book-cover ${book.cover}">
        <p class="bc-title">${esc(book.title)}</p>
        <i class="bc-deco ${book.deco}"></i>
        <p class="bc-pub">${esc(book.publisher)}</p>
      </div>`;
  }

  /* ==================================================================
   *  状态：当前选中教材
   * ================================================================== */
  let currentBookId = BOOKS[0].id;

  /** 教材导航项 HTML */
  function navItemHTML(book) {
    return `
      <button class="book-nav-item ${book.id === currentBookId ? 'active' : ''}" data-book="${book.id}">
        ${coverHTML(book)}
        <span class="min-w-0">
          <span class="bn-name block">${esc(book.title)}</span>
          <span class="bn-meta block">${esc(book.publisher)}</span>
        </span>
      </button>`;
  }

  /** 渲染桌面导航 + 移动抽屉（同一份数据） */
  function renderBookNav() {
    document.getElementById('book-rail').innerHTML = BOOKS.map(navItemHTML).join('');
    document.getElementById('drawer-list').innerHTML = BOOKS.map(navItemHTML).join('');
    document.getElementById('book-count').textContent = `共 ${BOOKS.length} 本`;

    document.querySelectorAll('.book-nav-item').forEach(btn => {
      btn.addEventListener('click', () => {
        selectBook(btn.dataset.book);
        closeDrawer();
      });
    });
  }

  function selectBook(bookId) {
    currentBookId = bookId;
    renderBookNav();
    renderBookContent();
  }

  /* ==================================================================
   *  右侧教材内容：大封面 + 章节手风琴
   * ================================================================== */

    if (!arr || !arr.length) {
      return `<div class="todo-box"><i class="fa-solid fa-pen-ruler mr-1.5 opacity-70"></i>本部分笔记整理中，位置已预留，后续直接补充即可。</div>`;
    }
    return `
      <ul class="note-list ${type}">
        ${arr.map(x => `<li>${esc(x)}</li>`).join('')}
      </ul>`;
  }

      <!-- 章节列表 -->
      <div id="chapter-list">
        ${book.chapters.map((ch, ci) => {
          const cid = book.id + '-ch-' + ci;
          return `
          <div class="chapter-item" id="${cid}">
            <button class="chapter-head" data-chapter="${cid}">
              <span class="ch-no">${ci + 1}</span>
              <span class="min-w-0">${esc(ch.title)}</span>
              <i class="fa-solid fa-chevron-down ch-caret"></i>
            </button>
            <div class="chapter-body">

              <!-- 本章小节 -->
              <p class="blk-title"><i class="fa-solid fa-list-ul text-cyan-300"></i>本章小节</p>
              ${ch.sections && ch.sections.length
                ? ch.sections.map(s => `<span class="sec-chip">${esc(s)}</span>`).join('')
                : `<div class="todo-box">小节标题待补充。</div>`}

              <!-- 核心知识点 -->
              <p class="blk-title"><i class="fa-solid fa-circle-info i-know"></i>核心知识点</p>
              ${listBlock('know', ch.knowledge)}

              <!-- 重点考点 -->
              <p class="blk-title"><i class="fa-solid fa-star i-exam"></i>重点考点</p>
              ${listBlock('exam', ch.examPoints)}

              <!-- 背诵要点 -->
              <p class="blk-title"><i class="fa-solid fa-fire i-memo"></i>背诵要点 · 对口升学高频</p>
              ${ch.memorize && ch.memorize.length
                ? `<div class="memo-card"><ul class="note-list">${ch.memorize.map(m => `<li>${esc(m)}</li>`).join('')}</ul></div>`
                : `<div class="todo-box">高频背诵要点整理中。</div>`}

              <!-- 开始刷题 -->
              <div class="flex flex-wrap items-center gap-2 mt-4">
                <button class="btn-quiz" data-quiz="${ci}"><i class="fa-solid fa-dumbbell"></i>开始刷题（单选 + 判断）</button>
                ${ch.questions && ch.questions.length
                  ? `<span class="text-[11px] t-sub">本章题库 ${ch.questions.length} 题</span>`
                  : `<span class="text-[11px] t-sub">题库待补充</span>`}
              </div>

            </div>
          </div>`;
        }).join('')}
      </div>
    `;

    // 章节展开/收起（手风琴：可同时展开多个）
    box.querySelectorAll('.chapter-head').forEach(head => {
      head.addEventListener('click', () => {
        document.getElementById(head.dataset.chapter).classList.toggle('open');
      });
    });
    // 开始刷题：先进入套题数量选择
    box.querySelectorAll('[data-quiz]').forEach(b => {
      b.addEventListener('click', () => openQuizSetup(currentBookId, Number(b.dataset.quiz)));
    });
  }

  /* ==================================================================
   *  站内搜索
   * ================================================================== */
  function initSearch() {
    const input = document.getElementById('search-input');
    const panel = document.getElementById('search-results');
    const clearBtn = document.getElementById('search-clear');

    /** 展开指定教材+章节并滚动、高亮 */
    function locate(bookId, chapterIndex) {
      if (currentBookId !== bookId) selectBook(bookId);
      const cid = bookId + '-ch-' + chapterIndex;
      const item = document.getElementById(cid);
      if (item) {
        item.classList.add('open', 'flash');
        setTimeout(() => item.classList.remove('flash'), 1800);
        item.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    input.addEventListener('input', () => {
      const kw = input.value.trim();
      const low = kw.toLowerCase();
      clearBtn.classList.toggle('hidden', !kw);
      if (!kw) { panel.style.display = 'none'; return; }

      const hits = [];
      BOOKS.forEach(book => {
        // 教材名命中
        if (book.title.toLowerCase().includes(low)) {
          hits.push({ type: '教材', text: book.title, where: book.publisher, book: book.id, ch: 0 });
        }
        book.chapters.forEach((ch, ci) => {
          if (ch.title.toLowerCase().includes(low) || ch.title.includes(kw)) {
            hits.push({ type: '章节', text: ch.title, where: book.title, book: book.id, ch: ci });
          }
          ch.sections.forEach(s => {
            if (s.toLowerCase().includes(low) || s.includes(kw)) {
              hits.push({ type: '小节', text: s, where: book.title + ' · ' + ch.title, book: book.id, ch: ci });
            }
          });
          ['knowledge', 'examPoints', 'memorize'].forEach(key => {
            (ch[key] || []).forEach(line => {
              if (line.toLowerCase().includes(low) || line.includes(kw)) {
                hits.push({
                  type: key === 'knowledge' ? '知识点' : (key === 'examPoints' ? '考点' : '背诵'),
                  text: line, where: book.title + ' · ' + ch.title, book: book.id, ch: ci
                });
              }
            });
          });
        });
      });

      if (!hits.length) {
        panel.innerHTML = '<p class="sr-empty">没有找到相关内容，换个关键词试试～</p>';
      } else {
        panel.innerHTML = hits.slice(0, 18).map(h =>
          `<a href="#" data-book="${h.book}" data-ch="${h.ch}">
             <span class="sr-type">${h.type}</span>${esc(h.text)}
             <span class="sr-where">${esc(h.where)}</span>
           </a>`
        ).join('') + (hits.length > 18 ? `<p class="sr-empty">还有 ${hits.length - 18} 条，请细化关键词</p>` : '');

        panel.querySelectorAll('a').forEach(a => {
          a.addEventListener('click', (e) => {
            e.preventDefault();
            locate(a.dataset.book, Number(a.dataset.ch));
            panel.style.display = 'none';
          });
        });
      }
      panel.style.display = 'block';
    });

    clearBtn.addEventListener('click', () => {
      input.value = ''; panel.style.display = 'none';
      clearBtn.classList.add('hidden'); input.focus();
    });
    document.addEventListener('click', (e) => {
      if (!panel.contains(e.target) && e.target !== input) panel.style.display = 'none';
    });
  }

  /* ==================================================================
   *  移动端抽屉
   * ================================================================== */
  function openDrawer() {
    document.getElementById('drawer-mask').classList.add('show');
    document.getElementById('book-drawer').classList.add('show');
  }
  function closeDrawer() {
    document.getElementById('drawer-mask').classList.remove('show');
    document.getElementById('book-drawer').classList.remove('show');
  }
  function initDrawer() {
    document.getElementById('drawer-fab').addEventListener('click', openDrawer);
    document.getElementById('drawer-mask').addEventListener('click', closeDrawer);
    document.getElementById('drawer-close').addEventListener('click', closeDrawer);
  }

  /* ==================================================================
   *  随机刷题 + 本地错题本（localStorage，无需后端）
   * ================================================================== */
  const LS_WRONG = 'zz_textbook_wrongbook';
  const QUIZ_MAX = 10;   // 每套最多随机抽题数

  let quizState = null;  // { bookId, chIdx, from:'main'|'wrong', qs:[], idx, correct }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  /** 视图切换：main / quiz / wrong / exam */
  function showView(name) {
    document.getElementById('view-main').classList.toggle('hidden', name !== 'main');
    document.getElementById('view-quiz').classList.toggle('hidden', name !== 'quiz');
    document.getElementById('view-wrong').classList.toggle('hidden', name !== 'wrong');
    document.getElementById('view-exam').classList.toggle('hidden', name !== 'exam');
    document.getElementById('drawer-fab').style.display = name === 'main' ? '' : 'none';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* ---------- 刷题进度本地保存（中途退出可续做） ---------- */
  const LS_PROG = 'zz_textbook_quiz_progress';
  function saveProgress() {
    if (!quizState || quizState.from !== 'main') return;
    // 存档下标 = 已答题数：当前题若已作答则 +1，续做时从下一题开始
    const saveIdx = quizState.idx + (quizState.answered ? 1 : 0);
    if (saveIdx >= quizState.qs.length) return; // 已完成的不保存
    localStorage.setItem(LS_PROG, JSON.stringify({
      bookId: quizState.bookId, chIdx: quizState.chIdx, from: 'main',
      count: quizState.count, qs: quizState.qs, idx: saveIdx,
      correct: quizState.correct,
      elapsed: Date.now() - quizState.startTime, savedAt: Date.now()
    }));
  }
  function getProgress() {
    try { return JSON.parse(localStorage.getItem(LS_PROG)); } catch (e) { return null; }
  }
  function clearProgress() { localStorage.removeItem(LS_PROG); }

  /* ---------- 做题计时 ---------- */
  function startTimer() {
    stopTimer();
    quizState.timerId = setInterval(() => {
      const s = Math.floor((Date.now() - quizState.startTime) / 1000);
      const el = document.getElementById('quiz-timer');
      if (el) el.textContent = '⏱ ' + fmtTime(s);
    }, 1000);
  }
  function stopTimer() {
    if (quizState && quizState.timerId) { clearInterval(quizState.timerId); quizState.timerId = null; }
  }
  function fmtTime(s) {
    return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }

  /** 章节刷题入口：先选套题数量（10/20/50/100），有未完成进度则提示续做 */
  function openQuizSetup(bookId, chIdx) {
    const book = BOOKS.find(b => b.id === bookId);
    const ch = book.chapters[chIdx];
    const pool = ch.questions || [];
    if (!pool.length) { showToast('本章题库待补充，敬请期待～'); return; }

    document.getElementById('quiz-title').textContent = book.title + ' · ' + ch.title;
    document.getElementById('quiz-progress').textContent = '选择套题数量';
    document.getElementById('quiz-timer').textContent = '';
    document.getElementById('quiz-bar-fill').style.width = '0%';

    // 难度模式：只刷基础 / 基础+中档（默认）/ 全部（含拔高）
    const DIFF_MODES = [
      { id: 'base',    label: '只刷基础' },
      { id: 'basemid', label: '基础+中档' },
      { id: 'all',     label: '全部（含拔高）' }
    ];
    let diffMode = 'basemid';
    const filterByDiff = list => list.filter(q => {
      const d = q.difficulty || 'base';
      return diffMode === 'all' ? true : diffMode === 'basemid' ? d !== 'high' : d === 'base';
    });

    const saved = getProgress();
    const matchSaved = saved && saved.bookId === bookId && saved.chIdx === chIdx && saved.from === 'main';

    const body = document.getElementById('quiz-body');
    body.innerHTML = `
      ${matchSaved ? `
      <div class="glass-card p-4 sm:p-5 fade-item" style="border-color: rgba(251,191,36,.45)">
        <p class="text-[13px] t-main font-semibold"><i class="fa-solid fa-clock-rotate-left text-amber-400 mr-1.5"></i>检测到上次未完成的刷题</p>
        <p class="text-[12px] t-sub mt-1">进度：第 ${saved.idx + 1} / ${saved.qs.length} 题 · 已答对 ${saved.correct} 题 · 已用时 ${fmtTime(Math.floor((saved.elapsed || 0) / 1000))}</p>
        <div class="flex flex-wrap gap-2 mt-3">
          <button id="quiz-resume" class="btn-quiz"><i class="fa-solid fa-play"></i>继续做题</button>
          <button id="quiz-discard" class="btn-soft"><i class="fa-solid fa-trash-can"></i>放弃并重新选择</button>
        </div>
      </div>` : ''}
      <div class="glass-card p-5 sm:p-6 fade-item">
        <p class="text-[13px] t-sub"><i class="fa-solid fa-layer-group text-cyan-300 mr-1"></i>刷题范围（按难度筛选）：</p>
        <div class="flex flex-wrap gap-2 mt-2.5">
          ${DIFF_MODES.map(m => `<button class="btn-soft diff-chip" data-mode="${m.id}">${m.label}</button>`).join('')}
        </div>
        <p class="text-[13px] t-sub mt-4">可选题库 <span id="quiz-pool-n" class="text-cyan-300 font-semibold"></span> 题，选择本次随机抽题数量：</p>
        <div class="flex flex-wrap gap-2 mt-3.5" id="quiz-counts"></div>
        <p class="text-[11px] t-sub mt-2 opacity-80">超出可选数量时按实际题数出题；含单选 + 判断，随机打乱；中途退出自动保存进度</p>
        <div class="mt-4 text-right">
          <button id="quiz-start" class="btn-quiz"><i class="fa-solid fa-play"></i>开始刷题</button>
        </div>
      </div>`;

    // 数量选择（默认第一项），随难度模式联动刷新
    let picked = 0;
    function markChips() {
      body.querySelectorAll('.count-chip').forEach(el => {
        const on = Number(el.dataset.count) === picked;
        el.style.borderColor = on ? 'rgba(103,232,249,.55)' : '';
        el.style.color = on ? '#67e8f9' : '';
      });
      body.querySelectorAll('.diff-chip').forEach(el => {
        const on = el.dataset.mode === diffMode;
        el.style.borderColor = on ? 'rgba(103,232,249,.55)' : '';
        el.style.color = on ? '#67e8f9' : '';
      });
    }
    function renderCounts() {
      const fp = filterByDiff(pool);
      const counts = [...new Set([10, 20, 50, 100].map(c => Math.min(c, fp.length)))];
      if (!counts.includes(picked)) picked = counts[0];
      document.getElementById('quiz-pool-n').textContent = fp.length;
      const wrap = document.getElementById('quiz-counts');
      wrap.innerHTML = counts.map(c => `<button class="btn-soft count-chip" data-count="${c}">${c} 题${c === fp.length && ![10,20,50,100].includes(c) ? '（全部）' : ''}</button>`).join('');
      wrap.querySelectorAll('.count-chip').forEach(el => {
        el.addEventListener('click', () => { picked = Number(el.dataset.count); markChips(); });
      });
      markChips();
    }
    body.querySelectorAll('.diff-chip').forEach(el => {
      el.addEventListener('click', () => { diffMode = el.dataset.mode; renderCounts(); });
    });
    renderCounts();

    body.querySelector('#quiz-start').addEventListener('click', () => startQuiz(bookId, chIdx, 'main', null, picked, diffMode));
    if (matchSaved) {
      body.querySelector('#quiz-resume').addEventListener('click', () => resumeQuiz(saved));
      body.querySelector('#quiz-discard').addEventListener('click', () => {
        clearProgress();
        openQuizSetup(bookId, chIdx);
        showToast('已清除上次进度');
      });
    }
    showView('quiz');
  }

  /** 恢复未完成的刷题进度 */
  function resumeQuiz(saved) {
    quizState = {
      bookId: saved.bookId, chIdx: saved.chIdx, from: 'main',
      qs: saved.qs, idx: saved.idx, correct: saved.correct, count: saved.count,
      startTime: Date.now() - (saved.elapsed || 0)
    };
    const book = BOOKS.find(b => b.id === saved.bookId);
    document.getElementById('quiz-title').textContent = book.title + ' · ' + book.chapters[saved.chIdx].title;
    showView('quiz');
    startTimer();
    renderQuizStep();
    showToast('已恢复上次进度');
  }

  /** 开始刷题；qsOverride 用于「重刷错题」模式；diffMode 为主题库难度筛选 */
  function startQuiz(bookId, chIdx, from, qsOverride, count, diffMode) {
    const book = qsOverride ? null : BOOKS.find(b => b.id === bookId);
    let pool;
    if (qsOverride) {
      pool = qsOverride;
    } else {
      const ch = book.chapters[chIdx];
      pool = (ch.questions || []).map((q, i) => ({ ...q, _i: i }));
      const dm = diffMode || 'all';
      if (dm !== 'all') {
        pool = pool.filter(q => {
          const d = q.difficulty || 'base';
          return dm === 'basemid' ? d !== 'high' : d === 'base';
        });
      }
    }
    if (!pool.length) { showToast('该难度范围暂无题目～'); return; }

    const n = Math.min(count || QUIZ_MAX, pool.length);
    quizState = {
      bookId, chIdx, from: from || 'main', count: n, diffMode: diffMode || 'all',
      qs: shuffle(pool.slice()).slice(0, n),
      idx: 0, correct: 0,
      startTime: Date.now()
    };
    if (quizState.from === 'main') clearProgress();   // 新开一套，清掉旧进度
    document.getElementById('quiz-title').textContent =
      qsOverride ? '错题重刷' : (book.title + ' · ' + book.chapters[chIdx].title);
    showView('quiz');
    startTimer();
    renderQuizStep();
  }

  /** 渲染当前题目 */
  function renderQuizStep() {
    const { qs, idx } = quizState;
    const total = qs.length;

    if (idx >= total) { finishQuiz(); return; }
    quizState.answered = false;

    const q = qs[idx];
    const isJudge = q.type === 'judge';
    const opts = isJudge ? ['正确', '错误'] : q.options;
    const d = q.difficulty || 'base';
    const dTxt = d === 'high' ? '拔高' : d === 'mid' ? '中档' : '基础';

    document.getElementById('quiz-progress').textContent = `第 ${idx + 1} / ${total} 题`;
    document.getElementById('quiz-bar-fill').style.width = (idx / total * 100) + '%';

    const body = document.getElementById('quiz-body');
    body.innerHTML = `
      <div class="glass-card p-4 sm:p-5 fade-item">
        <p class="text-[13.5px] sm:text-sm font-semibold t-main leading-relaxed">
          <span class="type-badge ${isJudge ? 'judge' : ''}">${isJudge ? '判断题' : '单选题'}</span><span class="diff-badge diff-${d}">${dTxt}</span>
          ${idx + 1}. ${esc(q.q)}
        </p>
        <div class="mt-3.5">
          ${opts.map((o, i) => `
            <button class="quiz-opt" data-opt="${i}">
              <span class="opt-key">${isJudge ? (i === 0 ? '✓' : '✗') : 'ABCD'[i]}</span>
              <span>${esc(o)}</span>
            </button>`).join('')}
        </div>
        <div id="quiz-explain" class="hidden"></div>
        <div class="mt-2 text-right">
          <button id="quiz-next" class="btn-quiz hidden">${idx + 1 === total ? '查看成绩' : '下一题'} <i class="fa-solid fa-arrow-right"></i></button>
        </div>
      </div>`;

    body.querySelectorAll('.quiz-opt').forEach(btn => {
      btn.addEventListener('click', () => answerQuiz(Number(btn.dataset.opt)));
    });
    document.getElementById('quiz-next').addEventListener('click', () => {
      quizState.idx++;
      renderQuizStep();
    });
  }

  /** 作答：即时判分 + 展示答案解析；答错自动进错题本 */
  function answerQuiz(pick) {
    const q = quizState.qs[quizState.idx];
    const correctIdx = q.type === 'judge' ? (q.answer ? 0 : 1) : q.answer;

    document.querySelectorAll('#quiz-body .quiz-opt').forEach((b, i) => {
      b.classList.add('disabled');
      if (i === correctIdx) b.classList.add('correct');
      else if (i === pick) b.classList.add('wrong');
    });

    const right = pick === correctIdx;
    quizState.answered = true;   // 标记当前题已作答（供进度存档判断）
    if (right) quizState.correct++;
    else addWrong(q);

    const ex = document.getElementById('quiz-explain');
    ex.className = 'quiz-explain';
    ex.innerHTML = `
      <p class="font-semibold ${right ? 'text-green-400' : 'text-rose-400'} mb-1">${right ? '✓ 回答正确' : '✗ 回答错误'}</p>
      <p><span class="text-cyan-300">解析：</span>${esc(q.explain || '暂无解析')}</p>`;
    document.getElementById('quiz-next').classList.remove('hidden');
    document.getElementById('quiz-bar-fill').style.width =
      ((quizState.idx + 1) / quizState.qs.length * 100) + '%';
    saveProgress();   // 每答一题自动存档，中途退出可续做
  }

  /** 一套做完：正确率 + 用时统计 + 再来一套 */
  function finishQuiz() {
    const total = quizState.qs.length;
    const pct = Math.round(quizState.correct / total * 100);
    const secs = Math.floor((Date.now() - quizState.startTime) / 1000);
    stopTimer();
    clearProgress();   // 本套已完成，清除存档
    document.getElementById('quiz-timer').textContent = '⏱ ' + fmtTime(secs);

    const msg = pct >= 90 ? '优秀！对口升学稳了 🎉'
              : pct >= 75 ? '很不错，继续保持 💪'
              : pct >= 60 ? '及格啦，错题记得回看 📖'
              : '别灰心，错题本帮你查漏补缺 🌱';

    document.getElementById('quiz-progress').textContent = '已完成';
    document.getElementById('quiz-bar-fill').style.width = '100%';
    document.getElementById('quiz-body').innerHTML = `
      <div class="glass-card p-6 sm:p-8 text-center fade-item">
        <p class="text-4xl font-black ${pct >= 60 ? 'text-cyan-300' : 'text-rose-400'}">${pct}<span class="text-lg">%</span></p>
        <p class="text-[13px] t-sub mt-2">共 ${total} 题 · 答对 ${quizState.correct} · 答错 ${total - quizState.correct}</p>
        <p class="text-[13px] t-sub mt-1"><i class="fa-regular fa-clock mr-1"></i>用时 ${fmtTime(secs)}</p>
        <p class="text-[13px] t-main mt-1.5">${msg}</p>
        ${total - quizState.correct > 0 ? '<p class="text-[11.5px] t-sub mt-1">答错的题目已自动存入错题本</p>' : ''}
        <div class="flex flex-wrap justify-center gap-2.5 mt-5">
          <button id="quiz-again" class="btn-quiz"><i class="fa-solid fa-rotate"></i>再刷一套</button>
          <button id="quiz-goback" class="btn-soft"><i class="fa-solid fa-arrow-left"></i>返回</button>
        </div>
      </div>`;

    document.getElementById('quiz-again').addEventListener('click', () => {
      if (quizState.from === 'wrong') {
        const pool = wrongPool();
        if (!pool.length) { showToast('错题本已清空，去刷章节题吧～'); exitQuiz(); return; }
        startQuiz(quizState.bookId, quizState.chIdx, 'wrong', pool, pool.length);
      } else {
        startQuiz(quizState.bookId, quizState.chIdx, 'main', null, quizState.count, quizState.diffMode);
      }
    });
    document.getElementById('quiz-goback').addEventListener('click', exitQuiz);
  }

  /** 退出刷题：未完成先存档，再回来源视图 */
  function exitQuiz() {
    if (quizState && quizState.idx < quizState.qs.length) saveProgress();
    stopTimer();
    if (quizState && quizState.from === 'wrong') {
      renderWrongbook();
      showView('wrong');
    } else {
      showView('main');
    }
  }

  /* ---------- 错题本存储 ---------- */
  function getWrong() {
    try { return JSON.parse(localStorage.getItem(LS_WRONG)) || []; } catch (e) { return []; }
  }
  function saveWrong(list) {
    localStorage.setItem(LS_WRONG, JSON.stringify(list));
    updateWrongBadge();
  }
  function updateWrongBadge() {
    const n = getWrong().length;
    const badge = document.getElementById('wrong-badge');
    badge.textContent = n > 99 ? '99+' : n;
    badge.classList.toggle('hidden', !n);
  }

  /** 答错收录（按 key 去重） */
  function addWrong(q) {
    const list = getWrong();
    const key = q._key || (quizState.bookId + '-' + quizState.chIdx + '-' + q._i);
    if (list.some(w => w.key === key)) return;
    const book = BOOKS.find(b => b.id === quizState.bookId);
    const where = book
      ? book.title + ' · ' + book.chapters[quizState.chIdx].title
      : (q._where || '错题重刷');
    list.unshift({
      key, type: q.type, q: q.q, options: q.options || null,
      answer: q.answer, explain: q.explain || '', where, ts: Date.now()
    });
    saveWrong(list);
  }

  /** 错题 → 刷题题池 */
  function wrongPool() {
    return getWrong().map(w => ({
      type: w.type, q: w.q, options: w.options, answer: w.answer,
      explain: w.explain, _key: w.key, _where: w.where
    }));
  }

  /** 渲染错题本列表 */
  function renderWrongbook() {
    const list = getWrong();
    document.getElementById('wrong-count').textContent = list.length ? `共 ${list.length} 题` : '空空如也';
    document.getElementById('wrong-restart').style.display = list.length ? '' : 'none';
    const box = document.getElementById('wrong-list');

    if (!list.length) {
      box.innerHTML = `<div class="glass-card p-8 text-center text-sm t-sub">错题本还是空的～刷题时答错的题目会自动收进来 📒</div>`;
      return;
    }
    box.innerHTML = list.map(w => `
      <div class="wrong-item">
        <p class="text-[11px] t-sub mb-1.5"><i class="fa-solid fa-location-dot mr-1 opacity-60"></i>${esc(w.where)} · ${new Date(w.ts).toLocaleDateString('zh-CN')}</p>
        <p class="text-[13px] t-main font-semibold leading-relaxed">
          <span class="type-badge ${w.type === 'judge' ? 'judge' : ''}">${w.type === 'judge' ? '判断' : '单选'}</span>${esc(w.q)}
        </p>
        <p class="text-[12.5px] mt-2 text-green-400">正确答案：${w.type === 'judge' ? (w.answer ? '正确' : '错误') : ('ABCD'[w.answer] + '. ' + esc(w.options[w.answer]))}</p>
        ${w.explain ? `<p class="text-[12px] t-sub mt-1 leading-relaxed">解析：${esc(w.explain)}</p>` : ''}
        <button class="btn-soft mt-2.5 !py-1 !px-3 !text-[11.5px]" data-remove="${esc(w.key)}"><i class="fa-solid fa-check"></i>已掌握，移出</button>
      </div>`).join('');

    box.querySelectorAll('[data-remove]').forEach(b => {
      b.addEventListener('click', () => {
        saveWrong(getWrong().filter(w => w.key !== b.dataset.remove));
        renderWrongbook();
        showToast('已移出错题本');
      });
    });
  }

  /* ==================================================================
   *  随机组卷（跨教材模拟考试）
   * ================================================================== */
  let examSetup = null;
  let examState = null;

  /** 组卷入口 */
  function openExamSetup() {
    if (!examSetup) {
      examSetup = {
        books: [], chapters: {},
        nChoice: 20, nJudge: 10,
        diffs: ['base', 'mid', 'high'],
        countdown: false, minutes: 60
      };
    }
    examState = null;
    renderExamSetup();
    showView('exam');
  }

  /** 计算当前设置下的题池（带书籍章节归属信息） */
  function examPool(cfg) {
    const choice = [], judge = [];
    cfg.books.forEach(bid => {
      const book = BOOKS.find(b => b.id === bid);
      if (!book) return;
      (cfg.chapters[bid] || []).forEach(ci => {
        const ch = book.chapters[ci];
        (ch.questions || []).forEach((q, i) => {
          if (!cfg.diffs.includes(q.difficulty || 'base')) return;
          const item = Object.assign({}, q, {
            _i: i, _bookId: bid, _chIdx: ci,
            _bookTitle: book.title, _chTitle: ch.title
          });
          (q.type === 'judge' ? judge : choice).push(item);
        });
      });
    });
    return { choice, judge };
  }

  /** 数量步进器卡片 */
  function examStepper(kind, label, n, avail) {
    return `
      <div class="rounded-xl p-3 flex items-center gap-2.5" style="background:var(--c-input);border:1px solid var(--c-border)">
        <span class="type-badge ${kind === 'judge' ? 'judge' : ''}">${label}</span>
        <button class="exam-step-btn" data-step-kind="${kind}" data-step-d="-1">−</button>
        <span class="exam-step-n">${n}</span>
        <button class="exam-step-btn" data-step-kind="${kind}" data-step-d="1">＋</button>
        <span class="ml-auto text-[11.5px] t-sub">可用 ${avail} 题</span>
      </div>`;
  }

  /** 章节短名（去掉章/单元前缀，保留 Unit 写法） */
  function examChShort(t) {
    return t.replace(/^第.+?[章单元]　/, '');
  }

  /** 渲染组卷设置 */
  function renderExamSetup() {
    const cfg = examSetup;
    const pool = examPool(cfg);
    const nc = Math.min(cfg.nChoice, pool.choice.length);
    const nj = Math.min(cfg.nJudge, pool.judge.length);
    const total = nc + nj;

    document.getElementById('exam-progress').textContent = '组卷设置';
    document.getElementById('exam-timer').textContent = '';
    document.getElementById('exam-bar-fill').style.width = '0%';

    document.getElementById('exam-body').innerHTML = `
      <div class="glass-card p-4 sm:p-6 fade-item space-y-5">

        <!-- ① 书本 -->
        <div>
          <p class="blk-title"><i class="fa-solid fa-book i-know"></i>① 选择教材（可多选，跨书组卷）</p>
          <div class="grid sm:grid-cols-2 gap-2 mt-1">
            ${BOOKS.map(b => {
              const on = cfg.books.includes(b.id);
              return `
              <button class="exam-sel-book ${on ? 'on' : ''}" data-book="${b.id}">
                <span class="w-2.5 h-2.5 rounded-full ${b.cover}"></span>
                <span>${esc(b.title)}</span>
                <span class="ml-auto text-[10.5px] opacity-70">${b.chapters.length} 章</span>
              </button>`;
            }).join('')}
          </div>
        </div>

        <!-- ② 章节 -->
        <div>
          <p class="blk-title"><i class="fa-solid fa-list-check i-know"></i>② 选择章节</p>
          ${cfg.books.length ? `
          <div class="space-y-3 mt-1">
            ${cfg.books.map(bid => {
              const book = BOOKS.find(b => b.id === bid);
              const sel = cfg.chapters[bid] || [];
              const all = sel.length === book.chapters.length;
              return `
              <div class="rounded-xl p-3" style="background:var(--c-input);border:1px solid var(--c-border)">
                <div class="flex items-center gap-2 mb-2 flex-wrap">
                  <p class="text-[12.5px] font-semibold t-main">${esc(book.title)}</p>
                  <span class="text-[11px] t-sub ml-auto">已选 ${sel.length}/${book.chapters.length}</span>
                  <button class="btn-soft !py-0.5 !px-2.5 !text-[11px]" data-all="${bid}">${all ? '清空' : '全选'}</button>
                </div>
                <div class="flex flex-wrap gap-1.5">
                  ${book.chapters.map((c, ci) => {
                    const on = sel.includes(ci);
                    const short = examChShort(c.title);
                    return `<button class="exam-ch-chip ${on ? 'on' : ''}" data-book="${bid}" data-ch="${ci}" title="${esc(c.title)}">${esc(short)}</button>`;
                  }).join('')}
                </div>
              </div>`;
            }).join('')}
          </div>` : `
          <div class="rounded-xl p-4 text-center text-[12.5px] t-sub" style="background:var(--c-soft);border:1px dashed var(--c-border)">先勾选上方教材，再选择出题章节</div>`}
        </div>

        <!-- ③ 数量 -->
        <div>
          <p class="blk-title"><i class="fa-solid fa-hashtag i-know"></i>③ 抽题数量（两种题型分别设置）</p>
          <div class="grid sm:grid-cols-2 gap-3 mt-1">
            ${examStepper('choice', '单选题', cfg.nChoice, pool.choice.length)}
            ${examStepper('judge', '判断题', cfg.nJudge, pool.judge.length)}
          </div>
          <p class="text-[11px] t-sub mt-2">题量超出题库容量时，按实际可抽数量出题；不足部分不补充其他题型</p>
        </div>

        <!-- ④ 难度 -->
        <div>
          <p class="blk-title"><i class="fa-solid fa-signal i-know"></i>④ 难度筛选（可多选，三项全选即混合抽取）</p>
          <div class="flex flex-wrap gap-2 mt-1">
            ${[['base', '基础题'], ['mid', '中档题'], ['high', '拔高题']].map(d =>
              `<button class="btn-soft exam-diff-chip ${cfg.diffs.includes(d[0]) ? 'on' : ''}" data-diff="${d[0]}">${d[1]}</button>`).join('')}
          </div>
        </div>

        <!-- ⑤ 倒计时 -->
        <div>
          <p class="blk-title"><i class="fa-solid fa-hourglass-half i-know"></i>⑤ 考试倒计时（可选）</p>
          <div class="flex flex-wrap items-center gap-2 mt-1">
            <button class="btn-soft ${!cfg.countdown ? 'on' : ''}" data-cd="off">不开启（仅正计时）</button>
            <button class="btn-soft ${cfg.countdown ? 'on' : ''}" data-cd="on">开启倒计时</button>
            ${cfg.countdown ? [30, 45, 60, 90, 120].map(m =>
              `<button class="btn-soft exam-min-chip ${cfg.minutes === m ? 'on' : ''}" data-min="${m}">${m} 分钟</button>`).join('') : ''}
          </div>
          ${cfg.countdown ? '<p class="text-[11px] t-sub mt-2">倒计时结束将自动交卷，未作答题目按答错计</p>' : ''}
        </div>

        <!-- 生成 -->
        <div class="flex items-center gap-3 flex-wrap pt-1 border-t" style="border-color:var(--c-border)">
          <p class="text-[12.5px] t-sub pt-3">本次试卷共
            <span class="text-cyan-300 font-bold">${total}</span> 道题
            （单选 ${nc} · 判断 ${nj}）</p>
          <button id="exam-generate" class="btn-quiz ml-auto mt-3" ${total ? '' : 'disabled style="opacity:.45"'}>
            <i class="fa-solid fa-wand-magic-sparkles"></i>生成试卷</button>
        </div>
      </div>`;

    bindExamSetup();
  }

  /** 设置页事件绑定 */
  function bindExamSetup() {
    const cfg = examSetup;
    const body = document.getElementById('exam-body');

    body.querySelectorAll('.exam-sel-book').forEach(btn => {
      btn.addEventListener('click', () => {
        const bid = btn.dataset.book;
        if (cfg.books.includes(bid)) {
          cfg.books = cfg.books.filter(x => x !== bid);
          delete cfg.chapters[bid];
        } else {
          cfg.books.push(bid);
          const n = BOOKS.find(b => b.id === bid).chapters.length;
          cfg.chapters[bid] = Array.from({ length: n }, (_, i) => i);
        }
        renderExamSetup();
      });
    });

    body.querySelectorAll('[data-all]').forEach(btn => {
      btn.addEventListener('click', () => {
        const bid = btn.dataset.all;
        const n = BOOKS.find(b => b.id === bid).chapters.length;
        const sel = cfg.chapters[bid] || [];
        cfg.chapters[bid] = sel.length === n ? [] : Array.from({ length: n }, (_, i) => i);
        renderExamSetup();
      });
    });

    body.querySelectorAll('.exam-ch-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        const bid = btn.dataset.book, ci = Number(btn.dataset.ch);
        const sel = cfg.chapters[bid] || [];
        cfg.chapters[bid] = sel.includes(ci) ? sel.filter(x => x !== ci) : sel.concat(ci);
        renderExamSetup();
      });
    });

    body.querySelectorAll('[data-step-kind]').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.dataset.stepKind === 'choice' ? 'nChoice' : 'nJudge';
        cfg[key] = Math.max(0, Math.min(200, cfg[key] + Number(btn.dataset.stepD)));
        renderExamSetup();
      });
    });

    body.querySelectorAll('.exam-diff-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        const d = btn.dataset.diff;
        if (cfg.diffs.includes(d)) {
          if (cfg.diffs.length === 1) { showToast('至少保留一种难度'); return; }
          cfg.diffs = cfg.diffs.filter(x => x !== d);
        } else {
          cfg.diffs.push(d);
        }
        renderExamSetup();
      });
    });

    body.querySelectorAll('[data-cd]').forEach(btn => {
      btn.addEventListener('click', () => { cfg.countdown = btn.dataset.cd === 'on'; renderExamSetup(); });
    });
    body.querySelectorAll('.exam-min-chip').forEach(btn => {
      btn.addEventListener('click', () => { cfg.minutes = Number(btn.dataset.min); renderExamSetup(); });
    });

    const gen = body.querySelector('#exam-generate');
    if (gen) gen.addEventListener('click', generateExam);
  }

  /** 生成试卷并进入考试 */
  function generateExam() {
    const cfg = examSetup;
    const pool = examPool(cfg);
    const nc = Math.min(cfg.nChoice, pool.choice.length);
    const nj = Math.min(cfg.nJudge, pool.judge.length);
    if (nc + nj === 0) { showToast('选中范围暂无题目，请调整设置'); return; }

    const qs = shuffle(
      shuffle(pool.choice.slice()).slice(0, nc)
        .concat(shuffle(pool.judge.slice()).slice(0, nj))
    );

    examState = {
      phase: 'taking',
      cfg, qs,
      answers: new Array(qs.length).fill(null),
      marks: new Array(qs.length).fill(false),
      idx: 0,
      start: Date.now(),
      duration: cfg.countdown ? cfg.minutes * 60 : null,
      timerId: null
    };
    renderExamTaking();
    startExamTimer();
  }

  /** 考试计时（正计时或倒计时） */
  function startExamTimer() {
    stopExamTimer();
    const tick = () => {
      const st = examState;
      if (!st || st.phase !== 'taking') return;
      const el = document.getElementById('exam-timer');
      if (st.duration) {
        const left = st.duration - Math.floor((Date.now() - st.start) / 1000);
        if (left <= 0) { el.textContent = '⏳ 00:00'; submitExam(true); return; }
        el.textContent = '⏳ ' + fmtTime(left);
        el.classList.toggle('text-rose-400', left <= 60);
        el.classList.toggle('font-bold', left <= 60);
      } else {
        el.textContent = '⏱ ' + fmtTime(Math.floor((Date.now() - st.start) / 1000));
      }
    };
    tick();
    examState.timerId = setInterval(tick, 1000);
  }
  function stopExamTimer() {
    if (examState && examState.timerId) { clearInterval(examState.timerId); examState.timerId = null; }
  }

  /** 渲染答题页（单题视图 + 答题卡导航） */
  function renderExamTaking() {
    const st = examState;
    const total = st.qs.length;
    const q = st.qs[st.idx];
    const isJudge = q.type === 'judge';
    const opts = isJudge ? ['正确', '错误'] : q.options;
    const d = q.difficulty || 'base';
    const dTxt = d === 'high' ? '拔高' : d === 'mid' ? '中档' : '基础';
    const userPick = st.answers[st.idx];
    const answered = st.answers.filter(a => a !== null).length;

    document.getElementById('exam-progress').textContent =
      `第 ${st.idx + 1}/${total} 题 · 已答 ${answered}`;
    document.getElementById('exam-bar-fill').style.width = (answered / total * 100) + '%';

    document.getElementById('exam-body').innerHTML = `
      <div class="glass-card p-4 sm:p-5 fade-item">
        <p class="text-[11.5px] t-sub mb-2"><i class="fa-solid fa-location-dot mr-1 opacity-60"></i>${esc(q._bookTitle)} · ${esc(q._chTitle)}</p>
        <p class="text-[13.5px] sm:text-sm font-semibold t-main leading-relaxed">
          <span class="type-badge ${isJudge ? 'judge' : ''}">${isJudge ? '判断题' : '单选题'}</span><span class="diff-badge diff-${d}">${dTxt}</span>
          ${st.idx + 1}. ${esc(q.q)}
        </p>
        <div class="mt-3.5">
          ${opts.map((o, i) => `
            <button class="quiz-opt ${userPick === i ? 'sel' : ''}" data-opt="${i}">
              <span class="opt-key">${isJudge ? (i === 0 ? '✓' : '✗') : 'ABCD'[i]}</span>
              <span>${esc(o)}</span>
            </button>`).join('')}
        </div>
        ${userPick !== null ? `
        <p class="text-[11.5px] t-sub mt-2.5"><i class="fa-solid fa-circle-check text-green-400 mr-1"></i>已作答，可点击其他选项修改答案</p>` : ''}
        <div class="mt-3 flex items-center justify-between flex-wrap gap-2">
          <button id="exam-mark" class="btn-soft ${st.marks[st.idx] ? 'on' : ''}">
            <i class="fa-${st.marks[st.idx] ? 'solid' : 'regular'} fa-bookmark"></i>
            ${st.marks[st.idx] ? '已标记（点击取消）' : '标记不会'}</button>
          <div class="flex gap-2">
            ${st.idx > 0 ? '<button id="exam-prev" class="btn-soft"><i class="fa-solid fa-arrow-left"></i>上一题</button>' : ''}
            <button id="exam-next" class="btn-quiz">${st.idx + 1 === total ? '已是最后一题' : '下一题'} <i class="fa-solid fa-arrow-right"></i></button>
          </div>
        </div>
      </div>

      <div class="glass-card p-4 sm:p-5">
        <div class="flex items-center justify-between mb-3 flex-wrap gap-2">
          <p class="text-[12.5px] t-main font-semibold"><i class="fa-solid fa-list-ol text-cyan-300 mr-1.5"></i>答题卡</p>
          <button id="exam-submit" class="btn-quiz !py-1.5 !px-4 !text-[12.5px]"><i class="fa-solid fa-flag-checkered"></i>交卷</button>
        </div>
        <div class="flex flex-wrap gap-1.5">
          ${st.qs.map((x, i) => {
            const cls = [
              'exam-nav-cell',
              st.answers[i] !== null ? 'done' : '',
              st.marks[i] ? 'marked' : '',
              i === st.idx ? 'current' : ''
            ].join(' ');
            return `<button class="${cls}" data-jump="${i}">${i + 1}</button>`;
          }).join('')}
        </div>
        <p class="text-[11px] t-sub mt-3 leading-relaxed">
          <span class="inline-block w-2.5 h-2.5 rounded-sm mr-1 align-middle" style="background:rgba(74,222,128,.5)"></span>已答
          <span class="inline-block w-2.5 h-2.5 rounded-sm mr-1 ml-3 align-middle" style="background:var(--c-input);border:1px solid var(--c-border)"></span>未答
          <span class="inline-block w-2.5 h-2.5 rounded-sm mr-1 ml-3 align-middle" style="border:1px solid rgba(251,191,36,.8)"></span>标记
          <span class="inline-block w-2.5 h-2.5 rounded-sm mr-1 ml-3 align-middle" style="box-shadow:0 0 0 2px rgba(103,232,249,.75)"></span>当前</p>
      </div>`;

    document.querySelectorAll('#exam-body .quiz-opt').forEach(btn => {
      btn.addEventListener('click', () => {
        st.answers[st.idx] = Number(btn.dataset.opt);
        renderExamTaking();
      });
    });
    document.getElementById('exam-mark').addEventListener('click', () => {
      st.marks[st.idx] = !st.marks[st.idx];
      renderExamTaking();
    });
    const prev = document.getElementById('exam-prev');
    if (prev) prev.addEventListener('click', () => { st.idx--; renderExamTaking(); });
    document.getElementById('exam-next').addEventListener('click', () => {
      if (st.idx + 1 < st.qs.length) { st.idx++; renderExamTaking(); }
    });
    document.querySelectorAll('[data-jump]').forEach(btn => {
      btn.addEventListener('click', () => { st.idx = Number(btn.dataset.jump); renderExamTaking(); });
    });
    document.getElementById('exam-submit').addEventListener('click', () => submitExam(false));
  }

  /** 交卷（可由倒计时自动触发） */
  function submitExam(auto) {
    const st = examState;
    if (!st || st.phase !== 'taking') return;
    const unanswered = st.answers.filter(a => a === null).length;
    if (!auto && unanswered > 0) {
      if (!confirm('还有 ' + unanswered + ' 道题未作答，确定交卷吗？未作答按答错计。')) return;
    }
    stopExamTimer();
    st.phase = 'result';
    st.autoSubmitted = !!auto;
    st.usedSecs = Math.floor((Date.now() - st.start) / 1000);
    renderExamResult();
  }

  /** 复盘选项行 */
  function examReviewOptions(q, userPick) {
    if (q.type === 'judge') {
      const ci = q.answer ? 0 : 1;
      return [0, 1].map(i => {
        const cls = i === ci ? 'ok' : (i === userPick ? 'bad' : '');
        return `<p class="exam-opt-mini ${cls}"><span class="ek">${i === 0 ? '✓' : '✗'}</span>${i === 0 ? '正确' : '错误'}</p>`;
      }).join('');
    }
    return q.options.map((o, i) => {
      let cls = '';
      if (i === q.answer) cls = 'ok';
      else if (i === userPick) cls = 'bad';
      return `<p class="exam-opt-mini ${cls}"><span class="ek">${'ABCD'[i]}</span>${esc(o)}</p>`;
    }).join('')
  }

  /** 渲染成绩与逐题解析 */
  function renderExamResult() {
    const st = examState;
    const total = st.qs.length;
    let correct = 0;
    st.qs.forEach((q, i) => {
      const ci = q.type === 'judge' ? (q.answer ? 0 : 1) : q.answer;
      if (st.answers[i] === ci) correct++;
    });
    const wrongN = total - correct;
    const pct = Math.round(correct / total * 100);

    const msg = pct >= 90 ? '优秀！模拟考试发挥出色 🎉'
      : pct >= 75 ? '很不错，保持手感继续冲 💪'
        : pct >= 60 ? '及格啦，错题逐题吃透 📖'
          : '别灰心，结合解析回归教材补短板 🌱';

    document.getElementById('exam-progress').textContent = '考试结束';
    document.getElementById('exam-bar-fill').style.width = '100%';
    const tEl = document.getElementById('exam-timer');
    tEl.textContent = '⏱ ' + fmtTime(st.usedSecs);
    tEl.classList.remove('text-rose-400', 'font-bold');

    document.getElementById('exam-body').innerHTML = `
      <div class="glass-card p-6 sm:p-8 text-center fade-item">
        <p class="text-[12.5px] t-sub">${st.autoSubmitted ? '倒计时结束，已自动交卷' : '试卷已提交'}</p>
        <p class="text-4xl font-black ${pct >= 60 ? 'text-cyan-300' : 'text-rose-400'} mt-1">${pct}<span class="text-lg">%</span></p>
        <p class="text-[13px] t-main mt-2 font-semibold">得分 ${correct} / ${total} 分</p>
        <p class="text-[12.5px] t-sub mt-1">答对 ${correct} · 答错/未答 ${wrongN} · 用时 ${fmtTime(st.usedSecs)}</p>
        <p class="text-[13px] t-main mt-1.5">${msg}</p>
        <div class="flex flex-wrap justify-center gap-2.5 mt-5">
          ${wrongN > 0 ? '<button id="exam-add-wrong" class="btn-quiz"><i class="fa-solid fa-book-bookmark"></i>错题一键加入错题本</button>' : ''}
          <button id="exam-again" class="btn-soft"><i class="fa-solid fa-rotate"></i>同设置再组一套</button>
          <button id="exam-setup" class="btn-soft"><i class="fa-solid fa-sliders"></i>修改设置</button>
        </div>
      </div>

      <div class="glass-card p-4 sm:p-5">
        <p class="text-[13px] t-main font-semibold mb-3"><i class="fa-solid fa-magnifying-glass-chart text-cyan-300 mr-1.5"></i>逐题复盘（标准答案 + 解析）</p>
        ${st.qs.map((q, i) => {
          const ci = q.type === 'judge' ? (q.answer ? 0 : 1) : q.answer;
          const userPick = st.answers[i];
          const isJudge = q.type === 'judge';
          const d = q.difficulty || 'base';
          const dTxt = d === 'high' ? '拔高' : d === 'mid' ? '中档' : '基础';
          const verdict = userPick === null
            ? '<span class="text-amber-400">未作答</span>'
            : (userPick === ci ? '<span class="text-green-400">✓ 答对</span>' : '<span class="text-rose-400">✗ 答错</span>');
          return `
          <div class="exam-review-item">
            <p class="text-[11px] t-sub mb-1.5">
              <i class="fa-solid fa-location-dot mr-1 opacity-60"></i>${esc(q._bookTitle)} · ${esc(q._chTitle)}</p>
            <p class="text-[13px] t-main font-semibold leading-relaxed">
              <span class="type-badge ${isJudge ? 'judge' : ''}">${isJudge ? '判断' : '单选'}</span><span class="diff-badge diff-${d}">${dTxt}</span>
              ${i + 1}. ${esc(q.q)} <span class="ml-1">${verdict}</span></p>
            <div class="mt-2">
              ${examReviewOptions(q, userPick)}
            </div>
            <p class="text-[12px] t-sub mt-2 leading-relaxed"><span class="text-cyan-300">解析：</span>${esc(q.explain || '暂无解析')}</p>
          </div>`;
        }).join('')}
      </div>`;

    const addBtn = document.getElementById('exam-add-wrong');
    if (addBtn) addBtn.addEventListener('click', examWrongToBook);
    document.getElementById('exam-again').addEventListener('click', generateExam);
    document.getElementById('exam-setup').addEventListener('click', renderExamSetup);
  }

  /** 本次试卷错题 → 统一错题本（按 key 去重，结构与章节错题一致） */
  function examWrongToBook() {
    const st = examState;
    const list = getWrong();
    let add = 0;
    st.qs.forEach((q, i) => {
      const ci = q.type === 'judge' ? (q.answer ? 0 : 1) : q.answer;
      if (st.answers[i] !== ci) {
        const key = 'exam-' + q._bookId + '-' + q._chIdx + '-' + q._i;
        if (!list.some(w => w.key === key)) {
          list.unshift({
            key, type: q.type, q: q.q, options: q.options || null,
            answer: q.answer, explain: q.explain || '',
            where: q._bookTitle + ' · ' + q._chTitle, ts: Date.now()
          });
          add++;
        }
      }
    });
    saveWrong(list);
    showToast(add ? ('已加入 ' + add + ' 道错题') : '这些错题都已在错题本中');
    const b = document.getElementById('exam-add-wrong');
    if (b) {
      b.disabled = true;
      b.classList.add('opacity-60');
      b.innerHTML = '<i class="fa-solid fa-check"></i>已加入错题本';
    }
  }

  /** 返回书架：考试中需确认放弃 */
  function examBack() {
    if (examState && examState.phase === 'taking') {
      if (!confirm('考试正在进行，确定退出吗？本卷不会保存。')) return;
      stopExamTimer();
    }
    examState = null;
    showView('main');
  }

  /** 刷题 / 错题本静态按钮绑定 */
  function initQuiz() {
    document.getElementById('quiz-back').addEventListener('click', exitQuiz);
    document.getElementById('btn-exam').addEventListener('click', openExamSetup);
    document.getElementById('exam-back').addEventListener('click', examBack);
    document.getElementById('btn-wrong').addEventListener('click', () => {
      renderWrongbook();
      showView('wrong');
    });
    document.getElementById('wrong-back').addEventListener('click', () => showView('main'));
    document.getElementById('wrong-restart').addEventListener('click', () => {
      const pool = wrongPool();
      if (!pool.length) { showToast('错题本是空的～'); return; }
      startQuiz(null, -1, 'wrong', pool, pool.length);
    });
    updateWrongBadge();
  }

  /* ==================================================================
   *  初始化
   * ================================================================== */
  function init() {
    loadBackground();
    initTheme();
    renderBookNav();
    renderBookContent();
    initSearch();
    initDrawer();
    initQuiz();
    document.getElementById('footer-year').textContent = new Date().getFullYear();
  }

  init();
  </script>
</body>
</html>
