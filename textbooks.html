          { type:'choice', difficulty:'base', q:'「负荆请罪」这一成语的主人公是____。', options:['蔺相如','赵王','廉颇','秦王'], answer:2, explain:'廉颇得知蔺相如以国事为重的苦心后，肉袒负荆登门请罪，二人结为刎颈之交。' },
          { type:'judge', difficulty:'base', q:'「项庄舞剑，意在沛公」比喻言行表面一套、暗中另有所图。', answer:true, explain:'项庄席间舞剑，真实意图是刺杀刘邦，后以此语比喻别有用心的举动。' },
          { type:'choice', difficulty:'base', q:'「旦日飨士卒，为击破沛公军」这句话的说话人是____。', options:['刘邦','范增','张良','项羽'], answer:3, explain:'项羽听闻曹无伤告密后大怒，下令次日犒劳士卒、击破沛公军，这是鸿门宴的起因。' },
          { type:'choice', difficulty:'base', q:'「张良出，要项伯」中「要」通____。', options:['邀','腰','夭','药'], answer:0, explain:'「要」通「邀」，意为邀请；张良出帐邀请项伯入内相见。' },
          { type:'judge', difficulty:'base', q:'「具言臣之不敢倍德也」中「倍」通「陪」，意为陪伴。', answer:false, explain:'「倍」通「背」，意为背弃、违背；全句说详细说明我不敢背弃项王的恩德。' },
          { type:'choice', difficulty:'base', q:'「旦日不可不蚤自来谢项王」中「蚤」通____。', options:['早','爪','骚','搔'], answer:0, explain:'「蚤」通「早」，项伯嘱咐刘邦第二天趁早亲自来向项王道歉。' },
          { type:'choice', difficulty:'base', q:'「完璧归赵」中「完」的用法是____。', options:['形容词作名词，完整','使动用法，使……完整','意动用法，认为……完整','名词作动词，修补完整'], answer:1, explain:'「完」是使动用法，使和氏璧完好无损地归还赵国。' },
          { type:'judge', difficulty:'mid', q:'「先国家之急而后私仇」中「先」是意动用法，即以……为先。', answer:true, explain:'「先」「后」均为意动用法，意为把国家急难放在前面、把个人仇怨放在后面。' },
          { type:'choice', difficulty:'mid', q:'下列各句中加点词属于使动用法的一项是____。', options:['沛公军霸上','范增数目项王','项伯杀人，臣活之','道芷阳间行'], answer:2, explain:'「活」是使动用法，使……活下来；其余三项「军」「目」「道」均为名词作动词。' },
          { type:'choice', difficulty:'base', q:'「何以知之」的句式是____。', options:['判断句','被动句','宾语前置句','状语后置句'], answer:2, explain:'「何以」即「以何」，疑问句中疑问代词作宾语前置，意为凭什么了解他。' },
          { type:'choice', difficulty:'base', q:'「廉颇者，赵之良将也」的句式是____。', options:['判断句','被动句','宾语前置句','省略句'], answer:0, explain:'以「者……也」表判断，意为廉颇是赵国的良将，是典型的判断句。' },
          { type:'judge', difficulty:'base', q:'「徒见欺」中「见」表示被动，全句意为白白地被欺骗。', answer:true, explain:'「见」是表被动的标志词，类似的用法还有「见笑于人」。' },
          { type:'choice', difficulty:'base', q:'「拜为上卿，以勇气闻于诸侯」所说的人物是____。', options:['廉颇','李牧','蔺相如','赵奢'], answer:0, explain:'课文开篇介绍廉颇伐齐大破之、取阳晋，拜为上卿，以勇气闻于诸侯。' },
          { type:'choice', difficulty:'mid', q:'下列句子中加点词古今意义相同的一项是____。', options:['臣所以去亲戚而事君者','未尝有坚明约束者也','沛公居山东时','相如持其璧睨柱'], answer:3, explain:'「璧」古今都指平而圆、中心有孔的玉；「亲戚」「约束」「山东」均为古今异义。' },
          { type:'choice', difficulty:'mid', q:'「未尝有坚明约束者也」中「约束」的古义是____。', options:['限制使不越出范围','规约、约定','束缚捆绑','管束管教'], answer:1, explain:'「约束」古义指规约、约定，今义指限制使不越出范围，属古今异义。' },
          { type:'choice', difficulty:'mid', q:'「所以遣将守关者，备他盗之出入与非常也」翻译正确的一项是____。', options:['派遣将领把守关口的原因，是防备其他盗贼进入和意外的变故','之所以派将领守关，是防备他偷盗财物出入和异常情况','派将领守关的人，是防备别的强盗出入的非常之人','派遣守关的将领，是为了防止其他盗贼经常出入'], answer:0, explain:'「所以」表原因，「非常」指意外的变故；全句说明守关目的在于防盗与防变。' },
          { type:'choice', difficulty:'base', q:'「人为刀俎，我为鱼肉」出自____。', options:['《廉颇蔺相如列传》','《劝学》','《师说》','《鸿门宴》'], answer:3, explain:'刘邦欲不辞而别时樊哙以此语劝谏，意为对方是刀和砧板，自己是鱼和肉。' },
          { type:'judge', difficulty:'mid', q:'鸿门宴上范增举玦示意，项羽立刻下令杀掉了刘邦。', answer:false, explain:'范增数目项王、举所佩玉玦者三，项羽默然不应，可见其优柔寡断，刘邦并未被杀。' },
          { type:'choice', difficulty:'base', q:'樊哙闯帐时的表现是____。', options:['悄悄潜入帐中劝刘邦逃走','在帐外大声责骂项羽','带剑拥盾入军门，瞋目视项王，头发上指','持剑与项庄对舞'], answer:2, explain:'樊哙带剑拥盾闯入军门，瞋目视项王，头发上指，目眦尽裂，气势震慑全场。' },
          { type:'choice', difficulty:'high', q:'下列对刘邦、项羽性格的分析，不正确的一项是____。', options:['刘邦善于听取意见，能屈能伸','项羽自矜功伐，优柔寡断','刘邦临危能随机应变，善于笼络人心','项羽精细多谋，处处提防刘邦'], answer:3, explain:'项羽寡谋轻信、刚愎自用，既不疑项伯泄密，又轻信刘邦谢罪之词，与「精细多谋、处处提防」正相反。' },
          { type:'judge', difficulty:'high', q:'蔺相如每逢上朝常称病、引车避匿，是因为畏惧廉颇的权势。', answer:false, explain:'相如以「先国家之急而后私仇」自明，回避廉颇是顾全大局，并非畏惧权势。' },
          { type:'choice', difficulty:'high', q:'下列对《鸿门宴》情节的概括，不正确的一项是____。', options:['曹无伤告密是鸿门宴的导火索','项庄舞剑意在借机刺杀刘邦','樊哙闯帐后被项羽当场处死','项伯夜访张良并替刘邦说情，使局势一度缓和'], answer:2, explain:'项羽欣赏樊哙的勇武，赐酒赐彘肩，并未加害；刘邦随后借故脱身，樊哙也安然离席。' },
          { type:'choice', difficulty:'base', q:'「大行不顾细谨，大礼不辞小让」中「让」的意思是____。', options:['谦让','推让','转让','责备'], answer:3, explain:'「让」意为责备；全句说做大事不必顾及小节，行大礼不必计较小的责备。' },
          { type:'choice', difficulty:'base', q:'「范增数目项王」中「目」的用法与意义是____。', options:['名词作状语，像眼睛一样','名词作动词，使眼色','形容词作动词，仔细看','名词作宾语，眼睛'], answer:1, explain:'「目」名词作动词，意为使眼色；范增多次向项羽使眼色示意其动手。' }
        ]
      },
      { title: '第六单元　小说',
        sections: ['《林教头风雪山神庙》（施耐庵《水浒传》）',
          '《项链》（莫泊桑）',
          '《荷花淀》（孙犁）',
          '口语交际：介绍',
          '写作：记叙文　人物描写'],
        knowledge: ['小说的三要素是人物、情节、环境：人物是核心，情节一般包括开端、发展、高潮、结局，环境包括自然环境与社会环境。',
          '《林教头风雪山神庙》节选自《水浒传》第十回，作者施耐庵，元末明初小说家；《水浒传》是我国第一部歌颂农民起义的长篇章回体小说。',
          '《林教头风雪山神庙》情节链：林冲发配沧州巧遇李小二—买刀寻陆谦复仇—被调接管草料场—山神庙得知真相、手刃仇敌、雪夜上梁山。',
          '风雪环境描写的作用：渲染紧张悲壮的气氛；推动情节发展（大雪压塌草厅，林冲才寄宿山神庙）；烘托人物由隐忍到激愤的心境。',
          '林冲的性格由逆来顺受、委曲求全到奋起反抗，其转变过程揭露了封建社会「官逼民反」的黑暗现实。',
          '细节描写：林冲出门前盖灭火炭、锁好门窗等细节，表现其谨小慎微，也为草厅被雪压塌埋下伏笔。',
          '《项链》作者莫泊桑，19世纪法国批判现实主义作家，被誉为「短篇小说巨匠」。',
          '莫泊桑与俄国契诃夫、美国欧·亨利并称「世界三大短篇小说家」，代表作有《项链》《羊脂球》《我的叔叔于勒》等。',
          '《项链》情节链：借项链—丢项链—赔项链—识项链，十年艰辛后得知所丢项链原来是假的。',
          '《项链》结尾出人意料又在情理之中：借项链时朋友爽快答应、还项链时朋友不曾细看等伏笔，早已暗示项链并非真品。',
          '玛蒂尔德形象：爱慕虚荣、追求享乐，但丢失项链后勇于承担责任、辛苦十年还清债务，性格复杂而真实；虚荣心是其悲剧的主观原因，攀比享乐的社会风气是客观原因。',
          '《荷花淀》作者孙犁，现代作家，「白洋淀派」（又称荷花淀派）的代表作家。',
          '《荷花淀》以抗日战争为背景，写水生嫂等青年妇女在斗争中成长，歌颂根据地人民的爱国主义精神和革命乐观主义精神。',
          '诗体小说特点：淡化激烈的战争场面，景物描写充满诗情画意，语言清新隽永，富有散文诗的韵味。',
          '水生嫂形象：勤劳善良、温柔体贴，又深明大义、识大体顾大局，是在战斗中成长起来的根据地劳动妇女的典型。',
          '《荷花淀》景物描写的作用：交代故事发生的环境，烘托人物美好的心灵，为伏击战作铺垫，景与人、情与景融为一体。'],
        examPoints: ['小说三要素的识记：人物、情节、环境，常以填空、选择形式考查。',
          '文学常识：施耐庵与《水浒传》、莫泊桑的国别与称号、孙犁与白洋淀派、世界三大短篇小说家，是必考内容。',
          '情节梳理：三篇课文的情节发展顺序（情节链），常以排序题、选择题出现。',
          '环境描写的作用：渲染气氛、推动情节、烘托人物，是选择与简答的高频考点。',
          '人物形象分析：林冲由忍让到反抗的转变、玛蒂尔德的虚荣与诚实、水生嫂的深明大义，须结合具体情节作答。',
          '《项链》结尾的艺术效果：出人意料又在情理之中，伏笔与铺垫的辨识。',
          '字音字形与词语运用：赍发、迤逦、朔风、酒馔等字词，以及「寻思」「交割」等词语的理解。',
          '修辞手法辨识：比喻、比拟等修辞在课文语句中的运用及其表达效果。'],
        memorize: ['小说三要素：人物、情节、环境。',
          '《林教头风雪山神庙》节选自施耐庵《水浒传》，《水浒传》是我国第一部歌颂农民起义的长篇章回体小说。',
          '林冲性格：由逆来顺受到奋起反抗，揭示「官逼民反」的主题。',
          '风雪描写的作用：渲染气氛、推动情节、烘托人物。',
          '莫泊桑，法国作家，「短篇小说巨匠」，与契诃夫、欧·亨利并称世界三大短篇小说家。',
          '《项链》情节：借项链—丢项链—赔项链—识项链，结尾出人意料。',
          '孙犁是「白洋淀派」代表作家，《荷花淀》被誉为「诗体小说」。',
          '水生嫂形象：勤劳善良、深明大义的根据地劳动妇女。'],
        practiceUrl: '',
        questions: [
          { type:'choice', difficulty:'base', q:'小说的三要素是____。', options:['人物、时间、地点','人物、情节、环境','开端、发展、结局','外貌、语言、动作'], answer:1, explain:'人物、情节、环境是小说三要素，其中人物是核心；「时间、地点」只是环境的一部分。' },
          { type:'judge', difficulty:'base', q:'《林教头风雪山神庙》节选自施耐庵的长篇小说《水浒传》。', answer:true, explain:'本文节选自《水浒传》第十回，作者施耐庵，元末明初小说家。' },
          { type:'choice', difficulty:'base', q:'《项链》的作者莫泊桑是____国作家。', options:['英国','俄国','法国','美国'], answer:2, explain:'莫泊桑是19世纪法国批判现实主义作家，被誉为短篇小说巨匠。' },
          { type:'choice', difficulty:'base', q:'「世界三大短篇小说家」指的是____。', options:['莫泊桑、巴尔扎克、欧·亨利','契诃夫、高尔基、莫泊桑','莫泊桑、托尔斯泰、契诃夫','莫泊桑、契诃夫、欧·亨利'], answer:3, explain:'法国莫泊桑、俄国契诃夫、美国欧·亨利并称世界三大短篇小说家；巴尔扎克、托尔斯泰以长篇小说著称。' },
          { type:'judge', difficulty:'base', q:'孙犁是「白洋淀派」的代表作家，《荷花淀》是其代表作之一。', answer:true, explain:'白洋淀派（荷花淀派）以孙犁为代表，风格清新隽永，《荷花淀》是其成名作。' },
          { type:'choice', difficulty:'base', q:'林冲原是东京八十万禁军____。', options:['枪棒教头','押狱节级','都监','提辖'], answer:0, explain:'林冲绰号豹子头，原为八十万禁军枪棒教头；提辖是鲁智深的官职，注意区分。' },
          { type:'choice', difficulty:'mid', q:'《林教头风雪山神庙》的情节发展顺序正确的一项是____。', options:['买刀寻仇—沧州遇旧—接管草料场—山神庙复仇','沧州遇旧—买刀寻仇—接管草料场—山神庙复仇','沧州遇旧—接管草料场—买刀寻仇—山神庙复仇','接管草料场—沧州遇旧—山神庙复仇—买刀寻仇'], answer:1, explain:'林冲发配沧州先遇李小二，得知陆谦到来后买刀寻仇，后被调往草料场，最终在山神庙手刃仇人。' },
          { type:'choice', difficulty:'base', q:'下列词语中加点字注音有误的一项是____。', options:['迤逦（yǐ）','酒馔（zhuàn）','朔风（sù）','剜心（wān）'], answer:2, explain:'「朔风」的「朔」应读shuò，指北风；其余注音均正确。' },
          { type:'judge', difficulty:'mid', q:'《林教头风雪山神庙》中的风雪描写只是为了交代故事发生的季节和天气。', answer:false, explain:'风雪描写渲染紧张气氛、推动情节发展、烘托人物心境，并非单纯交代天气。' },
          { type:'choice', difficulty:'base', q:'《项链》中玛蒂尔德参加舞会前，向佛来思节夫人借的是____。', options:['一串钻石项链','一件貂皮大衣','一副珍珠耳环','一枚宝石戒指'], answer:0, explain:'她挑中一串精美的钻石项链（实际是赝品），在舞会上大出风头。' },
          { type:'choice', difficulty:'base', q:'路瓦栽夫妇为赔偿丢失的项链，辛苦劳碌了____。', options:['三年','五年','八年','十年'], answer:3, explain:'夫妇俩节衣缩食、辛苦十年才还清债务，玛蒂尔德也因此变得苍老粗俗。' },
          { type:'judge', difficulty:'base', q:'《项链》的结尾揭示那串丢失的项链原来是假的，出人意料。', answer:true, explain:'结尾佛来思节夫人道出项链是赝品，戛然而止，出人意料又在情理之中。' },
          { type:'choice', difficulty:'mid', q:'《林教头风雪山神庙》中风雪描写的作用不包括____。', options:['渲染紧张悲壮的气氛','推动故事情节的发展','交代故事发生的地点','烘托人物激愤的心境'], answer:2, explain:'交代地点由「沧州」「草料场」等完成；风雪的作用是渲染气氛、推动情节、烘托人物。' },
          { type:'choice', difficulty:'base', q:'《荷花淀》的故事发生在____。', options:['微山湖畔','白洋淀','洪湖地区','洞庭湖区'], answer:1, explain:'小说以抗日战争时期冀中白洋淀为背景，写水生嫂等青年妇女的成长。' },
          { type:'choice', difficulty:'base', q:'《荷花淀》被誉为「诗体小说」，主要是因为____。', options:['全篇用诗歌形式写成','人物对话像诗句一样押韵','景物描写充满诗情画意，语言清新隽永','故事情节完全虚构、富于想象'], answer:3, explain:'孙犁以散文诗的笔法写小说，景物描写如诗如画，故有诗体小说之誉；它仍是小说而非诗歌。' },
          { type:'choice', difficulty:'base', q:'下列词语书写完全正确的一项是____。', options:['妥帖　寒喧　伶俐','赔尝　羡幕　惆怅','丰韵　惆怅　琐碎','请柬　端祥　仰慕'], answer:2, explain:'A「寒喧」应为「寒暄」，B「赔尝」应为「赔偿」、「羡幕」应为「羡慕」，D「端祥」应为「端详」。' },
          { type:'choice', difficulty:'mid', q:'林冲性格发展的轨迹是____。', options:['由逆来顺受、委曲求全走向奋起反抗','一贯疾恶如仇、主动反抗','由勇猛刚烈变得胆小怕事','由安分守己走向贪图富贵'], answer:0, explain:'一系列迫害使林冲的幻想彻底破灭，他终于在山神庙前杀死仇敌，完成了由忍到反的转变。' },
          { type:'choice', difficulty:'base', q:'施耐庵是____的文学家，《水浒传》的作者。', options:['北宋末年','明代中期','元末明初','清代初年'], answer:2, explain:'施耐庵为元末明初小说家；《水浒传》描写的是北宋末年宋江起义的故事，作者时代与故事时代不可混淆。' },
          { type:'judge', difficulty:'mid', q:'玛蒂尔德只是一个爱慕虚荣、毫无可取之处的妇女形象。', answer:false, explain:'她虽有虚荣心，但丢失项链后勇于承担、辛苦十年还清债务，表现出诚实与坚韧，形象是复杂的。' },
          { type:'choice', difficulty:'base', q:'《荷花淀》中水生嫂的形象特点是____。', options:['多愁善感、优柔寡断','勤劳善良、深明大义','泼辣放肆、爱慕虚荣','孤高自许、目下无尘'], answer:1, explain:'水生嫂送夫参军、组织妇女练兵，既有传统妇女的勤劳温柔，又有深明大义、保家卫国的觉悟。' },
          { type:'choice', difficulty:'base', q:'下列句子中加点成语使用恰当的一项是____。', options:['林冲忍无可忍，终于破天荒地杀死了陆谦等人','玛蒂尔德在舞会上出尽风头，变得踌躇满志','水生夫妇话别时情深意切，令人感动','小说结尾突如其来，让读者觉得不可理喻'], answer:2, explain:'「破天荒」指从未有过的事，用于杀人不当；「踌躇满志」多含贬义，不合语境；「不可理喻」指人不讲道理，不能形容情节。' },
          { type:'choice', difficulty:'base', q:'「那一望无边际的密密层层的大荷叶，迎着阳光舒展开，就像铜墙铁壁一样。」这句话运用的修辞手法是____。', options:['拟人','比喻','借代','对偶'], answer:1, explain:'把密密层层的大荷叶比作铜墙铁壁，暗喻根据地人民坚不可摧的抗日力量。' },
          { type:'judge', difficulty:'base', q:'《水浒传》是我国文学史上第一部以农民起义为题材的长篇章回体小说。', answer:true, explain:'《水浒传》描写北宋末年以宋江为首的农民起义，是我国第一部歌颂农民起义的长篇章回体小说。' },
          { type:'choice', difficulty:'high', q:'下列对《项链》结尾艺术效果的赏析，不正确的一项是____。', options:['结尾陡然一转，出人意料','前文多处伏笔使结局又在情理之中','戛然而止，给读者留下回味的余地','结尾点明玛蒂尔德从此过上了幸福生活'], answer:3, explain:'小说在佛来思节夫人说出真相处戛然而止，并未交代此后的生活；其余三项均为对结尾艺术的正确赏析。' },
          { type:'choice', difficulty:'base', q:'《荷花淀》开头月下编席的景物描写，主要作用是____。', options:['交代故事发生的环境，烘托宁静美好的氛围','渲染战争的残酷与恐怖','表现水生嫂的悠闲懒散','暗示故事以悲剧收场'], answer:0, explain:'月夜、荷香、编席的画面交代了白洋淀的环境，烘托人物美好的心灵与和平安宁的生活，与后文战争形成对照。' },
          { type:'judge', difficulty:'high', q:'林冲接管草料场时，已经彻底认清统治者的面目，决心奋起反抗。', answer:false, explain:'接管草料场时他仍对回东京与家人团聚抱有幻想，甚至想修屋过冬；直到山神庙听到仇人谈话才彻底觉醒。' },
          { type:'choice', difficulty:'high', q:'下列对三篇小说艺术特色的比较，不正确的一项是____。', options:['《林教头风雪山神庙》情节曲折，环境描写出色','《项链》构思精巧，结尾出人意料','《荷花淀》以浓郁的诗情画意著称','三篇小说都以第一人称「我」叙述故事'], answer:3, explain:'三篇均采用第三人称叙事；其余三项分别概括了各篇的突出特色。' },
          { type:'choice', difficulty:'base', q:'下列对课文中词语解释有误的一项是____。', options:['「酒馔」指酒和食物','「小觑」指仔细端详','「浑家」指妻子','「赍发」指资助、打发'], answer:1, explain:'「小觑」意为小看、轻视，并非仔细端详；其余解释均正确。' },
          { type:'judge', difficulty:'mid', q:'路瓦栽夫妇赔偿项链之后，生活反而比从前更加富裕了。', answer:false, explain:'为还清债务，夫妇俩搬进阁楼、辞退女仆，辛苦劳碌十年，生活更加贫困。' },
          { type:'choice', difficulty:'base', q:'林冲在山神庙得知陆谦等人要烧死自己的阴谋后，采取的行动是____。', options:['连夜逃回东京','忍气吞声，继续看守草料场','杀死仇人，雪夜上梁山','向官府告发陆谦'], answer:2, explain:'林冲手刃陆谦、富安和差拨，彻底走上反抗道路，雪夜投奔梁山。' }
        ]
      },
      { title: '第七单元　记叙文',
        sections: ['《我的母亲》（老舍）',
          '《金岳霖先生》（汪曾祺）',
          '口语交际：交谈',
          '写作：记叙文　选材与组材'],
        knowledge: ['记叙文的六要素是时间、地点、人物和事件的起因、经过、结果，写人叙事都离不开这六要素。',
          '记叙的顺序主要有顺叙、倒叙、插叙、补叙四种；顺叙按时间先后写来，条理清晰、脉络分明。',
          '倒叙是把事件的结局或最突出的片段提到开头，再按顺叙写来，能设置悬念、吸引读者，避免平铺直叙。',
          '插叙是在叙述中心事件的过程中暂时中断线索，插入相关情节，能补充交代背景、丰富人物形象，插叙结束仍回到原线索。',
          '补叙是在文章结尾或关键处对前文作简短的补充交代，使情节完整、释疑解惑；补叙是内容的有机组成部分，删去会影响完整，插叙删去则不影响事件本身的完整。',
          '记叙的人称：第一人称「我」真实亲切、便于抒情，但受「我」的见闻限制；第三人称不受时空限制、自由灵活，便于全方位刻画人物。',
          '《我的母亲》作者老舍，原名舒庆春，字舍予，满族人，被授予「人民艺术家」称号。',
          '老舍的代表作有长篇小说《骆驼祥子》《四世同堂》，话剧《茶馆》《龙须沟》等。',
          '《我的母亲》通过缝洗衣物、筹措学费、送别儿子、除夕返校等日常琐事塑造母亲形象，于平凡中见伟大。',
          '母亲形象：勤劳、勤俭、诚实，热情好客、乐于助人；待人宽厚是「软」，在刺刀下、饥荒中挺身而出保护儿女是「硬」，软中带硬、外柔内刚。',
          '《我的母亲》善用细节描写：如母亲的手「终年是鲜红微肿的」，一双红肿的手凝结着终年劳作的艰辛，以小见大。',
          '《金岳霖先生》作者汪曾祺，江苏高邮人，师从沈从文，是京派作家的代表，小说有《受戒》《大淖记事》等。',
          '《金岳霖先生》运用白描手法，抓住人物的外貌、举止等特征，寥寥几笔便形神毕现，笔调幽默而温情。',
          '文章通过金先生给亡友林徽因过生日、与斗鸡同桌进餐等琐事，以小见大，表现其天真率直、重情重义的学者风采。',
          '写人叙事散文的选材：围绕中心选取真实、典型、新颖的材料，善于从小处着眼、以小见大，选材要服务于表现人物性格和主题。',
          '组材方法：合理安排记叙顺序与详略，围绕线索组织材料，做到详略得当、过渡自然、首尾呼应。'],
        examPoints: ['记叙文六要素的识记：时间、地点、人物、起因、经过、结果，常以填空、选择形式考查。',
          '记叙顺序的辨析及作用：给出语段判断顺叙、倒叙、插叙、补叙并分析其表达作用，是高频考点。',
          '记叙人称的作用：第一人称真实亲切、第三人称自由灵活，常结合语段考查。',
          '文学常识：老舍的原名、字号、称号与代表作，汪曾祺的师承与流派，是必考内容。',
          '细节描写及其作用：结合《我的母亲》《金岳霖先生》中的细节分析人物形象。',
          '人物形象分析：母亲的勤俭诚实、软中带硬，金岳霖的天真率直、重情重义，须结合具体情节作答。',
          '字音字形与词语运用：殷勤、筹划、撮土、款待等字词，以及成语在语境中的运用。',
          '选材与组材：围绕中心选材、详略安排、线索与照应，常以写作题或选择题出现。'],
        memorize: ['记叙文六要素：时间、地点、人物，起因、经过、结果。',
          '记叙顺序：顺叙、倒叙、插叙、补叙。',
          '倒叙设置悬念、吸引读者；插叙补充交代、丰富形象。',
          '第一人称真实亲切，第三人称自由灵活。',
          '老舍，原名舒庆春，字舍予，「人民艺术家」，代表作《骆驼祥子》《茶馆》。',
          '《我的母亲》以日常琐事塑造母亲形象：勤俭诚实、软中带硬，善用细节描写。',
          '汪曾祺师从沈从文，京派作家；《金岳霖先生》善用白描，以小见大。',
          '选材要围绕中心、真实典型；组材要详略得当、线索清晰。'],
        practiceUrl: '',
        questions: [
          { type:'choice', difficulty:'base', q:'记叙文的六要素是____。', options:['时间、地点、人物、原因、经过、结果','时间、地点、人物、起因、经过、结果','人物、事件、环境、起因、高潮、结局','时间、地点、人物、开端、发展、高潮'], answer:1, explain:'六要素指时间、地点、人物和事件的起因、经过、结果；「原因」表述不准确，「开端、发展、高潮」是情节结构而非要素。' },
          { type:'choice', difficulty:'base', q:'老舍原名____。', options:['周树人','沈雁冰','舒庆春','李尧棠'], answer:2, explain:'老舍原名舒庆春，字舍予；周树人是鲁迅，沈雁冰是茅盾，李尧棠是巴金，注意区分。' },
          { type:'judge', difficulty:'base', q:'《我的母亲》一文通过日常琐事塑造了一位勤俭诚实、软中带硬的母亲形象。', answer:true, explain:'课文借缝洗衣物、筹钱供学、送别儿子等琐事写人，母亲外柔内刚，软中带硬。' },
          { type:'choice', difficulty:'base', q:'记叙文常见的记叙顺序不包括____。', options:['论叙','顺叙','倒叙','插叙'], answer:0, explain:'记叙顺序有顺叙、倒叙、插叙、补叙四种，「论叙」是生造出来的干扰项。' },
          { type:'choice', difficulty:'base', q:'汪曾祺师从的作家是____。', options:['鲁迅','老舍','巴金','沈从文'], answer:3, explain:'汪曾祺是沈从文的学生，京派作家代表，小说有《受戒》《大淖记事》等。' },
          { type:'choice', difficulty:'base', q:'下列词语中加点字注音有误的一项是____。', options:['殷勤（yīn）','筹划（chóu）','撮土（chuō）','挂念（guà）'], answer:2, explain:'「撮土」的「撮」应读cuō，意为聚拢；其余注音均正确。' },
          { type:'judge', difficulty:'base', q:'倒叙就是把事件的全部内容按时间先后完全反过来写。', answer:false, explain:'倒叙只是把结局或最突出的片段提到开头，之后仍按顺叙展开，并非整篇倒过来写。' },
          { type:'choice', difficulty:'base', q:'以第一人称「我」叙述的主要好处是____。', options:['真实亲切，便于抒发感情','不受时空限制，自由灵活','能写进所有人物的内心','可以任意虚构故事情节'], answer:0, explain:'第一人称给人亲历感，真实亲切、便于抒情；「不受时空限制」是第三人称的优点。' },
          { type:'choice', difficulty:'mid', q:'《我的母亲》塑造母亲形象最主要的手法是____。', options:['通过激烈的矛盾冲突刻画','通过日常琐事和细节描写刻画','通过大段的心理独白刻画','通过众人的议论评价刻画'], answer:1, explain:'老舍不写惊天动地的大事，而是借洗衣、筹学费、送别等琐事与细节，于平凡中见伟大母爱。' },
          { type:'choice', difficulty:'base', q:'《金岳霖先生》的作者是____。', options:['老舍','沈从文','汪曾祺','朱自清'], answer:2, explain:'本文作者汪曾祺，金岳霖是他在西南联大求学时的老师，文章为回忆恩师的散文。' },
          { type:'judge', difficulty:'mid', q:'插叙的内容一旦插入，文章的叙述就不再回到原来的线索上。', answer:false, explain:'插叙是暂时中断主线，插入的相关内容结束后，叙述仍回到原来的中心事件上。' },
          { type:'choice', difficulty:'base', q:'下列词语书写完全正确的一项是____。', options:['就序　殷勤　筹划','联落　刮痧　勤俭','侯补　款待　推拿','筹备　私塾　惦念'], answer:3, explain:'「就序」应为「就绪」，「联落」应为「联络」，「侯补」应为「候补」，只有D项书写全部正确。' },
          { type:'choice', difficulty:'base', q:'《我的母亲》中母亲「软中带硬」的「硬」主要体现在____。', options:['对儿女要求严厉苛刻','在刺刀下、饥荒中保护儿女，坚韧不屈','与人争吵毫不退让','拒绝一切亲友的求助'], answer:1, explain:'母亲待人宽厚是「软」，在兵荒马乱中挺身而出保护全家是「硬」，体现外柔内刚。' },
          { type:'choice', difficulty:'mid', q:'某文开头先写母亲去世多年后「我」对母亲的深切思念，再转入对母亲生前事迹的回忆，这种记叙顺序是____。', options:['倒叙','顺叙','补叙','分叙'], answer:0, explain:'先把后面的内容（如今的思念）提到开头，再按时间回忆往事，属倒叙；「分叙」不是记叙顺序的种类。' },
          { type:'judge', difficulty:'base', q:'第三人称叙述不受时间和空间的限制，能够比较自由灵活地反映客观内容。', answer:true, explain:'第三人称以旁观者身份叙述，视角开阔、自由灵活，便于全方位刻画人物。' },
          { type:'choice', difficulty:'base', q:'在叙述中心事件的过程中插入一段相关回忆，随后又回到原来的线索，这种写法是____。', options:['顺叙','倒叙','补叙','插叙'], answer:3, explain:'暂时中断主线插入相关情节、写完再回到主线，是插叙的典型特征；补叙多在篇末作补充交代。' },
          { type:'choice', difficulty:'base', q:'白描手法的特点是____。', options:['辞藻华丽，浓墨重彩','多用比喻拟人，铺陈渲染','用简练的笔墨勾勒形象，不加烘托渲染','大量运用排比对偶'], answer:2, explain:'白描原指国画中只用墨线勾勒的技法，文学上指用极简练的文字勾勒形象，《金岳霖先生》即善用此法。' },
          { type:'judge', difficulty:'mid', q:'《金岳霖先生》写金先生与斗鸡同桌进餐等小事，是以小见大表现人物的天真率直。', answer:true, explain:'文章选取生活琐事，于细微处见精神，正是以小见大的写法。' },
          { type:'choice', difficulty:'base', q:'下列句子中加点成语使用恰当的一项是____。', options:['母亲对客人总是热情款待，让客人感到坐立不安','金岳霖先生做起学问来一丝不苟，令人敬佩','母亲终年劳碌，手上的裂口栩栩如生','听了我的话，母亲忍俊不禁地哭了起来'], answer:1, explain:'「坐立不安」形容心情焦虑，不用于待客；「栩栩如生」形容艺术形象逼真，不能写伤口；「忍俊不禁」指忍不住笑，与哭矛盾。' },
          { type:'choice', difficulty:'mid', q:'《我的母亲》写母亲的手「终年是鲜红微肿的」，这一细节描写的作用是____。', options:['以小见大，表现母亲终年劳作的辛苦','交代母亲患有疾病','说明当时天气寒冷','表现母亲不爱惜身体'], answer:0, explain:'一双红肿的手凝结了母亲终年洗衣劳作的艰辛，细节虽小，母爱与辛劳自见，属以小见大。' },
          { type:'choice', difficulty:'base', q:'「她的词汇不多，但说起话来总是那么得体。」句中「得体」的意思是____。', options:['得到好处','身体健壮','打扮时髦','言语行动得当，恰如其分'], answer:3, explain:'「得体」指言语行动恰如其分，符合场合与身份；其余义项均不合语境。' },
          { type:'judge', difficulty:'base', q:'老舍因话剧《龙须沟》的创作被授予「人民艺术家」的称号。', answer:true, explain:'1951年老舍因《龙须沟》获「人民艺术家」称号，其代表作还有《骆驼祥子》《茶馆》等。' },
          { type:'choice', difficulty:'base', q:'下列句子没有语病的一项是____。', options:['通过阅读《我的母亲》，使我懂得了母爱的伟大','母亲的手之所以终年鲜红微肿，是因为终年洗衣劳作的原因','金岳霖先生天真率直的性格，给同学们留下了深刻的印象','我们要学习和发扬老一辈学者的优良作风和品质'], answer:2, explain:'A项「通过」与「使」并用导致主语残缺；B项「之所以」与「的原因」句式杂糅；D项「发扬」与「品质」搭配不当。' },
          { type:'choice', difficulty:'base', q:'下列作品中，不属于老舍代表作的一项是____。', options:['《骆驼祥子》','《受戒》','《茶馆》','《四世同堂》'], answer:1, explain:'《受戒》是汪曾祺的小说；其余三项均为老舍代表作。' },
          { type:'judge', difficulty:'mid', q:'《我的母亲》采用第三人称叙述，因此能够自由灵活地描写母亲的内心世界。', answer:false, explain:'课文以第一人称「我」回忆母亲，真实亲切；「我」只能写母亲的言行与自己的感受，不能直接深入母亲内心。' },
          { type:'judge', difficulty:'high', q:'《金岳霖先生》通篇运用夸张与讽刺，塑造了一位迂腐可笑的旧式学究形象。', answer:false, explain:'文章用的是白描而非夸张讽刺；金先生天真、有趣、重情，作者带着温情与敬意回忆恩师，绝非嘲笑。' },
          { type:'choice', difficulty:'high', q:'下列对《我的母亲》的赏析，不正确的一项是____。', options:['以时间为序组织材料，脉络清晰','借日常琐事写人，于平凡中见伟大','细节描写真切感人，语言朴素自然','全文浓墨重彩、辞藻华丽，极力铺陈渲染'], answer:3, explain:'老舍此文语言朴素自然、不假雕饰，靠琐事与细节打动人；「浓墨重彩、辞藻华丽」恰恰与其风格相反。' },
          { type:'choice', difficulty:'base', q:'记叙文选材的基本要求是____。', options:['围绕中心选择真实、典型的材料','材料越多越好，不必取舍','只选名人名言与重大事件','选材与中心无关才显得新颖'], answer:0, explain:'选材须服从中心，贵在真实、典型、新颖，以小见大；堆砌材料或与中心无关都是误区。' },
          { type:'choice', difficulty:'base', q:'《金岳霖先生》中，金先生为林徽因的生日请客吃饭，这一细节表现了他____。', options:['爱慕虚荣，讲究排场','生活奢侈，不拘小节','重情重义，怀念故友','性格古怪，不近人情'], answer:2, explain:'林徽因去世多年，金先生仍郑重纪念她的生日，足见其重情重义、一片赤子之心。' },
          { type:'choice', difficulty:'high', q:'下列对两篇文章的比较，不正确的一项是____。', options:['两文都通过琐事细节写人，以小见大','《我的母亲》饱含深情，语言朴素自然','《金岳霖先生》善用白描，笔调幽默而温情','两文都用第三人称全方位展示人物内心'], answer:3, explain:'两文均为第一人称回忆性散文，靠言行细节刻画人物，而非第三人称全方位展示内心。' }

      { title: '第八单元　应用文写作',
        sections: ['便条：请假条、留言条、托事条',
          '单据：借条、收条、欠条、领条',
          '专用书信：感谢信、慰问信、求职信、申请书',
          '通知',
          '启事：寻物启事、招领启事、招聘启事',
          '计划',
          '总结',
          '写作训练：常用应用文修改'],
        knowledge: ['应用文是国家机关、企事业单位和人民群众处理事务、交流信息时经常使用的文体，具有实用性强、格式相对固定、语言简明得体的特点。',
          '应用文的一般格式包括标题、称呼、正文、祝颂语（结语）、署名、日期等部分，不同文种略有差异。',
          '便条是简便的书信，常见的有请假条、留言条、托事条，格式为标题、称呼、正文、祝颂语、署名、日期。',
          '请假条正文要写明请假原因和请假起止时间，请假时间较长或病假时应附有关证明。',
          '留言条用于走访不遇或不能当面说明情况时，托事条用于托人办事，二者正文都要把事情写得简明清楚。',
          '单据是具有凭证作用的条据，常见的有借条、收条、欠条、领条，格式为第一行居中写名称，正文写明钱物名称与数量，末尾署名并写日期。',
          '单据中钱物的数量必须用大写数字（壹贰叁肆伍陆柒捌玖拾佰仟万），并在数字后面加上「整」字，以防涂改。',
          '借条是向他人或单位借入钱物时所写，要写明归还日期；收条是收到他人交来的钱物时所写；欠条是因拖欠钱物而立；领条是领取钱物时写给发放方的凭证。',
          '专用书信指有特定用途的书信，常见的有感谢信、慰问信、求职信、申请书等。',
          '专用书信的格式为标题、称呼、正文、祝颂语、署名、日期；祝颂语「此致」空两格写在正文之后，「敬礼」另起一行顶格写。',
          '通知的格式包括标题、主送单位（对象）、正文、落款；正文要写明时间、地点、事项、要求，做到周知无误。',
          '通知按内容和用途可分为会议通知、活动通知、任免通知、批转性通知等，语言要求简明准确。',
          '启事是单位或个人有事向公众说明或请求帮助时使用，常见的有寻物启事、招领启事、招聘启事；启事面向公众，一般没有主送对象，这是它与通知的重要区别。',
          '计划的结构包括标题、正文和落款；正文一般写明目标（做什么）、措施（怎么做）、步骤（分几步、何时完成）。',
          '总结的结构包括标题、正文和落款；正文一般写基本情况、成绩与经验、问题与教训、今后打算，要求实事求是、一分为二。',
          '应用文语言要求准确、简明、平实、得体：用词准确不产生歧义，表述简明不啰嗦，语体平实不浮夸，措辞得体合乎身份与场合。'],
        examPoints: ['「此致」空两格、「敬礼」另起一行顶格，是专用书信格式考查与改错的高频考点。',
          '借条、收条等单据中金额必须大写并加「整」字，常考规范书写与改错。',
          '通知与启事的辨析：通知有明确主送对象，启事面向公众、无称呼，常以选择题形式考查。',
          '计划正文的目标、措施、步骤三要素与总结正文的内容构成，常以填空、选择形式考查。',
          '便条格式六要素（标题、称呼、正文、祝颂语、署名、日期）的识记与默写。',
          '落款顺序为先署名后日期，署名与日期分行书写，是改错题常见设错点。',
          '给出情境选择恰当文种（如拾到物品写招领启事、借入钱物写借条），是对口升学常见题型。',
          '应用文格式改错题：在一段应用文中找出标题、称呼、祝颂语、落款等处的错误并改正。'],
        memorize: ['便条格式口诀：标题称呼正文，祝颂署名日期。',
          '此致敬礼记心间：此致空两格，敬礼顶格写。',
          '单据钱物须大写，数字后面加「整」字。',
          '借入钱物写借条，收到钱物写收条，领取写领条，拖欠写欠条。',
          '通知四要素：标题、主送、正文、落款；正文写清时间地点事项。',
          '启事面向公众无称呼，通知发往对象有主送。',
          '计划写目标、措施、步骤；总结写情况、经验、教训、打算。',
          '应用文语言八字诀：准确、简明、平实、得体。'],
        practiceUrl: '',
        questions: [
          { type:'choice', difficulty:'base', q:'便条写作必须具备的格式要素是____。', options:['标题、称呼、正文、祝颂语、署名、日期','标题、导语、正文、结语、署名、日期','称呼、正文、插图、落款','标题、正文、附件、编号'], answer:0, explain:'便条格式包括标题、称呼、正文、祝颂语、署名、日期六部分；导语、插图、编号等均非便条要素。' },
          { type:'judge', difficulty:'base', q:'专用书信中「此致」应空两格书写，「敬礼」应另起一行顶格书写。', answer:true, explain:'「此致」接正文后空两格写，「敬礼」另起一行顶格写，这是专用书信祝颂语的规范格式。' },
          { type:'choice', difficulty:'mid', q:'小王在操场拾到一个钱包，想通过张贴文字寻找失主，他应写作____。', options:['寻物启事','通知','招领启事','感谢信'], answer:2, explain:'拾到物品寻找失主用招领启事；丢失物品寻找失物才用寻物启事，二者方向相反，最易混淆。' },
          { type:'choice', difficulty:'base', q:'借条中借款金额「500元」的规范写法是____。', options:['五百元','伍佰元整','500元整','伍百元整'], answer:1, explain:'单据中钱物数目必须用大写数字，「百」的大写是「佰」，并在数字后加「整」字以防涂改。' },
          { type:'judge', difficulty:'base', q:'单据中的钱物数量可以用阿拉伯数字书写，只要写清楚即可。', answer:false, explain:'单据中钱物数量必须大写并加「整」字，用阿拉伯数字容易被涂改，不符合规范。' },
          { type:'choice', difficulty:'base', q:'请假条正文必须写明的内容是____。', options:['家庭成员情况','对单位的意见建议','请假期间的天气情况','请假原因和请假时间'], answer:3, explain:'请假条正文要写清请假原因和请假起止时间，必要时附有关证明，其余各项与请假无关。' },
          { type:'choice', difficulty:'base', q:'会议通知的正文必须写清的要素是____。', options:['会议的历史沿革','与会人员的个人简历','会议的时间、地点和主要事项','会议经费的详细预算'], answer:2, explain:'通知正文要交代清楚时间、地点、事项、要求，让人一看就知道做什么、何时何地参加。' },
          { type:'judge', difficulty:'base', q:'寻物启事要在正文写明丢失物品的名称、特征和联系方式。', answer:true, explain:'写清物品特征与联系方式，拾到者才能核对并联系失主，这是寻物启事正文的基本要求。' },
          { type:'choice', difficulty:'base', q:'启事与通知的一个重要区别是____。', options:['启事面向社会公众，一般没有明确的主送对象；通知有明确的主送单位或人员','启事必须加盖公章，通知不必','启事只能用毛笔书写张贴','通知只能写在红纸上'], answer:0, explain:'启事面向不特定的公众，开头一般没有称呼；通知有明确的主送单位或对象，这是二者的主要区别。' },
          { type:'choice', difficulty:'base', q:'应用文末尾落款的正确顺序是____。', options:['先写日期，再写署名','先写署名，再写日期','署名与日期写在同一行即可','只需署名，不必写日期'], answer:1, explain:'落款先署名（单位名称），另起一行写明日期，署名在上、日期在下，这是应用文的通行格式。' },
          { type:'choice', difficulty:'base', q:'计划正文一般应包括的三部分内容是____。', options:['称谓、问候、祝颂','导语、主体、背景','标题、落款、附件','目标、措施、步骤'], answer:3, explain:'计划正文要写清做什么（目标）、怎么做（措施）、何时完成（步骤），即目标、措施、步骤三要素。' },
          { type:'judge', difficulty:'base', q:'计划正文一般要写明目标、措施、步骤三个部分。', answer:true, explain:'目标回答做什么，措施回答怎么做，步骤回答分几步何时完成，三者是计划正文的基本内容。' },
          { type:'choice', difficulty:'base', q:'总结正文通常不包括下列哪一项内容？', options:['基本情况与主要成绩','经验体会','问题与教训','虚构夸张的情节'], answer:3, explain:'总结要求实事求是，包括基本情况、成绩经验、问题教训、今后打算；虚构夸张恰恰违背总结的写作要求。' },
          { type:'judge', difficulty:'mid', q:'写总结时为了突出成绩，可以只摆成绩、回避存在的问题。', answer:false, explain:'总结要一分为二，既肯定成绩与经验，也找出问题与教训，只报喜不报忧不符合写作要求。' },
          { type:'choice', difficulty:'base', q:'下列各项中，最能体现应用文区别于文学作品的特点是____。', options:['讲究虚构与想象','实用性强，格式相对固定','追求辞藻华丽','以抒发个人情感为主'], answer:1, explain:'应用文以实用为目的，有相对固定的格式，语言简明得体；虚构、华丽辞藻是文学创作的特点。' },
          { type:'choice', difficulty:'base', q:'应用文的语言要求是____。', options:['准确、简明、平实、得体','华丽、夸张、含蓄、幽默','晦涩、深奥、新奇、独特','随意堆砌、照搬口语'], answer:0, explain:'应用文语言要求准确、简明、平实、得体，便于读者快速理解并据以办事。' },
          { type:'judge', difficulty:'base', q:'感谢信、慰问信、求职信、申请书都属于专用书信。', answer:true, explain:'专用书信指有特定用途的书信，常见的有感谢信、慰问信、求职信、申请书等，格式大致相同。' },
          { type:'choice', difficulty:'mid', q:'感谢信中「此致」与「敬礼」的正确写法是____。', options:['「此致」顶格，「敬礼」空两格','「此致」「敬礼」写在同一行','「此致」「敬礼」均可省略不写','「此致」空两格，「敬礼」另起一行顶格'], answer:3, explain:'「此致」接正文之后空两格书写，「敬礼」另起一行顶格书写，位置颠倒或不换行都是常见错误。' },
          { type:'choice', difficulty:'base', q:'小李从学校总务处领到劳动工具，他应写给总务处的单据是____。', options:['借条','收条','领条','欠条'], answer:2, explain:'从单位领取钱物时写给发放方的单据叫领条；借条是借入时写，收条是收到他人钱物时写，注意区分。' },
          { type:'choice', difficulty:'base', q:'借条的正文中除写明所借钱物的名称、数量外，还应写明____。', options:['归还日期','借用人家庭成员','出借人的收入情况','双方的兴趣爱好'], answer:0, explain:'借条要写明钱物名称、数量（大写）、归还日期，最后署名并写日期，这样才完整规范。' },
          { type:'choice', difficulty:'high', q:'小张向学校图书馆借用一套工具书，管理员要求他出具书面凭证。下列做法正确的一项是____。', options:['写一张收条，金额用小写数字','写一张借条，写明所借书名、数量、归还日期，数目大写并签名写日期','写一份计划，说明使用安排','写一封慰问信表示感谢'], answer:1, explain:'借入物品应用借条；钱物数量要大写，并写明归还日期、署名、写日期；收条是收到归还时出具的，计划、慰问信均不合情境。' },
          { type:'choice', difficulty:'base', q:'寻物启事的正文不必写明的内容是____。', options:['丢失物品的名称与特征','联系方式','对拾到者的严厉指责','丢失的大致时间与地点'], answer:2, explain:'寻物启事要写清物品特征、丢失时间地点和联系方式；语气应恳切礼貌，指责警告既不得体也不利于找回失物。' },
          { type:'judge', difficulty:'mid', q:'招领启事中应把拾到钱物的具体数额、详细特征写得越具体越好，方便失主辨认。', answer:false, explain:'招领启事宜只写物品的大致情况，具体数额与细节由失主前来核对时说明，以防冒领。' },
          { type:'choice', difficulty:'mid', q:'借条与欠条的主要区别是____。', options:['借条用钢笔写，欠条用铅笔写','借条不必写日期，欠条必须写日期','借条因借入钱物而立据，欠条因拖欠钱物而立据','二者没有任何区别，可以通用'], answer:2, explain:'借条证明借贷关系，欠条证明拖欠关系（如赊购货物）；立据原因不同，不能混用。' },
          { type:'choice', difficulty:'base', q:'通知的落款包括____。', options:['主送单位名称','正文与祝颂语','附件清单','发文单位名称和发文日期'], answer:3, explain:'通知落款在正文右下方写明发文单位名称和发文日期；主送单位写在正文之前，不属于落款。' },

          { type:'choice', difficulty:'base', q:'M受体激动时不会出现下列哪项效应', options:['心率减慢','平滑肌收缩','腺体分泌减少','瞳孔缩小'], answer:2, explain:'M受体激动表现为心脏抑制（心率减慢）、平滑肌收缩、腺体分泌增加、瞳孔缩小。腺体分泌减少不是M受体激动的效应。' },
          { type:'choice', difficulty:'mid', q:'有机磷酸酯类中毒时应采取的正确解救措施是', options:['单用阿托品','单用碘解磷定','阿托品与碘解磷定合用','大量输液加速排泄'], answer:2, explain:'有机磷中毒需阿托品对抗M样症状，同时合用碘解磷定恢复胆碱酯酶活性，两者合用才能彻底解救。单用任何一种均不够。' },
          { type:'judge', difficulty:'base', q:'去甲肾上腺素可作皮下或肌内注射给药。', answer:false, explain:'去甲肾上腺素强烈收缩血管，皮下或肌内注射可致局部组织缺血坏死，只能静脉滴注给药。' },
          { type:'choice', difficulty:'base', q:'新斯的明临床主要用于下列哪种疾病', options:['青光眼','重症肌无力','高血压','心律失常'], answer:1, explain:'新斯的明为抗胆碱酯酶药，临床主要用于重症肌无力、术后腹胀气和尿潴留。青光眼用毛果芸香碱，不要混淆。' },
          { type:'choice', difficulty:'base', q:'阿托品对眼的作用表现为', options:['缩瞳、降低眼内压','扩瞳、升高眼内压','缩瞳、升高眼内压','扩瞳、降低眼内压'], answer:1, explain:'阿托品为M受体阻断药，阻断瞳孔括约肌M受体使瞳孔扩大，虹膜向周边退缩前房角变窄，眼内压升高，故禁用于青光眼。' },
          { type:'judge', difficulty:'base', q:'阿托品禁用于青光眼患者。', answer:true, explain:'阿托品扩瞳、升高眼内压，可使青光眼患者病情加重甚至失明，因此青光眼是阿托品的禁忌证。' },
          { type:'choice', difficulty:'mid', q:'下列关于毛果芸香碱与阿托品对眼作用的比较，正确的是', options:['两者均可治疗青光眼','两者均可扩瞳','毛果芸香碱缩瞳降眼压，阿托品扩瞳升眼压','阿托品缩瞳降眼压，毛果芸香碱扩瞳升眼压'], answer:2, explain:'毛果芸香碱激动M受体缩瞳降眼压治青光眼；阿托品阻断M受体扩瞳升眼压禁青光眼。二者对眼的作用正好相反，常对比考查。' },
          { type:'choice', difficulty:'base', q:'抢救过敏性休克的首选药物是', options:['去甲肾上腺素','肾上腺素','异丙肾上腺素','多巴胺'], answer:1, explain:'肾上腺素激动α、β受体，能迅速收缩血管、兴奋心脏、缓解支气管痉挛，是抢救过敏性休克的首选药。' },
          { type:'judge', difficulty:'base', q:'普萘洛尔可用于支气管哮喘患者以缓解喘息症状。', answer:false, explain:'普萘洛尔为非选择性β受体阻断药，阻断支气管平滑肌β₂受体可诱发或加重哮喘，支气管哮喘患者禁用。' },
          { type:'choice', difficulty:'base', q:'去甲肾上腺素的主要临床应用是', options:['支气管哮喘','升压和抗休克','心律失常','青光眼'], answer:1, explain:'去甲肾上腺素主要激动α受体，使全身血管收缩、血压升高，临床用于升压和抗休克。' },
          { type:'choice', difficulty:'base', q:'异丙肾上腺素的突出药理作用是', options:['阻断α受体','阻断β受体','激动β受体','激动M受体'], answer:2, explain:'异丙肾上腺素主要激动β受体，使心脏兴奋、支气管平滑肌松弛，用于平喘、房室传导阻滞及心脏骤停。' },
          { type:'judge', difficulty:'mid', q:'异丙肾上腺素可用于治疗房室传导阻滞。', answer:true, explain:'异丙肾上腺素激动心脏β₁受体，能加快房室传导，临床可用于治疗房室传导阻滞和心脏骤停。' },
          { type:'choice', difficulty:'base', q:'多巴胺抗休克的特点是', options:['收缩肾血管减少尿量','激动多巴胺受体扩张肾血管增加肾血流量','阻断β受体降低心率','阻断α受体降低血压'], answer:1, explain:'多巴胺除激动β₁受体外，还能激动肾血管多巴胺受体使肾血管扩张、肾血流量增加，这是其抗休克的重要特点。' },
          { type:'choice', difficulty:'base', q:'去甲肾上腺素能神经兴奋时，其末梢释放的递质是', options:['乙酰胆碱','多巴胺','肾上腺素','去甲肾上腺素'], answer:3, explain:'去甲肾上腺素能神经兴奋时释放去甲肾上腺素；释放乙酰胆碱的是胆碱能神经，神经与递质要一一对应记忆。' },
          { type:'judge', difficulty:'base', q:'肾上腺素与局麻药配伍，可延缓局麻药吸收并延长麻醉时间。', answer:true, explain:'肾上腺素收缩注射部位血管，可延缓局麻药吸收、延长麻醉时间并减少吸收中毒；但手指、足趾等末梢部位麻醉时不宜加用。' },
          { type:'choice', difficulty:'mid', q:'阿托品常见的不良反应是', options:['嗜睡、乏力','口干、视物模糊、心悸','支气管哮喘发作','骨骼肌震颤'], answer:1, explain:'阿托品阻断M受体，治疗量常见口干、视物模糊、心悸、皮肤干燥潮红等不良反应，停药后可自行消失。' },
          { type:'choice', difficulty:'high', q:'患者注射青霉素后突发胸闷、呼吸困难、血压下降，诊断为过敏性休克，应立即首选', options:['静脉滴注去甲肾上腺素','皮下注射普萘洛尔','皮下或肌内注射肾上腺素','静脉注射酚妥拉明'], answer:2, explain:'过敏性休克首选肾上腺素皮下或肌内注射，能迅速升高血压、缓解支气管痉挛。去甲肾上腺素不作首选，普萘洛尔会加重病情。' },
          { type:'judge', difficulty:'mid', q:'碘解磷定能直接对抗有机磷中毒的M样症状，可单独替代阿托品解救中毒。', answer:false, explain:'碘解磷定只能使被抑制的胆碱酯酶复活、解除N样症状，不能直接对抗M样症状，故必须与阿托品合用，不能单独替代。' },
          { type:'choice', difficulty:'base', q:'去甲肾上腺素静脉滴注时药液外漏致局部组织缺血坏死，应局部浸润注射', options:['酚妥拉明','肾上腺素','阿托品','多巴胺'], answer:0, explain:'酚妥拉明阻断α受体、扩张血管，局部浸润注射可对抗去甲肾上腺素外漏所致的局部组织缺血坏死。' },
          { type:'choice', difficulty:'base', q:'普萘洛尔禁用于下列哪种患者', options:['高血压','心绞痛','心律失常','支气管哮喘'], answer:3, explain:'普萘洛尔阻断支气管平滑肌β₂受体，可诱发或加重支气管哮喘，故支气管哮喘患者禁用；高血压、心绞痛、心律失常恰是其适应证。' },
          { type:'choice', difficulty:'high', q:'患者感染性休克，血压下降且尿量明显减少，宜选用的抗休克药物是', options:['去甲肾上腺素','普萘洛尔','阿托品','多巴胺'], answer:3, explain:'多巴胺能激动多巴胺受体扩张肾血管、增加尿量，最适合伴尿量减少的休克患者；去甲肾上腺素收缩肾血管，会加重少尿。' },
          { type:'judge', difficulty:'base', q:'大剂量阿托品可扩张血管、改善微循环，用于感染中毒性休克。', answer:true, explain:'大剂量阿托品可解除小血管痉挛、扩张血管、改善微循环，故可用于感染中毒性休克，但需注意其不良反应。' },
          { type:'choice', difficulty:'base', q:'酚妥拉明属于', options:['β受体阻断药','M受体阻断药','α受体阻断药','胆碱酯酶抑制药'], answer:2, explain:'酚妥拉明为α受体阻断药，可扩张血管、降低血压，临床用于外周血管痉挛性疾病及诊治嗜铬细胞瘤。' },
          { type:'choice', difficulty:'base', q:'有机磷酸酯类中毒时，用于迅速对抗M样症状的药物是', options:['阿托品','碘解磷定','肾上腺素','新斯的明'], answer:0, explain:'阿托品阻断M受体，可迅速缓解有机磷中毒的M样症状；碘解磷定的作用是恢复胆碱酯酶活性，不能直接对抗M样症状。' },
          { type:'choice', difficulty:'mid', q:'新斯的明禁用于', options:['重症肌无力','术后腹胀气','术后尿潴留','机械性肠梗阻'], answer:3, explain:'新斯的明能兴奋胃肠道平滑肌，机械性肠梗阻时使用会加重病情甚至导致肠穿孔，故禁用；其余三项均为其适应证。' },
          { type:'choice', difficulty:'high', q:'患者手指遇冷后苍白、发紫伴疼痛，诊断为外周血管痉挛性疾病，宜选用', options:['酚妥拉明','肾上腺素','去甲肾上腺素','毛果芸香碱'], answer:0, explain:'酚妥拉明阻断α受体、扩张外周血管，适用于雷诺病等外周血管痉挛性疾病；肾上腺素和去甲肾上腺素收缩血管，会加重病情。' },
          { type:'choice', difficulty:'base', q:'阿托品用作麻醉前给药的主要目的是', options:['镇痛','催眠','预防感染','抑制呼吸道腺体分泌'], answer:3, explain:'阿托品抑制唾液腺和呼吸道腺体分泌，麻醉前给药可防止术中分泌物阻塞呼吸道及吸入性肺炎。' },
          { type:'choice', difficulty:'base', q:'心搏骤停抢救时常选用的药物是', options:['肾上腺素','阿托品','普萘洛尔','酚妥拉明'], answer:0, explain:'肾上腺素能直接兴奋心脏，是心搏骤停抢救的常用药物；普萘洛尔抑制心脏，作用正好相反。' }

          { type:'judge', difficulty:'base', q:'麻醉乙醚的诱导期和苏醒期较长，且对呼吸道有刺激性。', answer:true, explain:'麻醉乙醚麻醉分期明显、肌松完全，但诱导期和苏醒期长，对呼吸道黏膜有刺激性，这是其主要缺点。' },
          { type:'choice', difficulty:'base', q:'下列属于吸入麻醉药的是', options:['氯胺酮','丙泊酚','麻醉乙醚','普鲁卡因'], answer:2, explain:'麻醉乙醚、氧化亚氮、氟烷类均属吸入麻醉药；氯胺酮、丙泊酚是静脉麻醉药，普鲁卡因是局部麻醉药。' },
          { type:'choice', difficulty:'base', q:'氯胺酮麻醉的突出特点是', options:['产生分离麻醉，意识与痛觉分离','麻醉分期非常明显','只能用于表面麻醉','有抗心律失常作用'], answer:0, explain:'氯胺酮可使患者意识与痛觉分离，表情淡漠、似醒非醒而痛觉消失，称为分离麻醉，是其特征性表现。' },
          { type:'judge', difficulty:'base', q:'氧化亚氮麻醉作用强，可单独用于大手术的麻醉。', answer:false, explain:'氧化亚氮（笑气）麻醉力弱但镇痛好，多与其他全麻药合用，不能单独承担大手术的麻醉。' },
          { type:'choice', difficulty:'base', q:'局部麻醉药的作用机制是', options:['在用药局部可逆性地阻断神经冲动的产生和传导','抑制中枢神经系统使意识消失','阻断骨骼肌神经肌肉接头','收缩局部血管减少出血'], answer:0, explain:'局麻药在用药局部可逆性地阻断神经冲动的产生和传导，使局部痛觉暂时消失，而患者意识保持清醒。' },
          { type:'choice', difficulty:'base', q:'氧化亚氮的俗称是', options:['氟烷','笑气','硫喷妥钠','普鲁卡因'], answer:1, explain:'氧化亚氮俗称笑气，吸入后可致欣快或发笑，麻醉力弱、镇痛好，常与其他全麻药合用。' },
          { type:'choice', difficulty:'base', q:'普鲁卡因不用于', options:['浸润麻醉','传导麻醉','蛛网膜下腔麻醉','表面麻醉'], answer:3, explain:'普鲁卡因毒性小，但穿透力弱、对黏膜穿透差，故不用于表面麻醉；浸润麻醉、传导麻醉和腰麻均可使用。' },
          { type:'judge', difficulty:'base', q:'普鲁卡因穿透力强，是表面麻醉的首选药。', answer:false, explain:'普鲁卡因穿透力弱，不用于表面麻醉；表面麻醉多选用穿透力强的丁卡因或利多卡因。' },
          { type:'choice', difficulty:'base', q:'毒性最大的常用局麻药是', options:['普鲁卡因','丁卡因','利多卡因','布比卡因'], answer:1, explain:'丁卡因毒性最大，故一般不用于浸润麻醉，多用于表面麻醉；普鲁卡因毒性最小，是浸润麻醉首选。' },
          { type:'choice', difficulty:'base', q:'局麻药中加入少量肾上腺素的目的是', options:['增强局麻药的穿透力','防止麻醉药氧化失效','使麻醉药毒性增大','收缩局部血管，延缓吸收，延长麻醉时间'], answer:3, explain:'少量肾上腺素收缩注射部位血管，可延缓局麻药吸收、延长麻醉时间并减少吸收中毒；手指、足趾等末梢部位禁用。' },
          { type:'choice', difficulty:'base', q:'硫喷妥钠在临床上主要用于', options:['表面麻醉','诱导麻醉和基础麻醉','抗心律失常','局部浸润麻醉'], answer:1, explain:'硫喷妥钠起效快、维持时间短，但镇痛差、肌松不完全，故主要用于诱导麻醉和基础麻醉。' },
          { type:'judge', difficulty:'base', q:'局麻药中加入肾上腺素的量越大，麻醉效果越好。', answer:false, explain:'肾上腺素只需少量即可收缩血管、延缓吸收，量过大易引起心悸、血压升高等不良反应，甚至局部缺血坏死，并非越多越好。' },
          { type:'choice', difficulty:'base', q:'下列哪项不属于复合麻醉的内容', options:['麻醉前给药','诱导麻醉','基础麻醉','表面麻醉'], answer:3, explain:'复合麻醉包括麻醉前给药、诱导麻醉、基础麻醉、合用骨骼肌松弛药等；表面麻醉是局部麻醉方法，不属于复合麻醉。' },
          { type:'choice', difficulty:'mid', q:'有「全能局麻药」之称的药物是', options:['普鲁卡因','丁卡因','利多卡因','硫喷妥钠'], answer:2, explain:'利多卡因起效快、穿透力强、作用较强而持久，可用于各种局麻方法，故有「全能局麻药」之称；还可用于抗心律失常。' },
          { type:'choice', difficulty:'base', q:'兼有抗心律失常作用的局麻药是', options:['普鲁卡因','丁卡因','布比卡因','利多卡因'], answer:3, explain:'利多卡因除用于局麻外还可阻滞心肌钠通道，常用于室性心律失常；其余几种局麻药不作抗心律失常用。' },
          { type:'judge', difficulty:'mid', q:'利多卡因既可用作局部麻醉药，又可用作抗心律失常药。', answer:true, explain:'利多卡因是全能局麻药，同时又是常用的抗室性心律失常药，一药两用是常考点。' },
          { type:'choice', difficulty:'base', q:'腰麻是将局麻药液注入', options:['硬膜外腔','皮肤黏膜表面','神经干周围','蛛网膜下腔'], answer:3, explain:'蛛网膜下腔麻醉简称腰麻，药液注入蛛网膜下腔，适用于下腹部和下肢手术。' },
          { type:'choice', difficulty:'base', q:'使用普鲁卡因前应常规', options:['做皮肤过敏试验','快速静脉注射','合用大量肾上腺素','口服给药'], answer:0, explain:'普鲁卡因偶可引起变态反应，用药前须做皮肤过敏试验，阳性者禁用。' },
          { type:'judge', difficulty:'mid', q:'丙泊酚起效快、苏醒迅速而完全，常用于全麻诱导与维持。', answer:true, explain:'丙泊酚起效快、苏醒快且完全，广泛用于全麻诱导和维持，也常用于门诊小手术。' },
          { type:'choice', difficulty:'mid', q:'硬膜外麻醉与腰麻的主要区别是', options:['硬膜外麻醉将药液注入蛛网膜下腔','腰麻适用于颈部手术','硬膜外麻醉药液注入硬膜外腔，适用范围较广','两者的穿刺部位和麻醉范围完全相同'], answer:2, explain:'腰麻药液注入蛛网膜下腔，适用于下腹部及下肢；硬膜外麻醉药液注入硬膜外腔，适用范围广、可连续给药，但技术难度大。' },
          { type:'choice', difficulty:'base', q:'浸润麻醉常首选的局麻药是', options:['普鲁卡因','丁卡因','氟烷','氯胺酮'], answer:0, explain:'普鲁卡因毒性小、安全性大，是浸润麻醉的首选药；丁卡因毒性大不作浸润麻醉，氟烷、氯胺酮是全麻药。' },
          { type:'judge', difficulty:'mid', q:'硬膜外麻醉是将药液注入蛛网膜下腔。', answer:false, explain:'硬膜外麻醉将药液注入硬膜外腔；注入蛛网膜下腔的是腰麻，二者穿刺部位不同，切勿混淆。' },
          { type:'choice', difficulty:'base', q:'传导麻醉是将局麻药液注射于', options:['蛛网膜下腔','硬膜外腔','神经干或神经丛周围','手术野皮下'], answer:2, explain:'传导麻醉将药液注射于神经干或神经丛周围，阻断神经冲动传导，使其支配区域麻醉，如拔牙时的阻滞麻醉。' },
          { type:'choice', difficulty:'high', q:'患者行手指末节清创缝合术，采用局麻时不宜加用肾上腺素，其原因是', options:['会增强局麻药的毒性','会使麻醉时间过短','局部血管收缩可致指端缺血坏死','可引起心律失常'], answer:2, explain:'手指、足趾、耳廓、阴茎等末梢部位血供单一，加肾上腺素收缩血管可致局部缺血坏死，故这些部位禁用。' },
          { type:'judge', difficulty:'base', q:'复合麻醉是指同时或先后应用两种以上麻醉药或辅助药以达到满意麻醉效果的方法。', answer:true, explain:'复合麻醉包括麻醉前给药、诱导麻醉、基础麻醉、合用肌松药等，可取长补短、减少单一药物的不良反应。' },
          { type:'choice', difficulty:'mid', q:'下列关于普鲁卡因与丁卡因的比较，正确的是', options:['普鲁卡因穿透力强，可用于表面麻醉','丁卡因毒性小，常用于浸润麻醉','普鲁卡因毒性小但穿透力弱，不用于表面麻醉','丁卡因是全能局麻药'], answer:2, explain:'普鲁卡因毒性小、穿透力弱，不用于表面麻醉；丁卡因毒性大、穿透力强，多用于表面麻醉。全能局麻药指利多卡因。' },
          { type:'choice', difficulty:'base', q:'表面麻醉效果最好的常用局麻药是', options:['普鲁卡因','丁卡因','氧化亚氮','硫喷妥钠'], answer:1, explain:'丁卡因穿透力强，表面麻醉效果好，常用于眼、鼻、咽喉黏膜麻醉；普鲁卡因穿透力弱，不宜用于表麻。' },
          { type:'choice', difficulty:'high', q:'患者需行阑尾切除术，要求术中意识清醒、麻醉范围限于下腹部，宜选用的麻醉方法是', options:['全身麻醉','表面麻醉','腰麻','分离麻醉'], answer:2, explain:'腰麻将药液注入蛛网膜下腔，麻醉下腹部和下肢，术中患者意识清醒，适用于阑尾切除等下腹部手术。' },
          { type:'choice', difficulty:'high', q:'患儿需行短小手术，要求麻醉起效快、保持咽喉反射、术后苏醒快，宜选用的全麻药是', options:['大剂量硫喷妥钠','氯胺酮','普鲁卡因','乙醚深麻醉'], answer:1, explain:'氯胺酮起效快、可产生分离麻醉，且咽喉反射不轻易消失，常用于小儿短小手术和体表手术；普鲁卡因是局麻药，不符合题意。' }
        ]
      },
      { title: '第4章　中枢神经系统药物',
        sections: [

          '第五节　镇痛药',
          '第六节　解热镇痛抗炎药',
          '第七节　中枢兴奋药'
        ],
        knowledge: [
          '镇静催眠药小剂量镇静、较大剂量催眠，常用药物有苯二氮䓬类（如地西泮）、巴比妥类（如苯巴比妥）和水合氯醛等。',
          '地西泮（安定）具有抗焦虑、镇静催眠、抗惊厥抗癫痫和中枢性肌肉松弛作用，是治疗癫痫持续状态的首选药；静脉注射过快可致呼吸抑制，应缓慢注射。',
          '巴比妥类作用随剂量增大依次为镇静、催眠、抗惊厥、麻醉，过量则抑制呼吸；苯巴比妥常用于癫痫大发作，因不良反应较多，现已较少用于催眠。',
          '水合氯醛催眠作用强，不易蓄积，醒后无后遗效应，临床用于顽固性失眠及小儿高热惊厥等。',
          '苯妥英钠是癫痫大发作和局限性发作的首选药，长期用药可致牙龈增生，应注意口腔卫生。',
          '卡马西平是癫痫精神运动性发作的首选药，对三叉神经痛、舌咽神经痛疗效好；丙戊酸钠为广谱抗癫痫药，对各型癫痫均有效。',
          '乙琥胺仅对癫痫小发作有效，是癫痫小发作的首选药。',
          '抗震颤麻痹药分拟多巴胺类和中枢抗胆碱药两类：左旋多巴是多巴胺的前体药，进入脑内转变为多巴胺发挥作用；苯海索是中枢抗胆碱药，适用于轻症及不能耐受左旋多巴者。',
          '氯丙嗪有安定、镇吐、降温和加强中枢抑制药的作用，能阻断α受体引起血管扩张（可致体位性低血压），阻断M受体引起口干、便秘。',
          '氯丙嗪的镇吐作用强，对药物和疾病引起的各种呕吐均有效，但对晕动症引起的呕吐无效。',
          '氯丙嗪最常见的严重不良反应是锥体外系反应，表现为帕金森综合征、急性肌张力障碍、静坐不能和迟发性运动障碍。',
          '人工冬眠疗法以氯丙嗪、异丙嗪、哌替啶组成冬眠合剂，配合物理降温，用于严重感染、创伤等危重病症的抢救。',
          '吗啡具有强大的镇痛、镇静、抑制呼吸、镇咳、缩瞳、催吐及兴奋平滑肌作用；兴奋胃肠及膀胱平滑肌可致便秘、尿潴留，兴奋胆道平滑肌可加重胆绞痛；临床用于其他镇痛药无效的剧痛及心源性哮喘。',
          '吗啡禁用于分娩止痛、支气管哮喘、肺源性心脏病和颅内压增高患者；抑制呼吸是吗啡中毒致死的主要原因。',
          '吗啡急性中毒表现为昏迷、针尖样瞳孔、呼吸高度抑制、血压下降，可用纳洛酮解救；吗啡反复应用易成瘾，应严格控制使用。',
          '哌替啶（杜冷丁）镇痛作用约为吗啡的1/10，成瘾性较轻、出现较慢，可用于分娩止痛，但产前2~4小时内禁用，以免引起新生儿呼吸抑制。',
          '阿司匹林（乙酰水杨酸）有解热、镇痛、抗炎抗风湿作用，小剂量还能抑制血小板聚集，用于预防血栓形成；不良反应以胃肠道反应最常见，大剂量可致水杨酸反应，偶见过敏反应，儿童病毒感染发热禁用以防瑞夷综合征。',
          '对乙酰氨基酚（扑热息痛）解热镇痛作用强而抗炎抗风湿作用极弱，不良反应少，但一次大剂量应用可致肝坏死。',
          '中枢兴奋药主要兴奋中枢神经系统：尼可刹米直接兴奋呼吸中枢，用于各种原因引起的中枢性呼吸抑制；咖啡因主要兴奋大脑皮层，可提神醒脑、对抗中枢抑制。'

          '氯丙嗪镇吐作用强但对晕动症呕吐无效，是易错点；氯丙嗪阻断α受体可致体位性低血压，发生低血压时不能用肾上腺素升压。',
          '氯丙嗪锥体外系反应的表现（帕金森综合征、急性肌张力障碍、静坐不能、迟发性运动障碍）是最常见的严重不良反应，常考。',

          '吗啡急性中毒表现「昏迷、针尖样瞳孔、呼吸抑制、血压下降」，特效解救药纳洛酮，是必考点。',
          '哌替啶镇痛力为吗啡的1/10、成瘾性较轻，可用于分娩止痛但产前2~4小时禁用，常与吗啡对比考查。',
          '阿司匹林胃肠道反应最常见，小剂量抑制血小板聚集防血栓；禁用于消化性溃疡、血友病、哮喘患者，儿童病毒感染发热禁用以防瑞夷综合征，是高频考点。'

          '巴比妥剂量递增：镇静、催眠、抗惊厥、麻醉、抑制呼吸。',

          '抗震颤麻痹：左旋多巴补多巴胺，苯海索抗胆碱。',
          '氯丙嗪三抗：安定镇吐又降温；晕动呕吐它无效，体位低血压防跌倒。',

          '阿司匹林解热镇痛防血栓，胃肠反应最常见；溃疡血友哮喘禁用；扑热息痛少抗炎，过量伤肝。'

        practiceUrl: '',
        questions: [
          { type:'choice', difficulty:'base', q:'治疗癫痫持续状态的首选药是', options:['苯妥英钠','地西泮','苯巴比妥','乙琥胺'], answer:1, explain:'地西泮静脉注射是治疗癫痫持续状态的首选药，起效快、安全性较大；苯妥英钠是癫痫大发作的首选药，注意二者区别。' },
          { type:'choice', difficulty:'base', q:'苯妥英钠长期应用最常见的不良反应是', options:['牙龈增生','锥体外系反应','肝坏死','水杨酸反应'], answer:0, explain:'苯妥英钠长期用药可致牙龈增生，多见于青少年，应注意口腔卫生；锥体外系反应见于氯丙嗪，水杨酸反应见于阿司匹林。' },
          { type:'judge', difficulty:'base', q:'地西泮静脉注射过快可引起呼吸抑制，故注射速度宜缓慢。', answer:true, explain:'地西泮静脉注射过快可抑制呼吸中枢，临床用于癫痫持续状态时应缓慢静注，并密切观察呼吸变化。' },
          { type:'choice', difficulty:'base', q:'氯丙嗪最常见且较严重的不良反应是', options:['水杨酸反应','瑞夷综合征','锥体外系反应','牙龈增生'], answer:2, explain:'氯丙嗪阻断黑质-纹状体通路的多巴胺受体，可引起锥体外系反应，表现为帕金森综合征、急性肌张力障碍、静坐不能和迟发性运动障碍。' },
          { type:'choice', difficulty:'base', q:'癫痫小发作的首选药是', options:['乙琥胺','苯妥英钠','卡马西平','左旋多巴'], answer:0, explain:'乙琥胺仅对癫痫小发作有效，是小发作的首选药；大发作首选苯妥英钠，精神运动性发作首选卡马西平，不要混淆。' },
          { type:'judge', difficulty:'base', q:'吗啡镇痛作用强大，可用于分娩止痛。', answer:false, explain:'吗啡能通过胎盘抑制新生儿呼吸，并可延长产程，禁用于分娩止痛；分娩止痛可选用成瘾性较轻的哌替啶，但产前2~4小时内禁用。' },
          { type:'choice', difficulty:'mid', q:'关于氯丙嗪镇吐作用的叙述，正确的是', options:['对各种呕吐均有效，但对晕动症呕吐无效','对晕动症引起的呕吐效果最佳','仅对胃肠炎引起的呕吐有效','氯丙嗪无镇吐作用'], answer:0, explain:'氯丙嗪镇吐作用强，对药物、疾病等引起的呕吐均有效，但对晕动症（晕车、晕船）引起的呕吐无效，这是易错点。' },
          { type:'choice', difficulty:'base', q:'吗啡中毒致死的主要原因是', options:['血压下降','昏迷','瞳孔缩小','呼吸抑制'], answer:3, explain:'吗啡抑制呼吸中枢，过量时呼吸高度抑制是致死的主要原因；抢救时除对症治疗外，可用纳洛酮解救。' },
          { type:'judge', difficulty:'mid', q:'氯丙嗪对晕动症引起的呕吐无效。', answer:true, explain:'氯丙嗪对药物及疾病引起的呕吐有效，但对晕动症呕吐无效；防治晕动症宜选用苯海拉明等抗组胺药。' },
          { type:'choice', difficulty:'base', q:'吗啡急性中毒的特效解救药是', options:['尼可刹米','肾上腺素','纳洛酮','阿托品'], answer:2, explain:'纳洛酮是阿片受体阻断药，能迅速解除吗啡中毒时的呼吸抑制，是吗啡等阿片类药物急性中毒的特效解救药。' },
          { type:'choice', difficulty:'base', q:'下列哪项不属于地西泮的作用', options:['抗焦虑','镇静催眠','中枢性肌肉松弛','全身麻醉'], answer:3, explain:'地西泮有抗焦虑、镇静催眠、抗惊厥抗癫痫和中枢性肌肉松弛四大作用，无麻醉作用，不能用于全身麻醉。' },
          { type:'judge', difficulty:'base', q:'阿司匹林不良反应少，消化性溃疡患者可长期放心服用。', answer:false, explain:'胃肠道反应是阿司匹林最常见的不良反应，可诱发或加重溃疡、引起胃出血，消化性溃疡患者禁用，宜饭后服。' },
          { type:'choice', difficulty:'base', q:'人工冬眠合剂的组成是', options:['氯丙嗪、异丙嗪、哌替啶','地西泮、吗啡、阿司匹林','苯巴比妥、咖啡因、尼可刹米','氯丙嗪、肾上腺素、哌替啶'], answer:0, explain:'氯丙嗪、异丙嗪、哌替啶组成冬眠合剂，配合物理降温使体温下降，用于严重感染、创伤等危重病症的人工冬眠疗法。' },
          { type:'choice', difficulty:'mid', q:'吗啡与哌替啶比较，下列叙述正确的是', options:['哌替啶镇痛作用强于吗啡','吗啡无镇咳作用','哌替啶成瘾性较吗啡轻，可用于分娩止痛','两药均可用于支气管哮喘'], answer:2, explain:'哌替啶镇痛力约为吗啡的1/10，成瘾性较轻，可用于分娩止痛（产前2~4小时禁用）；吗啡有强大镇咳作用，两药均禁用于支气管哮喘。' },
          { type:'judge', difficulty:'mid', q:'丙戊酸钠是广谱抗癫痫药，对各型癫痫均有一定疗效。', answer:true, explain:'丙戊酸钠为广谱抗癫痫药，对大发作、小发作、精神运动性发作等均有效，但有一定肝毒性，用药期间应定期检查肝功能。' },
          { type:'choice', difficulty:'high', q:'患者因使用过量吗啡出现昏迷、瞳孔呈针尖样、呼吸高度抑制，应立即选用的解救药是', options:['尼可刹米','纳洛酮','阿托品','肾上腺素'], answer:1, explain:'昏迷、针尖样瞳孔、呼吸抑制是吗啡急性中毒的典型表现，特效解救药为纳洛酮；尼可刹米虽可兴奋呼吸，但不是特效解毒药。' },
          { type:'choice', difficulty:'base', q:'阿司匹林最常见的不良反应是', options:['锥体外系反应','胃肠道反应','牙龈增生','针尖样瞳孔'], answer:1, explain:'阿司匹林刺激胃黏膜，胃肠道反应（恶心、呕吐、上腹不适）最常见，大剂量可诱发溃疡及胃出血，宜饭后服用。' },
          { type:'judge', difficulty:'base', q:'对乙酰氨基酚抗炎抗风湿作用强，是治疗风湿性关节炎的首选药。', answer:false, explain:'对乙酰氨基酚解热镇痛作用强，但抗炎抗风湿作用极弱，不能用于风湿性关节炎；抗风湿治疗常选用阿司匹林。' },
          { type:'choice', difficulty:'base', q:'尼可刹米的临床主要用途是', options:['治疗高血压','治疗癫痫小发作','治疗震颤麻痹','各种原因引起的中枢性呼吸抑制'], answer:3, explain:'尼可刹米直接兴奋呼吸中枢，用于各种原因引起的中枢性呼吸抑制，对吗啡中毒所致的呼吸抑制效果较好。' },
          { type:'choice', difficulty:'base', q:'癫痫精神运动性发作的首选药是', options:['丙戊酸钠','苯巴比妥','左旋多巴','卡马西平'], answer:3, explain:'卡马西平是癫痫精神运动性发作的首选药，对大发作也有效，还可用于三叉神经痛和舌咽神经痛。' },
          { type:'judge', difficulty:'base', q:'苯巴比妥不良反应少，目前仍广泛用作催眠药。', answer:false, explain:'巴比妥类后遗效应明显、安全性较低且易成瘾，现已较少用于催眠，临床催眠多选用地西泮等苯二氮䓬类药物。' },
          { type:'choice', difficulty:'mid', q:'氯丙嗪引起的体位性低血压主要与其阻断哪种受体有关', options:['M受体','β受体','α受体','多巴胺受体'], answer:2, explain:'氯丙嗪阻断α受体使血管扩张、血压下降，可致体位性低血压，用药后应卧床休息、变换体位宜慢；发生低血压时不能用肾上腺素升压。' },
          { type:'choice', difficulty:'base', q:'水合氯醛的临床主要用途是', options:['癫痫大发作','精神分裂症','胆绞痛','顽固性失眠'], answer:3, explain:'水合氯醛催眠作用强、不易蓄积、醒后无后遗效应，临床主要用于顽固性失眠，也可用于小儿高热惊厥等。' },
          { type:'judge', difficulty:'mid', q:'哌替啶在产前2~4小时内禁用，是为了防止新生儿呼吸抑制。', answer:true, explain:'哌替啶可通过胎盘，新生儿对其呼吸抑制作用极为敏感，产前2~4小时内使用可致娩出的新生儿呼吸抑制，故此段时间内禁用。' },
          { type:'choice', difficulty:'base', q:'左旋多巴抗震颤麻痹的作用机制是', options:['在脑内转变为多巴胺，补充多巴胺不足','阻断中枢M受体','阻断α受体','抑制血小板聚集'], answer:0, explain:'震颤麻痹与脑内多巴胺不足有关，多巴胺不易透过血脑屏障；左旋多巴是其前体，进入脑内转变为多巴胺而发挥作用。' },
          { type:'choice', difficulty:'high', q:'患儿病毒感染伴发热，为预防瑞夷综合征应禁用的解热镇痛药是', options:['对乙酰氨基酚','哌替啶','地西泮','阿司匹林'], answer:3, explain:'病毒感染伴发热的儿童及青少年服用阿司匹林可诱发瑞夷综合征（急性脑病合并内脏脂肪变性），严重者可致死，故禁用；退热可选用对乙酰氨基酚。' },
          { type:'choice', difficulty:'base', q:'小剂量阿司匹林可用于预防血栓形成的机制是', options:['收缩血管','抑制血小板聚集','升高血脂','扩张冠状动脉'], answer:1, explain:'小剂量阿司匹林能抑制血小板的环氧酶，减少血栓素A2生成，从而抑制血小板聚集，临床用于预防心肌梗死和脑血栓形成。' },
          { type:'choice', difficulty:'base', q:'吗啡禁用于下列哪种情况', options:['心源性哮喘','严重创伤剧痛','支气管哮喘','癌症晚期剧痛'], answer:2, explain:'吗啡抑制呼吸并收缩支气管平滑肌，可诱发或加重哮喘，禁用于支气管哮喘；心源性哮喘却是吗啡的适应证，注意二者区别。' },
          { type:'choice', difficulty:'high', q:'产妇使用哌替啶分娩止痛，产前2~4小时内禁用的原因是', options:['会抑制子宫收缩导致难产','可致新生儿呼吸抑制','会引起产妇体位性低血压','此时使用镇痛完全无效'], answer:1, explain:'哌替啶能通过胎盘，新生儿对其呼吸抑制作用极为敏感，产前2~4小时内用药可致新生儿娩出后呼吸抑制，故应禁用。' },
          { type:'choice', difficulty:'base', q:'对乙酰氨基酚的作用是', options:['抗炎抗风湿作用强','主要兴奋呼吸中枢','可治疗癫痫大发作','解热镇痛强而抗炎抗风湿弱'], answer:3, explain:'对乙酰氨基酚（扑热息痛）解热镇痛作用强，抗炎抗风湿作用极弱，不良反应少，是常用退热止痛药；一次大剂量应用可致肝坏死。' }

      { title: '第5章　心血管系统药物',
        sections: [

        knowledge: [
          '硝酸甘油能松弛血管平滑肌，以扩张静脉为主，使回心血量减少、心脏前负荷降低，从而降低心肌耗氧量；同时扩张冠状动脉，增加缺血区心肌供血。',
          '硝酸甘油首关消除明显，口服生物利用度低，不宜口服；心绞痛急性发作时舌下含服，1~3分钟起效，适用于各型心绞痛。',
          '硝酸甘油的不良反应有头面部血管扩张所致的皮肤潮红、搏动性头痛，以及体位性低血压、反射性心率加快；连续用药2~3周可产生耐受性，宜间歇给药。',
          '普萘洛尔阻断心脏β1受体，减慢心率、减弱心肌收缩力，降低心肌耗氧量，适用于稳定型心绞痛。',
          '普萘洛尔阻断β2受体可使冠状动脉收缩，故禁用于变异型心绞痛；伴有支气管哮喘、房室传导阻滞的患者也不宜使用。',

          '硝苯地平属钙通道阻滞药，能扩张冠状动脉和外周血管，降低心肌耗氧量，尤其适用于冠脉痉挛所致的变异型心绞痛。',
          '抗心律失常药分四类：Ⅰ类钠通道阻滞药（利多卡因、奎尼丁），Ⅱ类β受体阻断药（普萘洛尔），Ⅲ类延长动作电位时程药（胺碘酮），Ⅳ类钙通道阻滞药（维拉帕米）。',

          '强心苷主要用于慢性心功能不全和某些心律失常（心房颤动、心房扑动、阵发性室上性心动过速）；安全范围小，易中毒，应严格掌握剂量。',
          '强心苷毒性反应包括：胃肠道反应（最早出现，为中毒先兆）、中枢神经系统反应（黄视、绿视等视觉障碍）和心脏反应（各种心律失常，以室性早搏最常见，最为严重）。',

          '卡托普利为血管紧张素转化酶抑制药（ACEI），通过抑制血管紧张素转化酶而降压；不良反应有刺激性干咳、高血钾、首剂低血压等。',

          '硝酸甘油的不良反应（皮肤潮红、搏动性头痛、体位性低血压、反射性心率加快）及连续用药2~3周产生耐受性常考。',

          '硝酸甘油与普萘洛尔合用可互相纠正缺点、协同降低心肌耗氧量，是药物相互作用的经典考点。',

          'ACEI卡托普利最常见的不良反应是刺激性干咳，久用还可致高血钾、首剂低血压，为高频考点。',
          '哌唑嗪的「首剂现象」（体位性低血压）及氢氯噻嗪久用致低血钾、高血糖、高尿酸血症常考。'

        memorize: [
          '硝酸甘油：扩静脉降前负荷，扩冠脉增供血；舌下含服治绞痛，头痛潮红易耐受。',
          '普萘洛尔：阻断β1减耗氧，稳定型心绞痛可用；变异型者禁用，合用硝酸甘油互补。',
          '硝苯地平：扩冠脉又扩外周，变异型心绞痛首选。',
          '心律失常药分类：Ⅰ类阻钠利多卡因，Ⅱ类普萘洛尔，Ⅲ类胺碘酮延时程，Ⅳ类维拉帕米阻钙。',
          '强心苷三作用：正性肌力、负性频率、负性传导；主治心衰与房颤房扑。',
          '强心苷中毒三反应：胃肠最早、黄视绿视、心律失常室早最常见。',
          '强心苷中毒解救：停药补钾，快律苯妥英钠，慢律阿托品。',
          '强心苷禁忌：传导阻滞、肥厚心肌、心梗一天内、低血钾。',
          '卡托普利抑制转化酶，干咳高钾首剂低；哌唑嗪首剂防低压。',
          '氢氯噻嗪基础降压，久用低钾高糖高尿酸；他汀降LDL-C，贝特降TG。'
        ],
        practiceUrl: '',
        questions: [
          { type:'choice', difficulty:'base', q:'硝酸甘油抗心绞痛的主要作用机制是', options:['扩张静脉为主，降低心脏前负荷，降低心肌耗氧量','阻断心脏β1受体，减慢心率','阻滞心肌细胞钙通道内流','抑制血管紧张素转化酶'], answer:0, explain:'硝酸甘油以扩张静脉为主，减少回心血量、降低前负荷，使心肌耗氧量降低，并扩张冠脉增加缺血区供血，这是其抗心绞痛的主要机制。' },
          { type:'judge', difficulty:'base', q:'硝酸甘油口服吸收良好，故心绞痛急性发作时宜口服给药。', answer:false, explain:'硝酸甘油首关消除明显，口服生物利用度低，不宜口服；心绞痛急性发作时应舌下含服，1~3分钟即可起效。' },
          { type:'choice', difficulty:'base', q:'硝酸甘油最常见的不良反应是', options:['听力减退','牙龈增生','头面部皮肤潮红及搏动性头痛','粒细胞减少'], answer:2, explain:'硝酸甘油扩张头面部血管，可致皮肤潮红、搏动性头痛，是最常见的不良反应；还可引起体位性低血压和反射性心率加快。' },
          { type:'choice', difficulty:'mid', q:'硝酸甘油连续用药2~3周可产生', options:['成瘾性','耐受性','过敏反应','反跳现象'], answer:1, explain:'硝酸甘油连续用药2~3周可产生耐受性，停药1~2周后敏感性可恢复，故宜采用间歇给药法。' },
          { type:'choice', difficulty:'base', q:'普萘洛尔禁用于下列哪种心绞痛', options:['稳定型心绞痛','劳累性心绞痛','高血压合并心绞痛','变异型心绞痛'], answer:3, explain:'普萘洛尔阻断β2受体可使冠状动脉收缩，加重冠脉痉挛，故禁用于变异型心绞痛；稳定型心绞痛是其适应证。' },
          { type:'judge', difficulty:'mid', q:'硝酸甘油与普萘洛尔合用治疗心绞痛可互相纠正缺点、增强疗效。', answer:true, explain:'普萘洛尔减慢心率，可对抗硝酸甘油引起的反射性心率加快；硝酸甘油扩张冠脉，可对抗普萘洛尔收缩冠脉的作用，两药合用可协同降低心肌耗氧量。' },
          { type:'choice', difficulty:'base', q:'变异型心绞痛的首选药是', options:['硝苯地平','普萘洛尔','哌唑嗪','氢氯噻嗪'], answer:0, explain:'变异型心绞痛由冠状动脉痉挛引起，硝苯地平扩张冠脉作用强、能解除痉挛，是首选药；普萘洛尔禁用。' },
          { type:'choice', difficulty:'mid', q:'属于延长动作电位时程药（Ⅲ类）的抗心律失常药是', options:['利多卡因','奎尼丁','胺碘酮','维拉帕米'], answer:2, explain:'Ⅲ类抗心律失常药延长动作电位时程，代表药为胺碘酮；利多卡因、奎尼丁属Ⅰ类，维拉帕米属Ⅳ类，注意分类配对。' },
          { type:'choice', difficulty:'base', q:'强心苷治疗慢性心功能不全的主要药理依据是', options:['负性频率作用','正性肌力作用','负性传导作用','利尿作用'], answer:1, explain:'强心苷增强心肌收缩力（正性肌力作用），增加衰竭心脏的输出量，这是其治疗慢性心功能不全的药理基础。' },
          { type:'judge', difficulty:'base', q:'强心苷具有正性肌力、负性频率和负性传导作用。', answer:true, explain:'强心苷三大作用为正性肌力（增强收缩力）、负性频率（减慢心率）、负性传导（减慢房室传导），是识记要点。' },
          { type:'choice', difficulty:'base', q:'强心苷中毒最早出现的不良反应是', options:['恶心、呕吐等胃肠道反应','室性早搏','黄视、绿视','窦性心动过缓'], answer:0, explain:'胃肠道反应（厌食、恶心、呕吐）是强心苷中毒最早出现的症状，为中毒先兆；心脏反应最严重，以室性早搏最常见。' },
          { type:'choice', difficulty:'mid', q:'强心苷中毒时出现黄视、绿视等视觉障碍属于', options:['胃肠道反应','心脏反应','过敏反应','中枢神经系统反应'], answer:3, explain:'黄视、绿视等视觉障碍是强心苷中毒的中枢神经系统反应，为其特有的中毒表现，出现时应立即停药。' },
          { type:'judge', difficulty:'base', q:'强心苷安全范围大，治疗量与中毒量距离远，不易发生中毒。', answer:false, explain:'强心苷安全范围小，治疗量已接近中毒量，易发生中毒，应严格掌握剂量并密切观察中毒先兆。' },
          { type:'choice', difficulty:'base', q:'强心苷中毒致快速型心律失常宜选用', options:['阿托品','肾上腺素','苯妥英钠或利多卡因','去甲肾上腺素'], answer:2, explain:'强心苷中毒所致快速型心律失常可用苯妥英钠或利多卡因；缓慢型心律失常（如窦性心动过缓）才用阿托品，切勿混淆。' },
          { type:'choice', difficulty:'high', q:'患者，女，68岁，因慢性心功能不全长期服用地高辛，近日出现恶心、呕吐、视物发黄，心电图示频发室性早搏，此时正确的处理是', options:['继续原剂量服用，密切观察','立即停用强心苷，补钾并用苯妥英钠','加用呋塞米加速排泄','静脉注射肾上腺素'], answer:1, explain:'恶心、呕吐、黄视及室性早搏均为强心苷中毒表现，应立即停用强心苷、补钾，快速型心律失常用苯妥英钠或利多卡因，缓慢型用阿托品。' },
          { type:'choice', difficulty:'base', q:'卡托普利最常见的不良反应是', options:['刺激性干咳','水杨酸反应','牙龈增生','锥体外系反应'], answer:0, explain:'卡托普利抑制缓激肽降解，使缓激肽蓄积而引起刺激性干咳，是最常见的不良反应；还可致高血钾、首剂低血压。' },
          { type:'judge', difficulty:'base', q:'卡托普利通过抑制血管紧张素转化酶而发挥降压作用。', answer:true, explain:'卡托普利属血管紧张素转化酶抑制药（ACEI），使血管紧张素Ⅱ生成减少、血管扩张，从而降低血压。' },
          { type:'choice', difficulty:'base', q:'哌唑嗪的「首剂现象」是指', options:['首次用药出现皮疹','首次用药出现严重体位性低血压','首次用药出现高血糖','首次用药即产生耐受性'], answer:1, explain:'哌唑嗪阻断α受体、扩张血管，首次给药可致严重体位性低血压，称为首剂现象；首剂减半并于睡前服用可避免。' },
          { type:'choice', difficulty:'base', q:'长期应用氢氯噻嗪最易引起的电解质紊乱是', options:['高血钾','高血钙','低血钠','低血钾'], answer:3, explain:'氢氯噻嗪为排钾利尿药，长期应用最易引起低血钾，还可致高血糖、高尿酸血症，应注意补钾。' },
          { type:'judge', difficulty:'base', q:'氢氯噻嗪为排钾利尿药，长期应用可引起高血钾。', answer:false, explain:'氢氯噻嗪促进钾离子排泄，长期应用引起的是低血钾而非高血钾，必要时补钾或与留钾利尿药合用。' },
          { type:'choice', difficulty:'base', q:'通过抑制HMG-CoA还原酶、主要降低LDL-C的调血脂药是', options:['非诺贝特','硝酸甘油','洛伐他汀','硝苯地平'], answer:2, explain:'他汀类（洛伐他汀等）抑制胆固醇合成限速酶HMG-CoA还原酶，主要降低LDL-C；非诺贝特属贝特类，主要降低TG。' },
          { type:'choice', difficulty:'base', q:'贝特类调血脂药主要用于降低', options:['低密度脂蛋白胆固醇','三酰甘油','血糖','血尿酸'], answer:1, explain:'贝特类（如非诺贝特）主要降低三酰甘油（TG），适用于高三酰甘油血症；他汀类则主要降低LDL-C。' },
          { type:'judge', difficulty:'mid', q:'普萘洛尔适用于各型心绞痛，尤其对变异型心绞痛疗效最好。', answer:false, explain:'普萘洛尔适用于稳定型心绞痛，但阻断β2受体可使冠脉收缩、加重冠脉痉挛，故禁用于变异型心绞痛。' },
          { type:'choice', difficulty:'high', q:'患者，男，58岁，高血压病史5年，近日多于夜间发作胸骨后压榨样疼痛，心电图示ST段一过性抬高，诊断为变异型心绞痛，宜选用', options:['普萘洛尔','硝苯地平','氢氯噻嗪','哌唑嗪'], answer:1, explain:'变异型心绞痛由冠脉痉挛所致，硝苯地平扩张冠脉、解除痉挛，为首选药，且兼有降压作用；普萘洛尔可加重冠脉痉挛，禁用。' },
          { type:'choice', difficulty:'base', q:'下列哪项是强心苷的禁忌证', options:['慢性心功能不全','心房颤动','阵发性室上性心动过速','房室传导阻滞'], answer:3, explain:'强心苷减慢房室传导，房室传导阻滞者禁用；肥厚型心肌病、急性心肌梗死24小时内、低钾血症也属禁忌，前三项则是其适应证。' },
          { type:'choice', difficulty:'base', q:'治疗阵发性室上性心动过速可选用的钙通道阻滞药是', options:['维拉帕米','硝苯地平','利多卡因','哌唑嗪'], answer:0, explain:'维拉帕米为Ⅳ类抗心律失常药，减慢房室传导，常用于阵发性室上性心动过速；硝苯地平以扩血管为主，不作抗心律失常首选。' },
          { type:'choice', difficulty:'mid', q:'硝酸甘油与普萘洛尔合用治疗心绞痛的优点是', options:['两药均能扩张冠状动脉','两药均能加快心率','互相纠正缺点，普萘洛尔可对抗硝酸甘油引起的反射性心率加快','两药合用可增加心肌耗氧量'], answer:2, explain:'两药合用协同降低心肌耗氧量，普萘洛尔减慢心率对抗硝酸甘油的反射性心率加快，硝酸甘油扩张冠脉对抗普萘洛尔的冠脉收缩作用。' },
          { type:'choice', difficulty:'high', q:'患者，男，72岁，慢性心功能不全伴心房颤动，长期服用地高辛，近日食欲减退、恶心，并诉看东西发黄，首先应考虑', options:['强心苷中毒','药物剂量不足','并发急性胃肠炎','高血压脑病'], answer:0, explain:'黄视、绿视等视觉障碍是强心苷中毒的中枢神经系统表现，伴胃肠道反应，应首先考虑强心苷中毒，立即停药并解救。' },
          { type:'judge', difficulty:'base', q:'低钾血症可诱发强心苷中毒，应用强心苷期间应注意监测血钾并适当补钾。', answer:true, explain:'低钾血症时心肌对强心苷的敏感性增高，易诱发中毒，故用药期间应监测血钾，必要时补钾。' },
          { type:'choice', difficulty:'base', q:'高血压合并支气管哮喘的患者不宜选用', options:['硝苯地平','卡托普利','氢氯噻嗪','普萘洛尔'], answer:3, explain:'普萘洛尔阻断支气管平滑肌β2受体，可诱发或加重支气管哮喘，高血压合并支气管哮喘者禁用；其余三药无此顾虑。' }
        ]
      },
      { title: '第6章　利尿药和脱水药',
        sections: [
          '第一节　高效能利尿药',
          '第二节　中效能利尿药',

          '第四节　脱水药'
        ],
        knowledge: [
          '呋塞米（速尿）为高效能利尿药，作用于髓袢升支粗段髓质部和皮质部，抑制NaCl重吸收，利尿作用强大迅速。',
          '呋塞米临床用于各种严重水肿、急性肺水肿和脑水肿，以及加速经肾脏排泄的药物或毒物中毒的辅助治疗。',
          '呋塞米的不良反应以水与电解质紊乱最常见，低血钾最为突出；还可引起耳毒性（表现为耳鸣、听力下降）和胃肠反应；用药期间应注意补钾或与保钾利尿药合用。',
          '氢氯噻嗪为中效能利尿药，作用于远曲小管近端，抑制NaCl重吸收，利尿作用温和持久。',
          '氢氯噻嗪临床用于轻中度水肿、高血压和尿崩症，是基础降压药之一。',
          '氢氯噻嗪长期应用的不良反应有低血钾、高血糖、高尿酸和高血脂；痛风和糖尿病患者应慎用。',
          '螺内酯（安体舒通）为低效能保钾利尿药，通过拮抗醛固酮受体而保钾排钠。',
          '氨苯蝶啶为低效能保钾利尿药，通过直接抑制远曲小管和集合管的Na通道而保钾排钠。',
          '保钾利尿药常与排钾利尿药（呋塞米、氢氯噻嗪）合用，目的是互相纠正电解质紊乱，防止低血钾。',
          '螺内酯的不良反应有高血钾和性激素样副作用（如男性乳房发育）；肾功能不全者慎用。',
          '甘露醇为渗透性利尿药（脱水药），静脉给药后提高血浆渗透压，使组织脱水。',
          '甘露醇临床用于脑水肿（降低颅内压首选）、急性肾衰竭早期（预防急性肾衰）和青光眼。',
          '甘露醇的不良反应有头痛、头晕、视力模糊；因增加血容量，心功能不全者慎用。',
          '山梨醇的作用与甘露醇相似，亦为渗透性利尿药，但脱水利尿作用较弱。',
          '50%高渗葡萄糖静脉注射也可提高血浆渗透压而产生脱水作用，但葡萄糖可进入组织被代谢，故作用弱且短暂。'
        ],
        examPoints: [
          '呋塞米的耳毒性（耳鸣、听力下降）是高频考点，常与氨基糖苷类抗生素耳毒性联合考查。',
          '呋塞米引起低血钾最常见，用药期间需注意补钾或与保钾利尿药合用，易出判断题。',
          '氢氯噻嗪长期应用可致高血糖、高尿酸血症，痛风和糖尿病患者慎用，为高频单选和判断考点。',
          '螺内酯为保钾利尿药，通过拮抗醛固酮受体发挥作用，常与排钾利尿药配伍，常考单选。',
          '甘露醇是治疗脑水肿、降低颅内压的首选药，属渗透性利尿药，必须静脉给药，几乎必考。',
          '甘露醇禁用于心功能不全者，因其增加血容量可加重心脏负担，常考禁忌证。',
          '三类利尿药作用部位对比：高效能（髓袢升支粗段）、中效能（远曲小管近端）、低效能（远曲小管和集合管），常考配对题。',
          '保钾利尿药（螺内酯、氨苯蝶啶）与排钾利尿药（呋塞米、氢氯噻嗪）的配伍目的及血钾变化是高频易错点。'
        ],
        memorize: [

          '氢氯噻嗪：远曲小管近端，轻中度水肿高血压尿崩症；低钾高糖高尿酸，痛风糖尿病慎用。',

          '甘露醇：提高血浆渗透压，组织脱水；脑水肿首选，预防急性肾衰，治青光眼；心功能不全者慎用。',
          '山梨醇作用同甘露醇但较弱；50%高渗葡萄糖脱水作用弱且短暂。',
          '三类利尿药对比：高效呋塞米髓袢，中效噻嗪远曲近端，低效螺内酯氨苯蝶啶远曲集合管。',
          '呋塞米耳毒低钾最常见，氢氯噻嗪高糖高尿酸，螺内酯高钾性激素样，甘露醇头痛头晕心不全慎用。'

        practiceUrl: '',
        questions: [
          { type:'choice', difficulty:'base', q:'呋塞米的作用部位是', options:['远曲小管近端','髓袢升支粗段髓质部和皮质部','远曲小管和集合管','肾小球'], answer:1, explain:'呋塞米为高效能利尿药，作用于髓袢升支粗段髓质部和皮质部，抑制NaCl重吸收；远曲小管近端是氢氯噻嗪的作用部位。' },
          { type:'choice', difficulty:'base', q:'呋塞米最常见的不良反应是', options:['高血钾','低血钾','高血糖','高尿酸'], answer:1, explain:'呋塞米为排钾利尿药，水与电解质紊乱中最常见的是低血钾，应注意补钾或与保钾利尿药合用。' },
          { type:'choice', difficulty:'base', q:'呋塞米的特征性不良反应是', options:['耳毒性，表现为耳鸣、听力下降','高血钾','高血糖','高尿酸血症'], answer:0, explain:'呋塞米可损害内耳引起耳毒性，表现为耳鸣、听力下降甚至耳聋，肾功能不全或合用氨基糖苷类抗生素时更易发生；低血钾虽最常见但不属其特征性反应。' },
          { type:'choice', difficulty:'base', q:'氢氯噻嗪的作用部位是', options:['髓袢升支粗段','远曲小管近端','集合管','近曲小管'], answer:1, explain:'氢氯噻嗪为中效能利尿药，作用于远曲小管近端，抑制NaCl重吸收；与呋塞米的作用部位不同。' },
          { type:'choice', difficulty:'base', q:'氢氯噻嗪的临床应用不包括', options:['轻中度水肿','高血压','尿崩症','急性肺水肿'], answer:3, explain:'氢氯噻嗪用于轻中度水肿、高血压和尿崩症；急性肺水肿宜选用高效能利尿药呋塞米，作用快而强。' },
          { type:'judge', difficulty:'mid', q:'氢氯噻嗪长期应用可引起低血钾、高血糖和高尿酸血症，痛风患者应慎用。', answer:true, explain:'氢氯噻嗪促进钾排泄并可致高血糖、高尿酸，痛风和糖尿病患者慎用。' },
          { type:'choice', difficulty:'mid', q:'螺内酯的作用机制是', options:['抑制髓袢升支粗段NaCl重吸收','抑制远曲小管近端NaCl重吸收','拮抗醛固酮受体，保钾排钠','直接抑制远曲小管和集合管Na通道'], answer:2, explain:'螺内酯（安体舒通）为保钾利尿药，通过拮抗醛固酮受体发挥保钾排钠作用；D项为氨苯蝶啶的作用机制。' },
          { type:'choice', difficulty:'mid', q:'氨苯蝶啶的作用机制是', options:['拮抗醛固酮受体','直接抑制远曲小管和集合管Na通道','抑制髓袢升支粗段Na-K-2Cl同向转运体','抑制碳酸酐酶'], answer:1, explain:'氨苯蝶啶直接抑制远曲小管和集合管的Na通道，减少Na重吸收而保钾排钠；螺内酯则是拮抗醛固酮受体。' },
          { type:'choice', difficulty:'base', q:'保钾利尿药常与排钾利尿药合用的目的是', options:['增强利尿效果','防止低血钾','降低血压','加速毒物排泄'], answer:1, explain:'排钾利尿药（呋塞米、氢氯噻嗪）长期应用易致低血钾，与保钾利尿药合用可互相纠正电解质紊乱，防止低血钾。' },
          { type:'judge', difficulty:'base', q:'螺内酯的不良反应包括高血钾和性激素样副作用。', answer:true, explain:'螺内酯保钾排钠，单独使用或肾功能不全时可致高血钾；其结构与醛固酮相似，还可引起男性乳房发育等性激素样副作用。' },
          { type:'choice', difficulty:'base', q:'甘露醇属于', options:['高效能利尿药','中效能利尿药','低效能利尿药','渗透性利尿药（脱水药）'], answer:3, explain:'甘露醇为渗透性利尿药（脱水药），静脉给药后提高血浆渗透压，使组织脱水；不属于传统的三类利尿药。' },
          { type:'choice', difficulty:'base', q:'治疗脑水肿、降低颅内压的首选药是', options:['呋塞米','氢氯噻嗪','甘露醇','螺内酯'], answer:2, explain:'甘露醇静脉给药后迅速提高血浆渗透压，使脑组织脱水，是降低颅内压、治疗脑水肿的首选药，几乎必考。' },
          { type:'choice', difficulty:'base', q:'甘露醇禁用于', options:['脑水肿','急性肾衰竭早期','青光眼','心功能不全者'], answer:3, explain:'甘露醇静脉给药后增加血容量，可加重心脏负担，故心功能不全者慎用或禁用；脑水肿、急性肾衰早期和青光眼为其适应证。' },
          { type:'judge', difficulty:'base', q:'山梨醇的作用与甘露醇相似，但利尿脱水作用较弱。', answer:true, explain:'山梨醇为甘露醇的同分异构体，作用机制相同，但进入体内后部分转化为糖原，脱水利尿作用较甘露醇弱。' },
          { type:'choice', difficulty:'base', q:'50%高渗葡萄糖静脉注射也可产生脱水作用，其特点是', options:['作用强而持久','作用弱且短暂','可透过血脑屏障','无不良反应'], answer:1, explain:'50%高渗葡萄糖静脉注射可提高血浆渗透压而脱水，但葡萄糖可进入组织被代谢，故作用弱且短暂，临床较少单独使用。' },
          { type:'choice', difficulty:'base', q:'呋塞米的临床应用不包括', options:['青光眼','各种严重水肿','急性肺水肿和脑水肿','加速毒物排泄'], answer:0, explain:'呋塞米用于各种严重水肿、急性肺水肿和脑水肿、加速毒物排泄；青光眼是脱水药甘露醇的适应证，注意区分。' },
          { type:'judge', difficulty:'mid', q:'呋塞米与氨基糖苷类抗生素合用可减轻耳毒性。', answer:false, explain:'呋塞米本身有耳毒性，氨基糖苷类抗生素也有耳毒性，两药合用会加重耳毒性，应避免合用。' },
          { type:'choice', difficulty:'high', q:'患者，男，45岁，患高血压伴痛风，下列利尿药中不宜选用的是', options:['螺内酯','氢氯噻嗪','氨苯蝶啶','甘露醇'], answer:1, explain:'氢氯噻嗪长期应用可致高尿酸血症，可诱发或加重痛风，痛风患者慎用或禁用；螺内酯、氨苯蝶啶对血尿酸影响小。' },
          { type:'choice', difficulty:'base', q:'氢氯噻嗪的不良反应不包括', options:['低血钾','高血糖','高尿酸','耳毒性'], answer:3, explain:'氢氯噻嗪的不良反应为低血钾、高血糖、高尿酸、高血脂，一般无耳毒性；耳毒性是呋塞米的特征性不良反应。' },
          { type:'judge', difficulty:'base', q:'甘露醇口服给药可用于降低颅内压、治疗脑水肿。', answer:false, explain:'甘露醇口服难吸收，在肠道产生导泻作用；降低颅内压必须静脉给药，才能迅速提高血浆渗透压使组织脱水。' },
          { type:'choice', difficulty:'mid', q:'关于三类利尿药的作用部位，下列配对正确的是', options:['呋塞米——远曲小管近端','氢氯噻嗪——髓袢升支粗段','螺内酯——远曲小管和集合管','氨苯蝶啶——肾小球'], answer:2, explain:'螺内酯作用于远曲小管和集合管（拮抗醛固酮受体）；呋塞米作用于髓袢升支粗段，氢氯噻嗪作用于远曲小管近端，切勿混淆。' },
          { type:'choice', difficulty:'base', q:'预防急性肾衰竭早期可选用的药物是', options:['甘露醇','山梨醇','高渗葡萄糖','螺内酯'], answer:0, explain:'甘露醇在急性肾衰竭早期应用可增加尿量、冲洗肾小管，预防急性肾衰；一旦肾衰已确立则不宜再用。' },
          { type:'judge', difficulty:'base', q:'螺内酯属于排钾利尿药，长期应用易引起低血钾。', answer:false, explain:'螺内酯是保钾利尿药，通过拮抗醛固酮受体保钾排钠，长期应用易引起的是高血钾而非低血钾。' },
          { type:'choice', difficulty:'high', q:'患者，女，60岁，慢性心功能不全伴水肿，长期服用呋塞米，近日出现乏力、腹胀、心律失常，首先应考虑', options:['高血钾','低血钾','强心苷中毒','耳毒性'], answer:1, explain:'长期服用排钾利尿药呋塞米易致低血钾，表现为乏力、腹胀、心律失常；应补钾或与保钾利尿药螺内酯合用。' },
          { type:'choice', difficulty:'base', q:'甘露醇用于治疗青光眼的主要机制是', options:['抑制房水生成','脱水降低眼内压','扩张眼内血管','缩瞳作用'], answer:1, explain:'甘露醇提高血浆渗透压，使眼内组织水分进入血液，降低眼内压，可用于青光眼急性发作；不是通过抑制房水生成。' },
          { type:'judge', difficulty:'mid', q:'颅内活动性出血（非手术时）者禁用甘露醇。', answer:true, explain:'甘露醇脱水后血容量增加，可使颅内活动性出血加重，故颅内活动性出血（非开颅手术时）者禁用。' },
          { type:'choice', difficulty:'base', q:'下列药物中属于保钾利尿药的是', options:['呋塞米和氢氯噻嗪','螺内酯和氨苯蝶啶','甘露醇和山梨醇','氢氯噻嗪和螺内酯'], answer:1, explain:'螺内酯和氨苯蝶啶均为保钾利尿药；呋塞米、氢氯噻嗪为排钾利尿药；甘露醇、山梨醇为脱水药。' },
          { type:'choice', difficulty:'base', q:'呋塞米可用于加速毒物排泄，其主要机制是', options:['吸附毒物','中和毒物','强大利尿作用加速毒物经肾排出','促进肝脏代谢'], answer:2, explain:'呋塞米利尿作用强大迅速，结合输液可明显增加尿量，加速经肾排泄的药物或毒物排出，用于中毒的辅助治疗。' },
          { type:'judge', difficulty:'base', q:'甘露醇可降低眼内压，用于治疗青光眼。', answer:true, explain:'甘露醇提高血浆渗透压，使眼内水分向血液转移，降低眼内压，可用于青光眼急性发作的辅助治疗。' },
          { type:'choice', difficulty:'high', q:'患者，男，70岁，突发脑水肿伴慢性心功能不全，急需降低颅内压，此时宜选用的药物是', options:['甘露醇','呋塞米','氢氯噻嗪','高渗葡萄糖'], answer:1, explain:'甘露醇虽为降颅内压首选，但会增加血容量、加重心脏负担，心功能不全者不宜；此时宜改用呋塞米，利尿脱水又可减轻心脏负荷。' }
        ]
      },
      { title: '第7章　作用于呼吸系统的药物',
        sections: [
          '第一节　平喘药',
          '第二节　镇咳药',
          '第三节　祛痰药'
        ],
        knowledge: [
          '平喘药分为支气管扩张药（β₂受体激动药如沙丁胺醇、茶碱类如氨茶碱、M胆碱受体阻断药如异丙托溴铵）、抗炎平喘药（糖皮质激素如倍氯米松）和抗过敏平喘药（如色甘酸钠）三类。',
          '沙丁胺醇（舒喘灵）选择性激动β₂受体，松弛支气管平滑肌、扩张支气管，起效快，是哮喘急性发作的首选药之一。',
          '沙丁胺醇对心脏β₁受体影响小，故心血管不良反应少，常用气雾吸入给药。',
          '氨茶碱的作用有扩张支气管、强心、利尿和兴奋中枢，临床用于支气管哮喘和心源性哮喘。',
          '氨茶碱安全范围小，静脉注射过快可致心律失常、血压骤降甚至惊厥，须稀释后缓慢静注并监测血药浓度。',
          '糖皮质激素（如倍氯米松）通过抗炎作用平喘，吸入给药用于慢性哮喘的维持治疗，不宜用于急性发作的抢救。',
          '倍氯米松吸入的主要局部不良反应是声音嘶哑和口腔念珠菌感染，用药后及时漱口可有效预防。',
          '色甘酸钠为肥大细胞膜稳定剂，能阻止过敏介质释放，只能预防哮喘发作，对已经发作的哮喘无效。',
          '色甘酸钠口服难吸收，采用干粉吸入给药，常用于预防季节性或运动性哮喘发作。',
          '异丙托溴铵为M胆碱受体阻断药，通过阻断支气管平滑肌M受体而扩张支气管，吸入给药全身不良反应少。',
          '镇咳药分中枢性和外周性两类；可待因为中枢性镇咳药，镇咳作用强，但有成瘾性，仅用于剧烈干咳，痰多者禁用。',
          '右美沙芬为中枢性镇咳药，镇咳作用与可待因相似但无成瘾性，临床应用较广。',
          '喷托维林（咳必清）兼有中枢性和外周性镇咳作用，并有轻度阿托品样作用，无成瘾性。',
          '氯化铵为恶心性祛痰药，口服后刺激胃黏膜，反射性增加呼吸道腺体分泌，使痰液变稀易于咳出。',
          '乙酰半胱氨酸为黏痰溶解药，能断裂黏蛋白的二硫键、降低痰的黏度；溴己新（必嗽平）则通过裂解黏痰中的黏多糖而祛痰。',
          '临床常用镇咳祛痰复方制剂，应按咳嗽性质选药：干咳为主选镇咳药，痰多黏稠则以祛痰药为主，不宜单用强力镇咳药。'
        ],
        examPoints: [
          '沙丁胺醇选择性激动β₂受体，是哮喘急性发作首选药，对β₁受体影响小、不良反应少，为高频单选考点。',
          '氨茶碱一药多用：扩张支气管、强心、利尿、兴奋中枢；既治支气管哮喘又治心源性哮喘，几乎必考。',
          '氨茶碱安全范围小，静注过快可致心律失常、血压骤降、惊厥，需监测血药浓度，常考不良反应与用药护理。',
          '色甘酸钠只能预防哮喘发作、对已发作无效，且须干粉吸入给药，是高频判断题陷阱。',
          '可待因镇咳强但成瘾，仅限剧烈干咳，痰多者禁用；右美沙芬无成瘾性，两者对比常考。',
          '祛痰药分类及机制：氯化铵（恶心性祛痰）、乙酰半胱氨酸（断裂二硫键）、溴己新（裂解黏多糖），常考配对题。',
          '倍氯米松吸入治慢性哮喘，局部不良反应为声音嘶哑和口腔念珠菌感染，用药后漱口可预防，常考护理措施。',
          '平喘药三大类（支气管扩张药、抗炎平喘药、抗过敏平喘药）及代表药的归属是识记型高频考点。'
        ],
        memorize: [
          '平喘药三类：扩张（沙丁胺醇、氨茶碱、异丙托溴铵）、抗炎（倍氯米松）、抗过敏（色甘酸钠）。',
          '沙丁胺醇：激动β₂，扩张支气管，急性发作首选，不良反应少。',
          '氨茶碱：扩支、强心、利尿、兴奋中枢；支哮心哮都能用；静注过快致心律失常、血压降，安全范围小。',
          '倍氯米松：吸入抗炎治慢哮，声嘶、念珠菌，用药后漱口。',
          '色甘酸钠：稳定肥大细胞膜，只预防、不治已发，干粉吸入。',
          '可待因：中枢镇咳强、成瘾，只治剧烈干咳，痰多禁用；右美沙芬无成瘾。',
          '喷托维林（咳必清）：中枢加外周镇咳，无成瘾。',
          '祛痰药：氯化铵刺激胃黏膜反射性稀痰；乙酰半胱氨酸断二硫键；溴己新裂解黏多糖。'
        ],
        practiceUrl: '',
        questions: [
          { type:'choice', difficulty:'base', q:'沙丁胺醇平喘的作用机制是', options:['激动M胆碱受体','选择性激动β₂受体，扩张支气管','阻断H1受体','稳定肥大细胞膜'], answer:1, explain:'沙丁胺醇选择性激动β₂受体，松弛支气管平滑肌而平喘；对心脏β₁受体影响小，故不良反应较少。阻断M受体的是异丙托溴铵。' },
          { type:'choice', difficulty:'base', q:'下列药物中属于抗炎平喘药的是', options:['沙丁胺醇','氨茶碱','倍氯米松','色甘酸钠'], answer:2, explain:'倍氯米松为糖皮质激素，属抗炎平喘药；沙丁胺醇和氨茶碱为支气管扩张药，色甘酸钠为抗过敏平喘药。' },
          { type:'judge', difficulty:'base', q:'色甘酸钠可用于控制哮喘急性发作。', answer:false, explain:'色甘酸钠只能预防发作，对已发作的哮喘无效，急性发作应选沙丁胺醇等支气管扩张药。' },
          { type:'choice', difficulty:'base', q:'氨茶碱静脉注射过快可引起', options:['嗜睡','便秘','血压升高','心律失常、血压骤降甚至惊厥'], answer:3, explain:'氨茶碱安全范围小，静注过快可致心律失常、血压骤降甚至惊厥，应稀释后缓慢注射并监测血药浓度。' },
          { type:'choice', difficulty:'base', q:'具有成瘾性、仅用于剧烈干咳的镇咳药是', options:['右美沙芬','喷托维林','可待因','氯化铵'], answer:2, explain:'可待因为中枢性镇咳药，镇咳作用强但易成瘾，仅限剧烈干咳，痰多者禁用；右美沙芬和喷托维林无成瘾性。' },
          { type:'judge', difficulty:'base', q:'可待因镇咳作用强但易成瘾，仅用于剧烈干咳，痰多者禁用。', answer:true, explain:'可待因抑制咳嗽中枢且有成瘾性，并可抑制排痰，痰多者用后可致痰液潴留，故禁用。' },
          { type:'choice', difficulty:'base', q:'氯化铵祛痰的作用机制是', options:['断裂黏蛋白二硫键','刺激胃黏膜，反射性增加呼吸道腺体分泌','裂解黏痰中的黏多糖','抑制咳嗽中枢'], answer:1, explain:'氯化铵为恶心性祛痰药，口服后刺激胃黏膜，反射性增加呼吸道腺体分泌，使痰液变稀易于咳出。' },
          { type:'choice', difficulty:'mid', q:'色甘酸钠预防哮喘发作的作用机制是', options:['激动β₂受体','阻断M胆碱受体','抗炎作用','稳定肥大细胞膜，阻止过敏介质释放'], answer:3, explain:'色甘酸钠为肥大细胞膜稳定剂，可阻止过敏介质释放，故只能预防发作；对支气管无直接扩张作用。' },
          { type:'choice', difficulty:'base', q:'色甘酸钠的常用给药途径是', options:['口服','静脉注射','干粉吸入','皮下注射'], answer:2, explain:'色甘酸钠口服难吸收，须采用干粉吸入给药，使药物直接到达呼吸道发挥作用。' },
          { type:'judge', difficulty:'mid', q:'氯化铵通过断裂黏蛋白二硫键、溶解黏痰而发挥祛痰作用。', answer:false, explain:'氯化铵为恶心性祛痰药，通过刺激胃黏膜反射性增加呼吸道分泌而祛痰；断裂二硫键的是乙酰半胱氨酸。' },
          { type:'choice', difficulty:'base', q:'倍氯米松吸入给药常见的局部不良反应是', options:['心律失常','声音嘶哑和口腔念珠菌感染','成瘾','血压升高'], answer:1, explain:'倍氯米松吸入可致声音嘶哑和口腔念珠菌感染，用药后及时漱口可有效预防。' },
          { type:'choice', difficulty:'base', q:'氨茶碱的临床应用不包括', options:['支气管哮喘','心源性哮喘','伴有心功能不全的喘息','预防季节性哮喘发作'], answer:3, explain:'氨茶碱既能治支气管哮喘又能治心源性哮喘；预防季节性发作应选用色甘酸钠。' },
          { type:'judge', difficulty:'base', q:'右美沙芬为中枢性镇咳药，镇咳作用与可待因相似但无成瘾性。', answer:true, explain:'右美沙芬无成瘾性是其区别于可待因的主要特点，临床应用较广。' },
          { type:'choice', difficulty:'mid', q:'无成瘾性的中枢性镇咳药是', options:['可待因','右美沙芬','吗啡','哌替啶'], answer:1, explain:'右美沙芬为中枢性镇咳药，镇咳作用与可待因相似但无成瘾性；吗啡、哌替啶为成瘾性镇痛药。' },
          { type:'choice', difficulty:'base', q:'溴己新（必嗽平）祛痰的作用机制是', options:['裂解黏痰中的黏多糖','断裂黏蛋白二硫键','刺激胃黏膜反射性增加分泌','抑制呼吸道腺体分泌'], answer:0, explain:'溴己新能裂解黏痰中的黏多糖，使痰黏稠度降低而易于咳出；断裂二硫键的是乙酰半胱氨酸。' },
          { type:'choice', difficulty:'base', q:'乙酰半胱氨酸祛痰的作用机制是', options:['刺激胃黏膜，反射性增加分泌','裂解黏痰中的黏多糖','断裂黏蛋白二硫键，降低痰黏度','扩张支气管'], answer:2, explain:'乙酰半胱氨酸为黏痰溶解药，能断裂黏蛋白的二硫键、降低痰的黏度，适用于黏痰不易咳出者。' },
          { type:'judge', difficulty:'base', q:'吸入倍氯米松后及时漱口，可减少声音嘶哑和口腔念珠菌感染的发生。', answer:true, explain:'漱口可清除残留在口咽部的药物，是预防吸入性糖皮质激素局部不良反应的重要护理措施。' },
          { type:'choice', difficulty:'mid', q:'氨茶碱的作用不包括', options:['扩张支气管','强心、利尿','稳定肥大细胞膜','兴奋中枢'], answer:2, explain:'氨茶碱有扩张支气管、强心、利尿和兴奋中枢作用；稳定肥大细胞膜是色甘酸钠的作用，注意区分。' },
          { type:'choice', difficulty:'base', q:'沙丁胺醇主要用于', options:['哮喘急性发作','慢性哮喘的长期抗炎治疗','预防季节性哮喘发作','剧烈干咳'], answer:0, explain:'沙丁胺醇起效快、扩张支气管作用强，为哮喘急性发作首选药；长期抗炎选糖皮质激素，预防发作选色甘酸钠。' },
          { type:'choice', difficulty:'base', q:'异丙托溴铵平喘的作用机制是', options:['阻断M胆碱受体，扩张支气管','激动β₂受体','抗炎作用','稳定肥大细胞膜'], answer:0, explain:'异丙托溴铵为M胆碱受体阻断药，吸入给药阻断支气管平滑肌M受体而扩张支气管。' },
          { type:'judge', difficulty:'mid', q:'沙丁胺醇为非选择性β受体激动药，对β₁和β₂受体均有强大激动作用。', answer:false, explain:'沙丁胺醇为选择性β₂受体激动药，对心脏β₁受体影响小，这正是其不良反应较少的原因。' },
          { type:'choice', difficulty:'base', q:'预防倍氯米松吸入引起口腔念珠菌感染的措施是', options:['增加剂量','改为口服给药','联合应用可待因','用药后及时漱口'], answer:3, explain:'吸入糖皮质激素后及时漱口，可清除口腔内残留药物，预防声音嘶哑和口腔念珠菌感染。' },
          { type:'judge', difficulty:'mid', q:'氨茶碱安全范围小，用药期间需监测血药浓度。', answer:true, explain:'氨茶碱有效浓度与中毒浓度接近，静注过快可致严重心律失常和惊厥，故需监测血药浓度。' },
          { type:'choice', difficulty:'base', q:'喷托维林（咳必清）的镇咳特点是', options:['仅有中枢镇咳作用','仅有外周镇咳作用','兼有中枢性和外周性镇咳作用','有成瘾性'], answer:2, explain:'喷托维林兼有中枢性和外周性镇咳作用，并有轻度阿托品样作用，无成瘾性，适用于上呼吸道感染引起的干咳。' },
          { type:'choice', difficulty:'base', q:'可待因的临床适应证是', options:['痰多咳嗽','慢性支气管炎咳嗽','哮喘发作','剧烈干咳'], answer:3, explain:'可待因镇咳作用强，用于剧烈干咳；因抑制排痰且成瘾，痰多者禁用，不宜长期使用。' },
          { type:'judge', difficulty:'base', q:'喷托维林（咳必清）具有成瘾性，不宜长期使用。', answer:false, explain:'喷托维林无成瘾性，兼有中枢和外周镇咳作用；有成瘾性的是可待因。' },
          { type:'choice', difficulty:'base', q:'关于色甘酸钠的叙述，正确的是', options:['只能预防哮喘发作，对正在发作的哮喘无效','可用于控制哮喘急性发作','口服吸收良好','具有成瘾性'], answer:0, explain:'色甘酸钠为肥大细胞膜稳定剂，只能预防发作、对已发作者无效；口服难吸收，须干粉吸入给药。' },
          { type:'choice', difficulty:'high', q:'患者，女，25岁，支气管哮喘急性发作，呼吸困难明显，宜首选的药物是', options:['色甘酸钠干粉吸入','沙丁胺醇气雾吸入','可待因口服','倍氯米松规律吸入'], answer:1, explain:'急性发作需迅速扩张支气管，首选沙丁胺醇气雾吸入；色甘酸钠只能预防，倍氯米松起效慢用于慢性维持，可待因与平喘无关。' },
          { type:'choice', difficulty:'high', q:'患者，男，60岁，夜间突发喘息、端坐呼吸，支气管哮喘与心源性哮喘一时难以鉴别，此时宜选用', options:['吗啡','氨茶碱','可待因','色甘酸钠'], answer:1, explain:'氨茶碱既能扩张支气管又能强心利尿，对两种哮喘均有效；吗啡抑制呼吸，原因未明前禁用。' },
          { type:'choice', difficulty:'high', q:'患者每逢花粉季节哮喘发作，为预防发作，可在接触花粉前使用的药物是', options:['色甘酸钠','可待因','乙酰半胱氨酸','氯化铵'], answer:0, explain:'色甘酸钠为肥大细胞膜稳定剂，提前吸入可预防已知过敏原诱发的哮喘发作；后三者与预防发作无关。' }

      { title: '第8章　作用于消化系统的药物',
        sections: [
          '第一节　抗消化性溃疡药',

          '第五节　肝胆疾病用药'
        ],
        knowledge: [
          '抗消化性溃疡药分为五大类：抗酸药（氢氧化铝、三硅酸镁——直接中和胃酸）、H2受体阻断药（西咪替丁、雷尼替丁——抑制胃酸分泌）、M胆碱受体阻断药（哌仑西平）、胃壁细胞H+泵抑制药/质子泵抑制剂PPI（奥美拉唑——目前最强的抑酸药）、胃黏膜保护药（硫糖铝、枸橼酸铋钾——兼杀幽门螺杆菌）。',
          '抗幽门螺杆菌感染常采用三联疗法或四联疗法：PPI（如奥美拉唑）或铋剂（如枸橼酸铋钾）联合两种抗菌药（如阿莫西林、克拉霉素、甲硝唑等）。',
          '奥美拉唑通过抑制胃壁细胞H+-K+-ATP酶（质子泵），产生强大而持久的抑酸作用，是目前最强的抑酸药，用于消化性溃疡、反流性食管炎及幽门螺杆菌感染（联合用药）。',
          '西咪替丁和雷尼替丁为H2受体阻断药，通过阻断胃壁细胞H2受体而减少胃酸分泌，用于治疗消化性溃疡和胃食管反流病。',
          '氢氧化铝为抗酸药，口服后直接中和胃酸，并可在溃疡面形成凝胶状保护膜；常见不良反应为便秘，长期大量服用可致铝中毒，肾功能不全者慎用。',
          '抗酸药氢氧化铝宜在餐前1h或睡前服用，以充分发挥中和胃酸及保护溃疡面的作用。',
          '硫糖铝为胃黏膜保护药，在酸性环境中聚合成胶冻状，黏附于溃疡面形成保护膜，促进溃疡愈合；同时可刺激前列腺素合成，增强黏膜屏障功能。',
          '枸橼酸铋钾兼具胃黏膜保护作用和杀灭幽门螺杆菌作用，在胃内酸性环境中形成氧化铋胶体沉淀，覆盖溃疡面并抑制幽门螺杆菌，常作为联合用药的重要组成部分。',
          '助消化药包括稀盐酸（用于胃酸缺乏症）、胃蛋白酶（常与稀盐酸合用，在酸性环境中活性高）、胰酶（替代胰液分泌不足，帮助消化脂肪和蛋白质）、乳酶生（活的乳酸杆菌制剂，能分解糖类产生乳酸而助消化）。',
          '乳酶生为活的乳酸杆菌制剂，不宜与抗菌药同服，因为抗菌药可杀灭或抑制乳酸杆菌，使助消化作用减弱甚至消失。',
          '甲氧氯普胺（胃复安）通过阻断中枢及胃肠道多巴胺受体而产生强大止吐作用，用于各种呕吐；长期或大剂量使用可引起锥体外系反应，青少年尤其敏感。',
          '昂丹司琼为5-HT3受体阻断药，止吐作用强，主要用于化疗和放疗引起的恶心呕吐。',
          '泻药分为三类：容积性泻药（硫酸镁——口服导泻、利胆，注射降压抗惊厥；硫酸钠）、刺激性泻药（酚酞、大黄——刺激肠壁蠕动）、润滑性泻药（液状石蜡、开塞露——润滑肠壁并软化粪便）。',
          '硫酸镁口服给药的主要作用是导泻和利胆，因口服不易吸收而在肠内形成高渗环境；注射给药则可产生降压和抗惊厥作用，二者作用完全不同，须注意区分给药途径。',
          '止泻药分为收敛吸附药（鞣酸蛋白、药用炭/活性炭——吸附肠内毒物及气体）和减少肠蠕动药（地芬诺酯、洛哌丁胺——激动阿片受体，减少肠蠕动）。',
          '肝胆疾病用药中的利胆药包括去氢胆酸和熊去氧胆酸，能促进胆汁分泌和排出，用于胆结石、胆汁淤积等肝胆疾病的辅助治疗。'

        examPoints: [

          '硫酸镁不同给药途径作用完全不同：口服导泻利胆，注射降压抗惊厥，是高频易混考点，常考单选配对与判断题。',
          '胃蛋白酶需在酸性环境中发挥活性，临床常与稀盐酸合用；与抗酸药或抑酸药合用会使胃内pH升高而降低疗效，常考配伍禁忌。',
          '乳酶生为活的乳酸杆菌制剂，不宜与抗菌药同服，否则活菌被杀灭而失效，是高频判断题陷阱。',
          '甲氧氯普胺（胃复安）阻断多巴胺受体止吐，可致锥体外系反应；昂丹司琼阻断5-HT3受体，主要用于化疗呕吐，两者机制与用途对比常考。',
          '泻药三类（容积性、刺激性、润滑性）及代表药的归属是识记型高频考点，酚酞、大黄、硫酸镁、液状石蜡的分类常考单选。',
          '抗幽门螺杆菌三联/四联疗法的组成（PPI或铋剂＋两种抗菌药）及代表药是临床应用型高频考点。'

          { type:'choice', difficulty:'base', q:'抑制胃壁细胞H+-K+-ATP酶、产生强大持久抑酸作用的药物是', options:['西咪替丁','雷尼替丁','奥美拉唑','枸橼酸铋钾'], answer:2, explain:'奥美拉唑为质子泵抑制剂（PPI），通过抑制胃壁细胞H+-K+-ATP酶而强大持久地抑制胃酸分泌，是目前最强的抑酸药。' },
          { type:'judge', difficulty:'base', q:'奥美拉唑通过抑制胃壁细胞H+-K+-ATP酶发挥强大持久的抑酸作用。', answer:true, explain:'奥美拉唑为质子泵抑制剂（PPI），抑制H+-K+-ATP酶（质子泵），是目前最强的抑酸药，用于消化性溃疡和反流性食管炎。' },
          { type:'choice', difficulty:'base', q:'氢氧化铝属于下列哪类药物', options:['抗酸药','H2受体阻断药','质子泵抑制剂','胃黏膜保护药'], answer:0, explain:'氢氧化铝为抗酸药，口服后直接中和胃酸，并可在溃疡面形成保护膜；H2受体阻断药为西咪替丁等，PPI为奥美拉唑。' },
          { type:'choice', difficulty:'mid', q:'西咪替丁和雷尼替丁抑制胃酸分泌的机制是', options:['中和胃酸','阻断H2受体','阻断M胆碱受体','抑制H+-K+-ATP酶'], answer:1, explain:'西咪替丁、雷尼替丁为H2受体阻断药，通过阻断胃壁细胞H2受体减少胃酸分泌；中和胃酸的是抗酸药，抑制质子泵的是奥美拉唑。' },
          { type:'judge', difficulty:'base', q:'氢氧化铝中和胃酸后可引起腹泻，肾功能不全者禁用。', answer:false, explain:'氢氧化铝常见不良反应为便秘而非腹泻；长期大量服用可致铝中毒，肾功能不全者排泄障碍，应慎用而非绝对禁用。' },
          { type:'choice', difficulty:'base', q:'胃蛋白酶临床常与下列哪种药物合用', options:['稀盐酸','氢氧化铝','西咪替丁','阿莫西林'], answer:0, explain:'胃蛋白酶在酸性环境中活性高，常与稀盐酸合用以助消化；与抗酸药或抑酸药合用会使胃内pH升高而降低疗效。' },
          { type:'choice', difficulty:'base', q:'关于乳酶生的叙述，正确的是', options:['为死的乳酸杆菌制剂','可与抗菌药同服增强疗效','用于中和胃酸','为活的乳酸杆菌制剂，不宜与抗菌药同服'], answer:3, explain:'乳酶生为活的乳酸杆菌制剂，能分解糖类产生乳酸而助消化；抗菌药可杀灭乳酸杆菌，降低药效，故不宜同服。' },
          { type:'judge', difficulty:'mid', q:'乳酶生为活的乳酸杆菌制剂，与抗菌药同服可增强疗效。', answer:false, explain:'抗菌药可杀灭或抑制乳酶生中的活乳酸杆菌，使助消化作用减弱甚至消失，故两者不宜同时服用。' },
          { type:'choice', difficulty:'base', q:'甲氧氯普胺（胃复安）止吐的作用机制是', options:['阻断5-HT3受体','阻断多巴胺受体','激动M胆碱受体','抑制H+-K+-ATP酶'], answer:1, explain:'甲氧氯普胺阻断中枢及胃肠道多巴胺受体，产生强大止吐作用，用于各种呕吐；阻断5-HT3受体的是昂丹司琼。' },
          { type:'choice', difficulty:'base', q:'昂丹司琼主要用于', options:['晕动病呕吐','妊娠呕吐','消化不良','化疗引起的呕吐'], answer:3, explain:'昂丹司琼为5-HT3受体阻断药，止吐作用强，主要用于化疗和放疗引起的恶心呕吐；晕动病常用苯海拉明等。' },
          { type:'judge', difficulty:'base', q:'甲氧氯普胺（胃复安）无锥体外系不良反应，可长期大剂量使用。', answer:false, explain:'甲氧氯普胺阻断多巴胺受体，长期或大剂量使用可引起肌张力障碍、帕金森样症状等锥体外系反应，青少年尤其敏感，不宜长期大剂量使用。' },
          { type:'choice', difficulty:'mid', q:'硫酸镁口服给药的主要作用是', options:['降压、抗惊厥','导泻、利胆','止血','止泻'], answer:1, explain:'硫酸镁口服不易吸收，在肠内形成高渗环境而导泻，并刺激十二指肠黏膜分泌缩胆囊素而利胆；降压抗惊厥为注射给药作用。' },
          { type:'choice', difficulty:'base', q:'硫酸镁注射给药可用于', options:['导泻','利胆','降压、抗惊厥','止泻'], answer:2, explain:'硫酸镁注射给药后Mg2+可抑制中枢及松弛血管平滑肌和骨骼肌，产生降压和抗惊厥作用；口服则导泻利胆，注意区分给药途径。' },
          { type:'choice', difficulty:'base', q:'酚酞属于下列哪类泻药', options:['容积性泻药','刺激性泻药','润滑性泻药','收敛性泻药'], answer:1, explain:'酚酞为刺激性泻药，口服后在肠内遇碱性肠液形成可溶性钠盐，刺激肠壁蠕动而导泻；容积性泻药为硫酸镁等，润滑性泻药为液状石蜡等。' },
          { type:'choice', difficulty:'base', q:'下列药物中属于润滑性泻药的是', options:['硫酸镁','酚酞','液状石蜡','大黄'], answer:2, explain:'液状石蜡为润滑性泻药，能软化粪便并润滑肠壁；硫酸镁为容积性泻药，酚酞和大黄为刺激性泻药。' },
          { type:'choice', difficulty:'base', q:'能吸附肠内毒物、气体，用于止泻和中毒解救的药物是', options:['药用炭','鞣酸蛋白','地芬诺酯','洛哌丁胺'], answer:0, explain:'药用炭（活性炭）具有强大的吸附作用，可吸附肠内毒物、气体，用于止泻和某些中毒的解救；鞣酸蛋白为收敛药，地芬诺酯和洛哌丁胺为减少肠蠕动药。' },
          { type:'judge', difficulty:'base', q:'硫酸镁口服和注射给药的作用完全相同，均为导泻。', answer:false, explain:'硫酸镁口服不易吸收，发挥导泻和利胆作用；注射给药则产生降压和抗惊厥作用，两者作用完全不同，须注意区分。' },
          { type:'choice', difficulty:'base', q:'枸橼酸铋钾治疗消化性溃疡的特点包括', options:['仅中和胃酸','仅抑制胃酸分泌','兼具黏膜保护和杀灭幽门螺杆菌作用','仅促进胃排空'], answer:2, explain:'枸橼酸铋钾在胃内酸性环境中形成氧化铋胶体沉淀，覆盖溃疡面并杀灭幽门螺杆菌，为黏膜保护药兼抗幽门螺杆菌药；并非仅中和或抑制胃酸。' },
          { type:'choice', difficulty:'base', q:'硫糖铝治疗消化性溃疡的机制是', options:['中和胃酸','抑制H+-K+-ATP酶','阻断H2受体','在溃疡面形成保护膜'], answer:3, explain:'硫糖铝在酸性环境中聚合成胶冻状，黏附于溃疡面形成保护膜，促进溃疡愈合；中和胃酸的是氢氧化铝，抑制质子泵的是奥美拉唑。' },
          { type:'judge', difficulty:'base', q:'硫糖铝在酸性环境中聚合成胶冻状，黏附于溃疡面形成保护膜。', answer:true, explain:'硫糖铝为胃黏膜保护药，在酸性环境中聚合成胶冻状，覆盖溃疡面并促进愈合；同时刺激前列腺素合成，增强黏膜屏障。' },
          { type:'choice', difficulty:'mid', q:'奥美拉唑的临床应用不包括', options:['消化性溃疡','反流性食管炎','幽门螺杆菌感染（联合用药）','急性胰腺炎'], answer:3, explain:'奥美拉唑用于消化性溃疡、反流性食管炎及幽门螺杆菌感染（联合用药）；急性胰腺炎不属于其适应证，注意区分。' },
          { type:'choice', difficulty:'base', q:'抗幽门螺杆菌感染常用的三联疗法组成是', options:['奥美拉唑＋阿莫西林＋克拉霉素','氢氧化铝＋西咪替丁＋甲氧氯普胺','硫酸镁＋酚酞＋液状石蜡','药用炭＋地芬诺酯＋去氢胆酸'], answer:0, explain:'标准三联疗法为PPI（奥美拉唑）或铋剂联合两种抗菌药（阿莫西林＋克拉霉素/甲硝唑）；其余选项与幽门螺杆菌无关。' },
          { type:'judge', difficulty:'base', q:'抗幽门螺杆菌感染常采用PPI联合两种抗菌药的三联疗法。', answer:true, explain:'幽门螺杆菌感染的标准治疗方案为PPI（如奥美拉唑）或铋剂联合两种抗菌药（如阿莫西林＋克拉霉素/甲硝唑），即三联或四联疗法。' },
          { type:'choice', difficulty:'base', q:'地芬诺酯和洛哌丁胺止泻的机制是', options:['吸附肠内毒物','在肠黏膜形成保护膜','激动阿片受体，减少肠蠕动','杀灭肠道细菌'], answer:2, explain:'地芬诺酯和洛哌丁胺为减少肠蠕动药，通过激动阿片受体、抑制肠蠕动而止泻；吸附毒物的是药用炭，形成保护膜的是鞣酸蛋白。' },
          { type:'choice', difficulty:'base', q:'下列药物中属于利胆药的是', options:['熊去氧胆酸','奥美拉唑','酚酞','地芬诺酯'], answer:0, explain:'熊去氧胆酸和去氢胆酸为利胆药，能促进胆汁分泌和排出，用于胆结石、胆汁淤积等；奥美拉唑为抑酸药，酚酞为泻药，地芬诺酯为止泻药。' },
          { type:'choice', difficulty:'mid', q:'患者，男，35岁，反复上腹痛、反酸，胃镜示十二指肠溃疡，宜首选的抑酸药是', options:['氢氧化铝','西咪替丁','奥美拉唑','硫糖铝'], answer:2, explain:'奥美拉唑为PPI，抑酸作用最强最持久，为消化性溃疡首选药；氢氧化铝起效快但持续短，西咪替丁抑酸较弱，硫糖铝为保护药。' },
          { type:'choice', difficulty:'high', q:'患者，女，28岁，化疗后出现剧烈呕吐，宜选用的止吐药是', options:['甲氧氯普胺','昂丹司琼','酚酞','液状石蜡'], answer:1, explain:'化疗引起的呕吐主要由5-HT3受体介导，昂丹司琼为选择性5-HT3阻断药，止吐作用强且锥体外系反应少，为首选。' },
          { type:'choice', difficulty:'high', q:'患者，男，60岁，慢性便秘，长期依赖泻药，为减少肠黏膜刺激，宜选用的泻药是', options:['硫酸镁','酚酞','液状石蜡','大黄'], answer:2, explain:'液状石蜡为润滑性泻药，不刺激肠黏膜，适用于老年人、痔疮患者及术后便秘；硫酸镁、酚酞、大黄均为刺激性或容积性泻药，长期用可致依赖或电解质紊乱。' },
          { type:'judge', difficulty:'mid', q:'对胃酸缺乏伴消化不良的患者，可同时给予稀盐酸和胃蛋白酶以助消化。', answer:true, explain:'稀盐酸可补充胃酸不足，胃蛋白酶在酸性环境中活性高，两者合用可协同改善消化不良；但不宜与抗酸药或抑酸药同用。' },
          { type:'choice', difficulty:'high', q:'患者，男，45岁，确诊幽门螺杆菌阳性消化性溃疡，下列治疗方案最合理的是', options:['单用氢氧化铝中和胃酸','奥美拉唑＋枸橼酸铋钾＋阿莫西林＋克拉霉素','长期单用西咪替丁','酚酞导泻促进排空'], answer:1, explain:'幽门螺杆菌阳性溃疡应采用含PPI或铋剂的四联/三联疗法根除细菌；单用抗酸药或H2阻断药不能根除细菌，导泻药无效。' }
        ]
      },
      { title: '第9章　作用于血液及造血系统的药物',
        sections: [
          '第一节　促凝血药',
          '第二节　抗凝血药',
          '第三节　抗血栓药',
          '第四节　抗贫血药',
          '第五节　促白细胞增生药与血容量扩充药'
        ],
        knowledge: [
          '维生素K为促进凝血因子合成药，能促进肝脏合成凝血因子Ⅱ、Ⅶ、Ⅸ、Ⅹ；用于维生素K缺乏引起的出血，如阻塞性黄疸（胆汁缺乏影响维生素K吸收）、新生儿出血、长期使用广谱抗生素（肠道合成减少）所致出血。',
          '维生素K静注过快可致面部潮红、出汗、血压下降甚至虚脱，故一般宜肌内注射或缓慢静注。',
          '氨甲苯酸（止血芳酸）为抗纤维蛋白溶解药，能抑制纤溶酶原的激活，使纤溶酶不能生成而止血；主要用于纤溶亢进引起的出血，如产后出血、前列腺等手术后的异常出血；用量过大可致血栓形成，有血栓形成倾向者禁用。',
          '酚磺乙胺（止血敏）能增强血小板聚集和黏附力，促进血小板释放凝血活性物质，缩短凝血时间；用于手术前后预防出血及血小板减少性出血。',
          '促凝血药按作用环节分为三类：促进凝血因子合成药（维生素K）、抗纤维蛋白溶解药（氨甲苯酸、氨甲环酸）、增强血小板功能药（酚磺乙胺）。',
          '肝素为抗凝血药，在体内、体外均有强大而迅速的抗凝作用，其机制是激活抗凝血酶Ⅲ（ATⅢ），进而灭活凝血因子Ⅱa、Ⅸa、Ⅹa、Ⅺa、Ⅻa等多种凝血因子；口服无效，需注射给药，用于血栓栓塞性疾病、弥散性血管内凝血早期及体外抗凝。',
          '肝素过量可致自发性出血，表现为黏膜出血、伤口出血等，应立即停药并用鱼精蛋白解救（1mg鱼精蛋白可中和100U肝素）；其他不良反应有过敏反应、长期应用可致骨质疏松和自发性骨折。',
          '肝素禁用于活动性出血、血友病、颅内出血、严重高血压、溃疡病及有出血倾向者，孕妇慎用。',
          '华法林为口服抗凝药，仅在体内有抗凝作用（体外无效），通过拮抗维生素K、抑制凝血因子Ⅱ、Ⅶ、Ⅸ、Ⅹ的合成而抗凝；起效慢（口服后需1～3天起效），作用持久，主要用于防治血栓栓塞性疾病；过量引起出血时可用维生素K解救。',
          '枸橼酸钠仅在体外有抗凝作用，能与血中钙离子结合而阻止血液凝固，临床用作输血保养液的抗凝剂；大量输血时可引起低钙性手足抽搐，可用钙剂解救。',
          '抗血栓药包括抗血小板药和纤维蛋白溶解药：小剂量阿司匹林能抑制血小板环氧酶、减少血栓素A2生成而抑制血小板聚集，用于预防心肌梗死和脑血栓；双嘧达莫（潘生丁）亦能抑制血小板聚集；链激酶、尿激酶能激活纤溶酶原溶解血栓，用于急性血栓栓塞性疾病。',
          '铁剂（硫酸亚铁、富马酸亚铁等）用于缺铁性贫血；口服铁剂对胃肠道有刺激性，宜饭后服用；忌与茶、牛奶同服（茶中鞣酸、牛奶中磷酸盐影响铁吸收）；可致便秘和黑便（铁与肠内硫化氢生成硫化铁所致），事先应向患者说明。',
          '叶酸和维生素B12用于巨幼红细胞性贫血：叶酸参与核酸合成，维生素B12促进叶酸的循环利用并维持神经组织功能；维生素B12还用于恶性贫血及神经系统疾病的辅助治疗。',
          '重组人促红细胞生成素（EPO）能刺激骨髓红系造血，促进红细胞生成，主要用于慢性肾功能不全所致的肾性贫血。',
          '促白细胞增生药有维生素B4、鲨肝醇等，用于白细胞减少症；血容量扩充药右旋糖酐能扩充血容量、改善微循环，用于低血容量性休克。'
        ],
        examPoints: [
          '肝素在体内、体外均有强大抗凝作用，机制为激活抗凝血酶Ⅲ并灭活多种凝血因子，口服无效须注射，是本章最高频考点。',
          '肝素过量自发性出血用鱼精蛋白解救，华法林过量出血用维生素K解救，两者解救药的配对是高频易混考点。',
          '华法林为口服抗凝药，仅体内有效（体外无效），起效慢（1～3天）、作用持久，常与肝素对比考查。',
          '维生素K促进凝血因子Ⅱ、Ⅶ、Ⅸ、Ⅹ合成，用于阻塞性黄疸、新生儿出血、长期用广谱抗生素所致出血；静注过快可致面部潮红、血压下降。',
          '氨甲苯酸为抗纤溶药，抑制纤溶酶原激活，用于纤溶亢进引起的出血（产后出血、前列腺术后出血），过量可致血栓形成。',
          '肝素禁忌证：活动性出血、血友病、颅内出血、严重高血压、溃疡病，常以多选或判断形式考查。',
          '铁剂（硫酸亚铁）用于缺铁性贫血，宜饭后服用，忌与茶、牛奶同服，可致便秘和黑便，用药护理是高频考点。',

          { type:'judge', difficulty:'base', q:'肝素在体内、体外均有强大的抗凝作用。', answer:true, explain:'肝素通过激活抗凝血酶Ⅲ灭活多种凝血因子，无论体内还是体外（如体外循环、血液标本抗凝）均有强大抗凝作用。' },
          { type:'choice', difficulty:'base', q:'肝素过量引起自发性出血，应选用的解救药是', options:['维生素K','鱼精蛋白','氨甲苯酸','华法林'], answer:1, explain:'鱼精蛋白为强碱性蛋白，可与酸性的肝素结合使之失活，是肝素过量的特效解救药；维生素K用于华法林过量。' },
          { type:'choice', difficulty:'base', q:'华法林过量引起出血时，应选用的解救药是', options:['鱼精蛋白','酚磺乙胺','维生素K','枸橼酸钠'], answer:2, explain:'华法林通过拮抗维生素K发挥抗凝作用，故其过量出血用维生素K解救；鱼精蛋白用于肝素过量，两药解救勿混淆。' },
          { type:'judge', difficulty:'base', q:'华法林口服起效迅速，适用于血栓栓塞性疾病的急救。', answer:false, explain:'华法林起效慢，口服后需1～3天才起效，不适用于急救；需迅速抗凝时应选用肝素。' },
          { type:'choice', difficulty:'base', q:'属于抗纤维蛋白溶解药的是', options:['氨甲苯酸','肝素','双嘧达莫','硫酸亚铁'], answer:0, explain:'氨甲苯酸（止血芳酸）为抗纤溶药，抑制纤溶酶原激活；肝素为抗凝血药，双嘧达莫为抗血小板药，硫酸亚铁为抗贫血药。' },
          { type:'choice', difficulty:'base', q:'酚磺乙胺（止血敏）的止血机制是', options:['激活抗凝血酶Ⅲ','增强血小板聚集和黏附，促进血小板释放凝血活性物质','拮抗维生素K','抑制纤溶酶原激活'], answer:1, explain:'酚磺乙胺通过增强血小板聚集和黏附力、促进血小板释放凝血活性物质而止血；抑制纤溶酶原激活的是氨甲苯酸。' },
          { type:'judge', difficulty:'base', q:'氨甲苯酸用量过大可致血栓形成，有血栓形成倾向者禁用。', answer:true, explain:'氨甲苯酸抑制纤溶系统，过量使纤溶受抑而促进血栓形成，故有血栓病史或血栓形成倾向者应禁用或慎用。' },
          { type:'choice', difficulty:'mid', q:'新生儿因维生素K缺乏所致的出血，宜选用的药物是', options:['肝素','华法林','氨甲苯酸','维生素K'], answer:3, explain:'新生儿肠道菌群未建立、维生素K合成不足，其出血为维生素K缺乏所致，应补充维生素K；肝素、华法林为抗凝药，会加重出血。' },

          { type:'judge', difficulty:'mid', q:'维生素B12除用于恶性贫血外，还可用于神经系统疾病的辅助治疗。', answer:true, explain:'维生素B12参与神经髓鞘脂质合成、维持神经组织功能，临床除治恶性贫血外，还用于神经炎、神经萎缩等神经系统疾病的辅助治疗。' },
          { type:'choice', difficulty:'base', q:'通过促进凝血因子合成而发挥止血作用的促凝血药是', options:['维生素K','酚磺乙胺','氨甲苯酸','肝素'], answer:0, explain:'维生素K促进肝脏合成凝血因子Ⅱ、Ⅶ、Ⅸ、Ⅹ；酚磺乙胺增强血小板功能，氨甲苯酸抗纤溶，肝素为抗凝药。' },

          { type:'judge', difficulty:'base', q:'枸橼酸钠仅在体外有抗凝作用，大量输血时可引起低钙性手足抽搐。', answer:true, explain:'枸橼酸钠与血中钙离子结合而抗凝，仅用于体外（如输血保养液）；大量输血时枸橼酸钠可与体内钙结合致低钙，出现手足抽搐，可用钙剂解救。' },

          { type:'judge', difficulty:'mid', q:'肝素和华法林均可口服给药，且在体内外均有抗凝作用。', answer:false, explain:'肝素口服无效须注射，体内外均有效；华法林可口服但仅体内有效、体外无效。两者给药途径和作用范围均不同，切勿混淆。' },
