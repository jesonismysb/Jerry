<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="奈良的个人中心 - 积分总览、VIP口令兑换、签到状态" />
  <meta name="theme-color" content="#0b1220" />
  <title>个人中心 · 奈良</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%230e7490'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='%23a5f3fc' font-family='sans-serif'%3E%E6%88%91%3C/text%3E%3C/svg%3E" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <!-- 签到积分共享模块：用于读取积分与刷新解锁视觉（纯本地逻辑，不修改） -->
  <script src="./checkin.js"></script>

  <script>
    tailwind.config = { theme: { extend: { colors: { accent: '#67e8f9' } } } };
  </script>

  <style>
    html, body { height: 100%; overflow-x: hidden; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, -apple-system, sans-serif;
      background-color: #0b1220;
      -webkit-tap-highlight-color: transparent;
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.42);
      backdrop-filter: blur(16px) saturate(150%);
      -webkit-backdrop-filter: blur(16px) saturate(150%);
      border: 1px solid rgba(148, 197, 255, 0.14);
      border-radius: 1.25rem;
      box-shadow: 0 8px 32px rgba(2, 8, 23, 0.35);
      transition: transform .3s ease, box-shadow .3s ease, border-color .3s ease;
    }
    .panel-card, .panel-card:hover { transform: none; }
    .btn-primary {
      display: inline-flex; align-items: center; justify-content: center; gap: .35rem;
      font-size: 13px; font-weight: 500; color: #ecfeff;
      padding: .5rem 1.15rem; border-radius: 999px;
      background: linear-gradient(to right, rgba(8,145,178,.85), rgba(14,165,233,.85));
      border: 1px solid rgba(103, 232, 249, 0.4);
      box-shadow: 0 6px 20px rgba(8, 145, 178, 0.25);
      transition: all .25s ease; cursor: pointer;
    }
    .btn-primary:hover { filter: brightness(1.1); box-shadow: 0 6px 24px rgba(103,232,249,.35); }
    .btn-primary:active { transform: scale(.97); }
    .btn-primary:disabled { opacity: .45; cursor: not-allowed; filter: none; }
    .btn-ghost {
      display: inline-flex; align-items: center; justify-content: center; gap: .35rem;
      font-size: 12.5px; color: #cbd5e1;
      padding: .45rem .9rem; border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.10);
      transition: all .25s ease; cursor: pointer;
    }
    .btn-ghost:hover { color: #67e8f9; border-color: rgba(103, 232, 249, 0.4); background: rgba(103, 232, 249, 0.08); }
    .tool-input {
      width: 100%; background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(148, 197, 255, 0.14); color: #e2e8f0;
      border-radius: .8rem; padding: .65rem .9rem; font-size: 14px;
      transition: border-color .3s ease, box-shadow .3s ease;
    }
    .tool-input::placeholder { color: #64748b; }
    .tool-input:focus { outline: none; border-color: rgba(103, 232, 249, 0.45); box-shadow: 0 0 0 3px rgba(103, 232, 249, 0.12); }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    main > * { animation: fadeUp .6s ease backwards; }
    @keyframes pop { 0% { transform: scale(.85); opacity: 0; } 60% { transform: scale(1.05); } 100% { transform: scale(1); opacity: 1; } }
    .pop-anim { animation: pop .45s ease both; }
    #toast {
      position: fixed; left: 50%; bottom: calc(32px + env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(20px); opacity: 0; pointer-events: none;
      background: rgba(8, 145, 178, 0.92); color: #ecfeff; font-size: 14px;
      padding: 10px 20px; border-radius: 999px; box-shadow: 0 8px 24px rgba(8, 145, 178, .35);
      transition: opacity .3s ease, transform .3s ease; z-index: 99; white-space: nowrap; max-width: 90vw; overflow: hidden; text-overflow: ellipsis;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.err { background: rgba(190, 18, 60, .92); box-shadow: 0 8px 24px rgba(190, 18, 60, .35); }
    #toast.ok  { background: rgba(2, 132, 90, .92); box-shadow: 0 8px 24px rgba(2, 132, 90, .35); }
    @keyframes pulseGlow { 0%,100% { box-shadow: 0 0 0 0 rgba(251,191,36,.5); } 50% { box-shadow: 0 0 0 12px rgba(251,191,36,0); } }
    .glow-coin { animation: pulseGlow 2s ease infinite; }
    #page-footer { padding-bottom: calc(1.5rem + env(safe-area-inset-bottom)); }
    @media (max-width: 640px) {
      .btn-primary, .btn-ghost { min-height: 44px; padding: .72rem 1.1rem; font-size: 13.5px; }
    }
  </style>
</head>

<body class="min-h-screen text-slate-200">

  <div class="fixed inset-0 -z-10 overflow-hidden bg-slate-950">
    <div class="absolute inset-0" style="background: linear-gradient(180deg, rgba(2,6,23,.72) 0%, rgba(2,6,23,.52) 45%, rgba(2,6,23,.85) 100%);"></div>
  </div>

  <header class="sticky top-0 z-40 backdrop-blur-md bg-slate-950/55 border-b border-white/10">
    <div class="max-w-3xl mx-auto px-4 h-14 flex items-center gap-3">
      <a href="./index.html" class="inline-flex items-center gap-2 text-sm text-slate-300 hover:text-cyan-300 px-3 py-1.5 rounded-full border border-white/10 bg-white/5 hover:bg-cyan-400/20 hover:border-cyan-300/40 transition-all min-w-[86px]">
        <i class="fa-solid fa-arrow-left"></i><span class="hidden sm:inline">返回首页</span><span class="sm:hidden">首页</span>
      </a>
      <div class="flex-1 flex items-center justify-center gap-2 min-w-0">
        <i class="fa-solid fa-user-astronaut text-cyan-300/90"></i>
        <h1 class="text-sm sm:text-base font-semibold text-slate-100 truncate">奈良 · 个人中心</h1>
      </div>
      <div class="min-w-[86px]"></div>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-6 sm:py-8 space-y-5">

    <!-- 积分总览卡 -->
    <section class="glass-card panel-card p-5 sm:p-6">
      <div class="flex items-center justify-between gap-3 flex-wrap">
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 rounded-full flex items-center justify-center bg-amber-400/15 text-amber-300 glow-coin">
            <i class="fa-solid fa-coins text-xl"></i>
          </div>
          <div>
            <p class="text-[11px] text-slate-400">当前总积分</p>
            <p class="text-2xl font-bold text-amber-200 leading-none mt-1"><span id="points-now">0</span></p>
          </div>
        </div>
        <div class="flex items-center gap-2 text-[11px] text-slate-400">
          <span class="px-2 py-1 rounded-full border border-white/10 bg-white/5"><i class="fa-solid fa-calendar-check text-cyan-300/70 mr-1"></i>累计签到 <span id="total-days" class="text-cyan-200">0</span> 天</span>
          <span class="px-2 py-1 rounded-full border border-white/10 bg-white/5"><i class="fa-solid fa-fire text-rose-300/70 mr-1"></i>连续 <span id="streak-days" class="text-rose-200">0</span> 天</span>
        </div>
      </div>
      <p class="text-[11px] text-slate-500 mt-3"><i class="fa-solid fa-circle-info text-cyan-300/60 mr-1"></i>积分与签到系统、模拟考场、游戏解锁完全互通。</p>
    </section>

    <!-- VIP 口令兑换 -->
    <section class="glass-card panel-card p-5 sm:p-6">
      <h2 class="text-sm font-medium text-slate-300 mb-3 flex items-center gap-2">
        <span class="w-1 h-4 rounded-full bg-gradient-to-b from-amber-300 to-rose-500"></span>
        VIP 口令兑换
      </h2>
      <div class="bg-amber-400/[0.06] border border-amber-300/20 rounded-xl p-3 mb-4">
        <p class="text-[12px] text-amber-200/90 leading-relaxed"><i class="fa-solid fa-gift text-amber-300 mr-1"></i>输入有效口令码即可兑换积分奖励。每个口令仅可兑换一次，兑换后立即到账。</p>
      </div>
      <div class="flex flex-col sm:flex-row gap-2">
        <input id="redeem-input" type="text" inputmode="numeric" maxlength="16" placeholder="请输入口令码" class="tool-input flex-1 font-mono tracking-[0.2em] text-center" />
        <button id="btn-redeem" class="btn-primary sm:w-auto"><i class="fa-solid fa-ticket"></i>立即兑换</button>
      </div>
      <div id="redeem-history" class="mt-4 pt-4 border-t border-white/10"></div>
    </section>

    <!-- 游戏解锁状态 -->
    <section class="glass-card panel-card p-5 sm:p-6">
      <h2 class="text-sm font-medium text-slate-300 mb-3 flex items-center gap-2">
        <span class="w-1 h-4 rounded-full bg-gradient-to-b from-cyan-300 to-sky-500"></span>
        游戏解锁状态
      </h2>
      <div id="unlock-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-2"></div>
    </section>

  </main>

  <div id="toast"></div>

  <script>
  (function () {
    'use strict';

    /* ==================== 配置 ==================== */
    var CHECKIN_KEY = 'nara_checkin_v1';
    var REDEEMED_KEY = 'nara_redeemed_v1';

    /* 口令码 → 奖励积分映射表（可扩展多个口令） */
    var CODES = {
      '09280307': { points: 10000, name: 'VIP 创始口令' }
    };

    /* ==================== 工具 ==================== */
    function $(id) { return document.getElementById(id); }
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function toast(msg, type) {
      var t = $('toast');
      t.textContent = msg;
      t.className = '';  // 重置
      if (type === 'err') t.classList.add('err');
      else if (type === 'ok') t.classList.add('ok');
      t.classList.add('show');
      clearTimeout(t._tid);
      t._tid = setTimeout(function () { t.classList.remove('show'); }, 2400);
    }
    function fmtDate(ts) {
      var d = new Date(ts);
      function p(n) { return String(n).padStart(2, '0'); }
      return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
    }

    /* ==================== 积分读写（与签到系统互通） ==================== */
    function loadCheckin() {
      try { return JSON.parse(localStorage.getItem(CHECKIN_KEY)) || {}; }
      catch (e) { return {}; }
    }
    function saveCheckin(s) {
      try { localStorage.setItem(CHECKIN_KEY, JSON.stringify(s)); } catch (e) {}
    }
    function getPoints() {
      var s = loadCheckin();
      return Math.max(0, s.points || 0);
    }
    function addPoints(delta) {
      var s = loadCheckin();
      if (!s || typeof s !== 'object') s = { points: 0, unlocks: {}, days: {}, milestones: {} };
      if (typeof s.points !== 'number') s.points = 0;
      s.points = Math.max(0, s.points + delta);
      saveCheckin(s);
      // 通知签到系统刷新视觉
      if (window.NaraCheckin && typeof window.NaraCheckin.refresh === 'function') {
        try { window.NaraCheckin.refresh(); } catch (e) {}
      }
      return s.points;
    }

    /* ==================== 已兑换记录读写 ==================== */
    function loadRedeemed() {
      try { return JSON.parse(localStorage.getItem(REDEEMED_KEY)) || []; }
      catch (e) { return []; }
    }
    function saveRedeemed(list) {
      try { localStorage.setItem(REDEEMED_KEY, JSON.stringify(list)); } catch (e) {}
    }
    function isRedeemed(code) {
      var list = loadRedeemed();
      return list.some(function (r) { return r.code === code; });
    }
    function addRedeemed(code, rec) {
      var list = loadRedeemed();
      list.push(rec);
      saveRedeemed(list);
    }

    /* ==================== 兑换逻辑 ==================== */
    function doRedeem() {
      var input = $('redeem-input');
      var code = (input.value || '').trim();
      if (!code) {
        toast('请输入口令码', 'err');
        input.focus();
        return;
      }
      var cfg = CODES[code];
      if (!cfg) {
        toast('口令码无效', 'err');
        return;
      }
      if (isRedeemed(code)) {
        toast('该口令已被兑换过，不可重复领取', 'err');
        return;
      }
      // 兑换成功
      var oldPoints = getPoints();
      var newPoints = addPoints(cfg.points);
      var rec = {
        code: code,
        name: cfg.name,
        points: cfg.points,
        date: Date.now(),
        oldPoints: oldPoints,
        newPoints: newPoints
      };
      addRedeemed(code, rec);
      // 弹窗提示
      toast('🎉兑换成功！已到账 ' + cfg.points + ' 积分', 'ok');
      // 刷新页面显示
      input.value = '';
      renderPoints();
      renderHistory();
    }

    /* ==================== 视图渲染 ==================== */
    function renderPoints() {
      var p = getPoints();
      $('points-now').textContent = p.toLocaleString();
      var s = loadCheckin();
      $('total-days').textContent = (s.total || 0);
      $('streak-days').textContent = (s.streak || 0);
    }
    function renderHistory() {
      var list = loadRedeemed();
      var wrap = $('redeem-history');
      if (!list.length) {
        wrap.innerHTML = '<p class="text-[11px] text-slate-500"><i class="fa-solid fa-inbox mr-1"></i>暂无兑换记录</p>';
        return;
      }
      var html = '<p class="text-[11px] text-slate-400 mb-2"><i class="fa-solid fa-receipt mr-1"></i>兑换记录（' + list.length + ' 条）</p><div class="space-y-1.5">';
      list.slice().reverse().forEach(function (r) {
        html += '<div class="flex items-center justify-between gap-2 p-2 rounded-lg bg-white/[0.04] border border-white/8">' +
          '<div class="flex items-center gap-2">' +
            '<i class="fa-solid fa-circle-check text-emerald-300/80"></i>' +
            '<span class="text-[12px] text-slate-200">' + esc(r.name || '口令') + '</span>' +
            '<span class="text-[10px] text-slate-500 font-mono">' + esc(r.code) + '</span>' +
          '</div>' +
          '<div class="text-right">' +
            '<span class="text-[12px] text-amber-200 font-semibold">+' + r.points + '</span>' +
            '<p class="text-[10px] text-slate-500">' + fmtDate(r.date) + '</p>' +
          '</div>' +
        '</div>';
      });
      html += '</div>';
      wrap.innerHTML = html;
    }
    function renderUnlocks() {
      var wrap = $('unlock-grid');
      var meta = (window.NaraCheckin && window.NaraCheckin.costs) || {};
      var s = loadCheckin();
      var unlocks = (s && s.unlocks) || {};
      var items = [
        { id: 'gomoku', name: '五子棋', icon: 'fa-circle-dot', cost: 0 },
        { id: 'xiangqi', name: '中国象棋', icon: 'fa-chess', cost: 0 },
        { id: 'uno', name: 'UNO', icon: 'fa-clone', cost: 150 },
        { id: 'heibai', name: '黑白棋', icon: 'fa-chess-board', cost: 160 },
        { id: 'doushou', name: '斗兽棋', icon: 'fa-paw', cost: 180 },
        { id: 'tiaoqi', name: '跳棋', icon: 'fa-bullseye', cost: 200 },
        { id: 'undercover', name: '谁是卧底', icon: 'fa-user-secret', cost: 250 },
        { id: 'langren', name: '狼人杀', icon: 'fa-moon', cost: 300 }
      ];
      var html = '';
      items.forEach(function (it) {
        var unlocked = it.cost === 0 || unlocks[it.id];
        var cls = unlocked ? 'border-emerald-300/30 bg-emerald-400/[0.06]' : 'border-white/8 bg-white/[0.03] opacity-70';
        var tag = unlocked ? '<span class="text-[10px] text-emerald-300">已解锁</span>' : '<span class="text-[10px] text-amber-300">🔒' + it.cost + '</span>';
        html += '<div class="p-2 rounded-lg border ' + cls + ' flex items-center gap-2">' +
          '<i class="fa-solid ' + it.icon + ' text-cyan-300/70"></i>' +
          '<div class="flex-1 min-w-0">' +
            '<p class="text-[11px] text-slate-200 truncate">' + esc(it.name) + '</p>' +
            tag +
          '</div>' +
        '</div>';
      });
      wrap.innerHTML = html;
    }

    /* ==================== 启动 ==================== */
    function init() {
      renderPoints();
      renderHistory();
      renderUnlocks();
      $('btn-redeem').addEventListener('click', doRedeem);
      $('redeem-input').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') doRedeem();
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
  </script>

  <div id="page-footer" class="text-center text-[11px] text-slate-500 py-6">
    <p>奈良个人中心 · 积分本地存储 · 与签到/考试/游戏系统互通</p>
  </div>

</body>
</html>
